<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no,
        viewport-fit=cover">
    <title>WayTandem</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ═══════ DESIGN TOKENS ═══════ */
        :root {
            --bg: #0a0e17;
            --bg-elevated: #111827;
            --bg-card: rgba(17, 24, 39, 0.85);
            --bg-glass: rgba(17, 24, 39, 0.72);
            --border: rgba(255, 255, 255, 0.08);
            --border-active: rgba(255, 255, 255, 0.16);
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #a3e635;
            --accent-dim: rgba(163, 230, 53, 0.15);
            --accent-glow: rgba(163, 230, 53, 0.4);
            --blue: #38bdf8;
            --blue-dim: rgba(56, 189, 248, 0.15);
            --amber: #fbbf24;
            --amber-dim: rgba(251, 191, 36, 0.15);
            --red: #f87171;
            --red-dim: rgba(248, 113, 113, 0.15);
            --green: #34d399;
            --green-dim: rgba(52, 211, 153, 0.15);
            --purple: #a78bfa;
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
            --nav-height: 72px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
            --header-height: 52px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            line-height: 1.5;
        }

        /* ═══════ LAYOUT SHELL ═══════ */
        #app {
            width: 100%;
            max-width: 500px;
            height: 100vh;
            height: 100dvh;
            margin: 0 auto;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg);
        }

        .header {
            flex-shrink: 0;
            height: var(--header-height);
            padding: 0 16px;
            padding-top: var(--safe-top);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        .header-title {
            font-weight: 800;
            font-size: 18px;
            letter-spacing: -0.5px;
        }

        .header-title .accent {
            color: var(--accent);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .role-pill {
            position: relative;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        /* Організатор — окремий факт від ролі (водій/попутник можуть бути
           одночасно організаторами), тому не замінює текст пілюлі, а додає
           значок-корону поверх кута, тим самим амбером, що "Подія" на карті
           і секція організатора у вітальному вікні. */
        .role-pill.is-organizer::after {
            content: '👑';
            position: absolute;
            top: -7px;
            right: -6px;
            font-size: 12px;
            line-height: 1;
            filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.5));
        }

        .role-pill.driver {
            background: var(--accent-dim);
            color: var(--accent);
            border: 1px solid rgba(163, 230, 53, 0.25);
        }

        .role-pill.passenger {
            background: var(--blue-dim);
            color: var(--blue);
            border: 1px solid rgba(56, 189, 248, 0.25);
        }

        .role-pill.none {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid var(--border);
        }
        .nav-suggest-btn {
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 20px;
            font-weight: 700;
            font-size: 11px;
            padding: 6px 12px;
            margin: 0 10px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
            display: none;
            align-self: center;
        }
        .floating-suggest-btn {
            position: fixed;
            bottom: calc(var(--nav-height) + 20px);
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 24px;
            padding: 10px 20px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3), 0 0 10px var(--accent-glow);
            cursor: pointer;
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            opacity: 0;
            white-space: nowrap;
        }
        .floating-suggest-btn.visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .avatar-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 14px;
            color: #fff;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        .avatar-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .header-help-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-muted);
            font-weight: 800;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
        }

        /* 🎯 СОЦІАЛЬНИЙ БАНЕР ПОДІЇ */
        .event-accordion {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.08) 0%, rgba(17, 24, 39, 0.85) 100%);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: var(--radius-md);
            margin: 0 16px 16px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: default;
        }

        .event-summary-row {
            display: flex;
            align-items: center;
        }

        .event-header {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex: 1;
            width: 100%;
            min-width: 0;
            border: 0;
            background: transparent;
            color: inherit;
            font: inherit;
            text-align: left;
            cursor: pointer;
        }

        .event-title-block {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .event-icon-badge {
            font-size: 18px;
            background: rgba(56, 189, 248, 0.12);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .event-meta-info {
            min-width: 0;
            display: block;
        }

        .event-goal-name {
            display: block;
            font-weight: 700;
            font-size: 13.5px;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .event-stats {
            display: block;
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 1px;
        }

        .event-arrow {
            font-size: 12px;
            color: var(--blue);
            transition: transform 0.3s ease;
            margin-left: auto;
        }

        .avatar-group {
            display: flex;
            align-items: center;
            margin: 0 12px 0 8px;
        }

        .avatar-mini {
            border: 1.5px solid #0f172a !important;
            font-size: 8px !important;
            font-weight: 800 !important;
            margin-left: -6px !important;
        }

        .avatar-mini:first-child {
            margin-left: 0 !important;
        }

        .event-details {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 0 16px;
        }

        .event-accordion.expanded .event-details {
            max-height: 500px;
            opacity: 1;
            padding-bottom: 16px;
        }

        .event-accordion.expanded .event-arrow {
            transform: rotate(180deg);
        }

        .event-divider {
            height: 1px;
            background: var(--border);
            margin-bottom: 12px;
        }

        .event-desc {
            font-size: 12.5px;
            color: var(--text-secondary);
            line-height: 1.5;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        .event-creator {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
        }

        .creator-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--blue), #1d4ed8);
            color: white;
            font-size: 9px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .creator-info {
            font-size: 12px;
        }

        .creator-name {
            font-weight: 600;
            color: var(--text);
        }

        .creator-label {
            color: var(--text-muted);
            font-size: 10px;
        }

        .event-participants-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .p-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 12px;
        }

        .p-avatar {
            border: 1px solid var(--border) !important;
            color: var(--text-secondary) !important;
            font-size: 9px !important;
            font-weight: 800 !important;
        }

        .p-name {
            font-weight: 500;
            color: var(--text-secondary);
        }

        .p-role-tag {
            font-size: 9px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: auto;
        }

        .p-role-tag.passenger {
            background: var(--blue-dim);
            color: var(--blue);
        }

        .p-role-tag.driver {
            background: var(--accent-dim);
            color: var(--accent);
        }

        /* 🚗 Візуальна панель місць */
        .capacity-panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            max-width: 320px;
            margin: 12px auto 0;
            text-align: left;
        }

        .capacity-title {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .seats-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .seat-dot {
            width: 24px;
            height: 24px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
        }

        .seat-dot.driver-seat {
            background: var(--blue-dim);
            color: var(--blue);
            border: 1px solid rgba(56, 189, 248, 0.25);
        }

        .seat-dot.free {
            background: var(--accent-dim);
            color: var(--accent);
            border: 1px dashed rgba(163, 230, 53, 0.3);
        }

        .seat-dot.taken {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .freshness-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
            margin-top: 10px;
        }

        .search-icon-container {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .search-icon-bg {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: var(--accent-dim);
            animation: pulse-ring-large 2.2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        .search-icon {
            font-size: 32px;
            z-index: 2;
        }

        .freshness-indicator .pulse-dot::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: var(--accent);
            animation: pulse-ring 1.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            top: 0;
            left: 0;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.33);
            }
            80%, 100% {
                opacity: 0;
            }
        }

        @keyframes pulse-ring-large {
            0% {
                transform: scale(0.66);
                opacity: 0.8;
            }
            100% {
                transform: scale(1.4);
                opacity: 0;
            }
        }

        .avatar-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }

        .avatar-inline {
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            overflow: hidden;
            color: #fff;
            flex-shrink: 0;
        }

        /* ═══ SUBSCRIPTION BAR ═══ */
        .sub-bar {
            flex-shrink: 0;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, rgba(163, 230, 53, 0.08), rgba(163, 230, 53, 0.03));
            border-bottom: 1px solid rgba(163, 230, 53, 0.15);
            z-index: 99;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .sub-bar::-webkit-scrollbar {
            display: none;
        }

        .sub-bar:empty {
            display: none;
            padding: 0;
            border: none;
            height: 0;
        }

        .sub-bar-chip {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 14px;
            background: rgba(163, 230, 53, 0.12);
            border: 1px solid rgba(163, 230, 53, 0.2);
            font-size: 12px;
            font-weight: 700;
            color: var(--accent);
            cursor: pointer;
            transition: all 0.2s;
        }

        .sub-bar-chip:active {
            background: rgba(163, 230, 53, 0.2);
            transform: scale(0.96);
        }

        .sub-bar-pending {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 5px 10px;
            border-radius: 14px;
            background: rgba(251, 191, 36, 0.12);
            border: 1px solid rgba(251, 191, 36, 0.2);
            font-size: 11px;
            font-weight: 700;
            color: var(--amber);
            cursor: pointer;
        }

        .sub-bar-crew {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 14px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.2);
            font-size: 12px;
            font-weight: 700;
            color: var(--blue);
            cursor: pointer;
        }

        .sub-bar-text {
            flex: 1;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 600;
            white-space: nowrap;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ═══ SCREEN PANEL (2026-09-25): «?» — що тут робити; стрічка — пошук на місці ═══ */
        .screen-help {
            flex-shrink: 0;
            margin: 8px 12px 0;
            padding: 10px 12px;
            border-radius: 12px;
            background: var(--bg-card);
            border: 1px solid rgba(56, 189, 248, 0.35);
            font-size: 13px;
            line-height: 1.45;
            color: var(--text-primary);
            z-index: 98;
        }

        .screen-help[hidden] {
            display: none;
        }

        .screen-help-head {
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }

        .screen-help-body {
            flex: 1;
            min-width: 0;
        }

        .screen-help-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            line-height: 1;
            padding: 2px 4px;
            cursor: pointer;
        }

        .screen-help-search {
            width: 100%;
            padding: 9px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-primary);
            font-size: 14px;
        }

        .screen-help-results {
            display: grid;
            gap: 6px;
            margin-top: 8px;
            max-height: 38vh;
            overflow-y: auto;
        }

        .screen-help-results:empty {
            display: none;
        }

        .screen-help-result {
            text-align: left;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-primary);
            font-size: 13px;
            cursor: pointer;
        }

        .screen-help-result small {
            display: block;
            color: var(--text-muted);
            font-size: 11px;
            margin-top: 2px;
        }
        /* ═══ OPEN CREW BUTTON ═══ */
        .open-crew-btn {
            margin: 12px 16px;
            padding: 16px 20px;
            border-radius: var(--radius-xl);
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(99, 102, 241, 0.1));
            border: 1px solid rgba(56, 189, 248, 0.3);
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .open-crew-btn:active {
            transform: scale(0.98);
            border-color: var(--blue);
        }

        .open-crew-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .open-crew-info {
            flex: 1;
        }

        .open-crew-title {
            font-weight: 800;
            font-size: 15px;
            margin-bottom: 2px;
        }

        .open-crew-sub {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .open-crew-arrow {
            color: var(--blue);
            font-size: 20px;
        }

        .req-pending-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 6px;
            background: var(--amber-dim);
            color: var(--amber);
            font-size: 10px;
            font-weight: 800;
            animation: pulse-amber 2s infinite;
        }

        @keyframes pulse-amber {

            0%,
            100% {
                opacity: 0.7;
            }

            50% {
                opacity: 1;
            }
        }

        .main {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .screen {
            position: absolute;
            inset: 0;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        .screen::-webkit-scrollbar {
            display: none;
        }

        .nav {
            flex-shrink: 0;
            height: calc(var(--nav-height) + var(--safe-bottom));
            padding-bottom: var(--safe-bottom);
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 8px 16px;
            border-radius: var(--radius-md);
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s;
            position: relative;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent);
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav.board-deep {
            justify-content: center;
            gap: 10px;
        }

        .nav.board-deep .nav-item[data-tab="board"],
        .nav.board-deep .nav-item[data-tab="board-add"] {
            flex-direction: row;
            gap: 8px;
            min-width: 150px;
            padding: 10px 18px;
            border: 1px solid var(--border);
            background: var(--bg-card);
        }

        /* ═══════ REUSABLE COMPONENTS ═══════ */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin: 0 16px 12px;
            backdrop-filter: blur(10px);

        .card:active {

        }

        .card-title {
            font-weight: 800;
            font-size: 16px;
            margin-bottom: 4px;

            align-items: center;
            gap: 8px;
        }

        .card-meta {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .hero {
            margin: 12px 16px;
            border-radius: var(--radius-xl);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .hero.reservation {

            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        .hero.driving {
            background: linear-gradient(135deg, rgba(163, 230, 53, 0.12) 0%, rgba(17, 24, 39, 0.9) 100%);
            border: 1px solid rgba(163, 230, 53, 0.3);
        }

        .hero-label {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hero-title {
            font-weight: 900;
            font-size: 22px;
            line-height: 1.2;
            margin-bottom: 6px;
        }

        .hero-sub {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .lifecycle-progress {
            display: flex;
            align-items: center;
            gap: 0;
            margin-top: 14px;
            padding: 0 4px;
        }
        .lifecycle-step {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
        }
        .lifecycle-step.active { color: var(--accent); font-weight: 600; }
        .lifecycle-step.done { color: var(--green); }
        .lifecycle-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--border);
            flex-shrink: 0;
        }
        .lifecycle-step.active .lifecycle-dot { background: var(--accent); }
        .lifecycle-step.done .lifecycle-dot { background: var(--green); }
        .lifecycle-arrow {
            flex: 1;
            height: 2px;
            background: var(--border);
            min-width: 8px;
        }
        .lifecycle-step.done + .lifecycle-arrow,
        .lifecycle-step.done ~ .lifecycle-arrow { background: var(--green); }

        .crew-tree {
            margin-top: 12px;
            padding: 10px 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
        }
        .crew-member {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            font-size: 14px;
            color: var(--text-primary);
        }
        .crew-member.is-self { color: var(--accent); font-weight: 600; }
        .crew-member .crew-icon { font-size: 16px; flex-shrink: 0; }
        .crew-member .crew-connector {
            color: var(--text-muted);
            font-family: monospace;
            font-size: 12px;
            margin-right: 2px;
        }
        .crew-member .crew-role {
            font-size: 11px;
            color: var(--text-muted);
            margin-left: auto;
        }
        .crew-empty {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            font-size: 14px;
            color: var(--text-muted);
            opacity: 0.6;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 20px;
            border-radius: var(--radius-md);
            font-family: inherit;
            font-weight: 800;
            font-size: 13px;
            text-align: center;
            line-height: 1.2;
            white-space: normal;
            cursor: pointer;
            transition: all 0.15s;
            border: none;
            min-height: 48px;
            user-select: none;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn:disabled {
            opacity: 0.42;
            cursor: default;
            box-shadow: none;
            transform: none;
        }

        .btn-primary {
            background: var(--accent);
            color: #000;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-danger {
            background: var(--red-dim);
            color: var(--red);
            border: 1px solid rgba(248, 113, 113, 0.2);
        }

        .btn-success {
            background: var(--green-dim);
            color: var(--green);
            border: 1px solid rgba(52, 211, 153, 0.2);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-muted);
            padding: 10px 16px;
            min-height: 40px;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin: 12px 16px;
        }

        .btn-row .btn {
            flex: 1;
        }

        .section-label {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            padding: 16px 16px 8px;
        }

        .news-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-right: 16px;
        }

        .news-scope-btn {
            flex-shrink: 0;
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text);
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
        }

        .news-scope-btn.scope-sub {
            border-color: var(--accent);
            color: var(--accent);
        }

        .news-scope-btn:active {
            transform: scale(0.97);
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .tag-accent {
            background: var(--accent-dim);
            color: var(--accent);
        }

        .tag-amber {
            background: var(--amber-dim);
            color: var(--amber);
        }

        .tag-blue {
            background: var(--blue-dim);
            color: var(--blue);
        }

        .tag-red {
            background: var(--red-dim);
            color: var(--red);
        }

        .tag-green {
            background: var(--green-dim);
            color: var(--green);
        }

        .seats-row {
            display: flex;
            align-items: center;
            gap: 3px;
            margin-top: 8px;
        }

        .seat-dot {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .seat-dot.taken {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
        }

        .seat-dot.free {
            background: var(--accent-dim);
            color: var(--accent);
            border: 1px dashed rgba(163, 230, 53, 0.3);
        }

        .seat-dot.driver-seat {
            background: var(--blue-dim);
            color: var(--blue);
        }

        .empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 32px;
            text-align: center;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.6;
        }

        .empty-title {
            font-weight: 800;
            font-size: 16px;
            margin-bottom: 6px;
        }

        .empty-sub {
            font-size: 13px;
            color: var(--text-muted);
            max-width: 240px;
        }

        .skeleton {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.03) 25%, rgba(255, 255, 255, 0.06) 50%, rgba(255, 255, 255, 0.03) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: var(--radius-md);
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0
            }

            100% {
                background-position: -200% 0
            }
        }

        /* ═══════ BOTTOM SHEET ═══════ */
        .sheet-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 9000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
        }

        .sheet-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        .sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 500px;
            margin: 0 auto;
            z-index: 9001;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
            pointer-events: none;
        }

        .sheet.open {
            transform: translateY(0);
            pointer-events: auto;
        }

        .sheet-card {
            margin: 0 8px;
            margin-bottom: max(8px, var(--safe-bottom));
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.5);
        }

        .sheet-handle {
            display: flex;
            justify-content: center;
            padding: 16px 0 12px;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
        }

        .sheet-handle-bar {
            width: 44px;
            height: 5px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.25);
            transition: background 0.15s ease, width 0.15s ease;
        }

        .sheet-handle:active .sheet-handle-bar {
            background: rgba(255, 255, 255, 0.45);
            width: 48px;
        }

        .sheet-body {
            padding: 0 20px 20px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .sheet-title {
            font-weight: 900;
            font-size: 20px;
            margin-bottom: 8px;
        }

        .sheet-sub {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 16px;
        }

        /* Кроки приєднання — та сама тонка смужка, що етапи поїздки (власник 2026-09-26). */
        .lifecycle-progress.join-steps { margin: 0 0 10px; }

        /* Організатор у шапці майстра: міні-аватарка з короною в куті, як на пілюлі ролі (власник 2026-09-26). */
        .organizer-mini { position: relative; flex-shrink: 0; width: 20px; height: 20px; }
        .organizer-mini .avatar-inline { width: 20px !important; height: 20px !important; font-size: 10px; }
        .organizer-mini::after {
            content: '👑';
            position: absolute;
            top: -8px;
            right: -7px;
            font-size: 10px;
            line-height: 1;
            filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.5));
        }
        /* «Гармошка» «Хочу поїхати»: кроки розгортаються в тій самій шторці (власник 2026-09-26). */
        .join-inline {
            border-top: 1px solid var(--border);
            padding-top: 12px;
            margin-top: 2px;
        }

        /* Відкрита «гармошка»: кнопка — тихий заголовок «Хочу поїхати ▴» (згортає), яскрава дія — «Далі». */
        .btn.join-cta-open {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            box-shadow: none;
        }
        .sheet-steps {
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 6px;
        }

        .sheet-context {
            font-size: 12px;
            color: var(--text-secondary);
            margin: -4px 0 12px;
        }

        .dock-steps {
            display: flex;
            gap: 6px;
            margin: 8px 0 2px;
        }

        .dock-step {
            flex: 1;
            text-align: center;
            font-size: 10px;
            color: var(--text-muted);
            border-top: 2px solid var(--border);
            padding-top: 4px;
        }

        .dock-step.done {
            color: var(--green);
            border-top-color: var(--green);
        }

        .dock-step.active {
            color: var(--text-primary);
            font-weight: 800;
            border-top-color: var(--accent);
        }

        .sheet-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
        }

        .map-role-options {
            display: grid;
            gap: 10px;
            margin: 4px 0 14px;
        }

        .map-role-option {
            position: relative;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }

        .map-role-option input {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
        }

        .map-role-option:focus-within {
            outline: 2px solid var(--blue);
            outline-offset: 2px;
        }

        .map-role-option.is-selected {
            border-color: var(--accent);
            background: var(--accent-dim);
        }

        .map-role-radio {
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-muted);
            border-radius: 50%;
            flex: 0 0 20px;
            margin-top: 1px;
            transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
        }

        .map-role-option.is-selected .map-role-radio {
            border-color: var(--accent);
            background: var(--accent);
            box-shadow: inset 0 0 0 4px var(--bg-elevated);
        }

        .map-role-label {
            display: block;
            font-size: 14px;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.25;
        }

        .map-role-hint {
            display: block;
            margin-top: 4px;
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.35;
        }

        /* ═══════ SCREEN: EXPLORE ═══════ */
        #screen-explore {
            display: flex;
            flex-direction: column;
        }

        #map-container {
            flex: 1;
            min-height: 200px;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .map-overlay-cards {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 16px;
            background: linear-gradient(transparent, var(--bg) 30%);
            z-index: 500;
            pointer-events: none;
            display: none;
        }

        .map-fab-stack {
            position: absolute;
            right: 16px;
            bottom: 120px;
            z-index: 520;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .map-fab {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            color: var(--text-primary);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 22px rgba(0,0,0,0.24);
            pointer-events: auto;
            padding: 0;
            appearance: none;
            -webkit-appearance: none;
        }

        .map-fab:active {
            transform: scale(0.96);
        }

        .map-focus-btn {
            background: rgba(251,191,36,0.14);
            border-color: rgba(251,191,36,0.45);
            color: #fbbf24;
            transition: all 0.3s ease;
        }
        .map-fab.location-active {
            background: var(--accent) !important;
            border-color: var(--accent) !important;
            color: #000 !important;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* Маркер власної локації — синя пульсуюча точка */
        .my-loc-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #2f7bff;
            border: 2px solid #fff;
            box-shadow: 0 0 0 rgba(47,123,255,0.5);
            animation: my-loc-pulse 2s infinite;
            margin: 3px;
        }
        @keyframes my-loc-pulse {
            0%   { box-shadow: 0 0 0 0 rgba(47,123,255,0.5); }
            70%  { box-shadow: 0 0 0 14px rgba(47,123,255,0); }
            100% { box-shadow: 0 0 0 0 rgba(47,123,255,0); }
        }

        .map-pin {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            font-size: 16px;
            font-weight: 900;
            color: #081018;
            border: 2px solid rgba(0,0,0,0.35);
            box-shadow: 0 6px 18px rgba(0,0,0,0.28);
            transform-origin: center;
        }

        .map-pin-event {
            background: #fbbf24;
            box-shadow: 0 0 18px rgba(251,191,36,0.42), 0 6px 18px rgba(0,0,0,0.28);
        }

        .map-pin-theocracy {
            background: #a78bfa;
            box-shadow: 0 0 18px rgba(167,139,250,0.42), 0 6px 18px rgba(0,0,0,0.28);
        }

        /* Пін теократії: будинок зібрань білий — так само, як у каталозі, News і шторці (власник 2026-09-26);
           лінія трохи товща, щоб білий читався на світло-фіолетовому. */
        .map-pin.map-pin-theocracy { color: #fff; }
        .map-pin.map-pin-theocracy .pin-hall { stroke-width: 2.4; }

        /* Будинок зібрань без хреста (власник 2026-09-25) — однаковий на всіх платформах. */
        .pin-hall {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .map-pin-leisure {
            background: #34d399;
            box-shadow: 0 0 18px rgba(52,211,153,0.42), 0 6px 18px rgba(0,0,0,0.28);
        }

        .map-pin-work {
            background: #38bdf8;
            box-shadow: 0 0 18px rgba(56,189,248,0.42), 0 6px 18px rgba(0,0,0,0.28);
        }

        .map-pin-crew {
            background: var(--accent);
            box-shadow: 0 0 18px var(--accent-glow), 0 6px 18px rgba(0,0,0,0.28);
        }

        /* Discovery preview popup (iter 3, 2026-06-10): картка зі стилю iconpins-прикладу —
           кольорова шапка категорії + іконка-плитка + рядки + кнопка «Детальніше» */
        .map-preview-popup .leaflet-popup-content-wrapper { background: transparent !important; border: 0 !important; border-radius: 16px !important; box-shadow: 0 12px 36px rgba(0,0,0,0.38) !important; padding: 0 !important; overflow: hidden !important; }
        .map-preview-popup .leaflet-popup-content { margin: 0 !important; width: 224px !important; }
        .map-preview-popup .leaflet-popup-tip { background: #fff !important; border: 0 !important; }
        .map-preview-popup .leaflet-popup-close-button { color: rgba(8,16,24,0.6); font-size: 18px; padding: 6px 8px 0 0; }
        .map-preview-card { font-family: inherit; width: 224px; color: #0d1b2a; background: #fff; border-radius: 16px; overflow: hidden; }
        .map-preview-hd { display: flex; align-items: center; gap: 10px; padding: 12px 14px; color: #081018; }
        .map-preview-hd .map-preview-ico { width: 34px; height: 34px; border-radius: 10px; background: rgba(255,255,255,0.38); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
        .map-preview-hd .map-preview-ttl { font-weight: 800; font-size: 15px; line-height: 1.2; }
        .map-preview-bd { padding: 10px 14px 12px; background: #fff; }
        .map-preview-row { display: flex; gap: 8px; align-items: center; margin: 4px 0; font-size: 13px; color: #4b5563; }
        .map-preview-desc { display: block; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(15,23,42,0.08); line-height: 1.35; }
        .map-preview-like { flex-shrink: 0; margin-left: auto; display: inline-flex; align-items: center; gap: 5px; min-width: 40px; height: 32px; padding: 0 11px; border: 1px solid rgba(15,23,42,0.14); border-radius: 999px; background: #fff; color: #4b5563; font: inherit; font-size: 13px; font-weight: 800; line-height: 1; cursor: pointer; transition: transform 0.1s ease; }
        .map-preview-like:active { transform: scale(0.94); }
        .map-preview-like svg { width: 18px; height: 18px; flex-shrink: 0; transform-origin: 35% 85%; }
        .map-preview-like svg path { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
        .map-preview-like[aria-pressed="true"] { background: #ecfccb; border-color: #bef264; color: #3f6212; }
        .map-preview-like[aria-pressed="true"] svg path { fill: currentColor; }
        .map-preview-like.is-popping svg { animation: like-pop 0.36s ease-out; }
        @keyframes like-pop { 0% { transform: scale(1) rotate(0); } 35% { transform: scale(1.35) rotate(-14deg); } 65% { transform: scale(0.92) rotate(4deg); } 100% { transform: scale(1) rotate(0); } }
        @media (prefers-reduced-motion: reduce) { .map-preview-like.is-popping svg { animation: none; } .map-preview-like:active { transform: none; } }
        .map-preview-like-n:empty { display: none; }
        .map-preview-btn { display: block; width: 100%; margin-top: 8px; padding: 10px; border: 0; border-radius: 10px; background: var(--accent); color: #081018; font-weight: 700; font-size: 14px; cursor: pointer; }
        .map-preview-hd.k-event { background: #fbbf24; }
        .map-preview-hd.k-theocracy { background: #a78bfa; }
        .map-preview-hd.k-leisure { background: #34d399; }
        .map-preview-hd.k-work { background: #38bdf8; }
        /* Тап по піну не має лишати фокус-рамку (раніше шторка одразу накривала її) */
        .leaflet-marker-icon:focus, .leaflet-marker-icon:focus-visible { outline: none; }
        /* Підпис мапи: найменший дозволений правилами плиток OSM — коротко, читабельно,
           у куті, без згортання в (i) (tile policy: «not behind toggles»). */
        .leaflet-control-attribution.leaflet-control {
            font-size: 8px;
            line-height: 1.25;
            padding: 0 3px;
            margin: 0;
            color: #333;
            background: rgba(255, 255, 255, 0.82);
            border-top-left-radius: 4px;
        }
        .leaflet-control-attribution a { color: #0b5cad; text-decoration: none; }
        .map-pin { -webkit-tap-highlight-color: transparent; }

        .map-pin-passenger {
            background: #65d48f;
            color: #07130d;
            box-shadow: 0 0 0 4px rgba(101,212,143,0.22), 0 0 18px rgba(101,212,143,0.46), 0 6px 18px rgba(0,0,0,0.28);
        }

        .map-pin-focused {
            background: #fbbf24;
            transform: scale(1.08);
            box-shadow: 0 0 0 4px rgba(251,191,36,0.22), 0 0 18px rgba(251,191,36,0.46), 0 6px 18px rgba(0,0,0,0.28);
        }

        .map-pin-mine {
            position: relative;
            background: #38bdf8;
            color: #07111a;
            box-shadow: 0 0 0 4px rgba(56,189,248,0.28), 0 0 0 7px rgba(255,255,255,0.16), 0 0 18px rgba(56,189,248,0.5), 0 6px 18px rgba(0,0,0,0.28);
        }
        /* Пінешка ВЛАСНОГО екіпажу водія дихає сонар-пульсом — динамічна відмітка
           «ти на карті» (замінює модал «Екіпаж відкрито», DM-2026-06-14-008). */
        .map-pin-mine::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 2px solid rgba(56,189,248,0.65);
            pointer-events: none;
            animation: mapPinMinePulse 1.8s ease-out infinite;
        }
        @keyframes mapPinMinePulse {
            0%   { transform: scale(1);   opacity: 0.7; }
            100% { transform: scale(2.2); opacity: 0;   }
        }

        .map-pin-full {
            opacity: 0.58;
            filter: grayscale(0.35);
        }

        .map-pin-self-dot {
            position: absolute;
            left: -4px;
            bottom: -4px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            border: 3px solid #38bdf8;
            box-shadow: 0 2px 8px rgba(0,0,0,0.35);
        }

        .map-pin-badge {
            position: absolute;
            right: -6px;
            top: -7px;
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            border-radius: 999px;
            background: #111827;
            border: 2px solid #fff;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            line-height: 1;
        }

        .map-pin-seat-badge {
            z-index: 2;
        }

        .crew-route-line {
            stroke-linecap: round;
            filter: drop-shadow(0 0 6px rgba(56,189,248,0.55));
        }

        .pickup-point-pin {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            border: 2px solid rgba(0,0,0,0.4);
            box-shadow: 0 0 0 4px rgba(255,255,255,0.2), 0 6px 18px rgba(0,0,0,0.28);
        }

        .pickup-point-driver {
            background: #fbbf24;
            color: #101827;
            box-shadow: 0 0 0 4px rgba(251,191,36,0.26), 0 0 18px rgba(251,191,36,0.48), 0 6px 18px rgba(0,0,0,0.28);
        }

        .pickup-point-passenger {
            background: #65d48f;
            color: #07130d;
            box-shadow: 0 0 0 4px rgba(101,212,143,0.28), 0 0 18px rgba(101,212,143,0.5), 0 6px 18px rgba(0,0,0,0.28);
        }

        /* ── LOCATION MAP PICKER (overlay над формою) ── */
        .map-picker {
            position: fixed;
            inset: 0;
            z-index: 11000;
            background: var(--bg-card);
        }
        .map-picker-map {
            position: absolute;
            inset: 0;
            z-index: 1; /* власний stacking-контекст: внутрішні шари Leaflet не перекривають пін і кнопки */
        }
        /* Нерухомий пін по центру: його кінчик вказує на центр карти */
        .map-picker-pin {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -100%);
            font-size: 38px;
            line-height: 1;
            z-index: 10;
            pointer-events: none;
            filter: drop-shadow(0 3px 4px rgba(0,0,0,0.45));
        }
        .map-picker-top {
            position: absolute;
            top: calc(8px + var(--safe-top, 0px));
            left: 12px;
            right: 12px;
            z-index: 20;
        }
        .map-picker-search {
            width: 100%;
            padding: 12px 14px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 14px;
            box-shadow: 0 8px 22px rgba(0,0,0,0.24);
            outline: none;
        }
        .map-picker-results {
            margin-top: 6px;
            max-height: 230px;
            overflow-y: auto;
            border-radius: var(--radius-md);
            background: var(--bg-card);
            box-shadow: 0 8px 22px rgba(0,0,0,0.28);
        }
        .map-picker-results:empty {
            display: none;
        }
        .map-picker-result {
            padding: 10px 14px;
            font-size: 13px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }
        .map-picker-result:last-child { border-bottom: none; }
        .map-picker-result:active { background: rgba(255,255,255,0.06); }
        .map-picker-gps {
            position: absolute;
            right: 16px;
            bottom: 150px;
            z-index: 20;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(0,0,0,0.24);
        }
        .map-picker-hint {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 88px;
            z-index: 20;
            background: rgba(0,0,0,0.62);
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            padding: 7px 12px;
            border-radius: 999px;
            max-width: calc(100% - 32px);
            white-space: normal;
            text-align: center;
            pointer-events: none;
        }
        .map-picker-bottom {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 20;
            display: flex;
            gap: 10px;
            padding: 12px 12px calc(12px + var(--safe-bottom));
            background: linear-gradient(to top, var(--bg-card) 70%, transparent);
        }

        .map-fab[hidden] {
            display: none;
        }

        .map-overlay-cards>* {
            pointer-events: auto;
        }

        .crew-mini-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 14px 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .crew-mini-card:active {
            border-color: var(--accent);
        }

        .crew-mini-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #22c55e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 16px;
            color: #fff;
            flex-shrink: 0;
        }

        .crew-mini-info {
            flex: 1;
            min-width: 0;
        }

        .crew-mini-name {
            font-weight: 800;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .crew-mini-dir {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .crew-mini-seats {
            font-size: 11px;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 8px;
            background: var(--accent-dim);
            color: var(--accent);
            white-space: nowrap;
        }

        .map-popup-roster {
            display: grid;
            gap: 6px;
            margin: 8px 0;
            text-align: left;
        }

        .map-popup-member {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px;
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.72);
            border: 1px solid rgba(148, 163, 184, 0.22);
        }

        .map-popup-avatar {
            width: 26px !important;
            height: 26px !important;
            font-size: 11px;
        }

        .map-popup-role {
            font-size: 10px;
            color: var(--text-secondary);
            font-weight: 700;
        }

        /* Спільний абсолютний стек для смуг над картою: «Режим:» + банери-фільтри.
           Flex-стовпець гарантує, що фільтри завжди під смугою режиму без накладання,
           незалежно від висоти (раніше були крихкі фіксовані top:12px / top:54px). */
        .map-top-stack {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 505;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }

        .map-top-stack > * {
            pointer-events: auto;
        }

        .news-strip {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .news-strip::-webkit-scrollbar {
            display: none;
        }

        .map-mode-strip {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 700;
            line-height: 1.25;
        }

        .map-mode-label {
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .map-mode-value {
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .map-scope-btn {
            flex-shrink: 0;
            margin-left: auto;
            padding: 5px 11px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text);
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
        }

        .map-scope-btn.scope-sub {
            border-color: var(--accent);
            color: var(--accent);
        }

        .map-scope-btn:active {
            transform: scale(0.97);
        }

        .news-chip {
            flex-shrink: 0;
            padding: 8px 14px;
            border-radius: 20px;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            font-size: 12px;
            font-weight: 700;
            color: var(--text-secondary);
            white-space: nowrap;
            cursor: pointer;
        }

        /* ═══════ SCREEN: BOARD ═══════ */
        #screen-board {
            padding-bottom: 20px;
        }

        .board-breadcrumb {
            margin: 10px 16px 0;
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 30px;
        }

        .board-crumb-back {
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            border-radius: 10px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .board-crumb-path {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Шторка події: фільтри «Водії» / «Попутники» і рядки людей (2026-09-24). */
        .event-people-chips { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 18px 0 10px; }
        .event-people-chip { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); background: rgba(255, 255, 255, 0.04); color: var(--text-primary); font: inherit; text-align: left; cursor: pointer; }
        .event-people-chip.active { border-color: rgba(163, 230, 53, 0.45); background: rgba(163, 230, 53, 0.10); }
        .event-people-chip-title { font-size: 14px; font-weight: 800; }
        .event-people-chip-sub { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
        .event-people-note { text-align: center; padding: 14px 8px; font-size: 13px; color: var(--text-muted); }
        .event-person-row { display: flex; align-items: center; gap: 12px; padding: 12px; margin-bottom: 8px; border-radius: 12px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); }
        .event-person-name { font-size: 15px; font-weight: 800; color: var(--text-primary); }
        .event-person-status { margin-top: 2px; font-size: 11px; font-weight: 600; color: var(--text-secondary); }

        .board-search {
            margin: 12px 16px;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            width: calc(100% - 32px);
            transition: border-color 0.2s;
        }

        .board-search::placeholder {
            color: var(--text-muted);
        }

        .board-search:focus {
            border-color: var(--accent);
        }

        .dir-card {
            display: flex;
            width: calc(100% - 32px);
            align-items: center;
            gap: 14px;
            padding: 14px 16px;
            margin: 0 16px 8px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            appearance: none;
            -webkit-appearance: none;
            color: var(--text-primary);
            font: inherit;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s;
        }

        .dir-card:active {
            border-color: var(--accent);
            transform: scale(0.98);
        }

        .dir-card-icon {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .dir-card-icon svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: 0.95;
        }

        .dir-card-info {
            flex: 1;
            min-width: 0;
        }

        .dir-card-name {
            display: block;
            font-weight: 800;
            font-size: 15px;
        }

        .dir-card-where {
            display: block;
            margin-top: 2px;
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .board-search-clear {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 32px;
            height: 32px;
            border: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            font-size: 18px;
            line-height: 32px;
            cursor: pointer;
        }

        #board-search:placeholder-shown + .board-search-clear {
            display: none;
        }

        .dir-card-stats {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 600;
            margin-top: 2px;
            display: flex;
            gap: 3px;
            flex-direction: column;
            align-items: flex-start;
        }

        .dir-card-total {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 32px;
            max-width: 100%;
            padding: 2px 8px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-secondary);
            font-weight: 700;
            line-height: 1.35;
        }

        .dir-card-context {
            color: var(--text-muted);
            font-weight: 600;
            line-height: 1.35;
        }

        .dir-card-arrow {
            color: var(--text-muted);
            font-size: 18px;
        }

        .dir-card.subscribed {
            border-color: rgba(52, 211, 153, 0.25);
            background: rgba(52, 211, 153, 0.04);
        }

        .board-folder-action {
            margin: 0 16px 12px;
        }

        .board-folder-action .btn {
            width: 100%;
        }

        /* ═══════ SCREEN: NEWS ═══════ */
        #screen-news {
            padding-bottom: 20px;
        }

        .news-banners {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            margin: 8px 16px 12px;
        }

        .news-banner {
            border: 1px solid var(--border);
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 10px 8px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, transform 0.15s;
        }

        .news-banner:active {
            transform: scale(0.98);
        }

        .news-banner.active {
            border-color: rgba(163, 230, 53, 0.45);
            background: rgba(163, 230, 53, 0.08);
        }

        .news-banner-title {
            font-size: 11px;
            font-weight: 800;
            color: var(--text);
        }

        .news-banner-count {
            margin-top: 4px;
            font-size: 12px;
            font-weight: 900;
            color: var(--accent);
        }

        /* Активний фільтр над картою має суцільну яскраву заливку,
           тому текст робимо темним — читається і на світлій, і на темній карті.
           Стосується лише смуги над картою (#news-strip), не екрана новин. */
        #news-strip .news-banner.active .news-banner-title,
        #news-strip .news-banner.active .news-banner-count {
            color: #0b1117;
        }

        .news-feed {
            margin: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .news-feed-item {
            border: 1px solid var(--border);
            background: var(--bg-card);
            border-radius: var(--radius-md);
            padding: 12px;
        }

        /* Без фільтра картки «Новин» мають легкий відтінок кольору категорії —
           тих самих кольорів, що піни на мапі (рішення власника 2026-09-24). */
        .news-card.news-card-tint-theocracy {
            background: rgba(167, 139, 250, 0.12);
            border-color: rgba(167, 139, 250, 0.35);
        }

        .news-card.news-card-tint-leisure {
            background: rgba(52, 211, 153, 0.12);
            border-color: rgba(52, 211, 153, 0.35);
        }

        .news-card.news-card-tint-work {
            background: rgba(56, 189, 248, 0.12);
            border-color: rgba(56, 189, 248, 0.35);
        }

        .news-card.news-card-tint-event {
            background: rgba(251, 191, 36, 0.12);
            border-color: rgba(251, 191, 36, 0.35);
        }

        /* Тема події скрізь однакова: значок як на піні + легкий відтінок рубрики (власник 2026-09-25). */
        .cat-ico {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: #081018;
        }

        .cat-ico-theocracy { background: #a78bfa; }
        .cat-ico-leisure { background: #34d399; }
        .cat-ico-work { background: #38bdf8; }
        .cat-ico-other { background: #fbbf24; }
        /* Каталог, News і шторка: фон значка приглушений до 35 % — не перетягує увагу з назви, але квадрат ще

            overflow-y: auto;
            transform: translateY(110%);
            transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
        }

        #map-result-panel.open {
            transform: translateY(0);
        }
        /* Згорнуто (мікро): тонка смужка над нижньою навігацією — нав лишається
           доступною (дзеркало #map-trip-dock.collapsed). СТАТУС-банери (підписка/
           авто-ручний пошук/очікування) згортаються сюди; ДІЯ-банери (handshake)
           не згортаються. */
        #map-result-panel.collapsed {
            bottom: calc(var(--nav-height) + var(--safe-bottom) + 6px);
            padding: 0;
            background: transparent;
            border-top: none;
            box-shadow: none;
            max-height: none;
            overflow: visible;
        }
        #map-result-panel.manual-search-panel {
            bottom: calc(var(--nav-height) + var(--safe-bottom) + 6px);
        }
        #map-result-panel.manual-search-panel.screen-hidden { display: none; }

        #map-result-panel .result-strip {
            margin: 0 12px;
            padding: 10px 16px;
            border-radius: 999px;
            background: var(--bg-elevated);
            border: 1px solid var(--accent);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
            font-size: 13px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            cursor: pointer;
        }

        /* DM-2026-06-14-011: коли обидві мікро-смужки (#map-result-panel і
           #map-trip-dock) одночасно .open.collapsed -- напр. активна поїздка
           по одному напрямку + нова підписка-пошук по іншому -- вони мають
           однаковий bottom і z-index 10000 result-панелі перекрив би смужку
           дока. Зсуваємо смужку дока вище, щоб обидві смужки були видимі
           одна над одною. */
        #map-trip-dock.collapsed.stacked-above-result {
            bottom: calc(var(--nav-height) + var(--safe-bottom) + 6px + 50px);
        }

        /* DM-2026-06-14-011: на час відкритої .sheet ховаємо floating-банери
           низу карти (їх статус "припарковується" як .sheet-pinned-strip у
           верхній частині шторки -- openSheet/closeSheet). Стан (.open/
           .collapsed/_mapResultMeta) не змінюється, лише видимість. */
        #map-result-panel.hidden-by-sheet,
        #map-trip-dock.hidden-by-sheet {
            display: none;
        }

        /* DM-2026-06-14-011: "припаркований" статус-банер у верхній частині
           шторки -- замінює прихований floating-банер на час конфліктної дії
           (напр. "Перемкнути запит?" при тапі на іншу пінешку під час
           очікування відповіді партнера). */
        .sheet-pinned-strip {
            margin: 10px 8px 0;
            padding: 10px 16px;
            border-radius: 999px;
            background: var(--bg-elevated);
            border: 1px solid var(--accent);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
            font-size: 13px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            opacity: 0.85;
        }

        /* ═══════ MAP TRIP DOCK (persistent lifecycle dock — "де я в циклі" + дії) ═══════ */
        /* DM-2026-06-13-006: після рукостискання низ карти лишався порожнім — статус
           і дії були тільки у вкладці "Поїздки". Цей док тримає поточну фазу екіпажу
           (домовились → збір → у дорозі) + до двох дій біля великого пальця,
           авто-оновлюється на кожному hydrate/poll. Поступається панелі вхідного
           запиту (z-index нижчий) і живе лише на екрані карти. */
        #map-trip-dock {
            position: fixed;
            left: 0;
            right: 0;
            max-width: 500px;
            margin: 0 auto;
            /* Кандидат безпечного фінішу (2026-10-01): розгорнутий док стоїть НАД нижнім меню —
               центр кожної вкладки лишається вкладкою, а не кнопкою дока (412×860 hit-test). */
            bottom: calc(var(--nav-height) + var(--safe-bottom));
            z-index: 9000;
            background: var(--bg-elevated);
            border-top: 1px solid var(--blue);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 14px 16px;
            padding-bottom: max(16px, var(--safe-bottom));
            box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.55);
            transform: translateY(calc(115% + var(--nav-height) + var(--safe-bottom)));
            transition: transform 0.38s cubic-bezier(0.32, 0.72, 0, 1);
        }
        #map-trip-dock.open { transform: translateY(0); }
        /* Згорнуто: тонка смужка над нижньою навігацією — нав лишається доступною. */
        #map-trip-dock.collapsed {
            bottom: calc(var(--nav-height) + var(--safe-bottom) + 6px);
            padding: 0;
            background: transparent;
            border-top: none;
            box-shadow: none;
        }
        #map-trip-dock .dock-head {

                if (Array.isArray(S._ratingQueue) && S._ratingQueue.length) localStorage.setItem(_stateKey('rq'), JSON.stringify(S._ratingQueue));
                else localStorage.removeItem(_stateKey('rq'));
                // Вибір «мікро» для СТАТУС-банера переживає F5 (I-FRONT-8: парний removeItem).
                if (S.mapResultCollapsed) localStorage.setItem(_stateKey('mrc'), '1');
                else localStorage.removeItem(_stateKey('mrc'));
                if (S.mapResultCollapseTouched) localStorage.setItem(_stateKey('mrc_touched'), '1');
                else localStorage.removeItem(_stateKey('mrc_touched'));

                if (S.mapTripDockCollapseMemo) localStorage.setItem(_stateKey('mtdc'), JSON.stringify(S.mapTripDockCollapseMemo));
