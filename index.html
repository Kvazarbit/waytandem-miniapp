        // ═══════ LOCATION MAP PICKER (overlay над формою, форма не руйнується) ═══════
        const _mapPicker = { map: null, onConfirm: null, onCancel: null, searchTimer: null, wired: false, dragWired: false, choiceMade: false, session: 0, confirming: false };

        // Codex аудит №2 (2026-07-14): «✓ Готово» без явного вибору брав центр
        // карти масштабу МІСТА → правдоподібна, але неправильна адреса збору.
        // Підтвердження вмикається ТІЛЬКИ явним вибором: drag карти, результат
        // пошуку, GPS, або відкриття зі збереженою точкою (opts.lat/lng —
        // restore-флоу DM-2026-06-28-001). Програмний setView НЕ вмикає
        // (dragend — лише жест користувача), zoom-кнопки центр не змінюють.
        function _setPickerConfirmEnabled(on) {
            const confirm = document.getElementById('map-picker-confirm');
            if (!confirm) return;
            on = on && !_mapPicker.confirming;
            confirm.disabled = !on;
            confirm.style.opacity = on ? '' : '.45';
            confirm.setAttribute('aria-disabled', on ? 'false' : 'true');
            // Живий прохід 2026-08-11: блокувальну логіку вище НЕ чіпаємо (Codex аудит №2 —
            // без неї «Готово» бере центр карти й дає правдоподібну, але хибну адресу збору).
            // Ламався лише зворотний зв'язок: 45% непрозорості на лаймі читались як активна
            // кнопка, тож тестувальник тиснув двічі й не розумів, чому нічого не стається.
            // Пояснення переносимо на саму кнопку — без нового UI і без зміни поведінки.
            confirm.textContent = on
                ? (_mapPicker.confirmLabel || '✓ Готово')
                : 'Перетягніть карту, щоб обрати';
        }

        function _markPickerChoice() {
            _mapPicker.choiceMade = true;
            _setPickerConfirmEnabled(true);
        }

        function openLocationPicker(opts = {}) {
            const overlay = document.getElementById('map-picker');
            if (!overlay) return;
            if (_mapPicker.onConfirm || _mapPicker.onCancel) closeLocationPicker();
            _mapPicker.session++;
            _mapPicker.confirming = false;
            const resultPanel = document.getElementById('map-result-panel');
            const tripDock = document.getElementById('map-trip-dock');
            if (resultPanel && resultPanel.classList.contains('open')) resultPanel.classList.add('hidden-by-sheet');
            if (tripDock && tripDock.classList.contains('open')) tripDock.classList.add('hidden-by-sheet');
            _mapPicker.onConfirm = typeof opts.onConfirm === 'function' ? opts.onConfirm : null;
            _mapPicker.onCancel = typeof opts.onCancel === 'function' ? opts.onCancel : null;
            overlay.style.display = 'block';
            const hint = document.getElementById('map-picker-hint');
            if (hint) hint.textContent = opts.hint || 'Перетягни карту так, щоб пін був на місці події';
            const search = document.getElementById('map-picker-search');
            if (search) search.placeholder = opts.searchPlaceholder || '🔍 Місто або місце (напр. Люблін)';
            const confirm = document.getElementById('map-picker-confirm');
            _mapPicker.confirmLabel = opts.confirmLabel || '✓ Готово';
            if (confirm) confirm.textContent = _mapPicker.confirmLabel;

            const hasCoords = Number.isFinite(opts.lat) && Number.isFinite(opts.lng);
            let center, zoom;
            if (hasCoords) { center = [opts.lat, opts.lng]; zoom = 15; }
            else if (S._lastKnownPos) { center = [S._lastKnownPos.lat, S._lastKnownPos.lng]; zoom = 14; }
            else { center = [S.homeCity.lat, S.homeCity.lng]; zoom = 11; }

            if (!_mapPicker.map) {
                _mapPicker.map = L.map('map-picker-map', { zoomControl: true, attributionControl: true }).setView(center, zoom);
                _mapPicker.map.attributionControl.setPrefix(false);
                L.tileLayer(MAP_TILE_URL, { maxZoom: 19, attribution: MAP_TILE_ATTRIBUTION }).addTo(_mapPicker.map);
            } else {
                _mapPicker.map.setView(center, zoom);
            }
            if (!_mapPicker.wired) { _wireMapPickerControls(); _mapPicker.wired = true; }
            if (!_mapPicker.dragWired) { _mapPicker.map.on('dragend', _markPickerChoice); _mapPicker.dragWired = true; }
            // Збережена/цільова точка = вже зроблений вибір; свіжий флоу чекає жесту.
            _mapPicker.choiceMade = hasCoords;
            _setPickerConfirmEnabled(hasCoords);
            setTimeout(() => { try { _mapPicker.map.invalidateSize(); } catch (e) {} }, 60);

            // 2026-06-20 (owner): БЕЗ авто getCurrentPosition тут. Авто-GPS при відкритті
            // пікера перекривав контекст браузерним дозволом GPS ще до вибору точки
            // (порушення WEB_FLOWS §4.4 «no startup GPS prompt»). Пікер центрується на
            // цілі (opts.lat/lng = фокус події) / останній відомій / home; GPS — лише по явному
            // тапу кнопки 🎯 «Моє місце» (#map-picker-gps), ніякого авто-попапа.

            if (search) search.value = '';
            const results = document.getElementById('map-picker-results');
            if (results) results.innerHTML = '';
        }

        function closeLocationPicker(reason = 'cancel') {
            _mapPicker.session++;
            _mapPicker.confirming = false;
            clearTimeout(_mapPicker.searchTimer);
            const overlay = document.getElementById('map-picker');
            if (overlay) overlay.style.display = 'none';
            if (!isSheetOpen()) {
                const resultPanel = document.getElementById('map-result-panel');
                const tripDock = document.getElementById('map-trip-dock');
                if (resultPanel) resultPanel.classList.remove('hidden-by-sheet');
                if (tripDock) tripDock.classList.remove('hidden-by-sheet');
            }
            const results = document.getElementById('map-picker-results');
            if (results) results.innerHTML = '';
            const onCancel = _mapPicker.onCancel;
            _mapPicker.onConfirm = null;
            _mapPicker.onCancel = null;
            if (reason !== 'confirm' && onCancel) onCancel();
        }

        function _wireMapPickerControls() {
            const cancelBtn = document.getElementById('map-picker-cancel');
            const gpsBtn = document.getElementById('map-picker-gps');
            const confirmBtn = document.getElementById('map-picker-confirm');
            const search = document.getElementById('map-picker-search');

            if (cancelBtn) cancelBtn.onclick = closeLocationPicker;

            if (gpsBtn) gpsBtn.onclick = () => {
                if (!navigator.geolocation) { showToast('GPS недоступний', 'error'); return; }
                const session = _mapPicker.session;
                navigator.geolocation.getCurrentPosition(
                    (p) => {
                        if (session !== _mapPicker.session || _mapPicker.confirming) return;
                        S._lastKnownPos = { lat: p.coords.latitude, lng: p.coords.longitude, at: Date.now() };
                        _mapPicker.map.flyTo([p.coords.latitude, p.coords.longitude], 15);
                        _markPickerChoice();
                    },
                    () => { if (session === _mapPicker.session) showToast('Не вдалося отримати GPS', 'error'); },
                    { enableHighAccuracy: true, timeout: 8000 }
                );
            };

            if (confirmBtn) confirmBtn.onclick = async () => {
                if (_mapPicker.confirming || !_mapPicker.onConfirm) return;
                // I-FRONT-11: disabled-атрибут обходиться DevTools — справжній
                // guard тут: без явного вибору центр карти НЕ є точкою людини.
                if (!_mapPicker.choiceMade) {
                    showToast('Спершу оберіть точку: перетягніть карту, знайдіть адресу або натисніть 🎯', 'error');
                    return;
                }
                const session = _mapPicker.session;
                const onConfirm = _mapPicker.onConfirm;
                _mapPicker.confirming = true;
                _setPickerConfirmEnabled(false);
                confirmBtn.textContent = 'Підтверджуємо…';
                const c = _mapPicker.map.getCenter();
                const lat = c.lat, lng = c.lng;
                let label = '';
                try {
                    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=uk&zoom=14`, { headers: { 'Accept': 'application/json' } });
                    if (r.ok) label = _shortPlaceName(await r.json());
                } catch (e) {}
                if (session !== _mapPicker.session || onConfirm !== _mapPicker.onConfirm) return;
                closeLocationPicker('confirm');
                if (onConfirm) onConfirm({ lat, lng, label });
            };

            if (search) search.oninput = () => {
                clearTimeout(_mapPicker.searchTimer);
                const q = search.value.trim();
                const box = document.getElementById('map-picker-results');
                if (q.length < 3) { if (box) box.innerHTML = ''; return; }
                _mapPicker.searchTimer = setTimeout(() => _runPickerSearch(q), 450);
            };
        }

        async function _runPickerSearch(q) {
            const box = document.getElementById('map-picker-results');
            if (!box) return;
            const session = _mapPicker.session;
            const isCurrent = () => session === _mapPicker.session && !_mapPicker.confirming && document.getElementById('map-picker-search')?.value.trim() === q;
            try {
                const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&q=${encodeURIComponent(q)}&accept-language=uk&limit=6`, { headers: { 'Accept': 'application/json' } });
                const arr = r.ok ? await r.json() : [];
                if (!isCurrent()) return;
                if (!Array.isArray(arr) || !arr.length) {
                    box.innerHTML = '<div class="map-picker-result" style="opacity:.6;cursor:default;">Нічого не знайдено</div>';
                    return;
                }
                box.innerHTML = arr.map(it => `<div class="map-picker-result" data-lat="${it.lat}" data-lng="${it.lon}">${escapeHtml(it.display_name)}</div>`).join('');
                Array.from(box.querySelectorAll('.map-picker-result[data-lat]')).forEach(el => {
                    el.onclick = () => {
                        if (!isCurrent()) return;
                        const lat = parseFloat(el.dataset.lat), lng = parseFloat(el.dataset.lng);
                        if (Number.isFinite(lat) && Number.isFinite(lng)) { _mapPicker.map.flyTo([lat, lng], 14); _markPickerChoice(); }
                        box.innerHTML = '';
                        const s = document.getElementById('map-picker-search');
                        if (s) s.blur();
                    };
                });
            } catch (e) { if (isCurrent()) box.innerHTML = ''; }
        }

        function _shortPlaceName(j) {
            if (!j) return '';
            const a = j.address || {};
            const parts = [a.city || a.town || a.village || a.municipality || a.county, a.country].filter(Boolean);
            if (parts.length) return parts.join(', ');
            return (j.display_name || '').split(',').slice(0, 2).join(',').trim();
        }

        function pickGpsForDirection() {
            openLocationPicker({
                lat: S._createDirLat, lng: S._createDirLng,
                onConfirm: ({ lat, lng, label }) => {
                    S._createDirLat = lat;
                    S._createDirLng = lng;
                    const el = document.getElementById('create-dir-loc-label');
                    if (el) el.textContent = label ? `📍 ${label}` : `📍 ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                    const place = document.getElementById('create-dir-place');
                    if (place && !place.value.trim() && label) place.value = label;
                    showToast('Локацію вибрано на карті', 'success');

        async function doCreateDirection() {
            const title = document.getElementById('create-dir-title')?.value?.trim();
            const meetingPoint = document.getElementById('create-dir-place')?.value?.trim() || '';
            const startDate = document.getElementById('create-dir-start')?.value || '';
            const endDate = document.getElementById('create-dir-end')?.value || '';
            const description = document.getElementById('create-dir-desc')?.value?.trim() || '';
            if (!title || title.length < 3) { showToast('Назва має бути від 3 символів', 'error'); return; }
            if (!meetingPoint && (S._createDirLat == null || S._createDirLng == null)) { showToast('Вкажіть публічну локацію або точку на карті', 'error'); return; }
            if (startDate && endDate && endDate < startDate) { showToast('Виїзд додому не може бути раніше виїзду на подію', 'error'); return; }
            const oldSub = (S.subscriptions || [])[0];
            if (oldSub) {
                const oldTitle = oldSub.title || oldSub.direction_title || `#${oldSub.direction_id}`;
                const confirmed = await new Promise(resolve => {
                    openSheet(`
                        <div class="sheet-title">Створити і перемкнути чергу?</div>
                        <div class="sheet-sub">Ви вже в черзі на "${escapeHtml(oldTitle)}".<br>Після створення "${escapeHtml(title)}" активною стане нова черга.</div>
                        <div class="sheet-actions">
                            <button class="btn btn-primary" id="confirm-create-switch-yes">✓ Створити і перейти</button>
                            <button class="btn btn-ghost" id="confirm-create-switch-no">Скасувати</button>
                        </div>
                    `);
                    document.getElementById('confirm-create-switch-yes').onclick = () => { closeSheet(); resolve(true); };
                    document.getElementById('confirm-create-switch-no').onclick = () => { closeSheet(); resolve(false); };
                });
                if (!confirmed) return;
            }
            if (!beginOp('create_direction')) return;
            try {
                const body = {
                    user_id: S.userId,
                    title,
                    parent_id: S.boardParentId || null,
                    meeting_point: meetingPoint,
                    description,
                    start_date: startDate,
                    end_date: endDate
                };
                if (S._createDirLat != null && S._createDirLng != null) {
                    body.lat = S._createDirLat;
                    body.lng = S._createDirLng;
                    if (!body.meeting_point) body.meeting_point = `${S._createDirLat.toFixed(5)}, ${S._createDirLng.toFixed(5)}`;
                }
                const res = await api('/api/v3/board', { method: 'POST', body: JSON.stringify(body) });
                if (res?.id || res?.status === 'ok' || res?.direction_id) {
                    showToast('✓ Подію створено. Ви в черзі.', 'success');
                    closeSheet(); S._createDirLat = null; S._createDirLng = null;
                    await hydrate();
                    renderNews();
                } else if (res?.status === 'limit') {
                    showToast('У вас вже є активна ідея в каталозі. Видаліть її щоб запропонувати нову.', 'error');
                } else { showToast(res?.message || res?.error || 'Помилка створення', 'error'); }
            } catch (e) { showToast('Помилка мережі', 'error'); }
            finally { endOp('create_direction'); }
        }

        async function doEditDirection(dirId) {
            const title = document.getElementById('edit-dir-title')?.value?.trim();
            const meetingPoint = document.getElementById('edit-dir-place')?.value?.trim() || '';
            const startDate = document.getElementById('edit-dir-start')?.value || '';

            let chatLink = document.getElementById('edit-dir-chat')?.value?.trim() || '';
            if (chatLink && chatLink.startsWith('t.me/')) chatLink = 'https://' + chatLink;
            // I-FRONT-11: HTML maxlength — підказка, СПРАВЖНЯ перевірка тут + на сервері
            if (chatLink && !chatLink.startsWith('https://t.me/')) { showToast('Чат події: лише посилання https://t.me/...', 'error'); return; }
            if (!title || title.length < 3) { showToast('Назва має бути від 3 символів', 'error'); return; }
            if (startDate && endDate && endDate < startDate) { showToast('Виїзд додому не може бути раніше виїзду на подію', 'error'); return; }
            const meetingChanged = meetingPoint !== (S._editDirOriginalMeetingPoint || '');
            if (!meetingPoint && !S._editDirGpsTouched && meetingChanged) { showToast('Вкажіть публічну локацію або точку на карті', 'error'); return; }
            if (!beginOp('edit_direction')) return;
            try {
                const payload = {
                    user_id: S.userId,
                    direction_id: dirId,
                    title,
                    meeting_point: meetingPoint,
                    chat_link: chatLink,
                    description,
                    start_date: startDate,
                    end_date: endDate
                };
                if (S._editDirGpsTouched && S._editDirLat != null && S._editDirLng != null) {
                    payload.lat = S._editDirLat;
                    payload.lng = S._editDirLng;
                    if (!payload.meeting_point) payload.meeting_point = `${S._editDirLat.toFixed(5)}, ${S._editDirLng.toFixed(5)}`;
                }
                const res = await api('/api/v3/board', { method: 'PATCH', body: JSON.stringify(payload) });
                if (res?.status === 'ok' || res?.id) {
                    showToast('✓ Ідею оновлено', 'success');
                    const updated = res?.direction || payload;
                    const patch = {
                        title: updated.title || title,
                        direction_title: updated.title || title,
                        meeting_point: updated.meeting_point ?? payload.meeting_point,
                        chat_link: updated.chat_link ?? payload.chat_link,
                        description: updated.description ?? payload.description,
                        start_date: updated.start_date ?? payload.start_date,
                        end_date: updated.end_date ?? payload.end_date,
                        lat: Object.prototype.hasOwnProperty.call(updated, 'lat') ? updated.lat : payload.lat,
                        lng: Object.prototype.hasOwnProperty.call(updated, 'lng') ? updated.lng : payload.lng
                    };
                    [allDirections, S.myDirections, S.subscriptions].forEach(list => {
                        (list || []).forEach(d => {
                            if (String(d.id || d.direction_id) === String(dirId)) Object.assign(d, patch);
                        });
                    });
                    closeSheet(); renderBoardList(allDirections, S.boardSubSet); renderSubBar(); renderNews(); refreshMap();

            finally { endOp('edit_direction'); }
        }

        // ═══════ MY IDEAS (My Directions) ═══════
        // Відкриває каталог на папці, де лежить створена подія, і скролює до неї.
        async function openMyIdeaInBoard(dirId, parentId) {
            closeSheet();
            switchScreen('board');
            if (!parentId) {
                // немає parent_id — відкриваємо корінь каталогу
                S.boardStack = [];
                S.boardParentId = null;
                await renderBoard();
                return;
            }
            // Будуємо повний breadcrumb-ланцюжок від кореня до parent
            const ancestors = [];
            let cur = String(parentId);
            const visited = new Set();
            // Йдемо вгору по дереву через allDirections
            while (cur && !visited.has(cur)) {
                visited.add(cur);
                const node = allDirections.find(d => String(d.id) === cur);
                if (!node) break;
                ancestors.unshift({ id: node.id, title: node.title || `#${node.id}` });
                cur = node.parent_id ? String(node.parent_id) : null;
            }
            // Якщо allDirections не має даних (до першого renderBoard) — читаємо з сервера
            if (!ancestors.length) {
                const data = await api(`/api/v3/board?lang=${S.lang}&parent_id=${parentId}&user_id=${S.userId||''}`);
                const dirs = Array.isArray(data) ? data : (data?.directions || []);
                const node = dirs.find(d => String(d.id) === String(parentId)) ||
                             { id: parentId, title: `#${parentId}` };
                ancestors.push({ id: node.id, title: node.title || `#${node.id}` });
            }
            // Встановлюємо boardStack і boardParentId
            S.boardStack = ancestors;
            S.boardParentId = ancestors[ancestors.length - 1].id;
            await renderBoard();
            // Скролимо до картки події
            setTimeout(() => {
                const el = document.querySelector(`[data-dir-id="${dirId}"]`);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 300);
        }

        // Codex #6: технічні статуси не для людей. Один chokepoint локалізації;
        // сирий статус лишається в API-даних. missed_pickup — НЕ завершена і

        function historyStatusLabel(status) {
            const map = {
                completed: { label: 'Завершено', cls: 'tag-green' },
                cancelled: { label: 'Скасовано', cls: 'tag-red' },
                canceled: { label: 'Скасовано', cls: 'tag-red' },
                cancelled_by_system: { label: 'Скасовано системою', cls: 'tag-red' },
                missed_pickup: { label: 'Посадка не відбулась', cls: 'tag-amber' },
                active: { label: 'Активна', cls: 'tag-blue' },
                pickup: { label: 'Збір екіпажу', cls: 'tag-blue' },
                driving: { label: 'У дорозі', cls: 'tag-blue' },
                pending: { label: 'Очікує', cls: 'tag-amber' },
                pending_confirm: { label: 'Очікує підтвердження', cls: 'tag-amber' }
            };
            return map[String(status || '').toLowerCase()] || { label: String(status || '—'), cls: 'tag-amber' };
        }

        function historyOwnRatingLine(t) {
            const parts = [];
            const score = Number(t.my_score);
            if (Number.isFinite(score) && t.my_score != null) {
                if (t.my_score_scale === 'stars5') parts.push(`Моя оцінка: ★ ${score}`);
                else if (score === 1) parts.push('Моя оцінка: 👍');
                else if (score === -1) parts.push('Моя оцінка: 👎');
            }
            const ev = Number(t.my_event_score);
            if (Number.isFinite(ev) && t.my_event_score != null) parts.push(`подія ★ ${ev}`);
            return parts.join(' · ');
        }

        // ═══════ LIVE LOCATION TRACKING (Reservation pickup + Phase 2) ═══════
        let _locationTrackInterval = null;
        let _locationConsentDeclinedForReqId = null;

        function liveLocationConsentKey() {
            return _stateKey('live_location_consent');
        }

        function hasLiveLocationConsent() {
            try { return localStorage.getItem(liveLocationConsentKey()) === '1'; } catch (_) { return false; }
        }

        function shouldShareLiveLocation(trip = S.activeTrip) {
            const reqId = currentRequestIdFromTrip(trip);
            if (!reqId) return false;
            const status = String(trip?.status || '').toLowerCase();
            return !['done', 'completed', 'cancelled', 'canceled'].includes(status);
        }

        function shouldRenderCrewMembersOnMap(trip = S.activeTrip) {
            return shouldShareLiveLocation(trip) && Array.isArray(trip?.members);
        }

        function enableLiveLocationForTrip() {
            const reqId = currentRequestId();
            if (!reqId) return;
            if (!navigator.geolocation) {
                showToast('GPS недоступний у цьому браузері', 'warning');
                return;
            }
            try { localStorage.setItem(liveLocationConsentKey(), '1'); } catch (_) { }
            _locationConsentDeclinedForReqId = null;
            try { localStorage.removeItem(_declineKey(reqId)); } catch (_) { }
            if (S.currentScreen === 'trips') renderTrips();
            startLocationTracking();
            showToast('Live GPS увімкнено — так легше знайти одне одного біля точки збору', 'success');
        }

        function declineLiveLocationForTrip() {
            const reqId = currentRequestId();
            if (!reqId) return;
            _locationConsentDeclinedForReqId = reqId;
            setLiveLocationDeclined(reqId);
            if (S.currentScreen === 'trips') renderTrips();
            showToast('Live GPS вимкнено для цієї поїздки', '');
        }

        function startLocationTracking() {
            if (_locationTrackInterval) return;
            if (!navigator.geolocation) return;
            const reqId = currentRequestId();
            if (!reqId) return;
            if (!hasLiveLocationConsent()) {
                // Telemetry must not open a blocking sheet over crew actions.
                // The Trips screen renders an inline opt-in panel instead.
                return;
            }
            // Send immediately, then every 10 seconds
            _sendMyLocation();
            _locationTrackInterval = setInterval(_sendMyLocation, 10000);
        }

        function stopLocationTracking(clearConsent = false) {
            if (_locationTrackInterval) {
                clearInterval(_locationTrackInterval);
                _locationTrackInterval = null;
            }
            if (clearConsent) {
                clearLiveLocationConsent();
                _locationConsentDeclinedForReqId = null;
            }
        }

        function _sendMyLocation() {
            if (!navigator.geolocation || !S.apiBase || !S.userId) return;
            // Якщо кнопка "моя локація" увімкнена, watchPosition уже дав свіжу позицію —
            // використовуємо її, щоб не викликати getCurrentPosition (і не перепитувати GPS).
            const cached = S._lastKnownPos;
            if (cached && (Date.now() - cached.at) < 15000) {
                api('/api/v3/user/location', {
                    method: 'POST',
                    body: JSON.stringify({ user_id: S.userId, lat: cached.lat, lng: cached.lng })
                }).catch(() => {});
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    api('/api/v3/user/location', {
                        method: 'POST',
                        body: JSON.stringify({ user_id: S.userId, lat: pos.coords.latitude, lng: pos.coords.longitude })
                    }).catch(() => {});
                },
                (err) => {
                    console.warn("Live location update failed:", err);
                    const isPermissionDenied = err && err.code === 1;
                    stopLocationTracking(isPermissionDenied);
                    if (isPermissionDenied) {
                        showToast("Доступ до GPS відхилено. Телеметрію вимкнено.", "warning");
                    } else {
                        showToast("GPS вимкнено або недоступний. Телеметрію призупинено.", "warning");
                    }
                },
                { enableHighAccuracy: true, timeout: 5000 }
            );
        }

        function renderCrewMembersOnMap() {
            if (!S.map) return;
            const removeAgreementRoute = () => {
                if (S._routePolyline) { S.map.removeLayer(S._routePolyline); S._routePolyline = null; }
            };
            // Markers are lens-specific. The agreement line below is relation-specific
            // and must survive filter/rerender changes while the active crew relation exists.
            (S._crewMemberMarkers || []).forEach(m => S.map.removeLayer(m));
            S._crewMemberMarkers = [];
            // Show crew members if trip is active (reservation pickup or Phase 2)
            const t = S.activeTrip;
            if (!shouldRenderCrewMembersOnMap(t)) { removeAgreementRoute(); return; }
            const context = activeMapContextForMap();
            const eventFilter = S.mapEventFilter || 'all';
            if (context && String(t.direction_id || '') !== String(context.dirId || '')) { removeAgreementRoute(); return; }
            const scheme = buildPickupScheme(t);
            const passengerFocusCoords = [];
            const driverFocusCoords = [];
            const fullMembers = orderedCrewMembersForMap(t);
            const members = fullMembers.filter(m => {
                if (!context || eventFilter === 'all') return true;
                if (eventFilter === 'event') return true;
                const isMe = !!S.userId && String(m?.user_id || '') === String(S.userId);
                if (isMe) return true;
                const role = String(m?.role || '').toLowerCase();
                if (eventFilter === 'drivers') return role === 'driver';
                if (eventFilter === 'passengers') return role !== 'driver';
                return true;
            });
            const carPinCoord = crewCarPinCoordForTrip(t);
            if (carPinCoord) {
                driverFocusCoords.push([carPinCoord.lat, carPinCoord.lng]);
                const driver = members.find(m => String(m?.role || '').toLowerCase() === 'driver');
                const driverName = driver?.name || t.driver_name || t.partner_name || 'Водій';
                const carLabel = escapeAttr(`Авто водія: ${driverName}`);
                const closePassengerCoord = fullMembers
                    .filter(m => String(m?.role || '').toLowerCase() !== 'driver')
                    .map(m => crewMemberVisibleMapCoord(m, t))
                    .find(Boolean);
                const carDisplayCoord = offsetMapCoordIfNear(carPinCoord, closePassengerCoord);
                const carMarker = L.marker([carDisplayCoord.lat, carDisplayCoord.lng], {
                    title: carLabel,
                    alt: carLabel,
                    icon: L.divIcon({
                        className: '',
                        html: `<div class="pickup-point-pin pickup-point-driver" role="img" aria-label="${carLabel}">🚗</div>`,
                        iconSize: [34, 34],
                        iconAnchor: [17, 17],
                        popupAnchor: [0, -25]
                    }),
                    zIndexOffset: 160
                }).addTo(S.map).bindPopup(`<b>${escapeHtml(driverName)}</b><br>авто водія${carDisplayCoord.visualOffset ? '<br><span style="font-size:11px;color:#94a3b8;">пін зміщено, щоб не перекривати попутника</span>' : ''}` + crewMemberContactButtonsHtml(driver || { user_id: t.driver_id, telegram_username: '' }, carDisplayCoord), MAP_POPUP_PAN_OPTS);
                S._crewMemberMarkers.push(carMarker);
            }
            members.forEach(m => {
                const isMe = String(m.user_id) === String(S.userId);
                const role = String(m?.role || '').toLowerCase();
                if (role === 'driver' && carPinCoord) return;
                let c = crewMemberVisibleMapCoord(m, t);
                if (!c) return;
                const emoji = role === 'driver' ? '🚗' : '👤';
                const pickedUp = role !== 'driver' && isPassengerPickedUp(m);
                // А7 (запис 57): без точки збору (попутник) чи без старту авто (водій) маркер — лише «зараз тут»
                // (жива геопозиція), а не зупинка «Схеми збору»: пунктир, приглушено, чесний підпис.
                const liveOnly = !pickedUp && (role === 'driver' || !firstFiniteLatLng([m?.pickup_lat, m?.pickup_lng]));
                const color = pickedUp ? '#10b981' : (isMe ? '#34d399' : '#38bdf8');
                const name = isMe ? 'Ви тут' : escapeHtml(m.name || '?');
                const phaseLabel = liveOnly
                    ? (role === 'driver' ? 'зараз тут · старт авто не задано' : 'зараз тут · точки збору немає')
                    : (pickedUp ? 'в авто' : (t.is_started ? 'в дорозі' : 'зустріч'));
                const statusLabel = `${role === 'driver' ? 'водій' : 'попутник'} · ${phaseLabel}`;
                const pinStyle = liveOnly ? 'opacity:.6;border:2px dashed rgba(255,255,255,0.85);' : 'border:2px solid rgba(0,0,0,0.4);';
                const marker = L.marker([c.lat, c.lng], {
                    icon: L.divIcon({
                        className: '',
                        html: `<div ${liveOnly ? 'data-live-only="1" ' : ''}style="width:36px;height:36px;border-radius:50%;background:${color};display:flex;align-items:center;justify-content:center;font-size:16px;${pinStyle}box-shadow:0 2px 12px ${color}66;">${emoji}</div>`,
                        iconSize: [36, 36], iconAnchor: [18, 18]
                    })
                }).addTo(S.map).bindPopup(`<b>${name}</b><br>${statusLabel}` + crewMemberContactButtonsHtml(m, c), MAP_POPUP_PAN_OPTS);
                S._crewMemberMarkers.push(marker);
            });
            fullMembers.forEach(m => {
                const role = String(m?.role || '').toLowerCase();
                if (role === 'driver' && carPinCoord) return;
                const c = crewMemberVisibleMapCoord(m, t);
                if (!c) return;
                if (role === 'driver') driverFocusCoords.push([c.lat, c.lng]);
                else passengerFocusCoords.push([c.lat, c.lng]);
            });
            // «Схема збору» (А5/А7): старт авто → непосаджені попутники в порядку черги → подія; невідома точка
            // рве лінію на сегменти.
            // WD-42: blue line is the DB agreement relation, not a viewport artifact.
            const segments = scheme ? scheme.segments : [];
            // Огляд ≠ геометрія лінії (запис 59): в огляд ідуть усі відомі вузли схеми, зокрема подія після розриву;
            // лінія лишається розірваною, а невідомий вузол координат не отримує.
            const schemeFocusCoords = scheme ? scheme.nodes.filter(n => n.coord).map(n => [n.coord.lat, n.coord.lng]) : [];
            const schemeEvent = scheme ? scheme.nodes.find(n => n.kind === 'event' && n.coord) : null;
            const newRoute = segments.length ? L.polyline(segments.length === 1 ? segments[0] : segments, {
                    color: '#38bdf8',
                    weight: 4,
                    opacity: 0.78,
                    dashArray: '8 5',
                    className: 'crew-route-line',
                    interactive: false
                }).addTo(S.map) : null;
            if (S._routePolyline) S.map.removeLayer(S._routePolyline);
            S._routePolyline = newRoute;

            let focusCoords = schemeFocusCoords.length ? schemeFocusCoords : [...driverFocusCoords, ...passengerFocusCoords];
            if (eventFilter === 'drivers' && driverFocusCoords.length) focusCoords = driverFocusCoords;
            else if (eventFilter === 'passengers' && passengerFocusCoords.length) focusCoords = passengerFocusCoords;
            else if (eventFilter === 'all' && !t.is_started) {
                const socialCoords = [...driverFocusCoords, ...passengerFocusCoords];
                if (socialCoords.length) focusCoords = schemeEvent ? [...socialCoords, [schemeEvent.coord.lat, schemeEvent.coord.lng]] : socialCoords;
            }
            // 2zi (Ф2): точки лишаються над видимою нижньою панеллю (розгорнутою чи згорнутою).
            if (focusCoords.length) fitMapCoordsAboveOverlays(focusCoords, focusCoords.length === 1 ? 15 : 14);
        }

    </script>
