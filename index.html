            // Люди й екіпажі — у фільтрах «Водії» / «Попутники» внизу шторки; тут лише
            // тривалість (рішення власника 2026-09-24: без дублювання).
            const customStatsLine = daysText;
            const summaryRisk = String(eventSummary.risk || 'ok');
            const summaryRiskText = summaryRisk === 'needs_drivers'
                ? 'Потрібні ще місця'
                : (summaryRisk === 'pending_confirmations' ? 'Є запити на підтвердженні' : 'Виїзд виглядає спокійно');
            const summaryRiskColor = summaryRisk === 'needs_drivers'
                ? '#f97316'
                : (summaryRisk === 'pending_confirmations' ? '#fbbf24' : '#22c55e');
            const organizerEventSummaryHtml = isMyDir ? `
                <div data-organizer-event-summary style="margin:10px 0 8px;padding:12px;border-radius:12px;background:rgba(15,23,42,0.55);border:1px solid rgba(148,163,184,0.22);">
                    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;">
                        <div style="font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-muted);">Стан виїзду</div>
                        <div style="font-size:11px;font-weight:800;color:${summaryRiskColor};">${escapeHtml(summaryRiskText)}</div>
                    </div>
                    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;">
                        <div style="min-width:0;"><div style="font-size:18px;font-weight:900;color:#fff;">${summaryDrivers}</div><div style="font-size:10px;color:var(--text-muted);line-height:1.25;">водії</div></div>
                        <div style="min-width:0;"><div style="font-size:18px;font-weight:900;color:#22c55e;">${summaryOpenSeats}</div><div style="font-size:10px;color:var(--text-muted);line-height:1.25;">вільні місця</div></div>
                        <div style="min-width:0;"><div style="font-size:18px;font-weight:900;color:#38bdf8;">${summaryMatched}</div><div style="font-size:10px;color:var(--text-muted);line-height:1.25;">мають місце</div></div>
                        <div style="min-width:0;"><div style="font-size:18px;font-weight:900;color:#fbbf24;">${summaryWaiting + summaryPending}</div><div style="font-size:10px;color:var(--text-muted);line-height:1.25;">чекають місце</div></div>
                    </div>
                </div>` : '';

            // --- Detail card: horizontal location + date row, description below ---
            const hasDetailMeta = meetingPoint || whenText;
            const hasDetailCard = hasDetailMeta || desc;
            const detailCardHtml = hasDetailCard ? `
                <div style="margin:10px 0 6px;padding:14px;border-radius:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(56,189,248,0.15);backdrop-filter:blur(6px);">
                    ${hasDetailMeta ? `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:${desc ? '12px' : '0'};">
                        ${meetingPoint ? `<div style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-primary);font-weight:600;"><span style="color:var(--blue);font-size:15px;">📍</span> <span><span style="color:var(--text-muted);font-weight:700;">Куди:</span> ${escapeHtml(meetingPoint)}</span></div>` : '<div></div>'}
                        ${whenText ? `<div style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-primary);font-weight:600;"><span style="color:var(--accent);font-size:15px;">📅</span> <span><span style="color:var(--text-muted);font-weight:700;">Виїзд:</span> ${escapeHtml(whenText)}</span></div>` : '<div></div>'}
                    </div>` : ''}
                    ${desc ? `<div style="font-size:13px;color:var(--text-secondary);line-height:1.55;white-space:pre-wrap;${hasDetailMeta ? 'border-top:1px solid rgba(255,255,255,0.08);padding-top:12px;' : ''}"><div style="font-size:10px;font-weight:900;letter-spacing:0.6px;text-transform:uppercase;color:var(--text-muted);margin-bottom:5px;">Опис події</div>${escapeHtml(desc)}</div>` : ''}
                </div>` : '';

            const sheetCat = itemCategory(data?.direction || dir);  // значок рубрики, як на піні (2026-09-25)
            // Після того як шторка намальована — облік «долучились і вийшли» (лише організатор).
            if (isMyDir) setTimeout(() => loadOrganizerMembership(dirId), 0);
            openSheet(`
                <div style="display:flex;align-items:center;gap:12px;margin-bottom:4px;">
                    <div class="cat-ico sheet-cat-ico cat-ico-${sheetCat}" aria-hidden="true">${itemIcon(data?.direction || dir, sheetCat, false)}</div>
                    <div style="flex:1;">
                        <div class="sheet-title" style="margin-bottom:2px;">${escapeHtml(dir.title || 'Подія')}</div>
                        <div style="font-size:12px;color:var(--text-secondary);font-weight:600;">${escapeHtml(customStatsLine)}</div>
                    </div>
                    ${isMyDir ? `<div style="display:flex;gap:6px;flex-shrink:0;"><button onclick="shareDirectionInvite(${parseInt(dirId) || 0})" style="padding:6px 10px;border-radius:8px;background:rgba(56,189,248,0.12);border:1px solid rgba(56,189,248,0.28);color:var(--blue);font-size:14px;cursor:pointer;" title="Запросити учасників">📨</button><button data-dir-id="${parseInt(dirId) || 0}" data-dir-title="${escapeAttr(String(dir.title || ''))}" onclick="openEditDirectionFromButton(this)" style="padding:6px 10px;border-radius:8px;background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--text-secondary);font-size:14px;cursor:pointer;" title="Редагувати">✏️</button></div>` : ''}
                </div>
                ${detailCardHtml}
                ${organizerEventSummaryHtml}
                ${isMyDir ? `<div data-organizer-membership="${parseInt(dirId, 10) || 0}"></div>` : ''}
                ${creatorContactBlock}
                <div style="display:flex;flex-direction:column;gap:8px;margin:14px 0 10px;">
                    ${isSub
                    ? `<button class="btn btn-danger" style="width:100%;font-size:15px;padding:13px 0;border-radius:12px;" onclick="confirmLeaveDirection(${dirId})">🚪 Вийти з події</button>`
                    : joinPrimaryCta}
                    ${chatLink.startsWith('https://t.me/') ? `<button id="btn-idea-chat" class="btn btn-secondary" style="width:100%;font-size:15px;font-weight:700;padding:13px 0;border-radius:12px;border:1px solid rgba(56,189,248,0.35);background:rgba(56,189,248,0.10);color:var(--blue);cursor:pointer;" data-chat-link="${escapeAttr(chatLink)}" onclick="openIdeaChat(this)">💬 Чат події</button>` : ''}
                    <button class="btn btn-secondary" style="width:100%;font-size:16px;font-weight:700;padding:14px 0;border-radius:12px;background:#334155;color:#ffffff;border:none;cursor:pointer;" onclick="closeSheet()">Закрити</button>
                </div>
                ${isSub ? `<button class="btn btn-secondary" style="width:100%;margin-bottom:8px;font-size:12px;" onclick="pickPickupLocation(${dirId}, { kind: ${_isDriverRole(S.userRole) ? "'driver_start'" : "'passenger_wait'"}, persistUserLocation: ${_isDriverRole(S.userRole) ? 'false' : 'true'} })">${hasPickup ? '📍 Точка вказана ✓' : (_isDriverRole(S.userRole) ? '🚗 Поставити авто на карту' : '📍 Вказати де чекати водія')}</button>` : ''}
                <div data-event-people="${parseInt(dirId, 10) || 0}"></div>
            `);
            // Люди події (рішення власника 2026-09-24): фільтри «Водії» / «Попутники» з
            // цифрами для всіх; імена попутників — лише тим, кому їх віддає сервер
            // (/home/feed/members: організатор і учасники, DM-2026-07-25-001).
            const peopleDirId = parseInt(dirId, 10) || 0;
            S._eventPeople = {
                dirId: peopleDirId,
                orgs,
                isSub: !!isSub,
                drivers,
                openSeats: hasEventSummary ? summaryOpenSeats : orgs.reduce((sum, o) => sum + safeCount(o?.seats_free), 0),
                passengers,
                withoutSeat: hasEventSummary ? summaryWaiting + summaryPending : passengers,
                members: undefined,
                filter: '',
                emptyCrewLine
            };
            renderEventPeopleSection();
            loadEventPhotos(peopleDirId, seq);  // фото людей з Telegram — окремо, не гальмує шторку (2026-09-26)
            const people = await api(`/api/v3/home/feed/members?direction_id=${peopleDirId}&user_id=${encodeURIComponent(S.userId || '')}`, { silent: true });
            if (seq !== S._openDirectionSeq || S._eventPeople?.dirId !== peopleDirId) return;
            S._eventPeople.members = Array.isArray(people?.cards) ? people.cards : null;
            renderEventPeopleSection();
        }

        async function subscribeDir(dirId, options = {}) {
            if (!requireRoleForAction('стати в чергу', () => subscribeDir(dirId, options))) return false;
            const dir = allDirections.find(d => String(d.id) === String(dirId));
            if (isFolderNode(dir)) { showToast('Оберіть конкретну подію, а не розділ', 'error'); return; }
            // Re-subscribing to a recently-removed direction: stop suppressing it.
            if (S._recentlyUnsubbed && S._recentlyUnsubbed.id === String(dirId)) S._recentlyUnsubbed = null;

            // Check if user is already subscribed to a different direction
            const currentSubs = S.subscriptions || [];
            const otherSub = currentSubs.find(s => String(s.direction_id) !== String(dirId));
            if (otherSub) {
                const oldTitle = otherSub.title || otherSub.direction_title || `#${otherSub.direction_id}`;
                const newTitle = dir?.title || `#${dirId}`;
                const confirmed = await new Promise(resolve => {
                    openSheet(`
                        <div class="sheet-title">Перемкнути чергу?</div>
                        <div class="sheet-sub">Ви вже в черзі на "${escapeHtml(oldTitle)}".<br>Перейти на "${escapeHtml(newTitle)}"?<br><br>Попередня черга буде скасована.</div>
                        <div class="sheet-actions">
                            <button class="btn btn-primary" id="confirm-switch-yes">✓ Так, перемкнути</button>
                            <button class="btn btn-ghost" id="confirm-switch-no">Скасувати</button>
                        </div>
                    `);
                    document.getElementById('confirm-switch-yes').onclick = () => { closeSheet(); resolve(true); };
                    document.getElementById('confirm-switch-no').onclick = () => { closeSheet(); resolve(false); };
                });
                if (!confirmed) return false;
                // Hide the old direction from the sub-bar until the server finishes the switch.
                S._recentlyUnsubbed = { id: String(otherSub.direction_id), until: Date.now() + 8000 };
            }

            const manualOnly = !!options?.manualOnly;
            const resp = await apiWithStatus('/api/v3/board/subscribe', {
                method: 'POST',
                body: JSON.stringify({ user_id: S.userId, direction_id: dirId, role: S.userRole, auto_match: !manualOnly })
            });
            const status = String(resp?.data?.status || '');
            if (!resp.ok || (status !== 'ok' && status !== 'already_subscribed')) {
                if (resp?.data?.reason === 'active_trip_other_direction') {
                    S._recentlyUnsubbed = null;  // стара подія лишається: сервер нічого не змінив
                    showActiveDealWarning(resp.data.active_direction_id);
                    return false;
                }
                showToast(resp?.data?.detail || 'Не вдалося стати в чергу', 'error');
                return false;
            }

            // Show notification if direction was switched
            const switchedFrom = resp?.data?.switched_from;
            if (switchedFrom) {
                showToast('↩️ Чергу перемкнено на нову подію', 'success');
            }

            await hydrate();
            const keepSheetOpen = !!options?.keepSheetOpen;
            if (!keepSheetOpen) closeSheet();
            const showCoordinationMap = options?.afterSuccessScreen === 'explore';
            const openCoordinationMap = async () => {
                switchScreen('explore');
                renderNewsStrip();
                await refreshMap();
                focusMapByFilter();
            };
            if (S.pendingMatches.length > 0) {
                if (showCoordinationMap) {
                    await openCoordinationMap();
                    if (keepSheetOpen) {
                        if (!options?.suppressSubscribedSheet) {
                            openMapSubscribedSheet(dirId, { sheetMaxHeight: '65vh', auto: !manualOnly });
                            showToast('Підписка активна на карті', 'success');
                        }
                        return true;
                    }
                    if (resp.ok && (status === 'ok' || status === 'already_subscribed')) {
                        showToast('🔔 Є збіг інтересів! Відповідь на карті', 'success');
                        openMapPendingMatchesSheet('all');
                    }
                } else {
                    switchScreen('trips');
                    showToast('🔔 Є збіг інтересів! Перевірте вкладку Поїздки', 'success');
                }
            } else {
                const successToast = String(options?.successToast || '').trim();
                showToast(successToast || (manualOnly ? 'Подія відкрита на карті' : (status === 'already_subscribed' ? 'Ви вже в черзі' : '✓ Ви в черзі. Поїздку ще не підтверджено.')), 'success');
                if (showCoordinationMap) {
                    await openCoordinationMap();
                    if (keepSheetOpen && !options?.suppressSubscribedSheet) openMapSubscribedSheet(dirId, { sheetMaxHeight: '65vh', auto: !manualOnly });
                    return true;
                }
                // Re-hydrate after delay to catch handshakes created by async matching task
                setTimeout(async () => {
                    await hydrate();
                    if (S.pendingMatches.length > 0 && !S.activeTrip) {
                        switchScreen('trips');
                        showToast('🔔 Є збіг інтересів!', 'success');
                    } else {
                        // No match yet — show lifecycle feedback
                        switchScreen('trips');
                    }
                }, 1500);
            }
            return true;
        }

        function confirmLeaveDirection(dirId) {
            const safeDirId = parseInt(dirId, 10) || 0;
            if (!safeDirId) return Promise.resolve(false);
            const dir = allDirections.find(d => String(d.id) === String(safeDirId));
            const sub = (S.subscriptions || []).find(s => String(s?.direction_id ?? s?.id ?? '') === String(safeDirId));
            const title = dir?.title || sub?.title || sub?.direction_title || `події #${safeDirId}`;
            return new Promise(resolve => {
                openSheet(`
                    <div class="sheet-title">🚪 Вийти з події?</div>
                    <div class="sheet-sub">Ви залишите «${escapeHtml(title)}». Підписка, точка на карті та активні запити будуть скасовані. Це не те саме, що зупинити автопошук.</div>
                    <div class="sheet-actions">
                        <button class="btn btn-danger" id="confirm-leave-direction-yes">Так, вийти з події</button>
                        <button class="btn btn-secondary" id="confirm-leave-direction-no">Залишитись у події</button>
                    </div>
                `);
                requestAnimationFrame(() => {
                    const yes = document.getElementById('confirm-leave-direction-yes');
                    const no = document.getElementById('confirm-leave-direction-no');
                    if (yes) yes.onclick = async () => {
                        yes.disabled = true;
                        yes.textContent = 'Виходимо…';
                        const ok = await unsubscribeDir(safeDirId);
                        resolve(ok === true);
                    };
                    if (no) no.onclick = () => { closeSheet(); resolve(false); };
                });
            });
        }

        async function unsubscribeDir(dirId) {
            const dir = allDirections.find(d => String(d.id) === String(dirId));
            if (isFolderNode(dir)) { showToast('Це розділ каталогу, оберіть подію', 'error'); return; }
            const resp = await apiWithStatus('/api/v3/board/unsubscribe', {
                method: 'POST',
                body: JSON.stringify({ user_id: S.userId, direction_id: dirId })
            });
            if (!resp.ok) {
                if (resp?.data?.reason === 'active_trip_in_direction') {
                    showActiveDealWarning(dirId, 'leave');  // з домовленості — лише через партнера (2026-09-26)
                    return false;
                }
                showToast(resp?.data?.detail || 'Не вдалося відписатись', 'error');
                return false;
            }
            S._recentlyUnsubbed = { id: String(dirId), until: Date.now() + 8000 };
            clearPickupPoint();
            await hydrate();
            showToast('🚪 Ви вийшли з події: підписку та запити скасовано');
            closeSheet();
            return true;
        }

        function crewPassengerMembers(trip) {
            return (Array.isArray(trip?.members) ? trip.members : [])
                .filter(m => String(m?.role || '').toLowerCase() !== 'driver');
        }

        function crewDriverMember(trip) {
            return (Array.isArray(trip?.members) ? trip.members : [])
                .find(m => String(m?.role || '').toLowerCase() === 'driver') || null;
        }

        // Черга збору (А2): pending-запит (ще не прийнятий) — не зупинка й лінії не має (А5).
        function isPendingCrewMember(member) {
            const st = String(member?.request_status || '').toLowerCase();
            return st === 'pending' || st === 'pending_confirm';
        }

        // Ранг черги: null / порожнє — відсутність (Number(null) === 0), тоді діє порядок (created_at, id).
        function pickupQueueRank(member) {
            const v = member?.pickup_rank;
            if (v === null || v === undefined || typeof v === 'boolean' || (typeof v === 'string' && !v.trim())) return Number.POSITIVE_INFINITY;
            const n = Number(v);
            return Number.isFinite(n) ? n : Number.POSITIVE_INFINITY;
        }

        function orderedPickupPassengers(trip) {
            return crewPassengerMembers(trip).filter(p => !isPendingCrewMember(p)).sort((a, b) => {
                // G5: «Не знайшли» — після тих, кого ще забирати (черга йде далі; людина може підійти — «в авто»).
                const ac = isPassengerClaimed(a) ? 1 : 0, bc = isPassengerClaimed(b) ? 1 : 0;
                if (ac !== bc) return ac - bc;
                // А2: ранг, який ставить сервер при прийнятті й перестановці водієм, — первинний ключ.
                const ak = pickupQueueRank(a), bk = pickupQueueRank(b);
                if (ak !== bk) return ak < bk ? -1 : 1;
                const aoRaw = Number(a?.pickup_order ?? a?.order);
                const boRaw = Number(b?.pickup_order ?? b?.order);
                const ao = Number.isFinite(aoRaw) ? aoRaw : Number.POSITIVE_INFINITY;
                const bo = Number.isFinite(boRaw) ? boRaw : Number.POSITIVE_INFINITY;
                if (ao !== bo) return ao - bo;
                // Фактичний порядок бази: (created_at, id) = (pickup_order, request_id), не ім'я (запис 57, А2).
                const ar = Number(a?.request_id) || Number.POSITIVE_INFINITY;
                const br = Number(b?.request_id) || Number.POSITIVE_INFINITY;
                if (ar !== br) return ar - br;
                return Number(a?.user_id || 0) - Number(b?.user_id || 0);
            });
        }

        function passengerPickupStatus(member) {
            return String(member?.passenger_pickup_status || member?.pickup_status || 'waiting').toLowerCase();
        }

        function isPassengerPickedUp(member) {
            return passengerPickupStatus(member) === 'picked_up';
        }

        function passengerRequestId(member) {
            return parseInt(member?.request_id || member?.id || 0, 10) || 0;
        }

        function passengerDisplayName(member) {
            return member?.name || `#${member?.user_id || '?'}`;
        }

        function passengerFinishFlags(member) {
            return {
                driverFinished: !!(member?.driver_finished || member?.driver_done),
                clientFinished: !!(member?.client_finished || member?.client_done),
            };
        }

        function memberCancelRequestedBy(member) {
            const raw = member?.cancel_requested_by ?? member?.cancel_by ?? null;
            const id = parseInt(raw || 0, 10);
            return Number.isFinite(id) && id > 0 ? id : 0;
        }

        function tripPassengerCount(trip) {
            const passengers = orderedPickupPassengers(trip);
            if (passengers.length) return passengers.length;
            return Array.isArray(trip?.members)
                ? trip.members.filter(m => String(m?.role || '').toLowerCase() !== 'driver').length
                : 0;
        }

        function tripSeatTotal(trip) {
            const direct = trip?.total_seats ?? trip?.seats_total;
            if (hasFiniteNumber(direct)) return seatCount(direct);
            const sameCrew = S.myCrew && trip && String(S.myCrew.direction_id || '') === String(trip.direction_id || '');
            if (sameCrew && hasFiniteNumber(S.myCrew.seats_total)) return seatCount(S.myCrew.seats_total);
            if (trip?.viewer_role === 'driver' && hasFiniteNumber(S.seats)) return seatCount(S.seats);
            return 0;
        }

        function tripEmptySeats(trip) {
            const passengers = tripPassengerCount(trip);
            const total = tripSeatTotal(trip);
            if (total <= 0) return 1;
            return Math.max(0, total - passengers);
        }

        function tripFormationLabel(trip, isStarted, isPickup) {
            if (isStarted) return '🚀 В ДОРОЗІ';
            if (isPickup) return '🚗 ТОЧКА ЗБОРУ';
            return tripEmptySeats(trip) === 0 ? '✅ ЕКІПАЖ ЗІБРАНО' : '⏳ ЕКІПАЖ ФОРМУЄТЬСЯ';
        }

        function pendingCrewCancelRequests(trip) {
            if (!trip || trip.is_started) return [];
            return orderedPickupPassengers(trip).filter(p => {
                const by = memberCancelRequestedBy(p);
                return by && String(by) !== String(S.userId);
            });
        }

        function pendingCrewCancelNames(trip) {
            const pending = pendingCrewCancelRequests(trip);
            const names = pending.map(p => passengerDisplayName(p)).filter(Boolean).slice(0, 3);
            const more = pending.length > 3 ? ` +${pending.length - 3}` : '';
            return names.length ? `${names.join(', ')}${more}` : 'Партнер';
        }

        function unconfirmedCrewFinishers(trip) {
            // Попутники, що відмітили фініш і чекають підтвердження водія.
            // Дзеркало pendingCrewCancelRequests, але для двофазного фінішу.
            const members = Array.isArray(trip?.members) ? trip.members : [];
            return members.filter(m =>
                String(m?.role || '').toLowerCase() !== 'driver'
                && !!m?.client_finished
                && !m?.driver_finished
                && Number(m?.request_id) > 0
            );
        }

        function buildLiveLocationConsentPanel(trip) {
            const reqId = currentRequestIdFromTrip(trip);
            if (!reqId || !shouldShareLiveLocation(trip)) return '';
            if (hasLiveLocationConsent() || isLiveLocationDeclined(reqId)) return '';
            return `<div data-live-location-inline-consent="true" style="margin-top:12px;padding:10px;border-radius:10px;background:rgba(56,189,248,0.07);border:1px solid rgba(56,189,248,0.22);">
                <div style="font-size:12px;font-weight:900;color:var(--blue);">Live GPS екіпажу вимкнено</div>
                <div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">Можна ділитися геопозицією під час збору і поїздки — так легше знайти одне одного біля точки збору. Це не обовʼязково і не перекриває керування екіпажем.</div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
                    <button class="btn btn-secondary" style="padding:8px 10px;font-size:12px;" onclick="enableLiveLocationForTrip()">Увімкнути</button>
                    <button class="btn btn-ghost" style="padding:8px 10px;font-size:12px;" onclick="declineLiveLocationForTrip()">Не зараз</button>
                </div>
            </div>`;
        }

        function buildCrewCancelAttentionPanel(trip) {
            const pending = pendingCrewCancelRequests(trip);
            if (!pending.length) return '';
            const names = escapeHtml(pendingCrewCancelNames(trip));
            return `<div data-crew-cancel-attention="true" style="margin-top:12px;padding:10px;border-radius:10px;background:rgba(239,68,68,0.10);border:1px solid rgba(239,68,68,0.30);">
                <div style="font-size:12px;font-weight:900;color:var(--red);">⚠️ Попутник хоче вийти: ${names}</div>
                <div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">Підтвердьте або відхиліть запит у рядку цього попутника нижче.</div>
            </div>`;
        }

        function buildDriverCrewCommsPanel(trip) {
            const passengers = orderedPickupPassengers(trip).filter(p => passengerRequestId(p));
            if (!passengers.length) return '';
            const isStarted = !!trip?.is_started;
            const isPickup = trip?.status === 'pickup';
            const broadcastKind = isStarted ? 'arrived_all' : (isPickup ? 'pickup_here_all' : 'ready_all');
            const broadcastLabel = isStarted ? 'Всім: доїхали' : (isPickup ? 'Всім: я біля точки' : 'Всім: готовність?');
            const rows = passengers.map(p => {
                const reqId = passengerRequestId(p);
                const passengerId = parseInt(p?.user_id || 0, 10) || 0;
                const name = passengerDisplayName(p);
                const picked = isPassengerPickedUp(p);
                const flags = passengerFinishFlags(p);
                const cancelBy = memberCancelRequestedBy(p);
                const cancelBySelf = cancelBy && String(cancelBy) === String(S.userId);
                const cancelByPassenger = cancelBy && String(cancelBy) === String(passengerId);
                const status = isStarted
                    ? (flags.driverFinished ? 'Фініш відмічено' : 'В дорозі')
                    : (cancelByPassenger ? 'Хоче вийти з екіпажу'
                        : (cancelBySelf ? 'Ви запросили скасування'
                            : (picked ? 'В авто' : (isPickup ? 'Чекаємо посадку' : 'Домовленість активна'))));
                const quickButtons = [];
                if (cancelByPassenger && !isStarted) {
                    quickButtons.push(`<button class="btn btn-primary" data-cancel-confirm="${reqId}" onclick="confirmCancelTrip(${reqId})">✅ Погодитись</button>`);
                    quickButtons.push(`<button class="btn btn-secondary" data-cancel-reject="${reqId}" onclick="rejectCancelTrip(${reqId})">❌ Відмовити</button>`);
                } else {
                    if (!isStarted && !picked && !cancelBySelf) quickButtons.push(`<button class="btn btn-secondary" data-quick-msg="where" onclick="sendTripQuickMessage(${reqId}, 'where')">Де ти?</button>`);
                    if (isPickup && !picked && !cancelBySelf) quickButtons.push(`<button class="btn btn-primary" data-quick-msg="pickup_here" onclick="sendTripQuickMessage(${reqId}, 'pickup_here')">Виходь</button>`);
                    if (isStarted && !flags.driverFinished) quickButtons.push(`<button class="btn btn-secondary" data-quick-msg="dropoff" onclick="sendTripQuickMessage(${reqId}, 'dropoff')">Висаджую тут</button>`);
                }
                return `<div data-driver-comms-row="true" data-comm-passenger-id="${passengerId}" data-comm-request-id="${reqId}" style="padding:10px;border-radius:8px;background:rgba(255,255,255,0.035);border:1px solid var(--border);">
                    <div style="display:flex;align-items:center;gap:10px;min-width:0;">
                        <div style="flex:1;min-width:0;">
                            <div style="font-size:14px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(name)}</div>
                            <div style="font-size:11px;color:var(--text-secondary);margin-top:2px;">${escapeHtml(status)}</div>
                        </div>
                        <button class="btn btn-secondary" data-comm-chat="true" style="padding:8px 10px;font-size:12px;" onclick="openChat(${reqId}, ${passengerId})">Чат</button>
                    </div>
                    ${quickButtons.length ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">${quickButtons.join('')}</div>` : ''}
                </div>`;
            }).join('');
            return `<div data-driver-comms-panel="true" style="margin-top:12px;padding:10px;border-radius:10px;background:rgba(56,189,248,0.07);border:1px solid rgba(56,189,248,0.22);">
                <div style="display:flex;gap:8px;align-items:flex-start;justify-content:space-between;">
                    <div>
                        <div style="font-size:11px;font-weight:900;color:var(--blue);text-transform:uppercase;letter-spacing:.6px;">Звʼязок екіпажу</div>
                        <div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">Швидкі повідомлення й чат біля кожного попутника, без перекриття карти.</div>
                    </div>
                    <button class="btn btn-secondary" data-crew-broadcast="${broadcastKind}" style="padding:8px 10px;font-size:12px;white-space:nowrap;" onclick="sendCrewQuickMessage('${broadcastKind}')">${broadcastLabel}</button>
                </div>
                <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px;">${rows}</div>
            </div>`;
        }

        function tripHumanStatusLabel(trip) {
            if (!trip) return 'Немає активної домовленості';
            if (trip.is_started) return 'В дорозі до події';
            if (trip.status === 'pickup') return 'Збір екіпажу біля точок';
            if (pendingCrewCancelRequests(trip).length) return 'Потрібна відповідь на вихід попутника';
            return tripEmptySeats(trip) === 0 ? 'Екіпаж зібрано' : 'Екіпаж домовився, місця ще є';
        }

        function buildTripHumanSummary(trip) {
            const driverName = trip?.driver_name || trip?.organizer_name || 'Водій';
            const passengers = orderedPickupPassengers(trip);
            const passengerNames = passengers.map(passengerDisplayName).filter(Boolean);
            const passengerLine = passengerNames.length ? passengerNames.slice(0, 4).join(', ') : 'попутників ще немає';
            const more = passengerNames.length > 4 ? ` +${passengerNames.length - 4}` : '';
            return `<div class="section-label">Підсумок</div>
                <div class="card" data-trip-human-summary="true">
                    <div class="card-meta">Стан: ${escapeHtml(tripHumanStatusLabel(trip))}</div>
                    <div class="card-meta">Водій: ${escapeHtml(driverName)}</div>
                    <div class="card-meta">Попутники: ${escapeHtml(passengerLine)}${escapeHtml(more)}</div>
                </div>`;
        }

        function buildDriverFinishPanel(trip) {
            const passengers = orderedPickupPassengers(trip);
            if (!passengers.length) return '';
            const activeRows = passengers.map(p => {
                const reqId = passengerRequestId(p);
                const passengerId = parseInt(p?.user_id || 0, 10) || 0;
                const name = passengerDisplayName(p);
                const flags = passengerFinishFlags(p);
                const waitingPassenger = flags.driverFinished && !flags.clientFinished;
                const passengerWaitingDriver = !flags.driverFinished && flags.clientFinished;
                const status = waitingPassenger
                    ? 'Очікуємо підтвердження попутника'
                    : (passengerWaitingDriver ? 'Попутник уже відмітив фініш' : 'У дорозі');
                const statusColor = waitingPassenger
                    ? 'var(--amber)'
                    : (passengerWaitingDriver ? 'var(--green)' : 'var(--text-secondary)');
                const disabled = !reqId || !passengerId || flags.driverFinished;
                const actionLabel = flags.driverFinished ? 'Фініш відмічено' : (passengerWaitingDriver ? 'Підтвердити' : 'Висадити');
                return `<div data-driver-finish-row="true" data-finish-passenger-id="${passengerId}" data-finish-request-id="${reqId}" style="display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px;border-radius:8px;background:rgba(255,255,255,0.04);border:1px solid var(--border);">
                    <div style="min-width:0;">
                        <div style="font-size:14px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(name)}</div>
                        <div style="font-size:11px;color:${statusColor};margin-top:2px;">${escapeHtml(status)}</div>
                    </div>
                    <button class="btn ${passengerWaitingDriver ? 'btn-success' : 'btn-secondary'}" style="padding:8px 10px;font-size:12px;" ${disabled ? 'disabled' : ''} onclick="confirmOwnFinish('request', ${reqId}, { stayOnCrew: true, partnerId: ${passengerId} })">${actionLabel}</button>
                </div>`;
            }).join('');
            const unfinished = passengers.filter(p => !passengerFinishFlags(p).driverFinished && passengerRequestId(p));
            const allMarked = unfinished.length === 0;
            return `<div data-driver-finish-panel="true" style="margin-top:12px;padding:10px;border-radius:10px;background:rgba(16,185,129,0.07);border:1px solid rgba(16,185,129,0.22);">
                <div style="display:flex;gap:8px;align-items:flex-start;justify-content:space-between;">
                    <div>
                        <div style="font-size:11px;font-weight:900;color:var(--green);text-transform:uppercase;letter-spacing:.6px;">Фініш екіпажу</div>
                        <div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">Висаджуйте окремих попутників або відмітьте фініш для всіх. Повне завершення буде тільки після підтвердження кожного.</div>
                    </div>
                    <button class="btn btn-success" data-finish-all-driver="true" style="padding:8px 10px;font-size:12px;white-space:nowrap;" ${allMarked ? 'disabled' : ''} onclick="confirmOwnFinish('driver_all')">З усіма</button>
                </div>
                <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px;">${activeRows}</div>
            </div>`;
        }

        function nextPickupPassenger(trip) {
            return orderedPickupPassengers(trip).find(p => !isPassengerPickedUp(p)) || null;
        }

        // G5 (§0.61): «Не знайшов» — заява водія про конкретного попутника. Це факт, не вирок і не видалення.
        function isPassengerClaimed(member) {
            const st = String(member?.presence_claim_state || '').toLowerCase();
            return st === 'declared' || st === 'contested';
        }

        function claimedPickupPassengers(trip) {
            return orderedPickupPassengers(trip).filter(p => !isPassengerPickedUp(p) && isPassengerClaimed(p));
        }

        function pickupReadyForStart(trip) {
            const passengers = orderedPickupPassengers(trip);
            return !passengers.length || passengers.every(p => isPassengerPickedUp(p) || isPassengerClaimed(p));
        }

        // М1 r2: до старту водій може зняти «в авто» з будь-кого, кого позначив помилково. Порядок натискань нічого не доводить:
        // двоє сідають на одній зупинці, а руху авто до старту система не бачить. Після старту це висадка, не неявка.
        function boardedPickupPassengers(trip) {
            return orderedPickupPassengers(trip).filter(isPassengerPickedUp);
        }

        function claimedNamesLine(claimed) {
            return claimed.map(p => `${escapeHtml(passengerDisplayName(p))}${p.presence_contested ? ' (каже, що на місці)' : ''}`).join(', ');
        }

        function ownPresenceClaim(trip) {
            const reqId = currentRequestIdFromTrip(trip);
            return (S.presenceClaims || []).find(c => c.request_status === 'pickup' && Number(c.request_id) === Number(reqId)) || null;
        }

        function applyPresenceClaimsPayload(data) {
            if (Array.isArray(data?.trip_contacts)) S.tripContacts = data.trip_contacts;
            const prevMissed = S.missedPickup;
            S.presenceClaims = Array.isArray(data?.presence_claims) ? data.presence_claims : [];
            S.missedPickup = data?.missed_pickup || null;
            refreshChatPresenceClaim();
            // §0.61 п.6: a missed pickup was no trip with this crew — never a rating candidate (drop its snapshot only).
            if (S.missedPickup && lastKnownTripForRating
                && Number(currentRequestIdFromTrip(lastKnownTripForRating)) === Number(S.missedPickup.request_id)) {
                lastKnownTripForRating = null;
                S._ratingQueue = null;
                try { localStorage.removeItem(_stateKey('ltr')); localStorage.removeItem(_stateKey('rq')); } catch (_) { }
            }
            const reqId = Number(S.missedPickup?.request_id || 0);
            if (reqId && S.didInitialHydrate && Number(prevMissed?.request_id || 0) !== reqId) {
                notifyCriticalEvent('missed_pickup', reqId);
                showToast('Екіпаж вирушив без вас. Посадка не відбулась', '');
            }
        }

        async function declarePassengerMissing(requestId, passengerId, name) {
            const reqId = parseInt(requestId || 0, 10) || 0;
            const paxId = parseInt(passengerId || 0, 10) || 0;
            if (!reqId || !paxId) return false;
            const who = escapeHtml(name || 'попутника');
            const sure = await new Promise(resolve => {
                openSheet(`
                    <div class="sheet-title">Не знайшли ${who}?</div>
                    <div class="sheet-sub">${who} отримає повідомлення й зможе відповісти «Я на місці». Домовленість не скасовується: якщо людина підійде, позначте «в авто». Якщо ні — зможете вирушити без неї.</div>
                    <div class="sheet-actions">
                        <button class="btn btn-primary" id="g5-claim-yes">Так, не знайшов</button>
                        <button class="btn btn-ghost" id="g5-claim-no">Ще шукаю</button>
                    </div>`);
                document.getElementById('g5-claim-yes').onclick = () => { closeSheet(); resolve(true); };
                document.getElementById('g5-claim-no').onclick = () => { closeSheet(); resolve(false); };
            });
            if (!sure || !beginOp(`g5_claim_${reqId}`)) return false;
            try {
                const res = await api('/api/v3/trip/presence-claim', { method: 'POST', body: JSON.stringify({ request_id: reqId, user_id: S.userId, passenger_id: paxId }) });
                if (res?.status === 'ok') { showToast(`Позначено: не знайшли ${name || 'попутника'}`, ''); await hydrate(); return true; }
                showToast('Не вдалося позначити', 'error');
                await hydrate();
                return false;
            } finally { endOp(`g5_claim_${reqId}`); }
        }

        async function contestPresenceClaim(requestId, claimSeq) {
            const reqId = parseInt(requestId || 0, 10) || 0;
            const seq = parseInt(claimSeq || 0, 10) || 0;
            if (!reqId || !beginOp(`g5_contest_${reqId}`)) return false;
            try {
                const body = { request_id: reqId, user_id: S.userId };
                if (seq) body.claim_seq = seq;
                const res = await api('/api/v3/trip/presence-contest', { method: 'POST', body: JSON.stringify(body) });
                if (res?.status === 'ok') { showToast('Водій бачить: ви на місці', 'success'); await hydrate(); return true; }
                showToast('Не вдалося надіслати відповідь', 'error');
                return false;
            } finally { endOp(`g5_contest_${reqId}`); }
        }

        async function revokePassengerPickup(requestId, passengerId, name) {
            const reqId = parseInt(requestId || 0, 10) || 0;
            const paxId = parseInt(passengerId || 0, 10) || 0;
            if (!reqId || !paxId) return false;
            const who = escapeHtml(name || 'попутника');
            const sure = await new Promise(resolve => {
                openSheet(`
                    <div class="sheet-title">Зняти «в авто» з ${who}?</div>
                    <div class="sheet-sub">Лише якщо позначили помилково: людина ще не сідала. Якщо вона вже їхала з вами, це не неявка.</div>
                    <div class="sheet-actions">
                        <button class="btn btn-primary" id="g5-revoke-yes">Так, помилково</button>
                        <button class="btn btn-ghost" id="g5-revoke-no">Ні</button>
                    </div>`);
                document.getElementById('g5-revoke-yes').onclick = () => { closeSheet(); resolve(true); };
                document.getElementById('g5-revoke-no').onclick = () => { closeSheet(); resolve(false); };
            });
            if (!sure || !beginOp(`g5_revoke_${reqId}`)) return false;
            try {
                const res = await api('/api/v3/trip/pickup-revoke', { method: 'POST', body: JSON.stringify({ request_id: reqId, user_id: S.userId, passenger_id: paxId }) });
                if (res?.status === 'ok') { showToast('Позначку «в авто» знято', ''); await hydrate(); return true; }
                showToast(res?.reason === 'invalid_state' ? 'Після старту це вже висадка, а не помилка позначки' : 'Не вдалося зняти позначку', 'error');
                await hydrate();
                return false;
            } finally { endOp(`g5_revoke_${reqId}`); }
        }

        async function resolveMissedPickup(choice) {
            const mp = S.missedPickup;
            const reqId = Number(mp?.request_id || 0);
            if (!reqId || !['re_search', 'not_going'].includes(choice)) return false;
            if (choice === 'not_going') {
                const sure = await new Promise(resolve => {
                    openSheet(`
                        <div class="sheet-title">Більше не їдете?</div>
                        <div class="sheet-sub">Ви вийдете з події «${escapeHtml(mp.direction_title || 'подія')}». Пошук у ній вимкнеться.</div>
                        <div class="sheet-actions">
                            <button class="btn btn-primary" id="g5-notgoing-yes">Так, більше не їду</button>
                            <button class="btn btn-ghost" id="g5-notgoing-no">Назад</button>
                        </div>`);
                    document.getElementById('g5-notgoing-yes').onclick = () => { closeSheet(); resolve(true); };
                    document.getElementById('g5-notgoing-no').onclick = () => { closeSheet(); resolve(false); };
                });
                if (!sure) return false;
            }
            if (!beginOp(`g5_resolve_${reqId}`)) return false;
            try {
                const res = await api('/api/v3/trip/missed-pickup/resolve', { method: 'POST', body: JSON.stringify({ request_id: reqId, user_id: S.userId, choice }) });
                if (res?.status === 'ok') {
                    if (res.resolution === 're_search' && (S.subscriptions || []).some(s => String(s.direction_id) === String(mp.direction_id) && s.auto_match === false)) {
                        S.mapResultCollapsed = true;
                        S.mapResultCollapseTouched = true;
                        persistCriticalState();
                    }
                    showToast(res.resolution === 're_search' ? 'Шукаємо інший екіпаж у цій події' : 'Ви вийшли з події', '');
                    await hydrate();
                    return true;
                }
                showToast('Не вдалося зберегти вибір', 'error');
                return false;
            } finally { endOp(`g5_resolve_${reqId}`); }
        }

        function buildMissedPickupDockBody(mp) {
            const dir = mp.direction_title || 'подія';
            const driver = mp.driver_name || 'водій';
            const contestLine = mp.contested
                ? 'Ви відповіли «Я на місці» — це збережено.'
                : 'Якщо ви були на погодженій точці — натисніть «Я на місці», це збережеться.';
            const contestBtn = mp.can_contest
                ? `<button class="btn btn-secondary" data-g5-contest="true" onclick="contestPresenceClaim(${Number(mp.request_id) || 0}, ${Number(mp.claim_seq) || 0})">📍 Я на місці</button>` : '';
            return `<div class="dock-head" data-g5-missed-pickup="${Number(mp.request_id) || 0}">
                    <div style="min-width:0;">
                        <div class="dock-title">🚗 Посадка не відбулась</div>
                        <div class="dock-sub">${escapeHtml(dir)} · 👤 Ви попутник</div>
                        <div class="dock-sub" style="color:var(--amber);font-weight:bold;margin-top:5px;white-space:normal;">Екіпаж вирушив без вас (${escapeHtml(driver)}). ${contestLine}</div>
                        <div class="dock-sub" style="margin-top:4px;white-space:normal;color:var(--text);">Що далі — вирішуєте ви.</div>
                    </div>
                </div>
                <div class="dock-actions">
                    ${contestBtn}
                    <button class="btn btn-primary" data-g5-choice="re_search" onclick="resolveMissedPickup('re_search')">🔎 Шукати інший екіпаж</button>
                    <button class="btn btn-ghost" data-g5-choice="not_going" onclick="resolveMissedPickup('not_going')">Більше не їду</button>
                </div>`;
        }

        function buildDriverPresenceClaimsPanel(trip) {
            if (!trip || trip.is_started || trip.status !== 'pickup' || trip.viewer_role !== 'driver') return '';
            const claimed = claimedPickupPassengers(trip);
            const boarded = boardedPickupPassengers(trip);
            if (!claimed.length && !boarded.length) return '';
            const rows = claimed.map(p => {
                const reqId = passengerRequestId(p), paxId = parseInt(p.user_id || 0, 10) || 0, name = passengerDisplayName(p);
                return `<div data-g5-claimed="${reqId}" style="display:flex;align-items:center;gap:8px;justify-content:space-between;margin-top:6px;">
                    <span style="font-size:13px;">❓ Не знайшли: ${escapeHtml(name)}${p.presence_contested ? ' · каже, що на місці' : ''}</span>
                    <button class="btn btn-secondary" style="padding:6px 10px;font-size:12px;" onclick="closeSheet();markPassengerPickedUp(${reqId}, ${paxId})">✅ в авто</button>
                </div>`;
            }).join('');
            const boardedRows = boarded.map(p => {
                const reqId = passengerRequestId(p), paxId = parseInt(p.user_id || 0, 10) || 0, name = passengerDisplayName(p);
                return `<div data-g5-revoke="${reqId}" style="display:flex;align-items:center;gap:8px;justify-content:space-between;margin-top:6px;">
                    <span style="font-size:13px;opacity:.85;">✅ В авто: ${escapeHtml(name)}</span>
                    <button class="btn btn-ghost" style="padding:6px 10px;font-size:12px;" onclick="closeSheet();revokePassengerPickup(${reqId}, ${paxId}, ${JSON.stringify(name).replace(/"/g, '&quot;')})">↩ Помилково</button>
                </div>`;
            }).join('');
            return `<div data-g5-driver-claims="true" style="margin-top:12px;padding:10px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid var(--border);">
                <div style="font-size:11px;font-weight:900;color:var(--amber);text-transform:uppercase;letter-spacing:.6px;">Посадка</div>
                ${rows}${boardedRows}
            </div>`;
        }

        function allPickupPassengersPickedUp(trip) {
            const passengers = orderedPickupPassengers(trip);
            return !passengers.length || passengers.every(isPassengerPickedUp);
        }

        // ── Черга збору (А1/А4/А6; канал, записи 45/57/61) ──
        function waitingPickupPassengers(trip) {
            return orderedPickupPassengers(trip).filter(p => !isPassengerPickedUp(p));
        }

        // А1: лише водій, лише у «Домовились»/«Збір» до «Поїхали», лише серед ще не посаджених (двоє й більше).
        function pickupQueueEditable(trip) {
            return !!trip && String(trip.viewer_role || '').toLowerCase() === 'driver' && !trip.is_started
                && ['active', 'pickup'].includes(String(trip.status || ''))
                && (parseInt(trip.crew_id || 0, 10) || 0) > 0
                && waitingPickupPassengers(trip).length >= 2;
        }

        function passengerQueueIndex(trip) {
            return waitingPickupPassengers(trip).findIndex(p => String(p?.user_id) === String(S.userId));
        }

        // А4: попутник постійно бачить свою позицію в черзі.
        function passengerQueuePositionText(trip) {
            const i = passengerQueueIndex(trip);
            if (i < 0 || trip?.is_started) return '';
            if (i === 0) return 'Наступна — ваша точка';
            return `Перед вами ще ${i} ${pluralUk(i, 'зупинка', 'зупинки', 'зупинок')}`;
        }

        // А1/А3: водій міняє сусідні зупинки. Сервер приймає повний новий порядок непосаджених разом з очікуваною
        // версією черги; якщо склад чи черга змінились після того, як водій їх побачив, — 409 і нічого не записано.
        async function movePickupStop(requestId, delta) {
            const t = S.activeTrip;
            if (!pickupQueueEditable(t)) return false;
            const seen = waitingPickupPassengers(t).map(p => passengerRequestId(p));
            const order = [...seen];
            const from = order.indexOf(parseInt(requestId || 0, 10) || 0);
            const to = from + (Number(delta) < 0 ? -1 : 1);
            if (from < 0 || to < 0 || to >= order.length || order.includes(0)) return false;
            [order[from], order[to]] = [order[to], order[from]];
            if (!beginOp('pickup_queue_move')) return false;
            try {
                const res = await apiWithStatus('/api/v3/trip/queue', {
                    method: 'POST',
                    silent: true,
                    body: JSON.stringify({
                        user_id: S.userId,
                        crew_id: parseInt(t.crew_id, 10),
                        expected_version: Number(t.pickup_queue_version || 0),
                        seen,
                        order
                    })
                });
                if (res.ok && res.data?.status === 'ok') {
                    showToast('Чергу збору змінено', 'success');
                    await hydrate();
                    return true;
                }
                showToast(res.status === 409 ? 'Склад змінився — чергу оновлено, спробуйте ще раз' : 'Не вдалося змінити чергу', 'error');
                if (res.status === 409) await hydrate();
                return false;
            } finally { endOp('pickup_queue_move'); }
        }

        // А6: Google Maps URLs приймають до 3 проміжних зупинок у мобільному браузері й до 9 в інших випадках; де
        // зупинки не підтримуються, Google мовчки їх ігнорує (developers.google.com/maps/documentation/urls/get-started,
        // перевірено 29.09.2026). Платформа невідома — беремо суворішу межу; більше — «по одній точці».
        function pickupFullRoute(trip) {
            const limit = 3;
            if (!trip || trip.is_started || String(trip.viewer_role || '').toLowerCase() !== 'driver') return null;
            const waiting = waitingPickupPassengers(trip);
            if (!waiting.length) return null;
            const stops = waiting.map(p => ({ member: p, coord: firstFiniteLatLng([p?.pickup_lat, p?.pickup_lng]) }));
            // Людину без точки маршрут не пропускає: поки хоч в одного немає точки — «Весь маршрут» недоступний.
            const gap = stops.find(s => !s.coord);
            if (gap) return { ok: false, reason: 'missing', member: gap.member };
            if (stops.length > limit) return { ok: false, reason: 'too_many', count: stops.length, limit };
            // Запис 62 (P2), А7: кінцева точка маршруту — лише валідна координата події (нуль валідний). Текстова адреса
            // не обіцяє визначеного місця — її відкриваємо окремо як пошук адреси.
            const event = tripEventDestination(trip);
            if (!event || event.lat == null || event.lng == null) return { ok: false, reason: 'no_event_point', query: event?.query || '' };
            const params = new URLSearchParams({
                api: '1',
                destination: `${Number(event.lat).toFixed(6)},${Number(event.lng).toFixed(6)}`,
                travelmode: 'driving',
                waypoints: stops.map(s => `${s.coord.lat.toFixed(6)},${s.coord.lng.toFixed(6)}`).join('|')
            });
            return { ok: true, count: stops.length, url: `https://www.google.com/maps/dir/?${params.toString()}` };
        }

        function eventAddressSearchUrl(trip) {
            const query = String(tripEventDestination(trip)?.query || '').trim();
            if (!query) return '';
            return `https://www.google.com/maps/search/?${new URLSearchParams({ api: '1', query }).toString()}`;
        }

        function openEventAddressSearch() {
            const url = eventAddressSearchUrl(S.activeTrip);
            if (!url) return;
            const tg = window.Telegram?.WebApp;
            if (tg?.openLink) tg.openLink(url, { try_instant_view: false });
            else window.open(url, '_blank', 'noopener');
        }

        function openPickupFullRoute() {
            const route = pickupFullRoute(S.activeTrip);
            if (!route?.ok) { renderTrips(); return; }
            const tg = window.Telegram?.WebApp;
            if (tg?.openLink) tg.openLink(route.url, { try_instant_view: false });
            else window.open(route.url, '_blank', 'noopener');
        }

        // А7: наступну людину без точки не пропускаємо й не ведемо на її живу геопозицію — просимо уточнити в чаті.
        function openPickupPointClarifyChat(requestId, passengerId) {
            const reqId = parseInt(requestId || 0, 10) || 0;
            if (!reqId) return;
            closeSheet();
            openChat(reqId, parseInt(passengerId || 0, 10) || 0);
            const input = document.getElementById('chat-input');
            if (input && !input.value) input.value = 'Уточни, будь ласка, свою точку збору на карті — без неї я не знаю, де тебе забрати.';
        }

        function buildPickupNavActions(trip) {
            const next = nextPickupPassenger(trip);
            if (!next) return '';
            const name = passengerDisplayName(next);
            const nextCoord = firstFiniteLatLng([next?.pickup_lat, next?.pickup_lng]);
            const reqId = passengerRequestId(next);
            const paxId = parseInt(next.user_id || 0, 10) || 0;
            const primary = nextCoord
                ? `<button class="btn btn-secondary" data-pickup-nav-next="true" onclick="openGoogleNavigationFromMap()">🧭 Навігація до наступної точки</button>`
                : `<button class="btn btn-secondary" data-pickup-clarify="true" ${reqId ? '' : 'disabled'} onclick="openPickupPointClarifyChat(${reqId}, ${paxId})">💬 Уточнити точку в чаті: ${escapeHtml(name)}</button>`;
            const route = pickupFullRoute(trip);
            const full = route?.ok
                ? `<button class="btn btn-secondary" data-pickup-full-route="true" title="Якщо Google не показав проміжні зупинки — їдьте по одній точці" onclick="openPickupFullRoute()">🗺 Весь маршрут</button>`
                : '';
            let note = '';
            // А7: подія без точки — лише пошук її адреси в Google, без обіцянки місця (запис 62, P2).
            const eventSearch = route && !route.ok && route.reason === 'no_event_point' && route.query
                ? `<button class="btn btn-secondary" data-event-address-search="true" onclick="openEventAddressSearch()">🔎 Адреса події в Google</button>`
                : '';
            if (route && !route.ok && route.reason === 'no_event_point') {
                note = 'Весь маршрут — коли в події буде точка на карті; адресу події можна знайти пошуком.';
            } else if (route && !route.ok && route.reason === 'too_many') {
                note = `Весь маршрут у Google — до ${route.limit} зупинок; зараз ${route.count}, тож навігація по одній точці.`;
            } else if (route && !route.ok && route.reason === 'missing' && nextCoord) {
                note = `Весь маршрут — коли точка буде в усіх (немає: ${passengerDisplayName(route.member)}).`;
            }
            return `<div data-pickup-nav="true" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">${primary}${full}${eventSearch}</div>`
                + (note ? `<div data-pickup-route-note="${escapeAttr(route.reason)}" style="font-size:11px;color:var(--text-secondary);margin-top:6px;">${escapeHtml(note)}</div>` : '');
        }

        // Координата: null / undefined / порожній рядок / булеве — ВІДСУТНІСТЬ (Number(null) === 0 малював таку
        // точку в (0, 0)); числовий нуль — валідна координата (контракт Е, А7; запис 57).
        function _finiteCoord(value, limit) {
            if (value === null || value === undefined || typeof value === 'boolean') return null;
            if (typeof value === 'string' && !value.trim()) return null;
            const n = Number(value);
            return Number.isFinite(n) && Math.abs(n) <= limit ? n : null;
        }

        function firstFiniteLatLng(...pairs) {
            for (const [lat, lng] of pairs) {
                const y = _finiteCoord(lat, 90);
                const x = _finiteCoord(lng, 180);
                if (y !== null && x !== null) return { lat: y, lng: x };
            }
            return null;
        }

        // Канонічний старт авто — лише з даних поїздки (точка, яку водій поставив для екіпажу). Pickup попутника
        // чи живий GPS водія стартом не є (контракт А5; AI_INSTRUCTIONS п.11).
        function tripCarStartCoord(trip) {
            return firstFiniteLatLng([trip?.car_start_lat, trip?.car_start_lng]);
        }

        function crewMemberMapCoord(member, trip) {
            const role = String(member?.role || '').toLowerCase();
            if (role === 'driver') {
                return firstFiniteLatLng(
                    [member?.lat, member?.lng]
                );
            }
            return firstFiniteLatLng(
                [member?.pickup_lat, member?.pickup_lng],
                [member?.lat, member?.lng]
            );
        }

        function crewCarPinCoordForTrip(trip) {
            // Запис 57: авто поїздки стоїть лише в канонічному старті з даних поїздки. Публічний шар map/crews
            // для екіпажу без рядка старту підставляє точку попутника, а S.pickupCoords — локальна чернетка,
            // тож жодне з них не є стартом авто. Невідомий старт — розрив схеми (А7), не вигадана точка.
            return tripCarStartCoord(trip);
        }

        function crewMemberVisibleMapCoord(member, trip) {
            const isMe = String(member?.user_id || '') === String(S.userId || '');
            let c = crewMemberMapCoord(member, trip);
            // Консенсус форуму 2026-06-12 («Моя поїздка»): користувач ЗАВЖДИ
            // бачить себе. Сервер свідомо не віддає глядачу його пін
            // (map/passengers: di.user_id != viewer), а без live-consent
            // координат нема — фолбек: статична точка очікування з S.pickupCoords.
            if (!c && isMe && Number.isFinite(Number(S.pickupCoords?.lat)) && Number.isFinite(Number(S.pickupCoords?.lng))) {
                c = { lat: Number(S.pickupCoords.lat), lng: Number(S.pickupCoords.lng) };
            }
            return c;
        }

        function offsetMapCoordIfNear(referenceCoord, nearCoord, offsetPx = { x: 28, y: -24 }) {
            if (!referenceCoord || !nearCoord || !S.map || !window.L) return referenceCoord;
            const ref = L.latLng(referenceCoord.lat, referenceCoord.lng);
            const near = L.latLng(nearCoord.lat, nearCoord.lng);
            const point = S.map.latLngToLayerPoint(ref);
            const nearPoint = S.map.latLngToLayerPoint(near);
            const pixelDistance = Math.hypot(point.x - nearPoint.x, point.y - nearPoint.y);
            if (pixelDistance > 38 && ref.distanceTo(near) > 24) return referenceCoord;
            const shifted = S.map.layerPointToLatLng(L.point(point.x + offsetPx.x, point.y + offsetPx.y));
            return { lat: shifted.lat, lng: shifted.lng, visualOffset: true };
        }

        function orderedCrewMembersForMap(trip) {
            const driver = crewDriverMember(trip);
            const passengers = orderedPickupPassengers(trip);
            return driver ? [driver, ...passengers] : passengers;
        }

        // «Схема збору» (контракт А5/А7, запис 57): канонічний старт авто → прийняті ще не посаджені попутники в
        // порядку черги → подія. Лише точки з даних поїздки: живий GPS — не точка схеми, pickup попутника — не
        // старт авто. Невідома точка рве схему: сусідів не з'єднуємо «наче її немає» і координат не вигадуємо.
        // Pending-запрошені не є учасниками поїздки, тож ліній не мають. Пряма лінія — не дорога й не час.
        function buildPickupScheme(trip) {
            if (!trip) return null;
            const driver = crewDriverMember(trip);
            const nodes = [{ kind: 'car', name: driver?.name || trip.driver_name || 'Водій', coord: tripCarStartCoord(trip) }];
            orderedPickupPassengers(trip).filter(p => !isPassengerPickedUp(p)).forEach(p => {
                nodes.push({ kind: 'passenger', name: passengerDisplayName(p), member: p,
                    coord: firstFiniteLatLng([p?.pickup_lat, p?.pickup_lng]) });
            });
            const destination = tripEventDestination(trip);
            const eventCoord = destination && destination.lat != null ? { lat: destination.lat, lng: destination.lng } : null;
            nodes.push({ kind: 'event', name: trip.direction_title || destination?.label || 'Подія', coord: eventCoord });
            const segments = [];
            let run = [];
            nodes.forEach(n => {
                if (n.coord) { run.push([n.coord.lat, n.coord.lng]); return; }
                if (run.length >= 2) segments.push(run);
                run = [];
            });
            if (run.length >= 2) segments.push(run);
            const missing = nodes.filter(n => !n.coord);
            return { nodes, segments, missing, complete: !missing.length };
        }

        function pickupSchemeNotice(scheme) {
            if (!scheme) return null;
            const items = [];
            const noPoint = scheme.missing.filter(n => n.kind === 'passenger').map(n => n.name);
            if (noPoint.length) items.push(`у ${noPoint.join(', ')} немає точки — уточніть у чаті`);
            if (scheme.missing.some(n => n.kind === 'car')) items.push('старт авто не задано');
            if (scheme.missing.some(n => n.kind === 'event')) items.push('подія без координат, схема закінчується на останній точці');
            if (items.length) return { tone: 'warn', text: `Схема неповна: ${items.join('; ')}` };
            return { tone: 'ok', text: 'Схема збору з\'єднує точки — це не дорога й не час у дорозі' };
        }

        function buildPickupSequence(trip) {
            if (!trip) return '';
            const passengers = orderedPickupPassengers(trip);
            if (!passengers.length) return '';
            const driver = crewDriverMember(trip);
            const driverName = driver?.name || trip.driver_name || 'Водій';
            const isStarted = !!trip.is_started;
            const isPickup = trip.status === 'pickup';
            const nextPassenger = nextPickupPassenger(trip);
            const title = isStarted ? 'Екіпаж у дорозі' : 'Порядок збору';
            const hint = isStarted
                ? 'Усі вже в авто; карта лишається спільним простором поїздки.'
                : (isPickup
                    ? (trip.viewer_role === 'driver'
                        ? 'Позначайте попутників по одному, коли вони вже в авто.'
                        : 'Водій позначає попутників по одному, коли вони сідають в авто.')
                    : 'Спочатку авто, потім точки попутників.');
            const startLabel = driver && String(driver.user_id) === String(S.userId) ? 'Ваш старт авто' : `Старт авто: ${driverName}`;
            const ownDriverStart = driver && String(driver.user_id) === String(S.userId) ? String(S.pickupLabel || '').trim() : '';
            const startMeta = trip.driver_start || trip.driver_pickup || ownDriverStart || 'старт авто на карті';
            const isDriverViewer = String(trip.viewer_role || '').toLowerCase() === 'driver';
            // А4: водій бачить «Наступний: Ім'я», попутник — свою позицію в черзі.
            const queueLine = isStarted ? '' : (isDriverViewer
                ? (nextPassenger ? `Наступний: ${passengerDisplayName(nextPassenger)}` : '')
                : passengerQueuePositionText(trip));
            const editable = pickupQueueEditable(trip);
            // А4: посаджені — окремий блок «Вже в авто», без номерів майбутніх зупинок.
            const waiting = isStarted ? [] : passengers.filter(p => !isPassengerPickedUp(p));
            const boarded = isStarted ? passengers : passengers.filter(p => isPassengerPickedUp(p));
            const startRow = {
                type: 'driver-start',
                icon: '🚗',
                title: startLabel,
                meta: startMeta,
                badge: isStarted ? 'в дорозі' : 'старт',
                isSelf: driver && String(driver.user_id) === String(S.userId),
            };
            const stopRows = waiting.map((p, index) => {
                const isSelf = String(p.user_id) === String(S.userId);
                const name = passengerDisplayName(p);
                const isNext = nextPassenger && String(nextPassenger.user_id) === String(p.user_id);
                const hasPoint = !!firstFiniteLatLng([p?.pickup_lat, p?.pickup_lng]);
                return {
                    type: 'passenger-stop',
                    icon: isSelf ? '🟢' : '👤',
                    number: index + 1,
                    title: isSelf ? 'Ваша точка очікування' : `Забрати: ${name}`,
                    meta: (p.pickup || p.pickup_label || 'точка на карті') + (hasPoint ? '' : ' · точки на карті немає'),
                    badge: isPickup && isNext ? 'зараз' : (index === 0 ? 'наступний' : 'далі'),
                    isSelf,
                    status: isPickup && isNext ? 'next' : 'waiting',
                    reqId: passengerRequestId(p),
                    name,
                    canUp: editable && index > 0,
                    canDown: editable && index < waiting.length - 1,
                };
            });
            const boardedRows = boarded.map(p => {
                const isSelf = String(p.user_id) === String(S.userId);
                return {
                    type: 'passenger-stop',
                    icon: '✅',
                    title: isSelf ? 'Ви' : passengerDisplayName(p),
                    meta: p.pickup || p.pickup_label || '',
                    badge: 'в авто',
                    isSelf,
                    status: 'picked_up',
                };
            });
            const moveBtn = (row, dir) => {
                const up = dir < 0;
                const allowed = up ? row.canUp : row.canDown;
                return `<button type="button" data-pickup-move="${up ? 'up' : 'down'}" aria-label="${escapeAttr(`${row.name}: ${up ? 'раніше' : 'пізніше'} в черзі`)}" ${allowed && row.reqId ? '' : 'disabled'} onclick="movePickupStop(${row.reqId}, ${dir})" style="width:30px;height:28px;border-radius:7px;border:1px solid var(--border);background:rgba(255,255,255,0.06);color:var(--text);font-size:14px;font-weight:900;cursor:pointer;${allowed ? '' : 'opacity:.35;cursor:default;'}">${up ? '↑' : '↓'}</button>`;
            };
            const rowHtml = row => `<div data-pickup-stop="${escapeAttr(row.type)}" data-pickup-status="${escapeAttr(row.status || '')}" style="display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:8px;border-radius:8px;background:${row.isSelf ? 'rgba(52,211,153,0.10)' : 'rgba(255,255,255,0.04)'};border:1px solid ${row.isSelf ? 'rgba(52,211,153,0.24)' : 'rgba(255,255,255,0.06)'};">
                        <div style="width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(15,23,42,0.58);font-size:13px;">${row.icon}</div>
                        <div style="min-width:0;">
                            <div style="font-size:13px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${row.number ? `${row.number}. ` : ''}${escapeHtml(row.title)}</div>
                            ${row.meta ? `<div style="font-size:11px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(row.meta)}</div>` : ''}
                        </div>
                        <div style="display:flex;align-items:center;gap:6px;">
                            <div style="font-size:10px;font-weight:850;color:${row.isSelf ? 'var(--green)' : 'var(--text-secondary)'};text-transform:uppercase;">${escapeHtml(row.badge)}</div>
                            ${editable && row.type === 'passenger-stop' && row.status !== 'picked_up' ? `${moveBtn(row, -1)}${moveBtn(row, 1)}` : ''}
                        </div>
                    </div>`;
            return `<div data-crew-pickup-sequence="true" data-pickup-queue-version="${escapeAttr(String(trip.pickup_queue_version ?? ''))}" style="margin-top:12px;padding:10px;border-radius:10px;background:rgba(56,189,248,0.06);border:1px solid rgba(56,189,248,0.18);">
                <div style="font-size:11px;font-weight:900;color:var(--blue);text-transform:uppercase;letter-spacing:.6px;">${escapeHtml(title)}</div>
                <div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">${escapeHtml(hint)}</div>
                ${queueLine ? `<div data-pickup-queue-line="true" style="font-size:13px;font-weight:850;color:var(--text);margin-top:6px;">${escapeHtml(queueLine)}</div>` : ''}
                <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px;">
                    ${[startRow, ...stopRows].map(rowHtml).join('')}
                </div>
                ${boardedRows.length ? `<div data-pickup-boarded="true" style="margin-top:10px;">
                    <div style="font-size:11px;font-weight:900;color:var(--green);text-transform:uppercase;letter-spacing:.6px;">Вже в авто</div>
                    <div style="display:flex;flex-direction:column;gap:8px;margin-top:6px;">${boardedRows.map(rowHtml).join('')}</div>
                </div>` : ''}
                ${isDriverViewer && !isStarted && waiting.length ? buildPickupNavActions(trip) : ''}
            </div>`;
        }

        function buildPickupActionPanel(trip, options = {}) {
            if (!trip || trip.is_started || trip.status !== 'pickup') return '';
            const includeAction = options.includeAction !== false;
            const passengers = orderedPickupPassengers(trip);
            if (!passengers.length) return '';
            const isDriver = trip.viewer_role === 'driver';
            const selfPassenger = passengers.find(p => String(p.user_id) === String(S.userId));
            if (!isDriver) {
                if (selfPassenger && isPassengerPickedUp(selfPassenger)) {
                    return `<div data-pickup-action-panel="passenger-picked" style="margin-top:12px;padding:10px;border-radius:10px;background:rgba(16,185,129,0.10);border:1px solid rgba(16,185,129,0.28);font-size:13px;color:var(--green);">${passengerPickupHint(trip, tripDriverName(trip), nextPickupPassenger(trip))}</div>`;
                }
                return `<div data-pickup-action-panel="passenger-waiting" style="margin-top:12px;padding:10px;border-radius:10px;background:rgba(56,189,248,0.10);border:1px solid rgba(56,189,248,0.28);font-size:13px;color:var(--blue);">${passengerPickupHint(trip, tripDriverName(trip), nextPickupPassenger(trip))}</div>`;
            }
            const next = nextPickupPassenger(trip);
            if (next && isPassengerClaimed(next)) {
                return `<div data-pickup-action-panel="claims-only" style="margin-top:12px;padding:10px;border-radius:10px;background:rgba(245,158,11,0.10);border:1px solid rgba(245,158,11,0.30);font-size:13px;color:var(--amber);">❓ Не знайшли: ${claimedNamesLine(claimedPickupPassengers(trip))}. Решта в авто — можна вирушати без них або позначити «в авто», якщо людина підійде.</div>`;
            }
            if (!next) {
                return `<div data-pickup-action-panel="all-picked" style="margin-top:12px;padding:10px;border-radius:10px;background:rgba(16,185,129,0.10);border:1px solid rgba(16,185,129,0.28);font-size:13px;color:var(--green);">✅ Усі попутники в авто. Можна стартувати до події.</div>`;
            }
            const reqId = passengerRequestId(next);
            const passengerId = parseInt(next.user_id || 0, 10) || 0;
            const name = passengerDisplayName(next);
            const meta = next.pickup || next.pickup_label || 'точка на карті';
            const disabled = !reqId || !passengerId;
            return `<div data-pickup-action-panel="driver-next" style="margin-top:12px;padding:10px;border-radius:10px;background:rgba(255,255,255,0.05);border:1px solid var(--border);">
                <div style="font-size:11px;font-weight:900;color:var(--amber);text-transform:uppercase;letter-spacing:.6px;">Зараз забрати</div>
                <div style="font-size:15px;font-weight:850;margin-top:4px;">${escapeHtml(name)}</div>
                <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">${escapeHtml(meta)}</div>
                ${includeAction ? `<button class="btn btn-primary" data-pickup-current-action="true" style="width:100%;margin-top:10px;" ${disabled ? 'disabled' : ''} onclick="markPassengerPickedUp(${reqId}, ${passengerId})">✅ ${escapeHtml(name)} в авто</button>` : ''}
            </div>`;
        }

        function buildCrewPresenceSummary(trip) {
            if (!trip) return '';
            const passengers = crewPassengerMembers(trip);
            const names = passengers.map(m => m?.name || `#${m?.user_id || '?'}`).filter(Boolean);
            const safeNames = names.slice(0, 3).map(escapeHtml).join(', ');
            const overflow = names.length > 3 ? ` +${names.length - 3}` : '';
            const isStarted = !!trip.is_started;
            const isPickup = trip.status === 'pickup';
            const isDriver = trip.viewer_role === 'driver';
            const label = isStarted
                ? 'У дорозі разом'
                : (isDriver ? 'Забрати попутників' : 'Ваш екіпаж');
            const text = safeNames
                ? `${safeNames}${overflow}`
                : (isDriver ? 'Поки без попутників' : 'Екіпаж формується');
            const hint = isStarted
                ? 'Карта показує людей у поїздці.'
                : (isPickup ? 'Екіпаж на зборі. Черга й позначки посадки — у картці.' : 'Карта показує маршрут збору та хто їде разом.');
            return `<div data-crew-presence-summary="true" style="margin-top:12px;padding:10px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid var(--border);">
                <div style="font-size:11px;font-weight:900;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.6px;">${label}</div>
                <div style="font-size:14px;font-weight:800;margin-top:3px;">${text}</div>
                <div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">${hint}</div>
            </div>`;
        }

        async function openTripMap() {
            if (!S.activeTrip) { switchScreen('explore'); return; }
            switchScreen('explore');
            await refreshMap();
            openMapTripCoordinationSheet();
        }

        function openMapTripCoordinationSheet() {
            const t = S.activeTrip;
            if (!t) return false;
            const isDriver = t.viewer_role === 'driver';
            const isStarted = !!t.is_started;
            const isPickup = t.status === 'pickup';
            const allPickedUp = allPickupPassengersPickedUp(t);
            const nextPassenger = nextPickupPassenger(t);
            const safeReqId = parseInt(t.request_id || t.id || 0, 10) || 0;
            const safePartnerId = parseInt(isDriver ? (t.client_id || 0) : (t.driver_id || 0), 10) || 0;
            const title = isStarted ? 'У дорозі до події' : (isPickup ? 'Збір екіпажу' : 'Екіпаж домовився');
            const status = isStarted
                ? 'Усі в авто. Карта лишається як просторовий контекст поїздки.'
                : (isDriver
                    ? 'На карті видно, кого забрати і маршрут збору. Позначайте попутників по одному.'
                    : 'На карті видно водія, вас та інших учасників екіпажу.');
            const nextReqId = passengerRequestId(nextPassenger);
            const nextPassengerId = parseInt(nextPassenger?.user_id || 0, 10) || 0;
            const nextName = nextPassenger ? passengerDisplayName(nextPassenger) : '';
            const actions = isStarted
                ? (isDriver
                    ? `<button class="btn btn-secondary" onclick="closeSheet();openChat(${safeReqId}, ${safePartnerId})">💬 Чат</button>
