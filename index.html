                ? (trip.client_id ?? trip.partner_id)
                : (trip.driver_id ?? trip.partner_id);
            const partnerId = Number(partnerRaw);
            if (!Number.isFinite(partnerId) || partnerId <= 0) return null;
            return {
                request_id: requestId,
                partner_id: partnerId,
                partner_name: ratingPartnerName(trip, partnerId, requestId),
                direction_title: String(trip.direction_title || '').trim(),
                viewer_role: viewerRole
            };
        }

        function isRatingEligibleTripSnapshot(trip) {
            if (!trip || !currentRequestIdFromTrip(trip)) return false;
            const status = String(trip.status || '').toLowerCase();
            if (status === 'cancelled' || status === 'canceled') return false;
            if (trip.cancel_requested_by || trip.cancel_by) return false;
            return status === 'completed' || tripViewerFinished(trip) || tripPartnerFinished(trip);
        }

        function getCurrentRatingContext() {
            return S._ratingContext || buildRatingContext(S.activeTrip);
        }

        // E2E-знахідка 2026-07-15: водій з N попутників має оцінити КОЖНОГО.
        // Черга контекстів зі знімка поїздки: водій — по одному на попутника
        // (per-request, індивідуальний фініш = індивідуальна оцінка),
        // попутник — один якірний контекст пари.
        function buildRatingQueueFromTrip(trip) {
            if (!trip) return [];
            if (String(trip.viewer_role || '').toLowerCase() === 'driver') {
                const q = orderedPickupPassengers(trip)
                    .map(p => ratingContextForRequest(trip, passengerRequestId(p), p?.user_id))
                    .filter(Boolean);
                if (q.length) return q;
            }
            const anchor = buildRatingContext(trip);
            return anchor ? [anchor] : [];
        }

        function hasPendingRating() {
            return !!lastKnownTripForRating || (Array.isArray(S._ratingQueue) && S._ratingQueue.length > 0);
        }

        function queueRatingContext(ratingContext, tripSnapshot = null) {
            if (!ratingContext?.request_id) return false;
            if (tripSnapshot) {
                lastKnownTripForRating = { ...tripSnapshot };
            } else if (!lastKnownTripForRating) {
                // Recovery anchor for a persisted queue from an older client.
                // It carries only terminal identity; the queue remains the
                // authoritative list of partners still awaiting a decision.
                lastKnownTripForRating = {
                    request_id: ratingContext.request_id,
                    direction_title: ratingContext.direction_title || '',
                    viewer_role: ratingContext.viewer_role || '',
                    status: 'completed'
                };
            }
            const queue = Array.isArray(S._ratingQueue) ? S._ratingQueue.filter(Boolean) : [];
            if (!queue.some(item => String(item?.request_id || '') === String(ratingContext.request_id))) {
                queue.push(ratingContext);
            }
            S._ratingQueue = queue;
            persistCriticalState();
            renderSubBar();
            return true;
        }

        function maybeOpenCompletedTripRatingSheet(source = '') {
            const existingQueue = Array.isArray(S._ratingQueue) ? S._ratingQueue.filter(Boolean) : [];
            if (S.activeTrip || (!lastKnownTripForRating && !existingQueue.length)) return false;
            // ФІКС L-6 (live-прохід 2026-07-04): явний тап пілюлі «⭐ Оцініть» —
            // це воля користувача, вона НЕ фільтрується евристиками авто-попапів:
            // ні застряглим isAppInBackground (фонова вкладка), ні one-shot
            // «вже показували». Інакше пілюля веде в порожні «Поїздки» — тупик.
            const explicit = source === 'subbar';
            if (!Array.isArray(S._ratingQueue) || !S._ratingQueue.length) {
                S._ratingQueue = buildRatingQueueFromTrip(lastKnownTripForRating);
            }
            const ratingContext = (S._ratingQueue && S._ratingQueue[0]) || buildRatingContext(lastKnownTripForRating);
            const reqId = Number(ratingContext?.request_id || currentRequestIdFromTrip(lastKnownTripForRating)) || 0;
            if (!reqId || !ratingContext) return false;
            if (lastKnownTripForRating && !isRatingEligibleTripSnapshot(lastKnownTripForRating)) {
                lastKnownTripForRating = null;
                waitingForPartner = false;
                S._ratingQueue = null;
                try {
                    localStorage.removeItem(_stateKey('ltr'));
                    localStorage.removeItem(_stateKey('wfp'));
                    localStorage.removeItem(_stateKey('rq'));
                } catch (_) { }
                renderSubBar();
                persistCriticalState();
                return false;
            }

            waitingForPartner = false;
            try { localStorage.removeItem(_stateKey('wfp')); } catch (_) { }

            if (!explicit && (isAppInBackground || S.roleGateOpen || S.matchSheetOpen || isSheetOpen())) {
                if (!S.completedRatingNotifiedIds.has(reqId)) {
                    S.completedRatingNotifiedIds.add(reqId);
                    notifyCriticalEvent('trip_completed', reqId);
                    showToast('🏁 Подорож завершена. Оцініть партнера у Поїздках', '');
                }
                renderSubBar();
                persistCriticalState();
                return false;
            }

            if (!explicit && S.completedRatingSheetShownIds.has(reqId)) return false;
            if (explicit && isSheetOpen()) closeSheet();
            S.completedRatingSheetShownIds.add(reqId);
            notifyCriticalEvent('trip_completed', reqId);
            showToast('🎉 Подорож завершена! Оцініть партнера.', 'success');
            openRatingSheet(ratingContext);
            persistCriticalState();
            renderSubBar();
            return true;
        }

        function currentRequestId() {
            return currentRequestIdFromTrip(S.activeTrip);
        }

        function confirmStartTripIntent(claimed = []) {
            if (!S.activeTrip) return;
            const t = S.activeTrip;
            const crewLabel = ` #${activeTripCrewNumber(t)}`;
            const without = claimed.length
                ? `<div class="sheet-sub" data-g5-start-without="true" style="color:var(--amber);font-weight:bold;">Вирушаєте без: ${claimedNamesLine(claimed)}. ${claimed.length === 1 ? 'Посадка не відбудеться, місце звільниться; людина зможе шукати інший екіпаж.' : 'Їхня посадка не відбудеться, місця звільняться; вони зможуть шукати інший екіпаж.'}</div>`
                : '';
            return new Promise(resolve => {
                openSheet(`
                    <div class="sheet-title">🚀 ${claimed.length ? 'Поїхали' : 'Усі в авто — поїхали'}${crewLabel}?</div>
                    ${without}
                    <div class="sheet-sub">Після цього екіпаж переходить із режиму збору в дорогу до події. Скасування буде закрито, далі доступні тільки чат і завершення подорожі.</div>
                    <div class="sheet-actions">
                        <button class="btn btn-primary" id="confirm-start-trip-yes">Так, поїхали</button>
                        <button class="btn btn-ghost" id="confirm-start-trip-no">Ще ні</button>
                    </div>
                `);
                document.getElementById('confirm-start-trip-yes').onclick = () => { closeSheet(); resolve(true); };
                document.getElementById('confirm-start-trip-no').onclick = () => { closeSheet(); resolve(false); };
            });
        }

        async function startTrip() {
            if (!S.activeTrip) return false;
            if (S.activeTrip.viewer_role === 'driver') {
                if (S.activeTrip.status !== 'pickup') {
                    showToast('Спочатку відмітьте, що ви біля точки збору', 'error');
                    return false;
                }
                if (!pickupReadyForStart(S.activeTrip)) {
                    showToast('Спочатку позначте попутників, які вже в авто', 'error');
                    return false;
                }
            }
            const claimed = S.activeTrip.viewer_role === 'driver' ? claimedPickupPassengers(S.activeTrip) : [];
            if (!await confirmStartTripIntent(claimed)) return false;
            if (!beginOp('start_trip')) return false;
            try {
                const reqId = currentRequestId();
                if (!reqId) { showToast('Немає активної поїздки', 'error'); return false; }
                const body = { request_id: reqId, user_id: S.userId };
                if (claimed.length) body.without_request_ids = claimed.map(passengerRequestId);
                const res = await api('/api/v3/trip/start', { method: 'POST', body: JSON.stringify(body) });
                if (res?.status === 'ok') { showToast('🚀 Поїхали!', 'success'); await hydrate(); return true; }
                if (res?.reason === 'without_set_mismatch') {
                    showToast('Склад змінився. Перевірте, хто в авто, і натисніть «Поїхали» ще раз', 'error');
                    await hydrate();
                    return false;
                }
                showToast('Помилка старту', 'error');
                return false;
            } finally { endOp('start_trip'); }
        }

        async function markPassengerPickedUp(requestId, passengerId) {
            const reqId = parseInt(requestId || 0, 10) || 0;
            const paxId = parseInt(passengerId || 0, 10) || 0;
            if (!reqId || !paxId) {
                showToast('Немає конкретного попутника для позначки', 'error');
                return false;
            }
            if (!beginOp(`pickup_passenger_${reqId}`)) return false;
            try {
                const res = await api('/api/v3/trip/pickup', {
                    method: 'POST',
                    body: JSON.stringify({ request_id: reqId, user_id: S.userId, passenger_id: paxId })
                });
                if (res?.status === 'ok') {
                    showToast('✅ Попутник у авто', 'success');
                    await hydrate();
                    return true;
                }
                showToast('Не вдалося позначити посадку', 'error');
                return false;
            } finally { endOp(`pickup_passenger_${reqId}`); }
        }

        async function arriveAtPickup() {
            if (!S.activeTrip) return false;
            if (!beginOp('arrive_at_pickup')) return false;
            try {
                const reqId = currentRequestId();
                if (!reqId) { showToast('Немає активної поїздки', 'error'); return false; }
                const res = await api('/api/v3/trip/arrive', { method: 'POST', body: JSON.stringify({ request_id: reqId, user_id: S.userId }) });
                if (res?.status === 'ok') { showToast('📍 Ви біля точки збору. Екіпаж у режимі посадки', 'success'); await hydrate(); return true; }
                showToast('Помилка', 'error');
                return false;
            } finally { endOp('arrive_at_pickup'); }
        }

        function driverQuickMessageText(kind) {
            const messages = {
                where: 'Де ти? Я бачу тебе в екіпажі й чекаю відповідь.',
                ready_all: 'Підтвердіть, будь ласка, що ви готові до виїзду.',
                pickup_here: 'Я біля точки збору. Можеш виходити.',
                pickup_here_all: 'Я біля точки збору. Чекаю екіпаж.',
                dropoff: 'Висаджую тут. Підтверди фініш, коли вийдеш.',
                arrived_all: 'Ми доїхали. Підтвердіть фініш, коли вийдете.',
            };
            return messages[kind] || '';
        }

        async function postTripQuickMessage(reqId, text) {
            const safeReqId = Number(reqId);
            if (!Number.isFinite(safeReqId) || safeReqId <= 0 || !text) return false;
            const res = await api('/api/v3/trip/message', {
                method: 'POST',
                body: JSON.stringify({ request_id: safeReqId, user_id: S.userId, text })
            });
            return res?.status === 'ok';
        }

        async function sendTripQuickMessage(reqId, kind) {
            const text = driverQuickMessageText(kind);
            if (!text) return;
            const opKey = `quick_msg_${reqId || 'unknown'}_${kind || 'msg'}`;
            if (!beginOp(opKey)) return;
            try {
                const ok = await postTripQuickMessage(reqId, text);
                showToast(ok ? 'Повідомлення надіслано' : 'Не вдалося надіслати', ok ? '' : 'error');
                if (ok && S.chatRequestId && String(S.chatRequestId) === String(reqId)) await loadChatMessages();
            } finally { endOp(opKey); }
        }

        async function sendCrewQuickMessage(kind) {
            if (!S.activeTrip || S.activeTrip.viewer_role !== 'driver') return;
            const text = driverQuickMessageText(kind);
            const targets = orderedPickupPassengers(S.activeTrip)
                .map(p => passengerRequestId(p))
                .filter(reqId => reqId > 0);
            if (!text || !targets.length) return;
            const opKey = `crew_quick_msg_${kind || 'msg'}`;
            if (!beginOp(opKey)) return;
            try {
                let sent = 0;
                for (const reqId of targets) {
                    if (await postTripQuickMessage(reqId, text)) sent += 1;
                }
                showToast(`Надіслано ${sent}/${targets.length}`, sent === targets.length ? '' : 'error');
                if (sent && S.chatRequestId && targets.map(String).includes(String(S.chatRequestId))) await loadChatMessages();
            } finally { endOp(opKey); }
        }

        function ratingContextForRequest(trip, reqId, partnerId = null) {
            const requestId = Number(reqId);
            if (!Number.isFinite(requestId) || requestId <= 0) return null;
            const partner = Number(partnerId);
            if (Number.isFinite(partner) && partner > 0) {
                return {
                    request_id: requestId,
                    partner_id: partner,
                    partner_name: ratingPartnerName(trip, partner, requestId),
                    direction_title: String(trip?.direction_title || '').trim(),
                    viewer_role: String(trip?.viewer_role || '').toLowerCase()
                };
            }
            if (currentRequestIdFromTrip(trip) === requestId) return buildRatingContext(trip);
            const passenger = orderedPickupPassengers(trip).find(p => passengerRequestId(p) === requestId);
            const passengerId = Number(passenger?.user_id || 0);
            if (trip?.viewer_role === 'driver' && Number.isFinite(passengerId) && passengerId > 0) {
                return {
                    request_id: requestId,
                    partner_id: passengerId,
                    partner_name: ratingPartnerName(trip, passengerId, requestId),
                    direction_title: String(trip?.direction_title || '').trim(),
                    viewer_role: 'driver'
                };
            }
            return null;
        }

        async function finishTripForRequest(reqId, options = {}) {
            if (!S.activeTrip) return;
            const opKey = `finish_trip_${reqId || 'current'}`;
            if (!beginOp(opKey)) return;
            try {
                const tripSnapshot = options.tripSnapshot || (S.activeTrip ? { ...S.activeTrip } : null);
                const safeReqId = Number(reqId);
                const ratingContext = ratingContextForRequest(tripSnapshot, safeReqId, options.partnerId);
                if (!safeReqId) { showToast('Немає активної поїздки', 'error'); return; }
                const res = await api('/api/v3/trip/done', {
                    method: 'POST',
                    body: JSON.stringify({ request_id: safeReqId, user_id: S.userId, role: S.activeTrip.viewer_role || S.userRole })
                });
                if (res?.status === 'ok') {
                    if (res?.completed) {
                        showToast('🎉 Подорож завершена! Дякуємо.', 'success');
                        waitingForPartner = false;
                        if (ratingContext) {
                            queueRatingContext(ratingContext, tripSnapshot);
                            openRatingSheet(ratingContext);
                        }
                        await hydrate();
                    } else if (options.stayOnCrew) {
                        showToast('⏳ Фініш відмічено. Чекаємо підтвердження попутника.', '');
                        waitingForPartner = false;
                        await hydrate();
                        if (S.currentScreen === 'trips') renderTrips();
                    } else {
                        stopLocationTracking(true);
                        showToast('⏳ Очікуємо підтвердження партнера...', '');
                        waitingForPartner = true;
                        if (tripSnapshot) lastKnownTripForRating = tripSnapshot;
                        renderTripsWaiting();
                        await hydrate();
                    }
                } else if (res?.reason === 'action_forbidden') {
                    showToast('Вже завершено — очікуємо партнера', '');
                } else { showToast('Помилка', 'error'); }
            } finally { endOp(opKey); }
        }

        async function finishAllDriverPassengers() {
            if (!S.activeTrip || S.activeTrip.viewer_role !== 'driver') return;
            const passengers = orderedPickupPassengers(S.activeTrip)
                .filter(p => passengerRequestId(p) && !passengerFinishFlags(p).driverFinished);
            if (!passengers.length) {
                showToast('Фініш уже відмічено для всіх активних попутників', '');
                return;
            }
            if (!beginOp('finish_all_driver_passengers')) return;
            try {
                let ok = 0;
                const tripSnapshot = { ...S.activeTrip };
                const completedContexts = [];
                for (const passenger of passengers) {
                    const reqId = passengerRequestId(passenger);
                    const passengerId = parseInt(passenger?.user_id || 0, 10) || 0;
                    const res = await api('/api/v3/trip/done', {
                        method: 'POST',
                        body: JSON.stringify({ request_id: reqId, user_id: S.userId, role: 'driver' })
                    });
                    if (res?.status === 'ok') ok += 1;
                    if (res?.completed) {
                        const ctx = ratingContextForRequest(tripSnapshot, reqId, passengerId);
                        if (ctx) {
                            queueRatingContext(ctx, tripSnapshot);
                            completedContexts.push(ctx);
                        }
                    }
                }
                if (completedContexts.length && !isSheetOpen()) openRatingSheet(completedContexts[0]);
                showToast(`⏳ Фініш відмічено для ${ok}/${passengers.length}. Чекаємо підтверджень попутників.`, ok === passengers.length ? '' : 'error');
                waitingForPartner = false;
                await hydrate();
                if (S.currentScreen === 'trips') renderTrips();
            } finally { endOp('finish_all_driver_passengers'); }
        }

        async function confirmAllUnconfirmedFinishers() {
            if (!S.activeTrip || S.activeTrip.viewer_role !== 'driver') return;
            const finishers = unconfirmedCrewFinishers(S.activeTrip);
            if (!finishers.length) {
                showToast('Немає фінішів, які чекають підтвердження', '');
                return;
            }
            if (!beginOp('confirm_all_finishers')) return;
            try {
                let ok = 0;
                const tripSnapshot = { ...S.activeTrip };
                const completedContexts = [];
                for (const passenger of finishers) {
                    const reqId = passengerRequestId(passenger);
                    const passengerId = parseInt(passenger?.user_id || 0, 10) || 0;
                    const ctx = ratingContextForRequest(tripSnapshot, reqId, passengerId);
                    const res = await api('/api/v3/trip/done', {
                        method: 'POST',
                        body: JSON.stringify({ request_id: reqId, user_id: S.userId, role: 'driver' })
                    });
                    if (res?.status === 'ok') ok += 1;
                    if (res?.completed && ctx) {
                        queueRatingContext(ctx, tripSnapshot);
                        completedContexts.push(ctx);
                    }
                }
                if (completedContexts.length && !isSheetOpen()) openRatingSheet(completedContexts[0]);
                showToast(`✅ Підтверджено фініш ${ok}/${finishers.length}`, ok === finishers.length ? 'success' : 'error');
                waitingForPartner = false;
                await hydrate();
            } finally { endOp('confirm_all_finishers'); }
        }

        async function finishTrip() {
            if (!S.activeTrip) return;
            const tripSnapshot = { ...S.activeTrip };
            return finishTripForRequest(currentRequestId(), { tripSnapshot });
        }

        // Codex #3: фініш водія з driving-дока. Диспетчер реюзить наявні
        // lifecycle-хендлери: кілька попутників → відмітити фініш УСІМ
        // (per-request, як у ростері), пара → якірний finishTrip().
        async function finishDriverTripFromDock() {
            if (!S.activeTrip || S.activeTrip.viewer_role !== 'driver') return;
            const passengers = orderedPickupPassengers(S.activeTrip).filter(p => passengerRequestId(p));
            if (passengers.length > 1) return finishAllDriverPassengers();
            return finishTrip();
        }

        // ═══ Безпечний фініш (кандидат, Опус 2026-10-01; OPUS_FINISH_SAFETY_TASK) ═══
        // Власний фініш записується лише після явного «Так, я доїхав» у короткому діалозі з назвою
        // події. «Ще ні», закриття шторки, чат і переходи між вкладками нічого не записують.
        // Діалог прив'язаний до показаної поїздки/екіпажу: якщо до «Так» стан змінився — запису немає.
        // Водійський фініш кількох пар підтверджується один раз — перед наявним виконанням.
        function ownFinishTarget(kind, reqId = 0) {
            const t = S.activeTrip;
            if (!t) return null;
            const isDriver = t.viewer_role === 'driver';
            const out = { kind, crewId: String(t.crew_id || ''), dirId: String(t.direction_id || ''), title: t.direction_title || 'Подія' };
            const withReq = orderedPickupPassengers(t).filter(p => passengerRequestId(p));
            const single = (rid, who, partnerDone, rest = 0) => ({ ...out, reqIds: [Number(rid)], who, partnerDone, multi: false, rest });
            if (!isDriver) {
                const rid = kind === 'request' ? Number(reqId) : currentRequestIdFromTrip(t);
                return rid && !tripViewerFinished(t) ? single(rid, driverRef(tripDriverName(t) || t.driver_name), tripPartnerFinished(t)) : null;
            }
            const pairFor = rid => withReq.find(p => Number(passengerRequestId(p)) === Number(rid)) || null;
            const fromMember = m => (m && !passengerFinishFlags(m).driverFinished)
                ? single(passengerRequestId(m), escapeHtml(passengerDisplayName(m)), passengerFinishFlags(m).clientFinished, Math.max(0, withReq.length - 1)) : null;
            const many = list => list.length ? { ...out, reqIds: list.map(p => Number(passengerRequestId(p))), who: escapeHtml(list.map(p => passengerDisplayName(p)).join(', ')), partnerDone: false, multi: true, rest: Math.max(0, withReq.length - list.length) } : null;
            if (kind === 'request') return withReq.length ? fromMember(pairFor(reqId)) : (!tripViewerFinished(t) && Number(reqId) ? single(reqId, escapeHtml(t.partner_name || 'попутник'), tripPartnerFinished(t)) : null);
            if (kind === 'all_finishers') { const f = unconfirmedCrewFinishers(t); const r = many(f); return r ? { ...r, partnerDone: true } : null; }
            if (kind === 'driver_all' || (kind === 'driver_dock' && withReq.length > 1)) return many(withReq.filter(p => !passengerFinishFlags(p).driverFinished));
            if (withReq.length === 1) return fromMember(withReq[0]);
            const rid = currentRequestIdFromTrip(t);
            return rid && !tripViewerFinished(t) ? single(rid, escapeHtml(t.partner_name || 'попутник'), tripPartnerFinished(t)) : null;
        }

        function confirmOwnFinish(kind, reqId = 0, options = {}) {
            const target = ownFinishTarget(kind, reqId);
            if (!target) { showToast('Цю позначку вже зроблено або поїздка змінилась', ''); return Promise.resolve(false); }
            const dropOff = kind === 'request' && !!options?.stayOnCrew;
            const question = dropOff ? `Відмітити фініш: ${target.who}?` : 'Ви доїхали до події?';
            // r2 (рев'ю 02.10): водій екіпажу з кількох пар завершує лише перелічені пари — так і кажемо.
            const others = target.rest > 0 ? ' Інші пари екіпажу залишаться активними.' : '';
            const explain = target.multi && !target.partnerDone
                ? `Ваш фініш буде відмічено для: ${target.who}. Кожна пара завершиться після підтвердження попутника.`
                : target.partnerDone
                    ? (target.multi
                        ? `Фініш уже відмічено: ${target.who}. Після «Так» завершаться поїздки з переліченими попутниками.${others}`
                        : `Фініш уже відмічено: ${target.who}. Після «Так» ${target.rest > 0 ? 'завершиться поїздка з цим попутником.' : 'поїздку буде завершено.'}${others}`)
                    : `Після «Так» чекатимемо підтвердження: ${target.who}. Поїздка завершиться, коли підтвердять обоє.${others}`;
            const yesLabel = dropOff ? 'Так, відмітити' : 'Так, я доїхав';
            return new Promise(resolve => {
                openSheet(`
                    <div data-own-finish-confirm="${escapeAttr(kind)}">
                        <div class="sheet-title">${question}</div>
                        <div class="sheet-sub">🎯 ${escapeHtml(target.title)}</div>
                        <div style="margin:10px 0 14px;font-size:13px;line-height:1.45;color:var(--text-secondary);">${explain}</div>
                        <!-- «Так» ліворуч, «Ще ні» праворуч: дія фінішу в доці завжди праворуч, тож другий тап
                             подвійного тапу (навіть під час виїзду шторки) влучає в «Ще ні» або в текст. Нижнє поле
                             тримає кнопки над зоною меню: тап у зону вкладок нічого не записує (guard 412/390). -->
                        <div class="sheet-actions" style="flex-direction:row;">
                            <button class="btn btn-success" id="own-finish-yes" style="flex:1;">${yesLabel}</button>
                            <button class="btn btn-secondary" id="own-finish-no" style="flex:1;">Ще ні</button>
                        </div>
                        <div aria-hidden="true" style="height:calc(var(--nav-height) + var(--safe-bottom) + 16px);"></div>
                    </div>
                `, { maxHeight: '60vh' });
                const yes = document.getElementById('own-finish-yes');
                const no = document.getElementById('own-finish-no');
                no.onclick = () => { closeSheet(); resolve(false); };
                yes.onclick = async () => {
                    yes.disabled = true; no.disabled = true;
                    closeSheet();
                    const fresh = ownFinishTarget(kind, reqId);
                    const same = !!fresh && fresh.crewId === target.crewId && fresh.dirId === target.dirId
                        && fresh.reqIds.join(',') === target.reqIds.join(',');
                    if (!same) { showToast('Стан поїздки змінився — перевірте картку', ''); resolve(false); return; }
                    if (kind === 'driver_dock') { resolve(await finishDriverTripFromDock()); return; }
                    if (kind === 'driver_all') { resolve(await finishAllDriverPassengers()); return; }
                    if (kind === 'all_finishers') { resolve(await confirmAllUnconfirmedFinishers()); return; }
                    const opts = kind === 'trip' ? { tripSnapshot: { ...S.activeTrip } } : (options || {});
                    resolve(await finishTripForRequest(target.reqIds[0], opts));
                };
            });
        }

        async function cancelTrip() {
            if (!S.activeTrip) return;
            const t = S.activeTrip;
            const crewLabel = `#${activeTripCrewNumber(t)}`;
            const isDriver = t.viewer_role === 'driver';
            // Чесний вихід (2026-10-02): для активної пари це ЗАПИТ — домовленість діє до згоди партнера (§0.19).
            // Діалог називає конкретну пару, якої стосується запит (водій: якірна пара, не «вибраний» попутник).
            const partner = cancelPartnerLabel(t, currentRequestId());
            const who = escapeHtml(partner.name || (isDriver ? 'попутник' : 'водій'));
            const instant = ['pending', 'pending_confirm'].includes(String(t.status || ''));
            const title = isDriver ? `Попросити скасування домовленості ${crewLabel}?` : `Попросити вихід з екіпажу ${crewLabel}?`;
            const sub = instant
                ? 'Домовленість ще не підтверджена — запит буде скасовано одразу.'
                : (isDriver
                    ? `Потрібна згода: попутник ${who}. До відповіді домовленість діє; інші попутники залишаться в екіпажі.`
                    : `Потрібна згода: водій ${who}. До відповіді домовленість діє — місце за вами, чат працює.`);
            openSheet(`
                <div class="sheet-title">${title}</div>
                <div class="sheet-sub">${sub}</div>
                <div class="sheet-sub" style="margin-top:8px;font-weight:600;">Вкажіть причину:</div>
                <div class="sheet-actions" style="flex-direction:column;">
                    <button class="btn btn-secondary" onclick="doCancelTrip('plans')">📅 Змінилися плани</button>
                    <button class="btn btn-secondary" onclick="doCancelTrip('wait')">⏳ Довго чекати</button>
                    <button class="btn btn-secondary" onclick="doCancelTrip('force')">🤕 Захворів / Форс-мажор</button>
                    <button class="btn btn-ghost" style="margin-top:8px;" onclick="closeSheet()">${isDriver ? 'Не скасовувати' : 'Залишитися'}</button>
                </div>
            `);
        }

        // ═══ Чесний вихід (кандидат, Опус 2026-10-02) ═══
        // /trip/cancel відповідає {"status":"ok"} і на миттєве скасування, і на пропозицію, що чекає
        // згоди партнера (§0.19). Тому результат дії беремо зі СВІЖОГО читання /trip/status саме тієї
        // пари, request_id і актора якої зафіксовано ДО запиту, — не з конверта відповіді й не з
        // S.activeTrip (його зникнення не доводить скасування; інша пара водія не підміняє результат).
        // Невдале читання = невідомий результат, без заяви про скасування.
        async function readPairStatus(reqId, actorId) {
            try {
                const r = await apiWithStatus(`/api/v3/trip/status?request_id=${parseInt(reqId, 10) || 0}&user_id=${parseInt(actorId, 10) || 0}`, { silent: true });
                const d = r?.data;
                return (r?.ok && d && d.found === true && typeof d.status === 'string') ? d : null;
            } catch (_) { return null; }
        }

        function cancelPartnerLabel(t, reqId) {
            if (!t) return { role: 'партнера', name: '' };
            if (t.viewer_role === 'driver') {
                const m = orderedPickupPassengers(t).find(p => Number(passengerRequestId(p)) === Number(reqId));
                return { role: 'попутника', name: m ? passengerDisplayName(m) : String(t.partner_name || '') };
            }
            return { role: 'водія', name: tripDriverName(t) || String(t.driver_name || '') };
        }

        // kind: 'request' — власний запит виходу; 'confirm' / 'reject' — відповідь на запит партнера.
        function cancelOutcomeMessage(kind, st, actorId, partner, post) {
            if (!st) return { text: 'Не вдалося перевірити результат. Домовленість може ще діяти — перевірте картку.', type: 'error', cancelled: false };
            const status = String(st.status || '');
            const cancelBy = parseInt(st.cancel_by || 0, 10) || 0;
            const who = partner.name ? `${partner.role} ${partner.name}` : partner.role;
            if (status === 'cancelled' || status === 'cancelled_by_system') {
                return { text: partner.name ? `✅ Домовленість з ${partner.name} скасовано` : '✅ Домовленість скасовано', type: 'success', cancelled: true };
            }
            if (status === 'completed') return { text: '🏁 Поїздку вже завершено — скасовувати нічого', type: '', cancelled: false };
            if (status === 'driving') return { text: 'Після старту скасування неможливе — лише фініш', type: 'error', cancelled: false };
            if (cancelBy && cancelBy === Number(actorId)) {
                return { text: `⏳ Запит на вихід надіслано. Очікуємо підтвердження ${who}. До відповіді домовленість діє.`, type: '', cancelled: false };
            }
            if (cancelBy) {
                return kind === 'request'
                    ? { text: `${partner.name || 'Партнер'} уже просить скасування — відповідь у картці.`, type: '', cancelled: false }
                    : { text: 'Запит партнера ще очікує вашої відповіді — спробуйте ще раз.', type: 'error', cancelled: false };
            }
            if (kind === 'reject') return { text: 'Скасування відхилено — домовленість діє', type: 'success', cancelled: false };
            return { text: post?.ok ? 'Стан не змінився — домовленість діє.' : 'Запит не надіслано — домовленість діє. Спробуйте ще раз.', type: 'error', cancelled: false };
        }

        async function sendCancelAction(kind, path, reqId, extra = {}) {
            const t = S.activeTrip;
            const actorId = S.userId;
            const partner = cancelPartnerLabel(t, reqId);
            // One opaque key per press: a duplicate delivery of THIS press carries the same key, so the server replays it and no
            // second proposal appears; a new press — e.g. after the partner rejected — carries a new key, so the server decides
            // anew (§0.19). Same contract the bot already follows (cancel_reason:{req}:{user}:{callback id}).
            const idemKey = `${kind}:${reqId}:${actorId}:${Date.now().toString(36)}:${Math.random().toString(36).slice(2, 10)}`;
            let post = { ok: false, data: null };
            try {
                post = await apiWithStatus(path, { method: 'POST', silent: true, body: JSON.stringify({ request_id: reqId, user_id: actorId, ...extra, idem_key: idemKey }) });
            } catch (_) { post = { ok: false, data: null }; }
            const st = await readPairStatus(reqId, actorId);
            const msg = cancelOutcomeMessage(kind, st, actorId, partner, post);
            await hydrate();
            if (msg.cancelled && !S.activeTrip) stopLocationTracking(true);
            else if (S.activeTrip && !shouldShareLiveLocation(S.activeTrip)) stopLocationTracking(false);
            showToast(msg.text, msg.type);
            return msg;
        }

        async function doCancelTrip(reason) {
            closeSheet();
            if (!beginOp('cancel_trip')) return;
            try {
                const reqId = currentRequestId();
                if (!reqId) { showToast('Немає активної поїздки', 'error'); return; }
                await sendCancelAction('request', '/api/v3/trip/cancel', reqId, { reason: reason || '' });
            } finally { endOp('cancel_trip'); }
        }

        async function confirmCancelTrip(requestId = null) {
            if (!beginOp('confirm_cancel')) return;
            try {
                const reqId = parseInt(requestId || currentRequestId() || 0, 10) || 0;
                if (!reqId) { showToast('Немає активної поїздки', 'error'); return; }
                await sendCancelAction('confirm', '/api/v3/trip/confirm-cancel', reqId);
            } finally { endOp('confirm_cancel'); }
        }

        async function rejectCancelTrip(requestId = null) {
            if (!beginOp('reject_cancel')) return;
            try {
                const reqId = parseInt(requestId || currentRequestId() || 0, 10) || 0;
                if (!reqId) { showToast('Немає активної поїздки', 'error'); return; }
                await sendCancelAction('reject', '/api/v3/trip/reject-cancel', reqId);
            } finally { endOp('reject_cancel'); }
        }

        // ─── RATING: дві зіркові шкали — подія + партнер (2026-07-14) ───
        // Закон правдивості (I-FRONT-1/I-FRONT-3, аудит Codex дефект #1):
        // жодних неявних дефолтів; успіх-toast тільки після підтвердження API;
        // фейл НЕ закриває шторку і НЕ стирає контекст — вибір лишається, кнопка
        // стає «Спробувати ще раз» (бекенд ідемпотентний, retry безпечний).
        function buildStarRow(row, label) {
            const stars = Array.from({ length: 5 }, (_, i) => {
                const v = i + 1;
                return `<button type="button" class="star-btn" data-star-row="${row}" data-star-value="${v}"
                    role="radio" aria-checked="false" aria-label="${v} з 5"
                    style="background:none;border:none;cursor:pointer;padding:2px 5px;font-size:30px;line-height:1;opacity:.35;transition:all .15s;color:var(--amber);"
                    onclick="selectStar('${row}', ${v})">★</button>`;
            }).join('');
            return `<div data-rating-row="${row}" style="margin:10px 0 4px;">
                <div style="font-size:12px;color:var(--text-muted);margin-bottom:2px;">${label}</div>
                <div role="radiogroup" aria-label="${escapeAttr(label.replace(/<[^>]*>/g, ''))}" style="display:flex;justify-content:center;">${stars}</div>
            </div>`;
        }

        function openRatingSheet(ratingContext = null) {
            S._ratingContext = ratingContext || getCurrentRatingContext();
            if (S._ratingContext) {
                queueRatingContext(S._ratingContext, S.activeTrip ? { ...S.activeTrip } : null);
                S.completedRatingSheetShownIds.add(Number(S._ratingContext.request_id) || S._ratingContext.request_id);
            }
            const partnerName = String(S._ratingContext?.partner_name || '').trim();
            const eventTitle = String(S._ratingContext?.direction_title || '').trim();
            const partnerLine = partnerName
                ? `Ви оцінюєте: <strong>${escapeHtml(partnerName)}</strong> та подію`
                : 'Ваш відгук допомагає покращити сервіс';
            openSheet(`
                <div class="sheet-title">Оцініть поїздку</div>
                <div class="sheet-sub" data-rating-partner-name="${escapeAttr(partnerName)}">${partnerLine}</div>
                ${buildStarRow('event', `🎪 Подія${eventTitle ? ': <strong>' + escapeHtml(eventTitle) + '</strong>' : ''}`)}
                ${buildStarRow('partner', `${((S._ratingContext?.viewer_role || S.activeTrip?.viewer_role || '') === 'driver') ? '👤' : '🚗'} Партнер${partnerName ? ': <strong>' + escapeHtml(partnerName) + '</strong>' : ''}`)}
                <input class="board-search" id="rating-comment" placeholder="Коментар (необов'язково)..." style="margin:12px 0 16px;">
                <button class="btn btn-primary" id="rating-submit" onclick="submitRating()" disabled>Надіслати оцінку</button>
                <button class="btn btn-ghost" style="width:100%;margin-top:8px;" onclick="postponeRatingSheet()">Пізніше</button>
            `);
            S._ratingStars = { event: null, partner: null };
        }

        function selectStar(row, value) {
            if (!S._ratingStars) S._ratingStars = { event: null, partner: null };
            S._ratingStars[row] = value;
            document.querySelectorAll(`.star-btn[data-star-row="${row}"]`).forEach(btn => {
                const v = parseInt(btn.dataset.starValue, 10) || 0;
                const on = v <= value;
                btn.style.opacity = on ? '1' : '.35';
                btn.setAttribute('aria-checked', v === value ? 'true' : 'false');
            });
            const submit = document.getElementById('rating-submit');
            if (submit && (Number.isInteger(S._ratingStars.event) || Number.isInteger(S._ratingStars.partner))) {
                submit.disabled = false;
                if (submit.textContent !== '🔁 Спробувати ще раз') submit.textContent = 'Надіслати оцінку';
            }
        }

        async function submitRating() {
            const stars = S._ratingStars || {};
            const hasEvent = Number.isInteger(stars.event);
            const hasPartner = Number.isInteger(stars.partner);
            if (!hasEvent && !hasPartner) { showToast('Оберіть хоча б одну оцінку зірками', 'error'); return; }
            const ctx = getCurrentRatingContext();
            const reqId = ctx?.request_id || null;
            const pid = ctx?.partner_id || null;
            if (!reqId || (hasPartner && !pid)) {
                showToast('Контекст оцінки треба відновити — оцінку збережено на пізніше', 'error');
                postponeRatingSheet('context-lost');
                return;
            }
            const comment = document.getElementById('rating-comment')?.value?.trim() || '';
            const submitBtn = document.getElementById('rating-submit');
            if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Надсилаємо…'; }
            const body = { from_user_id: S.userId, request_id: reqId };
            if (hasPartner) { body.partner_score = stars.partner; body.to_user_id = pid; }
            if (hasEvent) body.event_score = stars.event;
            if (comment) body.comment = comment;
            const res = await api('/api/v3/rating', { method: 'POST', body: JSON.stringify(body) });
            if (res?.status === 'ok' || res?.status === 'already_rated') {
                showToast('Дякуємо за відгук!', 'success');
                finalizeRatingFlow('submit-rating');
                return;
            }
            // Фейл (мережа/сервер): вибір і контекст живі, retry явний.
            if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = '🔁 Спробувати ще раз'; }
            showToast('Не вдалося надіслати оцінку — вибір збережено, спробуйте ще раз', 'error');
        }

        function postponeRatingSheet(source = 'later') {
            const context = S._ratingContext;
            if (context) queueRatingContext(context, lastKnownTripForRating);
            S._ratingStars = null;
            S._ratingContext = null;
            persistCriticalState();
            closeSheet({ preserveRating: true, suppressRatingReopen: true });
            renderSubBar();
            showToast(source === 'later'
                ? 'Оцінку збережено на пізніше'
                : 'Оцінка чекає у смужці стану');
            return true;
        }

        function finalizeRatingFlow(source = '') {
            const finishedReq = S._ratingContext?.request_id;
            closeSheet({ preserveRating: true, suppressRatingReopen: true });
            S._ratingStars = null;
            S._ratingContext = null;
            // Мульти-екіпаж водія: оцінив/пропустив одного → наступний з черги.
            if (Array.isArray(S._ratingQueue) && S._ratingQueue.length) {
                S._ratingQueue = S._ratingQueue.filter(c => c && c.request_id !== finishedReq);
            }
            if (Array.isArray(S._ratingQueue) && S._ratingQueue.length) {
                persistCriticalState();
                renderSubBar();
                setTimeout(() => openRatingSheet(S._ratingQueue[0]), 400);
                return;
            }
            S._ratingQueue = null;
            lastKnownTripForRating = null;
            waitingForPartner = false;
            try {
                localStorage.removeItem(_stateKey('ltr'));
                localStorage.removeItem(_stateKey('wfp'));
                localStorage.removeItem(_stateKey('rq'));
            } catch (_) { }
            syncTerminalIdleState(source);
            updateBadges();
            renderTrips();
            renderSubBar();
            refreshMap();
            verifyMapTripDockState();
            verifyMapResultPanelState();
        }

        // ─── CHAT ───
        function resetGenericSheetForChat() {
            const sheet = document.getElementById('sheet');
            if (sheet && sheet._cleanup) sheet._cleanup();
            const body = document.getElementById('sheet-body');
            if (body) body.style.maxHeight = '';
            const pinnedStrip = document.getElementById('sheet-pinned-strip');
            if (pinnedStrip) pinnedStrip.remove();
            const resultPanel = document.getElementById('map-result-panel');
            const tripDock = document.getElementById('map-trip-dock');
            if (resultPanel) resultPanel.classList.remove('hidden-by-sheet');
            if (tripDock) tripDock.classList.remove('hidden-by-sheet');
            document.getElementById('sheet-backdrop')?.classList.remove('open');
            if (sheet) {
                sheet.classList.remove('open');
                sheet.style.transform = '';
                sheet.style.transition = '';
            }
            S.matchSheetOpen = false;
            S.activeMatchKey = null;
        }

        // P-6 (2026-07-05): заголовок чату показував внутрішній request_id (#996366)
        // замість імен — незрозуміло, ДО КОГО пишеш. Збираємо співрозмовників:
        // попутник бачить водія + інших попутників, водій — усіх попутників (крім себе).
        function chatHeaderParticipants() {
            const t = S.activeTrip;
            if (!t) return [];
            const out = [];
            const isDriver = t.viewer_role === 'driver';
            if (!isDriver) {
                const driverName = t.driver_name || t.organizer_name || '';
                if (driverName) out.push(driverName);
            }
            crewPassengerMembers(t).forEach(m => {
                if (String(m?.user_id || '') !== String(S.userId)) out.push(passengerDisplayName(m));
            });
            return out.filter(Boolean);
        }

        function chatRoomDraftKey(requestId) {
            const t = S.activeTrip;
            const ids = [currentRequestIdFromTrip(t), ...crewPassengerMembers(t).map(m => m.request_id || m.id)];
            const inCrew = t?.crew_id && ids.some(id => id && String(id) === String(requestId));
            return inCrew ? `crew:${t.crew_id}` : `request:${requestId}`;
        }

        function rememberChatDraft() {
            const key = S.chatDraftKey || (S.chatRequestId ? chatRoomDraftKey(S.chatRequestId) : '');
            if (!key) return null;
            S.chatDrafts ||= Object.create(null);
            const text = document.getElementById('chat-input')?.value || '';
            if (S.chatDrafts[key]?.text !== text) S.chatDrafts[key] = { text };
            return S.chatDrafts[key];
        }

        async function openChat(requestId, partnerId, contact = null) {
            rememberChatDraft();
            S.chatContact = contact;
            S.chatDraftKey = contact ? `contact:${requestId}` : chatRoomDraftKey(requestId);
            document.getElementById('chat-input').value = S.chatDrafts?.[S.chatDraftKey]?.text || '';
            S.chatSession = (S.chatSession || 0) + 1; // сеанс: запізніла відповідь старого сеансу нічого не читає
            S.chatRequestId = requestId; S.chatPartnerId = partnerId;
            resetGenericSheetForChat();
            const backdrop = document.getElementById('chat-backdrop');
            const sheet = document.getElementById('chat-sheet');
            backdrop.classList.remove('open');
            sheet.classList.remove('open');
            sheet.style.transform = '';
            void sheet.offsetHeight;
            backdrop.classList.add('open');
            sheet.classList.add('open');
            const who = chatHeaderParticipants();
            // Живий прохід 2026-08-11: кімната вже спільна на сервері (get_trip_messages
            // читає по crew_id і авторизує за членством в екіпажі), але заголовок називав
            // лише співрозмовника — і водій не розумів, що пише одразу всьому екіпажу.
            // Номер беремо ЛЮДСЬКИЙ (crewEventDisplayNumber); технічний crew_id показувати
            // заборонено — spine crew_reserved.forbidden «huge technical crew_id as identity».
            const crewNo = crewEventDisplayNumber(S.activeTrip);
            const crewLabel = crewNo ? `Екіпаж #${crewNo}` : 'Чат екіпажу';
            const names = who.length
                ? `${who.slice(0, 3).join(', ')}${who.length > 3 ? ` +${who.length - 3}` : ''}`
                : '';
            document.getElementById('chat-title').textContent = contact ? `💬 ${contact.partner_name || 'Учасник'} · Особиста розмова` : names
                ? `💬 ${crewLabel} · ${names}`
                : `💬 ${crewLabel}`;
            refreshChatPresenceClaim();
            setChatSubtitle('відкриваємо...');
            updateChatComposer();
            await loadChatMessages();
        }

        function closeChat() {
            rememberChatDraft();
            S.chatDraftKey = null;
            document.getElementById('chat-input').value = '';
            document.getElementById('chat-backdrop')?.classList.remove('open');
            document.getElementById('chat-sheet')?.classList.remove('open');
            S.chatSession = (S.chatSession || 0) + 1;
            S.chatRequestId = null;
            S.chatContact = null;
            S.chatPartnerId = null;
            refreshChatPresenceClaim();
        }

        // Непрочитане в чаті екіпажу (живий прохід 27.09: закритий чат не давав жодного знаку, люди
        // домовлялися поза продуктом). Опитування лише ЧИТАЄ; «побачене» пише тільки відкритий чат
        // (loadChatMessages) — фоновий шлях нічого не позначає прочитаним за людину (§0.60).
        function chatSeenStorageKey(trip) {
            const crew = trip?.crew_id || currentRequestIdFromTrip(trip);
            return crew && S.userId ? `wt_chat_seen_${S.userId}_${crew}` : '';
        }

        function applyChatUnreadIndicator(count = 0) {
            const body = document.body;
            if (!body) return;
            const n = Math.max(0, parseInt(count, 10) || 0);
            body.classList.toggle('chat-has-unread', n > 0);
            body.dataset.chatUnread = n > 0 ? String(n) : '';
            body.style?.setProperty?.('--chat-unread-label', n > 0 ? `"${n > 9 ? '9+' : n}"` : '""');
        }

        function forgetChatUnread() {
            if (S.chatUnreadKey) { try { localStorage.removeItem(S.chatUnreadKey); } catch (_) { } }
            S.chatUnreadKey = '';
            applyChatUnreadIndicator(0);
        }

        // Явне читання: відкритий чат показав ці повідомлення — запам'ятати найбільший id.
        function markChatMessagesSeen(msgs, key) {
            const maxId = (msgs || []).reduce((mx, m) => Math.max(mx, parseInt(m?.id, 10) || 0), 0);
            if (key) {
                let seen = 0;
                try { seen = parseInt(localStorage.getItem(key) || '0', 10) || 0; } catch (_) { }
                if (maxId > seen) { try { localStorage.setItem(key, String(maxId)); } catch (_) { } }
                S.chatUnreadKey = key;
            }
            S.chatUnreadToastedId = Math.max(S.chatUnreadToastedId || 0, maxId);
            applyChatUnreadIndicator(0);
        }

        async function refreshChatUnread() {
            const trip = S.activeTrip;
            const reqId = currentRequestIdFromTrip(trip);
            const key = chatSeenStorageKey(trip);
            if (!reqId || !key) { forgetChatUnread(); return; }
            if (S.chatUnreadKey && S.chatUnreadKey !== key) { try { localStorage.removeItem(S.chatUnreadKey); } catch (_) { } }
            S.chatUnreadKey = key;
            // Відкритий чат сам показує й позначає прочитаним — окремий сигнал не потрібен.
            if (S.chatRequestId) { applyChatUnreadIndicator(0); return; }
            const seq = S.chatUnreadSeq = (S.chatUnreadSeq || 0) + 1;
            // latest=1: найновіші 200 (старий сервер ігнорує параметр і віддає найстаріші — як раніше).
            const data = await api(`/api/v3/trip/messages?request_id=${reqId}&user_id=${S.userId}&limit=200&latest=1`, { silent: true });
            // Застаріла відповідь (новіший запит або читання вже були), збій чи відкритий чат — нічого не змінюють.
            if (seq !== S.chatUnreadSeq || !Array.isArray(data?.messages) || S.chatRequestId || S.chatUnreadKey !== key) return;
            let seen = 0;
            try { seen = parseInt(localStorage.getItem(key) || '0', 10) || 0; } catch (_) { }
            const unread = data.messages.filter(m => String(m?.user_id) !== String(S.userId) && (parseInt(m?.id, 10) || 0) > seen);
            applyChatUnreadIndicator(unread.length);
            const latest = unread[unread.length - 1];
            const latestId = parseInt(latest?.id, 10) || 0;
            if (latestId > (S.chatUnreadToastedId || 0)) {
                S.chatUnreadToastedId = latestId;
                const preview = String(latest.text || '').replace(/\s+/g, ' ').trim();
                showToast(`💬 ${latest.name || 'Учасник екіпажу'}: ${preview.length > 60 ? `${preview.slice(0, 60)}…` : preview}`, '');
                notifyCriticalEvent('chat_message', `${key}:${latestId}`);
            }
        }

        // §0.61: заява щодо цієї пари видима поверх чату. Poll змінює лише банер,
        // не стрічку/чернетку/фокус. Відповідь — тільки явний POST, без локальної згоди.
        function refreshChatPresenceClaim() {
            const banner = document.getElementById('chat-presence');
            if (!banner) return;
            const claim = S.chatRequestId && (S.presenceClaims || []).find(c =>
                Number(c.request_id) === Number(S.chatRequestId)
                && ['pickup', 'missed_pickup'].includes(c.request_status));
            let html = '';
            if (claim) {
                const driver = escapeHtml(claim.driver_name || 'Водій');
                const missed = claim.request_status === 'missed_pickup';
                const answered = claim.state === 'contested';
                const busy = S.chatPresenceSending === `${claim.request_id}:${claim.claim_seq}`;
                html = `<div><strong>${driver} повідомив: «Не знайшов вас».</strong></div>
                    <div>${missed ? 'Екіпаж уже вирушив без вас. Відповідь збережеться; вона не поверне вас в авто.' : 'Якщо ви на погодженій точці — відповідайте тут.'}</div>
                    ${answered ? '<div>📍 Ви відповіли «Я на місці» — це збережено.</div>' : claim.can_contest ? `<button type="button" class="btn btn-secondary" data-chat-presence-contest="true" onclick="respondChatPresenceClaim()" ${busy ? 'disabled' : ''}>${busy ? 'Надсилаємо…' : '📍 Я на місці'}</button>` : ''}`;
            }
            // Вимір до зміни висоти: хто читав останнє, лишається внизу;
            // хто гортав історію, не отримує примусової прокрутки.
            const feed = banner._presenceHtml !== html ? document.getElementById('chat-feed') : null;
            const wasAtBottom = feed && feed.scrollTop + feed.clientHeight >= feed.scrollHeight - 24;
            // Незмінний poll не пересоздає кнопку під пальцем/фокусом людини.
            if (banner._presenceHtml !== html) { banner.innerHTML = html; banner._presenceHtml = html; }
            banner.hidden = !html;
            if (wasAtBottom) feed.scrollTop = feed.scrollHeight;
        }

        async function respondChatPresenceClaim() {
            const claim = S.chatRequestId && (S.presenceClaims || []).find(c =>
                Number(c.request_id) === Number(S.chatRequestId)
                && ['pickup', 'missed_pickup'].includes(c.request_status));
            if (!claim?.can_contest || S.chatPresenceSending) return false;
            const session = S.chatSession, requestId = S.chatRequestId;
            S.chatPresenceSending = `${claim.request_id}:${claim.claim_seq}`;
            refreshChatPresenceClaim();
            try {
                return await contestPresenceClaim(claim.request_id, claim.claim_seq);
            } finally {
                S.chatPresenceSending = null;
                if (S.chatSession === session && S.chatRequestId === requestId) refreshChatPresenceClaim();
            }
        }

        function setChatSubtitle(status = 'оновлено щойно') {
            const subtitle = document.getElementById('chat-subtitle');
            if (!subtitle || !S.chatRequestId) return;
            const stamp = new Date().toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
            // P-6: без внутрішнього #request_id — лише людський статус/час.
            subtitle.textContent = status === 'оновлено щойно' ? `оновлено ${stamp}` : status;
        }

        async function loadChatMessages() {
            if (!S.chatRequestId) return;
            const feed = document.getElementById('chat-feed');
            const shouldStickToBottom = feed.scrollTop + feed.clientHeight >= feed.scrollHeight - 24;
            const session = S.chatSession, reqId = S.chatRequestId, contact = !!S.chatContact, key = contact ? '' : chatSeenStorageKey(S.activeTrip);
            const loadSeq = S.chatLoadSeq = (S.chatLoadSeq || 0) + 1;
            // latest=1: найновіші 200 — відкритий чат показує те повідомлення, про яке сигналила позначка.
            const path = contact ? '/api/v3/trip/contact/messages' : '/api/v3/trip/messages';
            const data = await api(`${path}?request_id=${reqId}&user_id=${S.userId}&limit=200&latest=1`);
            // Чат закрили/перевідкрили, поки летів запит, — ця відповідь нікому не показується;
            // новіше завантаження того ж сеансу вже в дорозі/застосоване — стара відповідь не відкочує стрічку.
            if (S.chatSession !== session || S.chatRequestId !== reqId || S.chatLoadSeq !== loadSeq) return;
            if (!Array.isArray(data?.messages)) { setChatSubtitle('Не вдалося завантажити повідомлення'); return; }
            const msgs = data.messages;
            // Прочитане — лише для кімнати цього запиту (key захоплено до await) і видимої вкладки.
            if (Array.isArray(data?.messages) && key && !document.hidden && !isAppInBackground) markChatMessagesSeen(msgs, key);
            if (!msgs.length) {
                feed.innerHTML = '<div data-chat-empty="true" style="text-align:center;padding:40px;color:var(--text-muted);font-size:13px;">Повідомлень поки немає 👋<br><span style="opacity:.75;">' + (contact ? 'Нові повідомлення бачите лише ви двоє' : 'Повідомлення бачить увесь екіпаж') + '</span></div>';
                setChatSubtitle();
                return;
            }
            feed.innerHTML = (contact ? '<div style="color:var(--text-muted);font-size:12px;margin-bottom:10px;">Попереднє листування — до невдалої посадки. Нові повідомлення бачите лише ви двоє.</div>' : '') + msgs.map(m => {
                const mine = m.user_id == S.userId;
                return `<div class="chat-msg ${mine ? 'mine' : 'theirs'}">${!mine ? `<div class="chat-meta">${escapeHtml(m.name || 'Учасник')}</div>` : ''}<div class="chat-bubble">${m.previous_crew ? '<div class="chat-meta">Раніше в чаті екіпажу</div>' : ''}${escapeHtml(m.text || '')}</div></div>`;
            }).join('');
            if (shouldStickToBottom) feed.scrollTop = feed.scrollHeight;
            setChatSubtitle();
        }

        function updateChatComposer() {
            const count = Array.from((document.getElementById('chat-input')?.value || '').trim()).length;
            const label = document.getElementById('chat-length');
            if (label) label.textContent = count > 500 ? `${count} / 500 · скоротіть повідомлення` : `${count} / 500`;
            const send = document.getElementById('chat-send');
            if (send) send.disabled = !!S.chatSending || count > 500;
        }

        async function sendChat() {
            const input = document.getElementById('chat-input');
            const draft = input.value;
            const text = draft.trim();
            if (!text || !S.chatRequestId || S.chatSending) return;
            if (Array.from(text).length > 500) {
                updateChatComposer();
                showToast('До 500 символів. Скоротіть повідомлення — текст збережено.', 'error');
                return;
            }
            const session = S.chatSession;
            const requestId = S.chatRequestId;
            const draftKey = S.chatDraftKey || chatRoomDraftKey(requestId);
            const draftSnapshot = rememberChatDraft();
            S.chatSending = true;
            updateChatComposer();
            const feed = document.getElementById('chat-feed');
            const empty = feed.querySelector('[data-chat-empty]');
            if (empty) empty.remove();
            const div = document.createElement('div'); div.className = 'chat-msg mine';
            div.innerHTML = `<div class="chat-bubble">${escapeHtml(text)}</div>`;
            feed.appendChild(div); feed.scrollTop = feed.scrollHeight;
            setChatSubtitle('надсилаємо...');
            // P-7 (2026-07-05): судимо про доставку за HTTP-СТАТУСОМ, не за тілом.
            // Раніше через api() (→ resp.ok ? data : null) успіх з порожнім тілом
            // (200/204) читався як null → «не вдалося» → дубль-відправка; а 200 на
            // невідомий роут читався як «надіслано», хоча нічого не збережено
            // («фальшива комунікація»). silent — щоб не було подвійного тоста.
            let res;
            try {
                res = await apiWithStatus(S.chatContact ? '/api/v3/trip/contact/message' : '/api/v3/trip/message', { method: 'POST', silent: true, body: JSON.stringify({ request_id: requestId, user_id: S.userId, text }) });
            } catch (_) { res = { ok: false }; }
            S.chatSending = false;
            const sameChat = session === S.chatSession && requestId === S.chatRequestId;
            if (!res.ok) {
                if (div.parentNode) div.remove();
                if (sameChat) {
                    setChatSubtitle('не надіслано');
                    showToast('Не вдалося надіслати — текст збережено', 'error');
                }
            } else {
                // Retire this exact draft even if its room was closed during delivery.
                const currentKey = S.chatDraftKey || (S.chatRequestId ? chatRoomDraftKey(S.chatRequestId) : '');
                if (currentKey === draftKey) rememberChatDraft();
                if (S.chatDrafts?.[draftKey] === draftSnapshot) {
                    S.chatDrafts[draftKey] = { text: '' };
                    if (currentKey === draftKey && input.value === draft) input.value = '';
                }
                if (sameChat) {
                    setChatSubtitle('надіслано щойно');
                    loadChatMessages();
                }
            }
            updateChatComposer();
        }

        function escapeHtml(str) {
            const d = document.createElement('div'); d.textContent = String(str ?? ''); return d.innerHTML;
        }

        function escapeAttr(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function sanitizeSearchInput(str) {
            // Remove HTML tags and limit length
            return String(str || '').replace(/[<>]/g, '').slice(0, 100);
        }

        // ═══ SHEET — mobile drag / desktop click-only ═══
        function openSheet(html, options = {}) {
            const body = document.getElementById('sheet-body');
            body.innerHTML = html;
            body.style.maxHeight = options?.maxHeight || '';
            document.getElementById('sheet-backdrop').classList.add('open');
            document.getElementById('sheet').classList.add('open');
            const sheet = document.getElementById('sheet');

            // DM-2026-06-14-011: «припарковуємо» активний статус-банер низу карти
            // у верхній частині шторки (options.pinnedStrip), а самі floating-
            // контейнери ховаємо на час шторки (.hidden-by-sheet), щоб не
            // конкурували за простір/z-index. closeSheet() відновлює все.
            const existingStrip = document.getElementById('sheet-pinned-strip');
            if (existingStrip) existingStrip.remove();
            if (options?.pinnedStrip) {
                const strip = document.createElement('div');
                strip.id = 'sheet-pinned-strip';
                strip.className = 'sheet-pinned-strip';
                strip.innerHTML = options.pinnedStrip;
                const handle = document.getElementById('sheet-handle');
                if (handle) handle.insertAdjacentElement('afterend', strip);
            }
            const resultPanel = document.getElementById('map-result-panel');
            const tripDock = document.getElementById('map-trip-dock');
            if (resultPanel && resultPanel.classList.contains('open')) resultPanel.classList.add('hidden-by-sheet');
            if (tripDock && tripDock.classList.contains('open')) tripDock.classList.add('hidden-by-sheet');

            // Track if sheet is alive (prevents stale event fires)
            const sheetId = Date.now();
            sheet._sheetId = sheetId;

            // ── MOBILE: drag-to-dismiss from sheet ──
            let touchStartY = 0, touchCurrentY = 0, isTouchDragging = false;
            const TOUCH_DISMISS_PX = 150;

            const onTouchStart = (e) => {
                const target = e.target;
                
                // Do not drag if touching interactive/form elements
                if (target.closest('button') || target.closest('input') || target.closest('textarea') || target.closest('select') || target.closest('a')) {
                    touchStartY = 0;
                    return;
                }
                
                // If touching inside the body, only drag if sheet-body is scrolled to the top
                const body = document.getElementById('sheet-body');
                if (body && body.contains(target) && body.scrollTop > 0) {
                    touchStartY = 0;
                    return;
                }

                touchStartY = e.touches[0].clientY;
                touchCurrentY = touchStartY;
                isTouchDragging = false;
                sheet.style.transition = 'none';
            };

            const onTouchMove = (e) => {
                if (sheet._sheetId !== sheetId) return;
                if (!touchStartY) return;
                
                const y = e.touches[0].clientY;
                const diff = y - touchStartY;

                if (!isTouchDragging) {
                    if (diff > 10) {
                        isTouchDragging = true;
                    } else if (diff < -10) {
                        // User swiped up: cancel drag detection so normal scroll occurs
                        touchStartY = 0;
                        return;
                    }
                }

                if (!isTouchDragging) return;

                touchCurrentY = y;
                if (diff > 0) {
                    e.preventDefault();
                    sheet.style.transform = `translateY(${diff * 0.55}px)`; // rubber-band drag
                }
            };

            const onTouchEnd = () => {
                if (sheet._sheetId !== sheetId) return;
                if (!isTouchDragging) { 
                    sheet.style.transition = ''; 
                    touchStartY = 0;
                    return; 
                }
                isTouchDragging = false;
                sheet.style.transition = 'transform 0.3s cubic-bezier(0.16, 1, 0.3, 1)';
                
                const diff = touchCurrentY - touchStartY;
                touchStartY = 0;
                
                if (diff > TOUCH_DISMISS_PX) {
                    sheet.style.transform = 'translateY(100%)';
                    setTimeout(() => { if (sheet._sheetId === sheetId) closeSheet(); }, 300);
                } else {
                    sheet.style.transform = '';
                }
            };

            sheet.addEventListener('touchstart', onTouchStart, { passive: true });
            sheet.addEventListener('touchmove', onTouchMove, { passive: false });
            sheet.addEventListener('touchend', onTouchEnd);

            // Store cleanup
            sheet._cleanup = () => {
                sheet._sheetId = null;
                sheet.removeEventListener('touchstart', onTouchStart);
                sheet.removeEventListener('touchmove', onTouchMove);
                sheet.removeEventListener('touchend', onTouchEnd);
            };
        }

        function closeSheet(options = {}) {
            const openSheetEl = document.getElementById('sheet');
            if (!options?.preserveRating && S._ratingContext && openSheetEl?.classList.contains('open')) {
                return postponeRatingSheet('dismiss');
            }
            if (S.roleGateOpen && !hasChosenRole()) return;
            if (S.matchSheetOpen) {
                S.matchSheetOpen = false;
                S.activeMatchKey = null;
            }
            S.roleGateOpen = false;
            S.directionInviteSheetOpen = false;
            clearViewedDirection();
            const sheet = document.getElementById('sheet');
            if (sheet && sheet._cleanup) sheet._cleanup();
            document.getElementById('sheet-backdrop').classList.remove('open');
            if (sheet) {
                sheet.classList.remove('open');
                sheet.style.transform = '';
                sheet.style.transition = '';
            }
            const body = document.getElementById('sheet-body');
            if (body) body.style.maxHeight = '';

            // DM-2026-06-14-011: знімаємо «парковку» статус-банерів і відновлюємо
            // їх реальний стан (mini/micro чи закриті) після закриття шторки.
            const pinnedStrip = document.getElementById('sheet-pinned-strip');
            if (pinnedStrip) pinnedStrip.remove();
            const resultPanel = document.getElementById('map-result-panel');
            const tripDock = document.getElementById('map-trip-dock');
            if (resultPanel) resultPanel.classList.remove('hidden-by-sheet');
            if (tripDock) tripDock.classList.remove('hidden-by-sheet');
            if (typeof verifyMapResultPanelState === 'function') verifyMapResultPanelState();
            if (typeof verifyMapTripDockState === 'function') verifyMapTripDockState();

            // DM-2026-06-15: після закриття шторки (зокрема rating-sheet) показати
            // банер іншої активної підписки, якщо такий є — він був стриманий
            // guard'ом у maybeOpenMapResultPanelOnHydrate() на час відкритої шторки.
            setTimeout(() => {
                maybeOpenPartnerFinishSheet(S.activeTrip);
                if (!options?.suppressRatingReopen) maybeOpenCompletedTripRatingSheet('sheet-close');
                maybeOpenMatchSheet();
                maybeOpenMapResultPanelOnHydrate();
            }, 0);
        }

        // Backdrop click closes sheet (click only, not drag)
        document.addEventListener('DOMContentLoaded', () => {
            const backdrop = document.getElementById('sheet-backdrop');
            if (backdrop) {
                backdrop.addEventListener('click', () => closeSheet());
            }
        });

        // ─── TOAST ───
        let toastTimer = null;
        function showToast(msg, type = '') {
            const el = document.getElementById('toast');

            clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2500);

        // ─── CRITICAL IN-APP SOUND (foreground only, deduped) ───
        let _appAudioCtx = null;
        let _appAudioUnlockWired = false;

        function ensureAppAudioContext() {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return null;
            if (!_appAudioCtx) _appAudioCtx = new AudioCtx();
            return _appAudioCtx;
        }

        function initAppSoundUnlock() {
            updateAppSoundToggle();
            if (_appAudioUnlockWired) return;
            _appAudioUnlockWired = true;
            const unlock = () => {
                if (!S.appSoundEnabled) return;
                const ctx = ensureAppAudioContext();
                if (!ctx) return;
                Promise.resolve(ctx.resume?.()).catch(() => { });
            };
            ['pointerdown', 'touchstart', 'keydown'].forEach(evt => {
                document.addEventListener(evt, unlock, { passive: true });
            });
        }

        function updateAppSoundToggle() {
            const toggle = document.getElementById('toggle-app-sound');
            const label = document.getElementById('settings-sound');
            if (toggle) toggle.classList.toggle('on', !!S.appSoundEnabled);
            if (label) label.textContent = S.appSoundEnabled ? 'Важливі' : 'Вимкнено';
        }

        function toggleAppSound() {
            S.appSoundEnabled = !S.appSoundEnabled;
            localStorage.setItem('wt_app_sound', S.appSoundEnabled ? 'on' : 'off');
            updateAppSoundToggle();
            if (S.appSoundEnabled) {
                const ctx = ensureAppAudioContext();
                Promise.resolve(ctx?.resume?.()).finally(() => {
                    pulseCriticalHaptic('sound_test');
                    playCriticalSound('sound_test');
                });
                showToast('Звуки важливих подій увімкнено', 'success');
            } else {
                showToast('Звуки в додатку вимкнено', '');
            }
        }

        function playCriticalSound(kind = 'notice') {
            if (!S.appSoundEnabled || isAppInBackground || document.hidden) return;
            const ctx = ensureAppAudioContext();
            if (!ctx || ctx.state !== 'running') return;
            const now = ctx.currentTime;
            const gain = ctx.createGain();
            const osc = ctx.createOscillator();
            const base = kind === 'trip_started' ? 660 : kind === 'trip_completed' ? 880 : 740;
            osc.type = 'sine';
            osc.frequency.setValueAtTime(base, now);
            osc.frequency.exponentialRampToValueAtTime(base * 1.18, now + 0.12);
            gain.gain.setValueAtTime(0.0001, now);
            gain.gain.exponentialRampToValueAtTime(0.045, now + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.24);
        }

        function pulseCriticalHaptic(kind = 'notice') {
            const haptic = window.Telegram?.WebApp?.HapticFeedback;
            try {
                if (haptic?.notificationOccurred) {
                    haptic.notificationOccurred(kind === 'finish_confirmation_needed' ? 'warning' : 'success');
                } else if (haptic?.impactOccurred) {
                    haptic.impactOccurred('light');
                }
            } catch (_) { }
        }

        function notifyCriticalEvent(kind, id = '') {
            const key = `${kind}:${id || 'global'}`;
            if (S.criticalSoundEventIds.has(key)) return false;
            S.criticalSoundEventIds.add(key);
            if (!S.appSoundEnabled || isAppInBackground || document.hidden) return true;
            pulseCriticalHaptic(kind);
            playCriticalSound(kind);
            return true;
        }

        // ═══════ EVENT CREATION ═══════
        // ═══════ DIRECTION CREATION ═══════
        function openCreateDirection() {
