                S._mapScopeDirId = rawDirId;
                // Роль-лінза за замовчуванням (2026-06-11): підписка з роллю = декларація
                // наміру → фільтр одразу на комплементарну роль (водій бачить попутників,
                // попутник — водіїв). Ручний вибір далі ЛИПКИЙ у межах цієї підписки;
                // у trip-режимі або без підписки — повертаємось на 'all'.
                S.mapEventFilter = rawDirId
                    ? (_isDriverRole(S.userRole) ? 'passengers'
                        : (_isPassengerRole(S.userRole) ? 'drivers' : 'all'))
                    : 'all';
            }
            const scoped = mapContextScoped();
            const value = scoped ? 'координація події' : 'пошук виїзду';
            let toggleHtml = '';
            if (canToggle) {
                const isSub = S.mapScope !== 'all';
                toggleHtml = `<button class="map-scope-btn ${isSub ? 'scope-sub' : ''}" onclick="toggleMapScope()" type="button">${isSub ? '📍 Підписка' : '🌐 Загальна'}</button>`;
            }
            // Поза подією рядок лише повторює підказку «Оберіть напрямок» і не має
            // керування (перемикач є тільки для підписки), тож новачок його не бачить.
            strip.style.display = raw ? 'flex' : 'none';
            strip.innerHTML = `<span class="map-mode-label">Режим:</span><span class="map-mode-value">${value}</span>${toggleHtml}`;
        }

        function toggleMapScope() {
            S.mapScope = (S.mapScope === 'all') ? 'sub' : 'all';
            // Скидаємо активні фільтри, щоб стара вибірка не ховала піни в новому режимі
            S.mapEventFilter = 'all';
            S.mapNewsFilter = 'all';
            renderNewsStrip();
            if (S.currentScreen === 'explore') { refreshMap(); }
        }

        function renderNewsStrip() {
            renderMapModeStrip();
            const strip = document.getElementById('news-strip');
            if (!strip) return;
            const dock = document.getElementById('map-trip-dock');
            if (dock && dock.classList.contains('open')) { strip.style.display = 'none'; return; }
            const context = mapContextScoped();
            if (context) {
                const drivers = (S.mapCrews || []).filter(c =>
                    String(c?.direction_id || '') === String(context.dirId || '') &&
                    c?.lat != null &&
                    c?.lng != null &&
                    Number.isFinite(Number(c.lat)) &&
                    Number.isFinite(Number(c.lng))
                ).length;
                // Консенсус форуму 2026-06-12: чесний counter label — чип «Водії»
                // розрізняє «усі водії vs з місцями», щоб muted повні авто не
                // робили лічильник брехливим («3 водії · 1 з місцями»).
                const driversWithSeats = (S.mapCrews || []).filter(c =>
                    String(c?.direction_id || '') === String(context.dirId || '') &&
                    safeCount(c?.seats_free ?? c?.free_seats ?? c?.available_seats) > 0
                ).length;
                // Г (запис 57): замість «Подія 0/1» — дія «📍 Подія» і один із трьох станів точки.
                const eventState = eventPointStateForMapContext(context);
                if (eventState.state === 'loading') ensureEventPointForMap(context.dirId);
                // «на карті» — лише коли пін справді намальовано; якщо його ховає лінза «Водії/Попутники», чип пропонує показати.
                const eventShown = eventState.state === 'ready' && mapEventPointsForCurrentMap().length > 0;
                const eventSub = { ready: eventShown ? 'на карті' : 'показати', loading: 'завантажуємо…', error: 'не вдалося завантажити', missing: 'без координат' }[eventState.state] || '';
                const cards = [
                    { key: 'event', title: '📍 Подія', color: '#fbbf24', count: '', sub: eventSub, onclick: 'onMapEventChip()' },
                    { key: 'drivers', title: 'Водії', color: '#38bdf8', count: drivers, sub: drivers > 0 ? `${driversWithSeats} з місцями` : '' },
                    { key: 'passengers', title: 'Попутники', color: '#34d399', count: livePassengerCountForMapContext(context) },
                ];
                strip.style.display = 'grid';
                strip.style.gridTemplateColumns = 'repeat(3, minmax(0, 1fr))';
                strip.innerHTML = cards.map(c => {
                    const active = S.mapEventFilter === c.key;
                    const nextFilter = active ? 'all' : c.key;
                    return `<div class="news-banner ${active ? 'active' : ''}" onclick="${c.onclick || `setMapEventFilter('${nextFilter}')`}" style="background:${active ? c.color : 'var(--bg-card)'};border-color:${active ? c.color : 'var(--border)'};">
                        <div class="news-banner-title">${c.title}</div>
                        <div class="news-banner-count">${c.count}</div>
                        ${c.sub ? `<div style="font-size:9px;color:${active ? 'rgba(8,16,24,0.7)' : 'var(--text-muted)'};margin-top:1px;">${c.sub}</div>` : ''}
                    </div>`;
                }).join('');
                return;
            }
            S.mapEventFilter = 'all';
            const buckets = catalogCategoryBucketsForMapStrip();
            const cards = [
                { key: 'theocracy', title: 'Теократія', color: '#a78bfa', rgb: '167, 139, 250', count: buckets.theocracy },
                { key: 'leisure', title: 'Відпочинок', color: '#34d399', rgb: '52, 211, 153', count: buckets.leisure },
                { key: 'work', title: 'Робота', color: '#38bdf8', rgb: '56, 189, 248', count: buckets.work },
            ];
            strip.style.display = 'grid';
            strip.style.gridTemplateColumns = 'repeat(3, minmax(0, 1fr))';
            strip.innerHTML = cards.map(c => {
                const active = S.mapNewsFilter === c.key;
                const nextFilter = active ? 'all' : c.key;
                return `<div class="news-banner ${active ? 'active' : ''}" onclick="setMapNewsFilter('${nextFilter}')" style="background:${active ? c.color : `linear-gradient(rgba(${c.rgb}, 0.16), rgba(${c.rgb}, 0.16)), var(--bg-card)`};border-color:${active ? c.color : `rgba(${c.rgb}, 0.45)`};">
                    <div class="news-banner-title">${c.title}</div>
                    <div class="news-banner-count">${c.count}</div>
                </div>`;
            }).join('');
        }

        function mapFocusFitOptions() {
            const topStack = document.querySelector('.map-top-stack');
            const topHeight = topStack && topStack.offsetParent !== null
                ? Math.ceil(topStack.getBoundingClientRect().height + 40)
                : 56;
            const resultPanel = document.getElementById('map-result-panel');
            const nav = document.querySelector('.nav');
            const navHeight = nav && nav.offsetParent !== null
                ? Math.ceil(nav.getBoundingClientRect().height)
                : 72;
            let bottomHeight = navHeight + 32;
            if (resultPanel && resultPanel.classList.contains('open')) {
                const panelHeight = Math.ceil(resultPanel.getBoundingClientRect().height || 0);
                bottomHeight = Math.max(bottomHeight, Math.min(240, panelHeight + 28));
            }
            return {
                paddingTopLeft: [24, Math.max(170, topHeight)],
                paddingBottomRight: [24, Math.max(104, bottomHeight)],
                maxZoom: 15
            };
        }

        function singlePointFitBounds(point) {
            const lat = Number(point?.[0]);
            const lng = Number(point?.[1]);
            if (!Number.isFinite(lat) || !Number.isFinite(lng)) return [];
            const d = 0.0012;
            return [[lat - d, lng - d], [lat + d, lng + d]];
        }

        // Пункт 2: фокус карти на піни ВІДПОВІДНО до активного фільтра
        function focusMapByFilter() {
            if (!S.map) return;
            const context = mapContextScoped();
            const coords = [];

            if (context) {
                const dirId = String(context.dirId || '');
                const ef = S.mapEventFilter || 'all';
                if (S.activeTrip && String(S.activeTrip.direction_id || '') === dirId) {
                    renderCrewMembersOnMap();
                    return;
                }
                if (ef === 'event' || ef === 'all') {
                    const pt = eventPointForMapContext(context);
                    if (pt && pt.lat != null && pt.lng != null) _pushMapCoord(coords, pt.lat, pt.lng);
                }
                if (ef === 'drivers' || ef === 'all') {
                    (S.mapCrews || []).forEach(c => {
                        if (String(c?.direction_id || '') === dirId) _pushMapCoord(coords, c.lat, c.lng);
                    });
                }
                if (ef === 'passengers' || ef === 'all') {
                    (S.mapPassengers || []).forEach(p => {
                        if (String(p?.direction_id || '') === dirId) _pushMapCoord(coords, p.lat, p.lng);
                    });
                    const members = (S.activeTrip && String(S.activeTrip.direction_id || '') === dirId
                        && Array.isArray(S.activeTrip.members)) ? S.activeTrip.members : [];
                    members.forEach(m => {
                        if (String(m?.role || '').toLowerCase() !== 'driver') _pushMapCoord(coords, m.lat, m.lng);
                    });
                }
            } else {
                const nf = S.mapNewsFilter || 'all';
                mapEventPointsForDiscovery().forEach(point => {
                    if (nf !== 'all' && classifyNewsItem(point) !== nf) return;
                    _pushMapCoord(coords, point.lat, point.lng);
                });
            }

            const seen = new Set();
            const uniq = coords.filter(([lat, lng]) => {
                const k = `${lat.toFixed(5)},${lng.toFixed(5)}`;
                if (seen.has(k)) return false; seen.add(k); return true;
            });

            if (!uniq.length) { showToast('Немає пінів цього типу на карті', ''); return; }
            const fitOptions = mapFocusFitOptions();
            if (uniq.length === 1) S.map.fitBounds(singlePointFitBounds(uniq[0]), fitOptions);
            else S.map.fitBounds(uniq, fitOptions);
        }

        async function setMapEventFilter(filter) {
            S.mapEventFilter = filter || 'all';
            renderNewsStrip();
            if (S.currentScreen === 'explore') { await refreshMap(); focusMapByFilter(); }
        }

        async function setMapNewsFilter(filter) {
            if (guardMapFilterChange(filter)) return;
            S.mapNewsFilter = filter || 'all';
            renderNewsStrip();
            if (S.currentScreen === 'explore') { await refreshMap(); focusMapByFilter(); }
        }

        function setNewsFilter(filter) { S.newsFilter = filter || 'all'; renderNewsScreen(); }

        async function openNewsDirection(dirId) {
            if (!dirId) return;
            // Find the news item to get parent_id
            const newsItem = S.news.find(n => Number(n.direction_id) === Number(dirId));
            const parentId = newsItem?.parent_id;

            // Navigate to board screen first
            switchScreen('board');
            openDirectionLoadingSheet(dirId);

            // If news has parent folder, navigate through the tree hierarchy
            if (parentId) {
                // Build path from root to parent by walking up the tree
                const path = [];
                let currentId = parentId;
                const maxDepth = 20; // safety limit
                let depth = 0;
                while (currentId && depth < maxDepth) {
                    const dir = allDirections.find(d => String(d.id) === String(currentId));
                    if (!dir) break;
                    path.unshift({ id: dir.id, title: dir.title || `#${dir.id}` });
                    currentId = dir.parent_id;
                    depth++;
                }
                // Now navigate through the path
                S.boardStack = [];
                S.boardParentId = null;
                for (const folder of path) {
                    S.boardStack.push(folder);
                    S.boardParentId = folder.id;
                }
                // Render the board at the parent folder level, then open the direction
                await renderBoard();
                await openDirection(dirId);
            } else {
                // No parent — just open the direction detail
                await openDirection(dirId);
            }
        }

        function renderNewsFeedItems(items) {
            return items.slice(0, 60).map(n => {
                const dId = Number(n?.direction_id || 0);
                const clickHandler = dId > 0 ? `onclick="openNewsDirection(${dId})"` : '';
                const cursorStyle = dId > 0 ? 'cursor:pointer;' : '';
                return `
                <div class="news-feed-item" ${clickHandler} style="${cursorStyle}">
                    <div style="font-size:13px;font-weight:700;line-height:1.45;">${escapeHtml(n.text || 'Новина')}</div>
                    <div class="news-feed-meta">${escapeHtml(n.dir_title || 'Без події')} • ${formatNewsTime(n.created_at)}</div>
                </div>
            `}).join('');
        }

        // Один chokepoint людських підписів картки події (як historyStatusLabel
        // для історії): сирі ключі рубрики і технічні токени в UI заборонені.
        function newsCategoryLabel(key) {
            const k = String(key || '').toLowerCase();
            if (k === 'theocracy') return 'Теократія';
            if (k === 'leisure') return 'Відпочинок';
            if (k === 'work') return 'Робота';
            return 'Подія';
        }

        // Свіжість читається відчуттям, а не арифметикою: «12 хв тому»
        // замість «23.07, 23:26» (UX-огляд 2026-07-25). Абсолютна дата
        // лишається у title як точний факт.
        function formatNewsRelative(ts) {
            const t = Number(ts || 0);
            if (!t) return '';
            const seconds = Math.max(0, Math.floor(Date.now() / 1000 - (t > 1e12 ? t / 1000 : t)));
            if (seconds < 90) return 'щойно';
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes} ${pluralUk(minutes, 'хвилину', 'хвилини', 'хвилин')} тому`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours} ${pluralUk(hours, 'годину', 'години', 'годин')} тому`;
            const days = Math.floor(hours / 24);
            if (days < 30) return `${days} ${pluralUk(days, 'день', 'дні', 'днів')} тому`;
            return formatNewsTime(t);
        }

        // «Serock · 29 серпня» — куди і коли; головні дані рішення новачка.
        // ВАЖЛИВО (review Codex 2026-07-25): показувати лише кінцеву дату
        // діапазону — брехня. «Розробка» триває 21.06→29.08, і рядок «29
        // серпня» читався як «подія 29 серпня». Одноденна подія = одна дата;
        // діапазон = діапазон; він не є сигналом доступності чи обіцянкою
        // можливості приєднатися.
        function formatNewsDay(value) {
            return formatEventDay(value);
        }

        // Правило дат (консенсус із Codex, форум 2026-07-25): СТАБІЛЬНА
        // фактологія без похідних від годинника. Одна дата → вона; різні →
        // діапазон («29–31 серпня» в межах місяця, інакше «21 червня – 29
        // серпня»); дат немає → лише місце. Свідомо БЕЗ маркера «триває»:
        // він залежить від локального годинника і читається як обіцянка, що
        // приєднатись ще можна, — а доступність визначають явні lifecycle-
        // факти й дії, не календар. Якщо пілот покаже потребу в статусі —
        // вводити його окремим organizer/lifecycle фактом, не таймером.
        function formatNewsWhen(startDate, endDate) {
            return formatEventDateRange(startDate, endDate);
        }

        // Українське узгодження числівників: 1 водій / 2 водії / 5 водіїв.
        function pluralUk(n, one, few, many) {
            const num = Math.abs(Number(n) || 0);
            const mod100 = num % 100;
            const mod10 = num % 10;
            if (mod100 >= 11 && mod100 <= 14) return many;
            if (mod10 === 1) return one;
            if (mod10 >= 2 && mod10 <= 4) return few;
            return many;
        }

        function renderNewsEventCards(events) {
            const banners = document.getElementById('news-banners');
            const feed = document.getElementById('news-feed');
            if (!feed) return;
            if (banners) { banners.style.display = 'none'; banners.innerHTML = ''; }
            const allCards = Array.isArray(events) ? events : [];
            renderNewsFilterTiles(allCards);
            const activeFilter = S.newsEventFilter || 'all';
            const cards = activeFilter === 'all'
                ? allCards
                : allCards.filter(card => String(card?.category || '').toLowerCase() === activeFilter);
            if (!cards.length) {
                feed.innerHTML = allCards.length
                    ? '<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">У цій рубриці порожньо</div><div class="empty-sub">Натисніть на вибраний фільтр ще раз, щоб побачити решту подій</div></div>'
                    : '<div class="empty"><div class="empty-icon">🗞️</div><div class="empty-title">Поки тихо</div><div class="empty-sub">Нові значущі оновлення з\'являться тут</div></div>';
                return;
            }
            feed.innerHTML = cards.map(card => {
                const id = Number(card?.direction_id || 0);
                const agg = card?.aggregates || {};
                const drivers = Number(agg.drivers_total || 0);
                const seats = Number(agg.open_seats || 0);
                const waiting = Number(agg.passengers_waiting || 0);
                const done = Number(card?.completed_trips_count || 0);
                // Відтінок і значок рубрики — завжди, і з фільтром теж: тема — орієнтир «де я», як на мапі
                // й у каталозі (власник 2026-09-25; раніше з фільтром картки були нейтральні).
                const catKey = String(card?.category || '').toLowerCase();
                const newsCat = ['theocracy', 'leisure', 'work'].includes(catKey) ? catKey : 'other';
                const tintClass = ` news-card-tint-${newsCat === 'other' ? 'event' : newsCat}`;
                const stats = `${drivers} ${pluralUk(drivers, 'водій', 'водії', 'водіїв')}`
                    + ` • ${seats} ${pluralUk(seats, 'вільне місце', 'вільні місця', 'вільних місць')}`
                    + ` • ${waiting} ${pluralUk(waiting, 'шукає місце', 'шукають місце', 'шукають місце')}`;
                // Куди і коли — перший рядок після назви: саме на це відповідає
                // людина собі «чи це для мене», ще нікуди не тапнувши.
                const where = String(card?.meeting_point || '').trim();
                const when = formatEventDateRange(card?.start_date, card?.end_date);
                const whereWhen = [where, when].filter(Boolean).join(' · ');
                const isOpen = !!S._newsOpenUpdates[String(id)];
                // A11y (review Codex 2026-07-25): картка НЕ може бути
                // role="button" з кнопками всередині — інтерактивне у
                // інтерактивному невалідне і ламає читач екрана. Тому:
                // <article> — простий контейнер; головна область — СПРАВЖНЯ
                // <button> з неінтерактивним вмістом; «×» і дія — її СУСІДИ.
                return `<article class="news-feed-item news-card${tintClass}" data-news-direction="${id}"
                    style="position:relative;">
                    <button type="button" class="news-card-toggle"
                        aria-expanded="${isOpen ? 'true' : 'false'}"
                        aria-controls="news-v2-body-${id}"
                        onclick="toggleNewsEventCard(${id})"
                        style="display:block;width:100%;text-align:left;padding:0;border:0;background:transparent;color:inherit;font:inherit;cursor:pointer;">
                        <span class="news-card-row"><span class="cat-ico news-cat-ico cat-ico-${newsCat}" aria-hidden="true">${itemIcon(card, newsCat, false)}</span><span class="news-card-text">
                        <span style="display:block;font-size:14px;font-weight:800;line-height:1.45;padding-right:30px;">${escapeHtml(card?.title || `Подія #${id}`)}</span>
                        ${whereWhen ? `<span class="news-feed-meta news-card-where" style="display:block;"><span class="news-card-pin" aria-hidden="true">📍</span>${escapeHtml(whereWhen)}</span>` : ''}
                        <span class="news-feed-meta" style="display:block;">${escapeHtml(newsCategoryLabel(card?.category))} • ${escapeHtml(stats)}${done > 0 ? ` • ${done} ${pluralUk(done, 'завершена поїздка', 'завершені поїздки', 'завершених поїздок')}` : ''}</span>
                        <span class="news-feed-meta" style="display:block;" title="${escapeAttr(formatNewsTime(card?.updated_at))}">Оновлено ${escapeHtml(formatNewsRelative(card?.updated_at))}${isOpen ? '' : ' • натисніть, щоб відкрити'}</span>
                        </span></span>
                    </button>
                    <button type="button" class="news-card-collapse" aria-label="Згорнути картку події"
                        onclick="collapseNewsEventCard(${id});"
                        style="display:${isOpen ? 'block' : 'none'};position:absolute;top:10px;right:10px;width:26px;height:26px;line-height:1;padding:0;border-radius:8px;border:1px solid var(--border);background:var(--bg-card);color:var(--text);font-weight:700;cursor:pointer;">×</button>
                    <div id="news-v2-body-${id}" class="news-card-body">
                        <div id="news-v2-updates-${id}" style="display:none;margin-top:5px;"></div>
                        <div id="news-v2-people-${id}" style="display:none;margin-top:5px;"></div>
                        <div id="news-v2-action-${id}" style="display:${isOpen ? 'block' : 'none'};margin-top:8px;">
                            <button type="button" class="news-card-action" onclick="openDirection(${id});"
                                style="padding:8px 12px;border-radius:9px;border:0;background:var(--accent);color:#081018;font-weight:800;cursor:pointer;">Відкрити подію</button>
                        </div>
                    </div>
                </article>`;
            }).join('');
            // Перебудова innerHTML знищує розгорнуті панелі — повертаємо їх
            // з пам'яті рендера, щоб poll не згортав те, що людина відкрила.
            restoreNewsExpansions();
        }

        // Перемикач "Підписка" ⇄ "Загальна" біля заголовка стрічки.
        function toggleNewsScope() {
            S.newsScope = (S.newsScope === 'sub') ? 'all' : 'sub';
            updateNewsBadge();
            renderNewsScreen();
        }

        function setNewsEventFilter(key) {
            S.newsEventFilter = key || 'all';
            updateNewsBadge();
            renderNewsScreen();
        }

        function renderNewsScreen() {
            const banners = document.getElementById('news-banners');
            const feed = document.getElementById('news-feed');
            if (!banners || !feed) return;
            const v2Events = Array.isArray(S.news) && S.news.some(item => item && item.aggregates && item.direction_id != null);
            if (v2Events) {
                renderNewsEventCards(S.news);
                return;
            }
            const allItems = Array.isArray(S.news) ? S.news.filter(isDiscoveryNewsItem) : [];

            // Активна підписка/поїздка визначає, чи доступний режим "Підписка".
            const context = activeMapContextForMap();
            const hasSub = !!(context && context.dirId);
            // При появі НОВОЇ підписки автоматично вмикаємо режим "Підписка";
            // у межах однієї підписки ручний вибір користувача зберігається.
            if (hasSub) {
                if (S._newsScopeDirId !== String(context.dirId)) {
                    S._newsScopeDirId = String(context.dirId);
                    S.newsScope = 'sub';
                    // Роль-лінза за замовчуванням (2026-06-11), дзеркально до карти:
                    // нова підписка → комплементарний фільтр; ручний вибір липкий далі.
                    S.newsEventFilter = defaultNewsEventFilterForRole();
                }
            } else {
                S._newsScopeDirId = null;
            }
            const scope = hasSub ? (S.newsScope || 'sub') : 'all';

            // Кнопка-перемикач показується лише за наявності активної підписки.
            const scopeBtn = document.getElementById('news-scope-btn');
            if (scopeBtn) {
                if (hasSub) {
                    scopeBtn.style.display = '';
                    scopeBtn.textContent = scope === 'sub' ? '📍 Підписка' : '🌐 Загальна';
                    scopeBtn.classList.toggle('scope-sub', scope === 'sub');
                } else {
                    scopeBtn.style.display = 'none';
                    scopeBtn.classList.remove('scope-sub');
                }
            }

            // Режим "Підписка": фільтри Подія/Водії/Попутники + новини свого напрямку.
            if (scope === 'sub') {
                const dirId = String(context.dirId);
                const dirItems = allItems.filter(n => String(n?.direction_id || '') === dirId);
                const ef = S.newsEventFilter || 'all';

                // Підраховуємо кількість для кожного фільтра
                const eventCount = filterNewsItemsByEventLens(dirItems, 'event').length;
                const driverCount = filterNewsItemsByEventLens(dirItems, 'drivers').length;
                const paxCount = filterNewsItemsByEventLens(dirItems, 'passengers').length;

                const eventCards = [
                    { key: 'event',      title: 'Подія',     color: '#fbbf24', count: eventCount  },
                    { key: 'drivers',    title: 'Водії',     color: '#38bdf8', count: driverCount },
                    { key: 'passengers', title: 'Попутники', color: '#34d399', count: paxCount    },
                ];
                banners.style.display = '';
                banners.innerHTML = eventCards.map(c => {
                    const active = ef === c.key;
                    return `<div class="news-banner ${active ? 'active' : ''}" onclick="setNewsEventFilter('${active ? 'all' : c.key}')" style="background:${active ? c.color + '33' : 'var(--bg-card)'};border-color:${active ? c.color : 'var(--border)'};">
                        <div class="news-banner-title">${c.title}</div>
                        <div class="news-banner-count">${c.count}</div>
                    </div>`;
                }).join('');

                // Фільтруємо новини по обраному типі
                const items = filterNewsItemsByEventLens(dirItems, ef);

                if (!items.length) {
                    const hint = ef === 'all'
                        ? 'Натисніть «🌐 Загальна», щоб бачити всі новини'
                        : 'По цьому фільтру поки тихо';
                    feed.innerHTML = `<div class="empty"><div class="empty-icon">🗞️</div><div class="empty-title">По вашій події поки тихо</div><div class="empty-sub">${hint}</div></div>`;
                    return;
                }
                feed.innerHTML = renderNewsFeedItems(items);
                return;
            }

            // Режим "Загальна": категорійні банери + фільтр за категорією.
            banners.style.display = '';
            const buckets = { theocracy: 0, leisure: 0, work: 0 };
            allItems.forEach(n => { const k = classifyNewsItem(n); if (k in buckets) buckets[k]++; });
            const cards = [
                { key: 'theocracy', title: 'Теократія', color: '#a78bfa', count: buckets.theocracy || 0 },
                { key: 'leisure', title: 'Відпочинок', color: '#34d399', count: buckets.leisure || 0 },
                { key: 'work', title: 'Робота', color: '#38bdf8', count: buckets.work || 0 },
            ];
            banners.innerHTML = cards.map(c => {
                const active = S.newsFilter === c.key;
                return `<div class="news-banner ${active ? 'active' : ''}" onclick="setNewsFilter('${active ? 'all' : c.key}')" style="background:${active ? c.color + '22' : 'var(--bg-card)'};border-color:${active ? c.color : 'var(--border)'};">
                    <div class="news-banner-title">${c.title}</div>
                    <div class="news-banner-count">${c.count}</div>
                </div>`;
            }).join('');
            const items = S.newsFilter === 'all' ? allItems : allItems.filter(n => classifyNewsItem(n) === S.newsFilter);
            if (!items.length) {
                feed.innerHTML = '<div class="empty"><div class="empty-icon">🗞️</div><div class="empty-title">Поки тихо</div><div class="empty-sub">Нові події з\'являться незабаром</div></div>';
                return;
            }
            feed.innerHTML = renderNewsFeedItems(items);
        }

        function renderNews() {
            if (!S.apiBase) { S.news = []; renderNewsStrip(); renderNewsScreen(); updateNewsBadge(); return; }
            // Legacy traceability anchor: the old route shape was
            // /api/v3/home/feed?limit=60; News v2 keeps the same limit while
            // adding the authenticated actor query before it.
            api('/api/v3/home/feed?user_id=' + encodeURIComponent(S.userId) + '&limit=60&lang=' + encodeURIComponent(S.lang || 'uk')).then(data => {
                S.news = Array.isArray(data?.events)
                    ? data.events
                    : (data?.news || []).filter(isDiscoveryNewsItem);
                renderNewsStrip(); renderNewsScreen();
                updateNewsBadge();
                if (S.currentScreen === 'explore') refreshMap();
            });
        }

        // ─── BOARD ───
        let allDirections = [];

        function isFolderNode(d) {
            if (!d || typeof d !== 'object') return false;
            const kind = String(d.kind || '').toLowerCase();
            return !!d.is_folder || !!d.has_kids || kind === 'folder' || kind === 'topic' || kind === 'category';
        }

        function safeCount(value) {
            const n = Number(value);
            return Number.isFinite(n) && n > 0 ? Math.floor(n) : 0;
        }

        function pluralUk(n, one, few, many) {
            const mod10 = n % 10;
            const mod100 = n % 100;
            if (mod10 === 1 && mod100 !== 11) return one;
            if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) return few;
            return many;
        }

        function formatCountLabel(key, count) {
            return window.WayTandemI18n?.formatCount?.(key, count, S.lang) || String(safeCount(count));
        }

        function buildDirectionCardStats(d) {
            const drivers = safeCount(d?.drivers ?? d?.drivers_count);
            const passengers = safeCount(d?.passengers ?? d?.passengers_count);
            const freeSeats = safeCount(d?.free_seats ?? d?.seats_free ?? d?.available_seats);
            const role = normalizeRole(S.userRole || 'client');
            if (isFolderNode(d)) {
                const totalEvents = safeCount(
                    d?.event_count ?? d?.events_count ?? d?.events ?? d?.descendant_events ?? d?.descendant_events_count
                );
                // Каталог відповідає "скільки тут подій"; учасники з'являються вже на рівні події.
                return { primary: formatCountLabel('folderEvents', totalEvents), secondary: '' };
            }
            if (_isDriverRole(role)) {
                return {
                    primary: `👤 ${passengers} ${pluralUk(passengers, 'шукає місце', 'шукають місце', 'шукають місце')}`,
                    secondary: `🚗 ${drivers} ${pluralUk(drivers, 'водій', 'водії', 'водіїв')}`
                };
            }
            if (_isPassengerRole(role)) {
                const seatText = freeSeats > 0
                    ? ` • 💺 ${freeSeats} ${pluralUk(freeSeats, 'вільне місце', 'вільні місця', 'вільних місць')}`
                    : '';
                return {
                    primary: `🚗 ${drivers} ${pluralUk(drivers, 'водій', 'водії', 'водіїв')}${seatText}`,
                    secondary: `👤 ${passengers} ${pluralUk(passengers, 'шукає місце', 'шукають місце', 'шукають місце')}`
                };
            }
            return {
                primary: `🚗 ${drivers} ${pluralUk(drivers, 'водій', 'водії', 'водіїв')} • 👤 ${passengers} ${pluralUk(passengers, 'попутник', 'попутники', 'попутників')}`,
                secondary: 'Оберіть роль перед дією'
            };
        }

        function renderBoardBreadcrumb(canCreate = false) {
            const el = document.getElementById('board-breadcrumb');
            if (!el) return;
            if (!S.boardStack.length) { el.innerHTML = ''; updateBottomNavForBoardDepth(); return; }
            const path = S.boardStack.map(x => x?.title || `#${x?.id || '?'}`);
            el.innerHTML = `<div class="board-crumb-path" onclick="boardGoRoot()" title="До кореня">${path.map(p => escapeHtml(String(p))).join(' / ')}</div>`;
            updateBottomNavForBoardDepth();
        }

        async function boardGoRoot() {
            S.boardStack = []; S.boardParentId = null;
            const search = document.getElementById('board-search');
            if (search) search.value = '';
            await renderBoard();
        }

        async function boardGoUp() {
            if (!S.boardStack.length) return;
            S.boardStack.pop();
            S.boardParentId = S.boardStack.length ? S.boardStack[S.boardStack.length - 1].id : null;
            const search = document.getElementById('board-search');
            if (search) search.value = '';
            await renderBoard();
        }

        async function boardOpenFolder(dirId) {
            const dir = allDirections.find(d => String(d.id) === String(dirId));
            if (!dir || !isFolderNode(dir)) return;
            S.boardParentId = dir.id;
            S.boardStack.push({ id: dir.id, title: dir.title || `#${dir.id}` });
            const search = document.getElementById('board-search');
            if (search) search.value = '';
            await renderBoard();
        }

        async function renderBoard() {
            const list = document.getElementById('board-list');
            // Поки в полі є запит, на екрані — результати пошуку: пізній renderBoard() (hydrate,
            // перемикання вкладок, опитування) не має затирати їх рівнем каталогу (прохід 2026-09-24).
            const searchActive = () => !!sanitizeSearchInput(document.getElementById('board-search')?.value || '').trim();
            if (!searchActive()) list.innerHTML = '<div class="skeleton" style="height:60px;margin:12px 16px;"></div>'.repeat(3);
            if (!S.apiBase) {
                renderBoardBreadcrumb(false);
                list.innerHTML = '<div class="empty"><div class="empty-icon">🧭</div><div class="empty-title">Підключіть API</div><div class="empty-sub">Вкажіть адресу сервера в налаштуваннях</div></div>';
                return;
            }

            const currentDirs = allDirections || [];
            S.canCreateEvent = S.boardStack.length > 0
                && S.boardParentId !== null
                && S.boardParentId !== undefined
                && !(document.getElementById('board-search')?.value?.trim())
                && !currentDirs.some(d => isFolderNode(d));

            if (!searchActive()) renderBoardBreadcrumb(S.canCreateEvent);
            const qp = new URLSearchParams({ lang: S.lang });
            if (S.userId) qp.set('user_id', String(S.userId));
            if (S.boardParentId !== null && S.boardParentId !== undefined) qp.set('parent_id', String(S.boardParentId));
            const [data, subs] = await Promise.all([
                api(`/api/v3/board?${qp.toString()}`),
                S.userId ? api(`/api/v3/user/subscriptions?user_id=${S.userId}`) : Promise.resolve(null),
            ]);
            allDirections = Array.isArray(data) ? data : (data?.directions || []);
            if (S.boardParentId === null || S.boardParentId === undefined) {
                rememberCatalogRootsForMap(allDirections);
                S.mapCatalogEventsLoaded = false;
            }
            applySubscriptionsPayload(subs);
            const subSet = new Set((S.subscriptions || []).map(s => String(s.direction_id)));
            S.boardSubSet = subSet;
            const liveQuery = sanitizeSearchInput(document.getElementById('board-search')?.value || '').trim();
            if (liveQuery) {
                // Дані рівня й підписки оновлено; результати перераховуємо тим самим запитом.
                updateBottomNavForBoardDepth();
                filterBoard(liveQuery);
                return;
            }
            renderBoardList(allDirections, S.boardSubSet);
            // Перерахунок зі свіжими даними (чи є підпапки) + оновлення нижнього меню
            S.canCreateEvent = S.boardStack.length > 0
                && S.boardParentId !== null
                && S.boardParentId !== undefined
                && !(document.getElementById('board-search')?.value?.trim())
                && !(allDirections || []).some(d => isFolderNode(d));
            updateBottomNavForBoardDepth();
        }

        function renderBoardList(dirs, subSet, searchQuery = '') {
            const list = document.getElementById('board-list');
            if (!dirs.length && searchQuery) {
                // Порожній пошук ≠ «подій немає» (live-прохід новачком 2026-09-24).
                list.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">Нічого не знайдено</div><div class="empty-sub">За запитом «${escapeHtml(searchQuery)}» подій немає. Спробуйте інше слово або місто, або створіть власну подію.</div><button class="btn btn-primary" style="margin-top:20px;max-width:320px;margin-left:auto;margin-right:auto;" onclick="switchScreen('explore')">Перейти до мапи</button></div>`;
                return;
            }
            if (!dirs.length) {
                list.innerHTML = `<div class="empty"><div class="empty-icon">📭</div><div class="empty-title">Немає подій</div><div class="empty-sub">Перегляньте події на мапі або створіть власну</div><button class="btn btn-primary" style="margin-top:20px;max-width:320px;margin-left:auto;margin-right:auto;" onclick="switchScreen('explore')">Перейти до мапи</button></div>`;
                return;
            }
            list.innerHTML = dirs.map(d => {
                const id = String(d.id);
                const isFolder = isFolderNode(d);
                const isSub = !isFolder && subSet?.has(id);
                const stats = buildDirectionCardStats(d);
                // Де і коли — як у «Новинах»: без цього серед результатів не вибрати.
                const whereWhen = isFolder ? '' : [String(d.meeting_point || '').trim(), formatEventDateRange(d.start_date, d.end_date)].filter(Boolean).join(' · ');
                // Колір рубрики — на всю глибину (2026-09-25); значок піна — лише на кореневих входах, глибше —
                // за змістом назви папки (власник 2026-09-26, `itemIcon`).
                const cat = itemCategory(d);
                // Розділ із результатів пошуку може лежати на іншому рівні — відкриваємо його за результатами.
                const click = isFolder ? (searchQuery ? `boardOpenSearchFolder(${d.id})` : `boardOpenFolder(${d.id})`) : `openDirection(${d.id})`;
                const cardLabel = `${isFolder ? 'Відкрити розділ' : 'Відкрити подію'}: ${d.title || 'Подія'}`;
                return `<button type="button" class="dir-card dir-card-tint-${cat}${isSub ? ' subscribed' : ''}" onclick="${click}" aria-label="${escapeAttr(cardLabel)}">
                    <span class="dir-card-icon cat-ico cat-ico-${cat}" aria-hidden="true">${itemIcon(d, cat, isFolder)}</span>
                    <span class="dir-card-info">
                        <span class="dir-card-name">${escapeHtml(d.title || 'Подія')}${isSub ? '<span class="dir-card-mine">✓ Ви в події</span>' : ''}</span>
                        ${whereWhen ? `<span class="dir-card-where">📍 ${escapeHtml(whereWhen)}</span>` : ''}
                        <span class="dir-card-stats"><span class="dir-card-total">${escapeHtml(stats.primary)}</span>${stats.secondary ? `<span class="dir-card-context">${escapeHtml(stats.secondary)}</span>` : ''}</span>
                    </span>
                    <span class="dir-card-arrow" aria-hidden="true">›</span>
                </button>`;
            }).join('');
        }

        function activeSubscriptionForRadar() {
            return (S.subscriptions || [])[0] || null;
        }

        function directionIdForRadar(sub) {
            const raw = sub?.direction_id ?? sub?.id ?? 0;
            const dirId = Number(raw);
            return Number.isFinite(dirId) && dirId > 0 ? dirId : 0;
        }

        function openCrewCountForRadar(dirId) {
            if (!dirId) return 0;
            return (S.mapCrews || []).filter(c =>
                String(c?.direction_id || '') === String(dirId) &&
                String(c?.organizer_id || '') !== String(S.userId || '') &&
                c?.lat != null &&
                c?.lng != null &&
                Number.isFinite(Number(c?.lat)) &&
                Number.isFinite(Number(c?.lng))
            ).length;
        }

        function activeMapContextForMap() {
            const tripDirId = Number(S.activeTrip?.direction_id || 0);
            if (Number.isFinite(tripDirId) && tripDirId > 0) {
                return {
                    kind: 'trip',
                    dirId: tripDirId,
                    title: S.activeTrip?.direction_title || S.activeTrip?.dir_title || S.activeTrip?.title || `#${tripDirId}`,
                };
            }

            const sub = activeSubscriptionForRadar();
            const subDirId = directionIdForRadar(sub);
            if (sub && subDirId) {
                return {
                    kind: 'subscription',
                    dirId: subDirId,
                    title: sub.title || sub.direction_title || sub.dir_title || `#${subDirId}`,
                };
            }
            return null;
        }

        // Контекст карти з урахуванням перемикача Підписка/Загальна.
        // У режимі 'all' трактуємо як відсутність контексту → карта показує всі піни (discovery).
        // ВАЖЛИВО: стрічку новин (renderNewsScreen) це НЕ зачіпає — там свій S.newsScope.
        function mapContextScoped() {
            if (S.mapScope === 'all') return null;
            return activeMapContextForMap();
        }

        function mapFocusedDirectionId() {
            return mapContextScoped()?.dirId || 0;
        }

        function isMapFocusedMode() {
            return !!mapFocusedDirectionId();
        }

        function visibleMapCrewsForContext(crews) {
            const focusedDirId = mapFocusedDirectionId();
            if (S.activeTrip && focusedDirId && String(S.activeTrip.direction_id || '') === String(focusedDirId)) {
                // Active-trip map is route truth, not discovery. The car is drawn
                // once by renderCrewMembersOnMap() at the driver's start point;
                // passenger pickup points must never receive a seat-badged car pin.
                return [];
            }
            return (crews || []).filter(c => {
                if (!c || c.lat == null || c.lng == null) return false;
                if (focusedDirId) {
                    // Власне авто — ПОЗА роль-фільтром (урок zombie-фіксу: фільтр не
                    // має ховати власний контекст), але в межах свого напрямку.
                    const isMine = S.userId && String(c?.organizer_id || '') === String(S.userId);
                    const eventFilter = S.mapEventFilter || 'all';
                    if (!isMine && eventFilter !== 'all' && eventFilter !== 'drivers') return false;
                    return String(c?.direction_id || '') === String(focusedDirId);
                }
                return false;
            });
        }

        function renderMapCrewRoster(crew) {
            const members = Array.isArray(crew?.members) ? crew.members : [];
            const driverName = crew?.driver_name || crew?.organizer_name || 'Водій';
            const roster = [
                {
                    user_id: crew?.organizer_id,
                    name: driverName,
                    role: 'driver',
                    photo_url: crew?.driver_photo_url || crew?.organizer_photo_url || ''
                },
                ...members.map(m => ({
                    user_id: m?.user_id,
                    name: m?.name || 'Попутник',
                    role: 'passenger',
                    photo_url: m?.photo_url || '',
                    matched_into_crew: true
                }))
            ];
            const visible = roster.slice(0, 5);
            const hidden = Math.max(0, roster.length - visible.length);
            const rows = visible.map(m => {
                const roleText = String(m.role || '').toLowerCase() === 'driver' ? 'водій' : 'у екіпажі';
                const absorbed = m.matched_into_crew ? ' matched-into-crew' : '';
                return `<div class="map-popup-member${absorbed}" data-map-crew-member="${escapeAttr(m.role || 'passenger')}">
                    ${renderAvatarInline(m.name || '?', m.photo_url || '', 26, 'crew-mini-avatar map-popup-avatar')}
                    <div class="crew-mini-info">
                        <div class="crew-mini-name">${escapeHtml(m.name || '?')}</div>
                        <div class="map-popup-role">${escapeHtml(roleText)}</div>
                    </div>
                </div>`;
            }).join('');
            const hiddenRow = hidden > 0
                ? `<div class="map-popup-role" style="text-align:center;">+${hidden} ще в екіпажі</div>`
                : '';
            return `<div class="map-popup-roster" data-map-crew-roster="matched-into-crew">${rows}${hiddenRow}</div>`;
        }

        function visibleMapPassengersForContext(passengers) {
            const focusedDirId = mapFocusedDirectionId();
            return (passengers || []).filter(p => {
                if (!focusedDirId || !p || p.lat == null || p.lng == null) return false;
                const eventFilter = S.mapEventFilter || 'all';
                if (eventFilter !== 'all' && eventFilter !== 'passengers') return false;
                if (String(p?.direction_id || '') !== String(focusedDirId)) return false;
                if (S.userId && String(p?.user_id || '') === String(S.userId)) return false;
                return Number.isFinite(Number(p.lat)) && Number.isFinite(Number(p.lng));
            });
        }

        // §0.62 / I-178 / WD-43 + D81 (власник 2026-10-04): стан власного авто водія в цій події для картки попутника.
        // Класифікує наявний знімок S.mapCrews / S.myCrew: free / full — з серверної проєкції (seats_free уже враховує
        // pending_all); absent — у знімку немає власного авто в події; unknown — авто є (S.myCrew), але в знімку немає
        // його рядка чи поля місткості. Невідоме ≠ 0. Свіжість і успішність читання тут не перевіряються: після
        // невдалого refreshMap лишається попередній знімок; остаточний захист — серверний driver_full.
        function driverCrewRecruitmentState(dirId) {
            const safeDirId = parseInt(dirId, 10) || 0;
            if (!safeDirId || !_isDriverRole(S.userRole)) return 'unavailable';
            const crew = (S.mapCrews || []).find(c =>
                String(c?.direction_id || '') === String(safeDirId)
                && String(c?.organizer_id || '') === String(S.userId || ''));
            if (!crew) {
                return String(S.myCrew?.direction_id || '') === String(safeDirId) ? 'unknown' : 'absent';
            }
            const value = crew.seats_free ?? crew.free_seats ?? crew.available_seats;
            if ((typeof value !== 'number' && typeof value !== 'string')
                || (typeof value === 'string' && !value.trim())) return 'unknown';
            const seats = Number(value);
            if (!Number.isFinite(seats) || seats < 0 || !Number.isInteger(seats)) return 'unknown';
            return seats > 0 ? 'free' : 'full';
        }

        function driverRecruitmentBlockReason(state) {
            if (state === 'full') return 'У вас немає вільних місць';
            if (state === 'absent') return 'Спершу вкажіть місця та старт авто';
            if (state === 'unknown') return 'Не вдалося перевірити вільні місця';
            return '';
        }

        function driverHasOpenCrewForDirection(dirId) {
            return driverCrewRecruitmentState(dirId) === 'free';
        }

        function renderMapPassengersOnMap() {
            if (!S.map) return;
            visibleMapPassengersForContext(S.mapPassengers || []).forEach(p => {
                const safePassengerId = Number.isFinite(Number(p.user_id)) ? Number(p.user_id) : 0;
                const safeDirectionId = Number.isFinite(Number(p.direction_id)) ? Number(p.direction_id) : 0;
                const lat = Number(p.lat);
                const lng = Number(p.lng);
                if (!safePassengerId || !safeDirectionId || !Number.isFinite(lat) || !Number.isFinite(lng)) return;
                const name = p.name || 'Попутник';
                const markerLabel = escapeAttr(`Попутник чекає: ${name}`);
                const marker = L.marker([lat, lng], {
                    title: markerLabel,
                    alt: markerLabel,
                    icon: L.divIcon({
                        className: '',
                        html: `<div class="map-pin map-pin-passenger" data-map-passenger-pin="wait" role="button" aria-label="${markerLabel}">👤</div>`,
                        iconSize: [34, 34],
                        iconAnchor: [17, 17],
                        popupAnchor: [0, -25]
                    }),
                    riseOnHover: true,
                    zIndexOffset: 220
                }).addTo(S.map);
                const directionTitle = escapeHtml(p.direction_title || '');
                // D81/D83: у водія картка вибраного попутника має рівно дві дії — «Запросити в екіпаж» саме цю людину
                // + «💬 Чат». Запрошення активне лише з відомим вільним місцем; інакше неактивне з причиною стану. Назва
                // події лишається в контексті картки; «→ Подія» — лише в не-водія. Оформлення власного авто — на власній
                // поверхні поза карткою (чип підшапки → шторка «Ви в події як водій»). Чат — лише контакт, без місця.
                const isDriverViewer = _isDriverRole(S.userRole);
                const recruitment = isDriverViewer ? driverCrewRecruitmentState(safeDirectionId) : 'unavailable';
                const inviteBtn = !isDriverViewer ? '' : (recruitment === 'free'
                    ? `<button data-passenger-invite="free" onclick="signalPassenger(${safePassengerId}, ${safeDirectionId}, { source: 'map', keepMapContext: true })" style="width:100%;padding:8px;border-radius:10px;background:rgba(101,212,143,0.16);color:#65d48f;border:1px solid rgba(101,212,143,0.34);font-weight:700;font-size:12px;cursor:pointer;">↗ Запросити в екіпаж</button>`
                    : `<button data-passenger-invite="${recruitment}" disabled aria-disabled="true" style="width:100%;padding:8px;border-radius:10px;background:rgba(148,163,184,0.10);color:#94a3b8;border:1px solid rgba(148,163,184,0.25);font-weight:700;font-size:12px;cursor:not-allowed;">Запросити в екіпаж</button>`
                      + `<div role="status" data-passenger-invite-reason="${recruitment}" style="font-size:11px;color:#fbbf24;margin-top:4px;">${escapeHtml(driverRecruitmentBlockReason(recruitment))}</div>`);
                const chatBtn = isDriverViewer
                    ? `<button data-passenger-chat="true" data-tg-user-id="${safePassengerId}" onclick="openTelegramContactFromButton(this)" style="flex:1;padding:8px;border-radius:10px;background:rgba(56,189,248,0.14);color:#38bdf8;border:1px solid rgba(56,189,248,0.3);font-weight:700;font-size:12px;cursor:pointer;">💬 Чат</button>`
                    : '';
                const openBtn = `<button onclick="openDirectionFromMap(${safeDirectionId})" style="flex:1;padding:8px;border-radius:10px;background:rgba(56,189,248,0.14);color:#38bdf8;border:1px solid rgba(56,189,248,0.3);font-weight:700;font-size:12px;cursor:pointer;">→ Подія</button>`;
                const actionRow = isDriverViewer ? chatBtn : openBtn;
                marker.bindPopup('<div style="text-align:center;min-width:180px;"><div style="font-weight:800;font-size:14px;margin-bottom:4px;">' + escapeHtml(name) + '</div><div style="font-size:11px;color:#94a3b8;margin-bottom:8px;">Чекає на водія' + (directionTitle ? ' · ' + directionTitle : '') + '</div>' + (inviteBtn ? '<div style="margin-bottom:8px;">' + inviteBtn + '</div>' : '') + '<div style="display:flex;gap:8px;">' + actionRow + '</div></div>', MAP_POPUP_PAN_OPTS);
                marker.on('add', () => bindMarkerPopupTap(marker));
                bindMarkerPopupTap(marker);
                S.mapMarkers.push(marker);
            });
        }

        function _pushMapCoord(coords, lat, lng) {
            const c = firstFiniteLatLng([lat, lng]);
            if (c) coords.push([c.lat, c.lng]);
        }

        function activeMapContextCoords(context = activeMapContextForMap()) {
            const dirId = String(context?.dirId || '');
            if (!dirId) return [];
            const coords = [];
            if (S.activeTrip && String(S.activeTrip.direction_id || '') === dirId) {
                const eventFilter = S.mapEventFilter || 'all';
                const car = crewCarPinCoordForTrip(S.activeTrip);
                if (car && eventFilter !== 'passengers') _pushMapCoord(coords, car.lat, car.lng);
                orderedCrewMembersForMap(S.activeTrip).forEach(m => {
                    const role = String(m?.role || '').toLowerCase();
                    if (role === 'driver' && car) return;
                    if (eventFilter === 'drivers' && role !== 'driver') return;
                    if (eventFilter === 'passengers' && role === 'driver') return;
                    const c = crewMemberVisibleMapCoord(m, S.activeTrip);
                    if (c) coords.push([c.lat, c.lng]);
                });
                // Запис 59: кінцева подія «Схеми збору» — частина огляду екіпажу й під час збору (лінза «усі»), навіть
                // коли лінія обірвана на невідомій точці.
                if (eventFilter === 'all' || eventFilter === 'event' || S.activeTrip.is_started) {
                    const destination = tripEventDestination(S.activeTrip);
                    if (destination?.lat != null && destination?.lng != null) _pushMapCoord(coords, destination.lat, destination.lng);
                }
                const seenTrip = new Set();
                return coords.filter(([lat, lng]) => {
                    const key = `${lat.toFixed(5)},${lng.toFixed(5)}`;
                    if (seenTrip.has(key)) return false;
                    seenTrip.add(key);
                    return true;
                });
            }
            (S.mapCrews || []).forEach(c => {
                if (String(c?.direction_id || '') === dirId) _pushMapCoord(coords, c.lat, c.lng);
            });
            (S.mapPassengers || []).forEach(p => {
                if (String(p?.direction_id || '') === dirId) _pushMapCoord(coords, p.lat, p.lng);
            });
            (S.news || []).forEach(n => {
                if (String(n?.direction_id || '') === dirId && isDiscoveryNewsItem(n)) _pushMapCoord(coords, n.lat, n.lng);
            });
            if (S.activeTrip && String(S.activeTrip.direction_id || '') === dirId) {
                _pushMapCoord(coords, S.activeTrip.pickup_lat, S.activeTrip.pickup_lng);
                orderedCrewMembersForMap(S.activeTrip).forEach(m => {
                    const c = crewMemberMapCoord(m, S.activeTrip);
                    if (c) coords.push([c.lat, c.lng]);
                });
                const destination = tripEventDestination(S.activeTrip);
                if (destination?.lat != null && destination?.lng != null) _pushMapCoord(coords, destination.lat, destination.lng);
            }
            if (S.pickupCoords && context?.kind === 'trip') {
                _pushMapCoord(coords, S.pickupCoords.lat, S.pickupCoords.lng);
            }
            const seen = new Set();
            return coords.filter(([lat, lng]) => {
                const key = `${lat.toFixed(5)},${lng.toFixed(5)}`;
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
            });
        }

        function googleMapsDestination(value) {
            if (!value) return '';
            if (value.lat != null && value.lng != null) {
                const lat = Number(value.lat);
                const lng = Number(value.lng);
                if (Number.isFinite(lat) && Number.isFinite(lng)) return `${lat.toFixed(6)},${lng.toFixed(6)}`;
            }
            return String(value.query || value.label || '').trim();
        }

        function tripEventDestination(trip = S.activeTrip) {
            if (!trip) return null;
            const point = firstFiniteLatLng(
                [trip.direction_lat, trip.direction_lng],
                [trip.event_lat, trip.event_lng],
                [trip.destination_lat, trip.destination_lng]
            );
            if (point) return { ...point, label: trip.direction_title || trip.destination || 'Подія' };
            const address = String(trip.direction_meeting_point || trip.destination || '').trim();
            return address ? { query: address, label: 'Подія' } : null;
        }

        function currentPassengerMemberForTrip(trip = S.activeTrip) {
            if (!trip || !Array.isArray(trip.members)) return null;
            return trip.members.find(m =>
                String(m?.user_id || '') === String(S.userId || '') &&
                String(m?.role || '').toLowerCase() !== 'driver'
            ) || null;
        }

        function mapGoogleNavigationTarget(trip = S.activeTrip) {
            if (!trip) return null;
            if (trip.is_started) return tripEventDestination(trip);

            const isDriver = String(trip.viewer_role || '').toLowerCase() === 'driver';
            if (isDriver) {
                // А6/А7: наступна — перша незавершена зупинка черги. Людину без точки не пропускаємо й не ведемо на
                // її живу геопозицію: дія стає «Уточнити точку в чаті».
                const next = nextPickupPassenger(trip);
                if (next) {
                    const coord = firstFiniteLatLng([next?.pickup_lat, next?.pickup_lng]);
                    if (coord) return { ...coord, label: `Забрати: ${passengerDisplayName(next)}` };
                    return { clarify: true, member: next, label: `Уточнити точку в чаті: ${passengerDisplayName(next)}` };
                }
                if (allPickupPassengersPickedUp(trip)) return tripEventDestination(trip);
            } else {
                const mine = currentPassengerMemberForTrip(trip);
                const coord = mine ? crewMemberMapCoord(mine, trip) : null;
                if (coord) return { ...coord, label: 'Ваша точка очікування' };
            }

            const pickup = firstFiniteLatLng([trip.pickup_lat, trip.pickup_lng]);
            if (pickup) return { ...pickup, label: 'Точка зустрічі' };
            const pickupAddress = String(trip.pickup || '').trim();
            return pickupAddress ? { query: pickupAddress, label: 'Точка зустрічі' } : null;
        }

        function googleNavigationUrl(target) {
            if (!target || target.clarify) return '';
            const destination = googleMapsDestination(target);
            if (!destination) return '';
            const params = new URLSearchParams({
                api: '1',
                destination,
                travelmode: 'driving',
                dir_action: 'navigate'
            });
            return `https://www.google.com/maps/dir/?${params.toString()}`;
        }

        function renderMapNavigationButton() {
            const btn = document.getElementById('map-nav-btn');
            if (!btn) return;
            const target = mapGoogleNavigationTarget();
            if (target?.clarify) {
                const clarifyTitle = target.label;
                btn.hidden = false;
                btn.title = clarifyTitle;
                btn.setAttribute('aria-label', clarifyTitle);
                return;
            }
            const url = googleNavigationUrl(target);
            if (!url) {
                btn.hidden = true;
                return;
            }
            const title = `Google навігація: ${target.label || 'маршрут'}`;
            btn.hidden = false;
            btn.title = title;
            btn.setAttribute('aria-label', title);
        }

        function openGoogleNavigationFromMap() {
            const target = mapGoogleNavigationTarget();
            if (target?.clarify) {
                openPickupPointClarifyChat(passengerRequestId(target.member), target.member?.user_id);
                return;
            }
            const url = googleNavigationUrl(target);
            if (!url) {
                renderMapNavigationButton();
                return;
            }
            const tg = window.Telegram?.WebApp;
            if (tg?.openLink) tg.openLink(url, { try_instant_view: false });
            else window.open(url, '_blank', 'noopener');
        }

        function renderMapFocusButton() {
            const btn = document.getElementById('map-focus-btn');
            renderMapNavigationButton();
            if (!btn) return;
            const context = activeMapContextForMap();
            if (!context) {
                btn.hidden = true;
                return;
            }
            const title = context.kind === 'trip' ? 'Сфокусувати поїздку' : 'Сфокусувати подію';
            btn.hidden = false;
            btn.title = title;
            btn.setAttribute('aria-label', title);
        }

        function focusActiveMapContext() {
            const context = activeMapContextForMap();
            if (!S.map || !context) return;
            const coords = activeMapContextCoords(context);
            if (!coords.length) {
                showToast('У цієї події ще немає точки на карті', '');
                return;

        async function toggleEventLike(btn, dirId) {
            const safeDirId = parseInt(dirId, 10) || 0;
            if (!safeDirId || !S.userId || !btn || btn.dataset.busy === '1') return;
            const next = btn.getAttribute('aria-pressed') !== 'true';
            btn.dataset.busy = '1';
            // Мутація «гучна» (I-FRONT-1): стан кнопки змінюємо лише після відповіді
            // сервера; помилку показує apiWithStatus.
            const resp = await apiWithStatus('/api/v3/events/like', {
                method: 'POST',
                body: JSON.stringify({ user_id: S.userId, direction_id: safeDirId, liked: next }),
            });
            delete btn.dataset.busy;
            if (!resp.ok || !resp.data) return;
            const count = safeCount(resp.data.likes_count);
            const liked = !!resp.data.viewer_liked;
            const key = String(safeDirId);
            S.eventLikes = { ...(S.eventLikes || {}), [key]: { likes_count: count, viewer_liked: liked } };
            const card = (S.news || []).find(n => String(n?.direction_id ?? n?.id) === key);
            if (card) { card.likes_count = count; card.viewer_liked = liked; }
            btn.setAttribute('aria-pressed', liked ? 'true' : 'false');
            btn.setAttribute('aria-label', eventLikeAriaLabel(count));
            if (liked && next) {
                // Коротке «підскакування» руки + легкий вібровідгук Telegram (лише на лайк).
                btn.classList.remove('is-popping');
                void btn.offsetWidth;
                btn.classList.add('is-popping');
                // Таймер, а не animationend: у фоновій вкладці анімація не йде і подія не настає.
                setTimeout(() => btn.classList.remove('is-popping'), 450);
                try { window.Telegram?.WebApp?.HapticFeedback?.impactOccurred?.('light'); } catch (_) { }
            }
            btn.lastElementChild.textContent = count ? String(count) : '';
        }

        // Піни подій стоять поруч, навіть з однаковою точкою (рішення власника
        // 2026-09-24): ближчі за 38 px (поріг offsetMapCoordIfNear) ставимо по колу
        // навколо спільного центру; при наближенні, коли місця розходяться самі,
        // зсув зникає. Справжня точка — у marker.options.wtTrueLatLng.
        function spreadOverlappingEventPins() {
            if (!S.map || !window.L) return;
            if (!S.map._wtEventSpreadBound) {
                S.map.on('zoomend', spreadOverlappingEventPins);
                S.map._wtEventSpreadBound = true;
            }
            const markers = (S.eventMarkers || []).filter(m => S.map.hasLayer(m));
            markers.forEach(m => { if (!m.options.wtTrueLatLng) m.options.wtTrueLatLng = m.getLatLng(); });
            const pts = markers.map(m => S.map.latLngToLayerPoint(m.options.wtTrueLatLng));
            const groupOf = markers.map(() => -1);
            const groups = [];
            markers.forEach((_, i) => {
                if (groupOf[i] !== -1) return;
                const members = [i];
                groupOf[i] = groups.length;
                for (let k = 0; k < members.length; k++) {
                    markers.forEach((__, j) => {
                        if (groupOf[j] === -1 && pts[members[k]].distanceTo(pts[j]) < 38) {
                            groupOf[j] = groups.length;
                            members.push(j);
                        }
                    });
                }
                groups.push(members);
            });
            groups.forEach(members => {
                if (members.length === 1) {
                    const m = markers[members[0]];
                    m.setLatLng(m.options.wtTrueLatLng);
                    return;
                }
                const cx = members.reduce((s, i) => s + pts[i].x, 0) / members.length;
                const cy = members.reduce((s, i) => s + pts[i].y, 0) / members.length;
                // Пін 34 px: сусіди на колі мають бути ≥ 42 px між центрами.
                const r = Math.max(21, 21 / Math.sin(Math.PI / members.length));
                members
                    .slice()
                    .sort((a, b) => (markers[a].options.wtDirId || 0) - (markers[b].options.wtDirId || 0))
                    .forEach((i, k) => {
                        const angle = Math.PI + (2 * Math.PI * k) / members.length;
                        markers[i].setLatLng(S.map.layerPointToLatLng(L.point(cx + r * Math.cos(angle), cy + r * Math.sin(angle))));
                    });
            });
        }

        }

            const onMap = S._incomingPickupMarker && (typeof S.map.hasLayer !== 'function' || S.map.hasLayer(S._incomingPickupMarker));

                clearIncomingPickupMarker();
                const label = escapeAttr(`Точка очікування: ${name} (запит)`);
                S._incomingPickupMarker = L.marker(info.pickup, {
                    title: label,
                    alt: label,
                    icon: L.divIcon({
                        className: '',
                        html: `<div class="pickup-point-pin" data-incoming-pickup-pin="true" role="img" aria-label="${label}" style="border:2px dashed #fbbf24;">👤</div>`,
                        iconSize: [34, 34],
                        iconAnchor: [17, 17]
                    }),
                    zIndexOffset: 170
                }).addTo(S.map);
                S._incomingPickupMarkerKey = key;
            }
            if (options.focus && S.currentScreen === 'explore') {
                fitMapCoordsAboveOverlays(info.car ? [info.car, info.pickup] : [info.pickup], 15);
            }
            return true;
        }

        function focusIncomingPickupOnMap() {
            const m = (S.pendingMatches || []).find(x => x && x.scope === 'incoming');
            if (m) showIncomingPickupOnMap(m, { focus: true });
        }

        // Пункт 6: поки після поїздки стан участі утримується, смужка й шторка кажуть
        // це прямо і не пропонують пошук через приховану панель.
        function subscriptionHeldSubBarLabel(title) {
            return `⏳ ${title} · оновлюємо стан участі`;
        }

        function openSubscriptionHeldSheet(ctx, options = {}) {
            openSheet(`
                ${renderMapInviteContextHeader(ctx)}
                <div class="sheet-title">Стан участі оновлюється</div>
                <div class="sheet-sub">Поїздки вже немає серед активних, а список ваших подій ще не оновився. Пошук не показуємо, доки дані не підтвердяться, — WayTandem перевіряє їх сам.</div>
                <div class="sheet-actions" data-map-command-count="2">
                    <button class="btn btn-secondary" onclick="openSubscribedDirectionDetails(${ctx.safeDirId})">Деталі події</button>
                    <button class="btn btn-ghost" onclick="closeSheet()">Закрити</button>
                </div>
            `, { maxHeight: options?.sheetMaxHeight || '65vh' });
        }

        function cachedDirectionDetails(dirId) {
            const key = String(dirId);
            const sources = [
                S.directionDetailsCache?.[key]?.direction,
                (S.mapCatalogEvents || []).find(d => String(d?.direction_id || d?.id) === key),
                allDirections.find(d => String(d?.id) === key),
                (S.subscriptions || []).find(s => String(s?.direction_id || s?.id) === key),
                (S.news || []).find(n => String(n?.direction_id || n?.id) === key),
                (S.mapCrews || []).find(c => String(c?.direction_id || c?.id) === key),
            ].filter(Boolean);
            const hit = {};
            sources.forEach(src => {
                Object.keys(src || {}).forEach(k => {
                    if (hit[k] === undefined || hit[k] === null || hit[k] === '') hit[k] = src[k];
                });
            });
            return hit;
        }

        function cachedDirectionTitle(dirId) {
            const hit = cachedDirectionDetails(dirId);
            return hit.title || hit.direction_title || hit.dir_title || hit.direction || hit.name || `#${dirId}`;
        }

        function openDirectionLoadingSheet(dirId) {
            const title = escapeHtml(cachedDirectionTitle(dirId));
            openSheet(`
                <div class="sheet-title">Відкриваю подію</div>
                <div class="sheet-sub">${title}</div>
                <div style="text-align:center;padding:18px 0 8px;">
                    <div class="pulse-dot" style="margin:0 auto 12px;"></div>
                    <div style="font-size:13px;color:var(--text-muted);">Завантажуємо організатора й екіпажі...</div>
                </div>
            `);
        }

        // ─── OPEN DIRECTION — full version ───
        async function openDirection(dirId) {
            const safeDirId = parseInt(dirId, 10) || 0;
            if (!safeDirId) return;
            rememberViewedDirection(safeDirId, cachedDirectionTitle(safeDirId));
            S._openDirectionSeq = (S._openDirectionSeq || 0) + 1;
            const seq = S._openDirectionSeq;
            openDirectionLoadingSheet(safeDirId);
            const data = await api(`/api/v3/fractal/organizers?direction_id=${safeDirId}&lang=${S.lang}&user_id=${S.userId || ''}`);
            if (seq !== S._openDirectionSeq) return;
            let dir = allDirections.find(d => String(d.id) === String(dirId));
            if (!dir && data?.direction && typeof data.direction === 'object') {
                dir = {
                    id: data.direction.id ?? dirId,
                    title: data.direction.title || data.direction.name || 'Подія',
                    drivers: Number(data.direction.drivers || data.direction.drivers_count || 0),
                    passengers: Number(data.direction.passengers || data.direction.passengers_count || 0),
                    is_folder: !!data.direction.is_folder,
                    has_kids: !!data.direction.has_kids,
                    kind: data.direction.kind || '',

            }
            if (!dir) { closeSheet(); showToast('Подія недоступна', 'error'); return; }
            if (isFolderNode(dir)) { closeSheet(); await boardOpenFolder(dirId); return; }
            rememberViewedDirection(safeDirId, dir.title || dir.name || cachedDirectionTitle(safeDirId));
            const orgs = data?.organizers || [];
            const isSub = data?.user_status?.subscribed;
            const creatorId = data?.direction?.creator_id || data?.direction?.user_id || dir?.creator_id || dir?.user_id;
            const isMyDir = creatorId && String(creatorId) === String(S.userId);
            const creatorName = data?.direction?.creator_name || dir?.creator_name || (isMyDir ? S.userName : '');
            const creatorUsername = sanitizeBotUsername(data?.direction?.creator_username || dir?.creator_username || (isMyDir ? S.userUsername : ''));
            const creatorDisplay = creatorName || (creatorId ? `#${creatorId}` : '');
            const creatorInitial = (creatorDisplay || 'О')[0].toUpperCase();
            const creatorAvatarBg = _avatarGradient(creatorDisplay || 'О');
            // Написати організатору (коментар для проходження тестів)
            const creatorContactBlock = creatorId ? `
                <div style="display:flex;align-items:center;gap:12px;margin:16px 0 20px;">
                    <div id="sheet-organizer-avatar" data-person-id="${parseInt(creatorId, 10) || 0}" data-initial="${escapeAttr(creatorInitial)}" style="width:40px;height:40px;border-radius:50%;background:${creatorAvatarBg};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff;flex-shrink:0;overflow:hidden;">${organizerAvatarInner(creatorId, creatorInitial)}</div>
                    <div style="flex:1;min-width:0;">
                        <div style="font-size:12px;color:var(--text-muted);line-height:1.2;">Організатор:</div>
                        <div style="font-size:14px;font-weight:700;color:var(--text-primary);margin-top:2px;">
                            ${escapeHtml(creatorDisplay || 'Організатор')}${creatorUsername ? ` <span style="font-weight:400;color:var(--blue);">(@${escapeHtml(creatorUsername)})</span>` : ''}
                        </div>
                    </div>
                    ${!isMyDir ? `<button class="btn btn-secondary" style="border:1px solid rgba(56,189,248,0.4);background:rgba(56,189,248,0.08);color:var(--blue);padding:6px 12px;border-radius:12px;font-size:12px;font-weight:600;min-height:36px;white-space:nowrap;line-height:1.3;text-align:center;cursor:pointer;" data-tg-username="${escapeAttr(creatorUsername)}" data-tg-user-id="${parseInt(creatorId, 10) || 0}" onclick="openTelegramContactFromButton(this)">💬 Написати<br>організатору</button>` : `<span class="tag tag-green">Ваша ідея</span>`}
                </div>` : '';
            const hasPickup = !!S.pickupCoords;
            // «Гармошка» (власник 2026-09-26): кроки розгортаються тут же, під кнопкою, а не в новій шторці.
            const joinInlineId = parseInt(dirId, 10) || 0;
            const joinPrimaryCta = `<button class="btn btn-primary" style="width:100%;" data-join-cta="${joinInlineId}" aria-expanded="false" aria-controls="join-inline-${joinInlineId}" onclick="toggleJoinInline(${dirId})">Хочу поїхати</button><div class="join-inline" id="join-inline-${joinInlineId}" data-join-inline="${joinInlineId}" hidden></div>`;
            const emptyCrewLine = 'Поки немає відкритих екіпажів. Можна їхати як водій або шукати місце.';

            const dirMeta = data?.direction || dir || {};
            const meetingPoint = dirMeta.meeting_point || dir.meeting_point || '';
            const chatLink = String(dirMeta.chat_link || dir.chat_link || '').trim();
            const desc = dirMeta.description || dir.description || '';
            const startAt = dirMeta.start_date || dir.start_date || '';
            const endAt = dirMeta.end_date || dir.end_date || '';

            const whenText = formatEventDateRange(startAt, endAt);
            const durationText = formatEventDuration(startAt, endAt);
            const daysText = durationText ? `📅 ${durationText}` : '';

            const eventSummary = (data?.event_summary && typeof data.event_summary === 'object') ? data.event_summary : {};
            const hasEventSummary = eventSummary.drivers_total != null;
            const summaryDrivers = safeCount(eventSummary.drivers_total);
            const summaryOpenSeats = safeCount(eventSummary.open_seats);
            const summaryWaiting = safeCount(eventSummary.passengers_without_seat ?? eventSummary.passengers_waiting);
            const summaryMatched = safeCount(eventSummary.passengers_matched);
            const summaryPending = safeCount(eventSummary.passengers_pending);
            // Live-аудит 2026-07-12 (блокер #2): картка події і карта мусять казати
            // одну правду. dir.drivers/passengers = лише unpaused interests — BUG-8
            // паузить водія із заповненим авто і посадженого попутника, тож картка
            // показувала «1 водій» при 4 екіпажах на карті. Коли є event_summary,
            // рахуємо з нього: drivers_total = interests ∪ web_open_crews ∪ активні
            // requests (ті самі критерії, що піни /map/crews).
            const drivers = hasEventSummary ? summaryDrivers : Number(dir.drivers || 0);
            const passengers = hasEventSummary
                ? (summaryMatched + summaryWaiting + summaryPending)
                : Number(dir.passengers || 0);
