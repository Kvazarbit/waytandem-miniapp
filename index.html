        function updateBottomNavForBoardDepth() {
            const nav = document.querySelector('.nav');
            const boardItem = document.querySelector('.nav-item[data-tab="board"]');
            if (!nav || !boardItem) return;
            const boardLabel = boardItem.querySelector('span');
            const boardIcon = boardItem.querySelector('svg');
            if (!boardNavDefaults) boardNavDefaults = { label: boardLabel?.textContent || 'Каталог', icon: boardIcon?.innerHTML || '' };
            const deepInBoard = S.currentScreen === 'board' && S.boardStack.length > 0;
            const navItems = Array.from(nav.querySelectorAll('.nav-item'));
            const addItem = document.getElementById('nav-board-add');
            nav.classList.toggle('board-deep', deepInBoard);
            navItems.forEach(item => { if (item === boardItem) return; item.style.display = deepInBoard ? 'none' : ''; });
            if (deepInBoard) {
                if (boardLabel) boardLabel.textContent = 'Назад';
                if (boardIcon) boardIcon.innerHTML = '<polyline points="15 18 9 12 15 6"></polyline><line x1="9" y1="12" x2="21" y2="12"></line>';
                boardItem.onclick = (e) => { e?.preventDefault?.(); boardGoUp(); };
                boardItem.classList.add('active');
                // Кнопка "Додати подію" праворуч від "Назад" — лише де додавання доречне.
                // Один організатор — одна власна подія (openCreateDirection блокує другу
                // з toast'ом і без дії), тому коли вона вже є, ця сама кнопка веде
                // одразу в редагування замість гарантованої відмови.
                if (addItem) {
                    const hasOwnEvent = Array.isArray(S.myDirections) && S.myDirections.length > 0;
                    addItem.style.display = S.canCreateEvent ? 'flex' : 'none';
                    if (S.canCreateEvent) {
                        const addLabel = addItem.querySelector('span');
                        const addIcon = addItem.querySelector('svg');
                        if (addLabel) addLabel.textContent = hasOwnEvent ? 'Редагувати подію' : 'Додати подію';
                        if (addIcon) addIcon.innerHTML = hasOwnEvent
                            ? '<path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>'
                            : '<line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>';
                        addItem.onclick = hasOwnEvent
                            ? () => openEditDirection(parseInt(S.myDirections[0]?.id, 10) || 0)
                            : () => openCreateDirection();
                    }
                }
                return;
            }
            if (boardLabel) boardLabel.textContent = boardNavDefaults.label || 'Каталог';
            if (boardIcon && boardNavDefaults.icon) boardIcon.innerHTML = boardNavDefaults.icon;
            boardItem.onclick = () => switchScreen('board');
            navItems.forEach(item => { if (item === addItem) return; item.style.display = ''; });
            if (addItem) addItem.style.display = 'none';
            navItems.forEach(item => {
                item.classList.toggle('active', item.dataset.tab === S.currentScreen);
                if (item.dataset.tab === S.currentScreen) item.setAttribute('aria-current', 'page'); else item.removeAttribute('aria-current');
            });
        }

        // ─── MAP ───
        // UX-fix: режим-бар і чипи категорій лежать ПОВЕРХ карти (z-index вище за
        // leaflet-панелі), тому попап, відкритий близько до верху, ховався під ними.
        // autoPan з верхнім відступом ~170px гарантує, що попап завжди видно повністю.
        // Праворуч на мапі плаває кнопка 📍 (#map-location-btn, ~44 px + 16 px поля),
        // тому картка не повинна підходити до правого краю ближче ніж на 64 px.
        // Відступи рахуються з фактичної розкладки, щоб картка разом із піном під нею
        // вміщалась у видиму мапу: зверху — під верхнім блоком (рубрики / «Режим:»),
        // знизу — місце для самого піна (~44 px) і відкритих нижніх панелей.
        function mapPopupTopInset() {
            const mapEl = document.getElementById('map');
            const stack = document.querySelector('.map-top-stack');
            if (!mapEl || !stack || stack.offsetParent === null) return 16;
            const inset = stack.getBoundingClientRect().bottom - mapEl.getBoundingClientRect().top;
            return Math.max(16, Math.ceil(inset + 8));
        }

        function mapPopupBottomInset() {
            const mapEl = document.getElementById('map');
            let overlay = 0;
            ['map-result-panel', 'map-trip-dock'].forEach(id => {
                const el = document.getElementById(id);
                if (!mapEl || !el || !el.classList.contains('open') || el.offsetParent === null) return;
                overlay = Math.max(overlay, mapEl.getBoundingClientRect().bottom - el.getBoundingClientRect().top);
            });
            return Math.ceil(Math.max(0, overlay) + 44);
        }

        const MAP_POPUP_PAN_OPTS = {
            autoPan: true,
            get autoPanPaddingTopLeft() { return [12, mapPopupTopInset()]; },
            get autoPanPaddingBottomRight() { return [64, mapPopupBottomInset()]; }
        };

        function bindMarkerPopupTap(marker) {
            if (!marker || typeof marker.getElement !== 'function') return;
            const el = marker.getElement();
            if (!el || el.dataset.mapPopupTapBound === '1') return;
            const open = (event) => {
                event?.preventDefault?.();
                event?.stopPropagation?.();
                try { marker.openPopup(); } catch (_) { }
            };
            el.dataset.mapPopupTapBound = '1';
            el.addEventListener('click', open);
            el.addEventListener('touchend', open, { passive: false });
        }

        // Базова мапа — стандартні плитки OpenStreetMap: без ключа, але з обовʼязковим
        // видимим підписом (operations.osmfoundation.org/policies/tiles). CARTO з 2026 року
        // вимагає ключ і без нього малює водяний знак «API KEY REQUIRED».
        const MAP_TILE_URL = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
        const MAP_TILE_ATTRIBUTION = '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>';

        function initMap() {
            S.map = L.map('map', { zoomControl: false, attributionControl: true }).setView([S.homeCity.lat, S.homeCity.lng], 11);
            S.map.attributionControl.setPrefix(false);
            L.tileLayer(MAP_TILE_URL, { maxZoom: 19, attribution: MAP_TILE_ATTRIBUTION }).addTo(S.map);
            // No browser GPS prompt on startup: user location is explicit via the map button.
            const controls = document.createElement('div');
            controls.className = 'map-fab-stack';
            const focusBtn = document.createElement('button');
            focusBtn.id = 'map-focus-btn';
            focusBtn.className = 'map-fab map-focus-btn';
            focusBtn.type = 'button';
            focusBtn.textContent = '🎯';
            focusBtn.hidden = true;
            focusBtn.setAttribute('aria-label', 'Сфокусувати активну подію');
            focusBtn.onclick = focusActiveMapContext;
            const navBtn = document.createElement('button');
            navBtn.id = 'map-nav-btn';
            navBtn.className = 'map-fab map-nav-btn';
            navBtn.type = 'button';
            navBtn.textContent = '🧭';
            navBtn.hidden = true;
            navBtn.setAttribute('aria-label', 'Відкрити навігацію в Google Maps');
            navBtn.title = 'Google навігація';
            navBtn.onclick = openGoogleNavigationFromMap;
            const locBtn = document.createElement('button');
            locBtn.id = 'map-location-btn';
            locBtn.className = 'map-fab';
            locBtn.type = 'button';
            locBtn.textContent = '📍';
            locBtn.setAttribute('aria-label', 'Показати мою локацію');
            locBtn.title = 'Показати мою локацію';
            locBtn.onclick = toggleMyLocation;
            controls.appendChild(focusBtn);
            controls.appendChild(navBtn);
            controls.appendChild(locBtn);
            document.getElementById('map-container').appendChild(controls);

        // ═══════ MY LOCATION TOGGLE (single permission, no repeated GPS prompts) ═══════
        // Замість getCurrentPosition на кожен клік (що щоразу перепитує дозвіл GPS),
        // використовуємо ОДИН watchPosition: браузер питає дозвіл один раз, далі стрімить
        // оновлення, поки кнопка ввімкнена. Повторний клік вимикає трекінг.
        let _myLocWatchId = null;
        let _myLocMarker = null;

        function _myLocationIcon() {
            return L.divIcon({
                className: '',
                html: '<div class="my-loc-dot"></div>',
                iconSize: [22, 22],
                iconAnchor: [11, 11]
            });
        }

        function stopMyLocationWatch() {
            if (_myLocWatchId !== null && navigator.geolocation) {
                navigator.geolocation.clearWatch(_myLocWatchId);
            }
            _myLocWatchId = null;
            if (_myLocMarker && S.map) { S.map.removeLayer(_myLocMarker); }
            _myLocMarker = null;
            const btn = document.getElementById('map-location-btn');
            if (btn) btn.classList.remove('location-active');
        }

        function toggleMyLocation() {
            const btn = document.getElementById('map-location-btn');
            if (!navigator.geolocation) { showToast('GPS недоступний', 'error'); return; }
            // Вже ввімкнено → вимикаємо
            if (_myLocWatchId !== null) { stopMyLocationWatch(); return; }
            // Вмикаємо: одразу підсвічуємо кнопку (зелений активний стан)
            if (btn) btn.classList.add('location-active');
            let firstFix = true;
            _myLocWatchId = navigator.geolocation.watchPosition(
                (p) => {
                    const lat = p.coords.latitude, lng = p.coords.longitude;
                    S._lastKnownPos = { lat, lng, at: Date.now(), acc: p.coords.accuracy };
                    const ll = [lat, lng];
                    if (!_myLocMarker) {
                        _myLocMarker = L.marker(ll, { icon: _myLocationIcon(), interactive: false, zIndexOffset: 1000 }).addTo(S.map);
                    } else {
                        _myLocMarker.setLatLng(ll);
                    }
                    if (firstFix) { S.map.flyTo(ll, 15, { duration: 1 }); firstFix = false; }
                },
                (err) => {
                    // Відмова в дозволі або помилка → повертаємо кнопку у вимкнений стан
                    stopMyLocationWatch();
                    const msg = (err && err.code === 1) ? 'Доступ до GPS відхилено' : 'Не вдалося отримати GPS';
                    showToast(msg, 'error');
                },
                { enableHighAccuracy: true, maximumAge: 10000, timeout: 15000 }
            );
        }

        async function refreshMap() {
            if (!S.apiBase) return;
            const crews = await api('/api/v3/map/crews');
            if (!crews) return;
            const focusedDirIdForPassengers = mapFocusedDirectionId();
            let passengers = [];
            let crewMembersById = new Map();
            if (focusedDirIdForPassengers && S.userId) {
                const params = new URLSearchParams({
                    direction_id: String(focusedDirIdForPassengers),
                    user_id: String(S.userId)
                });
                const passengerRes = await api(`/api/v3/map/passengers?${params.toString()}`);
                passengers = Array.isArray(passengerRes) ? passengerRes : [];
                const crewMembersRes = await api(`/api/v3/map/crew-members?${params.toString()}`);
                const crewMemberRows = Array.isArray(crewMembersRes?.crews) ? crewMembersRes.crews : [];
                crewMembersById = new Map(crewMemberRows.map(c => [String(c?.crew_id || ''), Array.isArray(c?.members) ? c.members : []]));
            }
            const enrichedCrews = (crews || []).map(c => ({
                ...c,
                members: crewMembersById.get(String(c?.crew_id || '')) || []
            }));
            await ensureMapCatalogEventsForMap();
            S.mapCrews = enrichedCrews;
            S.mapPassengers = passengers;
            S.lastMapSyncAt = Date.now();
            // Zombie-state guard (2026-06-10, I-FRONT-8 / I-170): «мій екіпаж»
            // перераховується З НУЛЯ зі свіжих серверних даних при кожному refreshMap.
            // Раніше S.myCrew лише ПРИЗНАЧАВСЯ (doOpenCrew, цикл пінів) і ніколи не
            // скидався: після відписки водія сервер закривав open crew (I-170),
            // пін зникав, а чип «🚗 Екіпаж #N» у sub-bar лишався вічно.
            // Важливо: шукаємо в enrichedCrews (повний список), а не у visibleCrews,
            // щоб event-фільтр карти не занулив живий екіпаж.
            const _prevMyCrewId = S.myCrew ? String(S.myCrew.crew_id || '') : '';
            const _mineCrew = S.userId ? enrichedCrews.find(c => String(c?.organizer_id || '') === String(S.userId)) : null;
            S.myCrew = _mineCrew ? {
                crew_id: _mineCrew.crew_id,
                crew_real_id: _mineCrew.crew_real_id,
                crew_event_number: _mineCrew.crew_event_number,
                crew_display_label: _mineCrew.crew_display_label,
                direction_id: _mineCrew.direction_id,
                seats_total: _mineCrew.seats_total,
                seats_free: safeCount(_mineCrew?.seats_free ?? _mineCrew?.free_seats ?? _mineCrew?.available_seats)
            } : null;
            if (_prevMyCrewId !== (S.myCrew ? String(S.myCrew.crew_id || '') : '')) renderSubBar();
            S.mapMarkers.forEach(m => S.map.removeLayer(m));
            S.mapMarkers = [];
            S.eventMarkers.forEach(m => S.map.removeLayer(m));
            S.eventMarkers = [];
            const visibleCrews = visibleMapCrewsForContext(enrichedCrews);
            visibleCrews.forEach(c => {
                if (!c.lat || !c.lng) return;
                // Highlight crews going to the same direction as active trip
                const focusedDirId = mapFocusedDirectionId();
                const isSameDirection = focusedDirId && c.direction_id && String(c.direction_id) === String(focusedDirId);
                const freeSeats = safeCount(c?.seats_free ?? c?.free_seats ?? c?.available_seats);
                const fullClass = (c?.seats_free !== undefined || c?.free_seats !== undefined || c?.available_seats !== undefined) && !freeSeats ? ' map-pin-full' : '';
                const focusedClass = isSameDirection ? ' map-pin-focused' : '';
                const isMine = S.userId && String(c?.organizer_id || '') === String(S.userId);
                const mineClass = isMine ? ' map-pin-mine' : '';
                const seatBadge = freeSeats > 0 ? `<span class="map-pin-badge map-pin-seat-badge" data-map-driver-seat-badge="free">${freeSeats}</span>` : '';
                const selfDot = isMine ? '<span class="map-pin-self-dot" aria-hidden="true"></span>' : '';
                const crewLabel = escapeAttr(`${isMine ? 'Ваш екіпаж' : 'Екіпаж'}: ${c.driver_name || c.organizer_name || c.direction_title || ''}`.trim());
                // S.myCrew більше не призначається тут: єдине джерело — повний
                // перерахунок вище (zombie-state guard), інакше дублікати логіки розходяться.
                const marker = L.marker([c.lat, c.lng], {
                    title: crewLabel,
                    alt: crewLabel,
                    icon: L.divIcon({
                        className: '',
                        html: `<div class="map-pin map-pin-crew${focusedClass}${mineClass}${fullClass}" role="button" aria-label="${crewLabel}">🚗${seatBadge}${selfDot}</div>`,
                        iconSize: [34, 34],
                        iconAnchor: [17, 17],
                        popupAnchor: [0, -25]
                    }),
                    zIndexOffset: isMine ? 180 : 120
                }).addTo(S.map);
                const canRequest = S.userId && String(S.userId) !== String(c.organizer_id) && S.userRole !== 'driver' && freeSeats > 0;
                const safeOrganizerId = Number.isFinite(Number(c.organizer_id)) ? Number(c.organizer_id) : 0;
                const safeDirectionId = Number.isFinite(Number(c.direction_id)) ? Number(c.direction_id) : 0;
                const popupName = isMine ? 'Ваше авто' : (c.driver_name || c.organizer_name || 'Екіпаж');
                const popupDirection = escapeHtml(c.direction_title || '');
                const crewRosterHtml = renderMapCrewRoster(c);
                const requestBtn = canRequest
                    ? `<button onclick="requestJoin(${safeOrganizerId}, ${safeDirectionId}, { source: 'map', keepMapContext: true })" style="flex:1;padding:8px;border-radius:10px;background:rgba(163,230,53,0.15);color:#a3e635;border:1px solid rgba(163,230,53,0.3);font-weight:700;font-size:12px;cursor:pointer;">✓ Запроситись</button>`
                    : '';
                const chatBtn = mapDriverPinChatButtonHtml(c);
                const openBtn = '<button onclick="openDirectionFromMap(' + safeDirectionId + ')" style="flex:1;padding:8px;border-radius:10px;background:rgba(56,189,248,0.14);color:#38bdf8;border:1px solid rgba(56,189,248,0.3);font-weight:700;font-size:12px;cursor:pointer;">→ Подія</button>';
                marker.bindPopup('<div style="text-align:center;min-width:230px;"><div style="font-weight:800;font-size:14px;margin-bottom:4px;">' + escapeHtml(popupName) + '</div><div style="font-size:11px;color:#94a3b8;margin-bottom:8px;">' + popupDirection + '</div>' + crewRosterHtml + '<div style="display:flex;flex-wrap:wrap;gap:8px;">' + chatBtn + requestBtn + openBtn + '</div></div>', MAP_POPUP_PAN_OPTS);
                S.mapMarkers.push(marker);
            });
            renderMapPassengersOnMap();
            // Re-draw pickup marker if exists
            if (S.pickupCoords && S._pickupMarker) { S._pickupMarker.addTo(S.map); }
            // Show live crew member markers during reservation pickup + Phase 2
            renderCrewMembersOnMap();
            renderEventPointsOnMap();
            maybeInitialDiscoveryFit();
            // Crew details live on the icon-only pin popup. Do not duplicate
            // the same drivers as bottom overlay cards; they cover the map.
            renderMapOverlay([]);
            renderMapFocusButton();
            renderNewsStrip();
            refreshOpenNearbyCrewsSheet();
            // Fresh map capacity must replace an already-visible auto-search
            // choice, but a late refresh may never overwrite a newer manual,
            // outgoing or handshake surface created by another async flow.
            refreshOpenMapAutoSearchPanelFromFreshMap();
            if (S.currentScreen === 'trips' && !S.activeTrip && !S.pendingMatches.length && (S.subscriptions || []).length) renderTrips();
        }

        // Перший огляд мапи без фільтра: новачок одразу бачить усі події, а не лише
        // околиці домашнього міста. Один раз за сесію і лише поза контекстом події чи
        // поїздки, щоб не перебивати ні фокус події, ні ручне переміщення мапи.
        function maybeInitialDiscoveryFit() {
            if (S._initialDiscoveryFitDone || S.currentScreen !== 'explore') return;
            if (mapContextScoped() || (S.mapNewsFilter || 'all') !== 'all') return;
            if (!mapEventPointsForDiscovery().length) return;
            S._initialDiscoveryFitDone = true;
            focusMapByFilter();
        }

        function refreshOpenMapAutoSearchPanelFromFreshMap() {
            const panel = document.getElementById('map-result-panel');
            const meta = panel && panel._mapResultMeta;
            if (!panel?.classList.contains('open') || meta?.kind !== 'auto_search') return false;
            const dirId = parseInt(meta?.dirId, 10) || 0;
            if (!dirId) return false;
            openMapAutoSearchPanel(dirId);
            return true;
        }

        function _eventMarkerEmoji(kind) {
            // Теократія — будинок зібрань без хреста: хрест суперечить Біблії (власник 2026-09-25).
            if (kind === 'theocracy') return '<svg class="pin-hall" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/><path d="M7 13h2v2H7zM15 13h2v2h-2z"/></svg>';
            if (kind === 'leisure') return '🏖️';
            if (kind === 'work') return '💼';
            return '🎯';
        }

        function _directionIdFromMapItem(item) {
            const id = Number(item?.direction_id ?? item?.id ?? 0);
            return Number.isFinite(id) && id > 0 ? id : 0;
        }

        function mapEventPointFromItem(item) {
            const dirId = _directionIdFromMapItem(item);
            const lat = Number(item?.lat);
            const lng = Number(item?.lng);
            if (!dirId || !Number.isFinite(lat) || !Number.isFinite(lng)) return null;
            const cached = cachedDirectionDetails(dirId);
            return {
                ...cached,
                ...item,
                direction_id: dirId,
                id: item?.id ?? cached?.id ?? dirId,
                lat,
                lng,
                title: item?.title || item?.direction_title || item?.dir_title || cached?.title || cached?.direction_title || cached?.dir_title || `Подія #${dirId}`,
            };
        }

        function mapEventPointsForDiscovery(filter = S.mapNewsFilter || 'all') {
            const points = [];
            const seen = new Set();
            const sources = [
                ...(Array.isArray(S.mapCatalogEvents) ? S.mapCatalogEvents : []),
                ...(Array.isArray(S.news) ? S.news.filter(isDiscoveryNewsItem) : []),
                ...(Array.isArray(allDirections) ? allDirections.filter(d => !isFolderNode(d)) : []),
            ];
            sources.forEach(item => {
                const point = mapEventPointFromItem(item);
                if (!point) return;
                const kind = classifyNewsItem(point);
                if (filter !== 'all' && kind !== filter) return;
                const key = String(point.direction_id);
                if (seen.has(key)) return;
                seen.add(key);
                points.push(point);
            });
            return points.slice(0, 80);
        }

        function mapEventPointsForCurrentMap() {
            const focusedDirId = mapFocusedDirectionId();
            if (focusedDirId) {
                const eventFilter = S.mapEventFilter || 'all';
                // А5: коли на карті «Схема збору», пін події в її кінці лишається за будь-якої лінзи.
                const tripScheme = !!S.activeTrip && String(S.activeTrip.direction_id || '') === String(focusedDirId)
                    && shouldRenderCrewMembersOnMap(S.activeTrip);
                if (eventFilter !== 'all' && eventFilter !== 'event' && !tripScheme) return [];
                const point = eventPointForMapContext({ dirId: focusedDirId });
                return point ? [point] : [];
            }
            return mapEventPointsForDiscovery();
        }

        function renderEventPointsOnMap() {
            if (!S.map) return;
            mapEventPointsForCurrentMap().forEach(point => {
                const dId = Number(point?.direction_id || point?.id || 0);
                if (!dId || !Number.isFinite(Number(point.lat)) || !Number.isFinite(Number(point.lng))) return;
                const kind = classifyNewsItem(point);
                const title = point.title || point.direction_title || point.dir_title || `Подія #${dId}`;
                const markerLabel = escapeAttr(`Подія: ${title}`);
                const icon = L.divIcon({
                    className: '',
                    html: `<div class="map-pin map-pin-event map-pin-${escapeAttr(kind)}" role="button" aria-label="${markerLabel}">${_eventMarkerEmoji(kind)}</div>`,
                    iconSize: [34, 34],
                    iconAnchor: [17, 17],
                    popupAnchor: [0, -25]
                });
                const marker = L.marker([Number(point.lat), Number(point.lng)], {
                    icon,
                    title: markerLabel,
                    alt: markerLabel,
                    riseOnHover: true,
                    zIndexOffset: 120
                }).addTo(S.map);
                if (isOwnDirectionOnMap(dId)) {
                    // Власний контекст: тап = дія → одразу головна шторка (канон iter 2).
                    marker.on('click', () => openDirectionInviteFromMap(dId));
                } else {
                    // Discovery (iter 3): попап-прев'ю; «Детальніше» → та сама шторка.
                    marker.bindPopup(() => buildMapEventPreviewHtml(point, dId), { closeButton: true, maxWidth: 240, className: 'map-preview-popup', ...MAP_POPUP_PAN_OPTS });
                }
                marker.options.wtDirId = dId;
                S.eventMarkers.push(marker);
            });
            spreadOverlappingEventPins();
        }

        // ─── Discovery preview (iter 3, 2026-06-10) ────────────────────────────
        // Чужий event-пін у браузингу → легкий попап (без накриття карти шторкою);
        // «Детальніше» → канонічна головна шторка (iter 2). Пін ВЛАСНОГО контексту
        // відкриває шторку одразу — там тап означає дію, не цікавість.
        function isOwnDirectionOnMap(dirId) {
            // Toggle-незалежна перевірка «це мій контекст?»: навмисно RAW
            // activeMapContextForMap (виняток задокументовано в chokepoint-guard).
            const own = activeMapContextForMap();
            return !!(own && String(own.dirId || '') === String(dirId || ''));
        }

        function formatMapPreviewWhen(point) {
            const startAt = String(point?.start_date || point?.start_at || point?.starts_at || '').trim();
            const endAt = String(point?.end_date || point?.end_at || point?.ends_at || '').trim();
            const explicit = String(point?.date || point?.event_date || point?.nearest_trip_date || point?.departure || '').trim();
            const startRaw = startAt || explicit;
            const endRaw = endAt;
            if (!startRaw && !endRaw) return '';
            return formatEventDateRange(startRaw, endRaw);
        }

        function buildMapEventPreviewHtml(point, dId) {
            const kind = classifyNewsItem(point);
            const title = point.title || point.direction_title || point.dir_title || `Подія #${dId}`;
            // Лайк події (рішення власника 2026-09-24): 👍 як у YouTube, лише позитивний
            // сигнал. Кнопка є завжди (інакше ніхто не поставить перший лайк), число —
            // лише коли > 0. Поточний пошук і учасники — у повній картці («Детальніше»).
            const like = eventLikeState(point, dId);
            const likeBtn = `<button type="button" class="map-preview-like" aria-pressed="${like.liked ? 'true' : 'false'}" aria-label="${escapeAttr(eventLikeAriaLabel(like.count))}" onclick="toggleEventLike(this, ${Number(dId) || 0})">${eventLikeIconSvg()}<span class="map-preview-like-n">${like.count || ''}</span></button>`;
            const rows = [];
            const when = formatMapPreviewWhen(point);
            const desc = String(point?.description || '').trim();
            rows.push(`<div class="map-preview-row"><span>${when ? `📅 ${escapeHtml(String(when))}` : ''}</span>${likeBtn}</div>`);
            if (desc) rows.push(`<div class="map-preview-row map-preview-desc">${escapeHtml(desc.slice(0, 120))}${desc.length > 120 ? '…' : ''}</div>`);
            return `<div class="map-preview-card">
                <div class="map-preview-hd k-${escapeAttr(kind)}">
                    <div class="map-preview-ico">${itemIcon(point, kind, false)}</div>
                    <div class="map-preview-ttl">${escapeHtml(title)}</div>
                </div>
                <div class="map-preview-bd">
                    ${rows.join('')}
                    <button type="button" class="map-preview-btn" onclick="openDirectionFromMapPreview(${Number(dId) || 0})">Детальніше</button>
                </div>
            </div>`;
        }

        async function openDirectionFromMapPreview(dirId) {
            if (S.map) S.map.closePopup();
            await openDirectionInviteFromMap(dirId);
        }

        async function openDirectionInviteFromMap(dirId) {
            // UX 2026-06-10 (iter 2, за пропозицією користувача): пін події одразу
            // відкриває ГОЛОВНУ шторку напрямку (openDirection) — вона є надмножиною
            // «Запрошення до події»: організатор+контакт, дати/місце/опис, CTA,
            // список водіїв з «Запроситись». Раніше було 3 шари одного контексту
            // (компактна → запрошення → учасники), тепер один.
            // «Запрошення до події» лишається ТІЛЬКИ для deep-link інвайтів
            // (openStartDirectionIfNeeded) — там доречний фрейм «вас запросили».
            await openDirection(dirId);
        }

        async function openDirectionFromMap(dirId) { switchScreen('board'); openDirection(dirId); }

        function renderMapOverlay(crews) {
            const c = document.getElementById('map-overlay-cards');
            if (!c) return;
            if (!crews.length) { c.innerHTML = ''; c.style.display = 'none'; return; }
            c.style.display = 'block';
            c.innerHTML = crews.map(cr => {
                const orgId = parseInt(cr.organizer_id) || 0;
                const dirId = parseInt(cr.direction_id) || 0;
                return `
                <div class="crew-mini-card" onclick="${S.userRole !== 'driver' ? `requestJoin(${orgId}, ${dirId})` : ''}">
                    ${renderAvatarInline(cr.driver_name || cr.organizer_name || '?', cr.driver_photo_url || cr.organizer_photo_url || '', 40, 'crew-mini-avatar')}
                    <div class="crew-mini-info">
                        <div class="crew-mini-name">${escapeAttr(cr.driver_name || cr.organizer_name || 'Екіпаж')}</div>
                        <div class="crew-mini-dir">${escapeAttr(cr.direction_title || '')}</div>
                    </div>
                    <div class="crew-mini-seats">${parseInt(cr.passengers) || 0} пас.</div>
                </div>`;
            }).join('');
        }

        // ═══ ERROR MESSAGES — parse API error reasons for user-friendly display ═══
        const ERROR_MESSAGES = {
            'already_in_trip': 'Ви вже в екіпажі — спочатку завершіть поточну поїздку',
            'capacity_full': 'Водій вже заповнив усі місця',
            'user_not_found': 'Користувача не знайдено',
            'direction_closed': 'Подія зараз недоступна',
            'reserved_by_in': 'Місце вже зарезервоване для іншого',
            'self_action_forbidden': 'Неможливо запросити самого себе',
            'rate_limited': 'Забагато спроб — зачекайте кілька секунд і повторіть',
            'expired': 'Термін запиту минув — надішліть новий',
            'handshake_not_found': 'Запит не знайдено',
            'user_blocked': 'Користувач заблокував взаємодію',
            'not_subscribed': 'Спочатку підпишіться на цю подію',
            'already_subscribed': 'Ви вже в черзі на цю подію',
            'direction_expired': 'Подія вже завершилась — оберіть актуальну в каталозі',
            'active_trip_other_direction': 'У вас уже є активна домовленість в іншій події',
            'driver_cannot_invite_driver': 'Водій може запросити лише попутника',
            'passenger_cannot_invite_passenger': 'Попутник може запроситися лише до водія',
            'driver_full': 'У цьому екіпажі вже немає вільних місць',
            'driver_busy': 'У цьому екіпажі вже немає вільних місць',
            'passenger_busy': 'Ця людина вже очікує на іншу домовленість',
            'not_found': 'Цей учасник уже недоступний у цій події — оновіть список',
            'already_invited': 'Запрошення цій людині вже надіслано',
            // Живий прохід 2026-08-11: сервер віддає ці три причини (server_v3
            // _invite_match_core, skip_cycles_remaining), а словника не було — користувач
            // бачив у тості сирий машинний код «recently_declined_by_you».
            'recently_declined_by_you': 'Ви нещодавно відхилили цю людину — пропозиція повернеться згодом. Поки оберіть іншого',
            'recently_declined_by_passenger': 'Попутник нещодавно відхилив цю пропозицію — спробуйте іншого або зачекайте',
            'recently_declined_by_driver': 'Водій нещодавно відхилив цю пропозицію — спробуйте іншого або зачекайте',
        };

        function getErrorMessage(res, fallback = 'Помилка') {
            if (!res) return 'Немає відповіді від серверу — перевірте з\'єднання';
            const detail = res.detail;
            const statusReason = typeof res.status === 'string'
                && !['ok', 'error', 'unavailable'].includes(res.status)
                ? res.status
                : '';
            const reason = res.reason
                || (detail && typeof detail === 'object' ? detail.reason : detail)
                || statusReason
                || '';
            return ERROR_MESSAGES[reason] || (reason ? `${fallback}: ${reason}` : fallback);
        }

        function openActiveTripOtherDirectionConflict(res = {}) {
            const message = ERROR_MESSAGES.active_trip_other_direction;
            openSheet(`
                <div class="sheet-title">Спочатку завершіть поточну поїздку</div>
                <div class="sheet-sub">${escapeHtml(message)}</div>
                <div style="font-size:13px;line-height:1.5;color:var(--text-secondary);margin:12px 0;">
                    Новий екіпаж не створено і вашу участь не змінено. Відкрийте «Поїздки»,
                    щоб завершити або скасувати поточну домовленість явною дією.
                </div>
                <div class="sheet-actions">
                    <button type="button" class="btn btn-ghost" onclick="closeSheet()">Залишитись тут</button>
                    <button type="button" class="btn btn-primary" onclick="closeSheet(); switchScreen('trips')">Відкрити Поїздки</button>
                </div>
            `);
        }

        function guardPassengerRequestWhileInTrip(opts = {}) {
            if (!S.activeTrip) return false;
            showToast(ERROR_MESSAGES.already_in_trip, 'error');
            if (opts?.openTrips !== false) {
                if (S.currentScreen === 'explore') openMapActiveTripFromSubBar();
                else switchScreen('trips');
            }
            return true;
        }

        function getOutgoingForDirection(dirId) {
            return (S.pendingMatches || []).find(m => {
                if (m.scope !== 'outgoing') return false;
                return String(m.direction_id) === String(dirId);
            });
        }

        function isManualSearchSubscriptionDirection(dirId) {
            const safeDirId = String(dirId || '');
            if (!safeDirId) return false;
            return (S.subscriptions || []).some(s =>
                String(s.direction_id || s.id || '') === safeDirId &&
                s.auto_match === false
            );
        }

        function suppressManualSearchProposedMatch() {
            if (!S.proposedMatch) return;
            if (!isManualSearchSubscriptionDirection(S.proposedMatch.direction_id)) return;
            // Manual map search means the user owns candidate choice through role-filtered pins.
            // Auto proposals must not cover the passenger/driver pin lane.
            S.proposedMatch = null;
            closeHandshakeActionPanel();
        }

        function outgoingQueueForDirection(dirId) {
            return (S.pendingMatches || [])
                .filter(m => m && m.scope === 'outgoing' && String(m.direction_id) === String(dirId));
        }

        function currentOutgoingForDirection(dirId) {
            return outgoingQueueForDirection(dirId)[0] || null;
        }

        async function confirmOutgoingSwitchIfNeeded(orgId, dirId) {
            const current = currentOutgoingForDirection(dirId);
            if (!current) return true;
            const currentTarget = current.target_id || current.partner_id;
            if (String(currentTarget) === String(orgId)) return true;

            const currentName = current.target_name || current.partner_name || `#${currentTarget}`;
            return await new Promise(resolve => {
                // DM-2026-06-14-011: попередній статус-банер (📤 очікуємо відповіді)
                // «припарковуємо» у верхній частині цієї шторки замість того, щоб
                // він конкурував за нижній простір карти на час підтвердження.
                openSheet(`
                    <div class="sheet-title">Перемкнути запит?</div>
                    <div class="sheet-sub">Ви вже запросились до "${escapeHtml(String(currentName))}".<br>Перейти до іншого екіпажу?<br><br>Попередній запит буде скасовано.</div>
                    <div class="sheet-actions">
                        <button class="btn btn-primary" id="confirm-request-switch-yes">✓ Так, перемкнути</button>
                        <button class="btn btn-ghost" id="confirm-request-switch-no">Скасувати</button>
                    </div>
                `, { pinnedStrip: `<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">📤 Очікуємо відповіді: ${escapeHtml(String(currentName))}</span>` });
                document.getElementById('confirm-request-switch-yes').onclick = () => { closeSheet(); resolve(true); };
                document.getElementById('confirm-request-switch-no').onclick = () => { closeSheet(); resolve(false); };
            });
        }

        function getMatchPartnerId(m) {
            const raw = m?.scope === 'incoming'
                ? (m.partner_id ?? m.sender_id ?? m.user_id ?? m.target_id)
                : (m.target_id ?? m.partner_id ?? m.sender_id ?? m.user_id);
            const id = parseInt(raw, 10);
            return Number.isFinite(id) ? id : 0;
        }

        function removePendingMatchByPair(partnerId, dirId) {
            const safePartnerId = parseInt(partnerId, 10) || 0;
            const safeDirId = parseInt(dirId, 10) || 0;
            if (!safePartnerId || !safeDirId) return;
            S.pendingMatches = (S.pendingMatches || []).filter(m => {
                const matchPartnerId = getMatchPartnerId(m);
                const matchDirId = parseInt(m?.direction_id, 10) || 0;
                return !(matchPartnerId === safePartnerId && matchDirId === safeDirId);
            });
        }

        function matchKey(m) {
            const ts = Number(m?.created_at || 0);
            const stamp = Number.isFinite(ts) ? Math.round(ts * 1000) : 0;
            return `${m?.scope || 'incoming'}:${getMatchPartnerId(m)}:${parseInt(m?.direction_id, 10) || 0}:${stamp}`;
        }

        function isSheetOpen() {
            return document.getElementById('sheet')?.classList.contains('open');
        }

        function isRatingSheetOpen() {
            const body = document.getElementById('sheet-body');
            return !!(body && body.querySelector('[data-rating-row] .star-btn'));
        }

        function closeBlockingSheetForScreen(name) {
            if (name !== 'trips') return;
            if (closePassiveDirectionInviteSheetForActionSurface('screen:trips')) return;
            if (!S.activeTrip || !isSheetOpen()) return;
            if (S.roleGateOpen || S.matchSheetOpen || isRatingSheetOpen()) return;
            closeSheet();
        }

        function closePassiveDirectionInviteSheetForActionSurface(source = '') {
            if (!S.directionInviteSheetOpen || !isSheetOpen()) return false;
            if (S.roleGateOpen || S.matchSheetOpen || isRatingSheetOpen()) return false;
            const hasActionSurface = !!S.activeTrip
                || waitingForPartner
                || !!S.proposedMatch
                || (S.pendingMatches || []).length > 0;
            if (!hasActionSurface) return false;
            closeSheet();
            return true;
        }

        function maybeOpenMatchSheet() {
            verifyHandshakePanelState();
            if (document.getElementById('handshake-panel')?.classList.contains('open')) return;
            if (S.matchSheetOpen || S.activeTrip || S.roleGateOpen || isAppInBackground) return;
            const match = (S.pendingMatches || []).find(m => m?.scope === 'incoming' && !S.seenMatchIds.has(matchKey(m)));
            if (!match) return;
            if (isSheetOpen() || S.currentScreen !== 'trips') {
                notifyPendingMatch(match);
                return;
            }
            openMatchSheet(match);
        }

        function notifyPendingMatch(match) {
            const key = matchKey(match);
            if (!S.notifiedMatchIds.has(key)) {
                S.notifiedMatchIds.add(key);
                notifyCriticalEvent('match_received', key);
                showToast('📩 Новий запит. Відкрийте Поїздки', '');
            }
            updateBadges();
            renderSubBar();
        }

        function openMatchSheet(match) {
            const partnerId = getMatchPartnerId(match);
            const dirId = parseInt(match?.direction_id, 10) || 0;
            if (!partnerId || !dirId) return;
            const key = matchKey(match);
            S.seenMatchIds.add(key);
            notifyCriticalEvent('match_received', key);
            S.matchSheetOpen = true;
            S.activeMatchKey = key;

            const isDriver = _isDriverRole(S.userRole);
            const partnerName = match.partner_name || match.sender_name || match.target_name || `#${partnerId}`;
            const direction = match.direction || match.direction_title || 'Подія';
            const title = isDriver ? 'Хтось хоче до екіпажу' : 'Водій знайдений';
            const subtitle = isDriver
                ? `${escapeHtml(partnerName)} хоче приєднатися до вашого екіпажу.`
                : `${escapeHtml(partnerName)} запрошує вас у поїздку.`;
            const acceptText = isDriver ? '✅ Взяти в екіпаж' : '✅ Прийняти запрошення';
            const declineText = isDriver ? '❌ Пропустити' : '❌ Цей варіант не підходить';

            openSheet(`
                <div class="sheet-title">${title}</div>
                <div class="sheet-sub">${subtitle}</div>
                <div class="sheet-context">🎯 ${escapeHtml(direction)}</div>
                <div style="display:flex;align-items:center;gap:12px;margin:16px 0;padding:12px;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,0.04);">
                    ${renderAvatarInline(partnerName, match.partner_photo_url || match.sender_photo_url || match.target_photo_url || '', 44)}
                    <div style="flex:1;min-width:0;">
                        <div style="font-weight:800;font-size:15px;">${escapeHtml(partnerName)}</div>
                    </div>
                </div>
                <div class="sheet-actions">
                    <button class="btn btn-primary" onclick="respondFromMatchSheet(${partnerId}, ${dirId}, true)">${acceptText}</button>
                    <button class="btn btn-danger" onclick="respondFromMatchSheet(${partnerId}, ${dirId}, false)">${declineText}</button>
                    <button class="btn btn-secondary" onclick="confirmStopSearchFromHandshake(${partnerId}, ${dirId})">🚪 Вийти з події</button>
                </div>
            `);
        }

        async function respondFromMatchSheet(partnerId, dirId, accept) {
            const ok = await respondHandshake(partnerId, dirId, accept);
            if (ok) closeSheet();
        }

        function confirmStopSearchFromHandshake(partnerId, dirId) {
            const safePartnerId = parseInt(partnerId, 10) || 0;
            const safeDirId = parseInt(dirId, 10) || 0;
            if (!safePartnerId || !safeDirId) {
                showToast('Запит не знайдено', 'error');
                return false;
            }
            const pending = (S.pendingMatches || []).find(m => {
                const candidateId = m?.scope === 'incoming'
                    ? (m?.partner_id || m?.sender_id)
                    : (m?.target_id || m?.partner_id);
                return String(candidateId || '') === String(safePartnerId)
                    && String(m?.direction_id || '') === String(safeDirId);
            }) || {};
            const direction = pending.direction || pending.direction_title || 'цю подію';
            const partnerName = pending.scope === 'incoming'
                ? (pending.partner_name || pending.sender_name || 'партнером')
                : (pending.target_name || pending.partner_name || 'партнером');
            openSheet(`
                <div class="sheet-title">Вийти з події?</div>
                <div class="sheet-sub">${escapeHtml(direction)}</div>
                <div style="font-size:13px;line-height:1.5;color:var(--text-secondary);margin:12px 0;">
                    Буде скасовано цей запит із ${escapeHtml(partnerName)}, видалено вашу підписку на подію
                    і прибрано вашу точку очікування або старт авто з карти.
                </div>
                <div style="font-size:12px;line-height:1.45;color:var(--amber);margin-bottom:14px;">
                    Якщо хочете лише відхилити або скасувати поточний запит, поверніться й оберіть цю окрему дію.
                </div>
                <div class="sheet-actions">
                    <button type="button" class="btn btn-ghost" onclick="closeSheet()">Ні, залишитись</button>
                    <button type="button" class="btn btn-danger" id="confirm-stop-search-yes" onclick="executeConfirmedEventExitFromHandshake(${safePartnerId}, ${safeDirId})">Так, вийти з події</button>
                </div>
            `);
            return true;
        }

        async function executeConfirmedEventExitFromHandshake(partnerId, dirId) {
            const confirmButton = document.getElementById('confirm-stop-search-yes');
            if (confirmButton) confirmButton.disabled = true;
            const ok = await stopSearchFromHandshake(partnerId, dirId);
            if (ok) {
                closeSheet();
                return true;
            }
            if (confirmButton) confirmButton.disabled = false;
            return false;
        }

        // Компактна "процес"-картка (DM-2026-06-13-005): той самий вигляд, що й
        // outgoing-картка в "Поїздки" (renderTrips, scope==='outgoing') — аватар
        // партнера, напрямок, тег «📤 Очікування» і ті самі дії
        // («🛑 Скасувати запит» / «🚪 Вийти з події»). Показуємо її замість статичного
        // «Запит надіслано», щоб одразу було видно: вибір зроблено, хендшейк іде.
        function renderMapOutgoingProcessCard(safeDirId, opts = {}) {
            const queue = outgoingQueueForDirection(safeDirId);
            const m = queue[0] || {};
            const total = queue.length;
            const partnerId = m.target_id || m.partner_id || opts.partnerId || 0;
            const partnerName = m.target_name || m.partner_name || opts.partnerName || (partnerId ? `#${partnerId}` : 'Партнер');
            const partnerPhoto = m.target_photo_url || m.partner_photo_url || '';
            const directionLabel = m.direction || m.direction_title || opts.directionLabel || 'Подія';
            const queueHint = total > 1
                ? `<div style="font-size:11px;color:var(--text-muted);margin:0 0 10px;line-height:1.35;">На карті показано один запит. Ще ${total - 1} ${pluralUk(total - 1, 'запит', 'запити', 'запитів')} — у списку поверх карти.</div>`
                : `<div style="font-size:11px;color:var(--text-muted);margin:0 0 10px;line-height:1.35;">На карті показано поточний запит. Усі запити можна відкрити тут, не покидаючи карту.</div>`;
            return `
                <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
                    ${renderAvatarInline(partnerName, partnerPhoto, 40)}
                    <div style="flex:1;"><div style="font-weight:800;font-size:14px;">${escapeHtml(partnerName)}</div><div style="font-size:11px;color:var(--text-secondary);">${escapeHtml(directionLabel)}</div></div>
                    <div class="tag tag-blue">📤 Очікування</div>
                </div>
                ${queueHint}
                <div style="display:flex;gap:10px;">
                    <button class="btn btn-secondary" style="flex:1;" onclick="closeMapResultPanel(); respondHandshake(${partnerId}, ${safeDirId}, false, 'cancel')">🛑 Скасувати цей</button>
                    <button class="btn btn-primary" style="flex:1;" onclick="openMapPendingMatchesSheet('outgoing')">Усі запити</button>
                </div>
            `;
        }

        function openMapRequestJoinResultSheet(dirId, res = {}, orgId = 0) {
            const ctx = mapInviteContext(dirId);
            const safeDirId = ctx.safeDirId || (parseInt(dirId) || 0);
            // Ядро може створити екіпаж миттєво (взаємний інтерес) — не брешемо «чекаємо
            // підтвердження», якщо hydrate вже приніс активну поїздку по цій події.
            const tripMatched = !!(S.activeTrip && String(S.activeTrip.direction_id || '') === String(safeDirId));
            const mutual = !!res?.mutual || tripMatched;
            if (!mutual) {
                // Вибір вже зроблено — показуємо лаконічну "процес"-картку (як у "Поїздки"),
                // а не окрему шторку з тупим "Запит надіслано". partnerId/directionLabel —
                // фолбек на orgId/ctx.title, якщо hydrate ще не встиг наповнити
                // S.pendingMatches (getOutgoingForDirection порожній).
                openMapResultPanel(`
                    ${ctx.safeDirId ? renderMapInviteContextHeader(ctx) : ''}
                    ${renderMapOutgoingProcessCard(safeDirId, { partnerId: orgId, directionLabel: ctx.title })}
                `, { kind: 'outgoing', dirId: safeDirId });
                return;
            }
            openMapResultPanel(`
                ${ctx.safeDirId ? renderMapInviteContextHeader(ctx) : ''}
                <div class="sheet-title">🎉 Екіпаж готовий!</div>
                <div class="sheet-sub">${escapeHtml('Водій уже відкрив місця — резервацію створено. Екіпаж можна відкрити прямо на карті.')}</div>
                <div class="sheet-actions" data-map-command-count="3">
                    <button class="btn btn-primary" onclick="closeMapResultPanel(); openMapTripCrewSheet()">Екіпаж</button>
                    <button class="btn btn-secondary" onclick="closeMapResultPanel()">Зрозуміло</button>
                    <button class="btn btn-ghost" onclick="closeMapResultPanel(); openSubscribedDirectionDetails(${safeDirId})">Деталі</button>
                </div>
            `);
        }

        function openMapSignalResultSheet(dirId, passengerId, res = {}) {
            const ctx = mapInviteContext(dirId);
            const safeDirId = ctx.safeDirId || (parseInt(dirId) || 0);
            const safePassengerId = parseInt(passengerId, 10) || 0;
            const mutual = !!res?.mutual;
            if (!mutual) {
                // Те саме лаконічне "процес"-стейт, що й для пасажирського запиту:
                // вибір зроблено, чекаємо підтвердження попутника.
                openMapResultPanel(`
                    ${ctx.safeDirId ? renderMapInviteContextHeader(ctx) : ''}
                    ${renderMapOutgoingProcessCard(safeDirId, { partnerId: safePassengerId, directionLabel: ctx.title })}
                `, { kind: 'outgoing', dirId: safeDirId });
                return;
            }
            openMapResultPanel(`
                ${ctx.safeDirId ? renderMapInviteContextHeader(ctx) : ''}
                <div class="sheet-title">Екіпаж готовий</div>
                <div class="sheet-sub">${escapeHtml('Попутник підтвердився. Відкрийте екіпаж поверх карти, щоб узгодити посадку.')}</div>
                <div class="sheet-actions" data-map-command-count="3">
                    <button class="btn btn-primary" onclick="closeMapResultPanel(); openMapTripCrewSheet()">Екіпаж</button>
                    <button class="btn btn-secondary" onclick="closeMapResultPanel()">Зрозуміло</button>
                    <button class="btn btn-ghost" onclick="closeMapResultPanel(); openSubscribedDirectionDetails(${safeDirId})">Деталі</button>
                </div>
            `);
        }

        async function requestJoin(orgId, dirId, opts = {}) {
            if (!requireRoleForAction('запроситись до екіпажу', () => requestJoin(orgId, dirId, opts))) return;
            if (_isDriverRole(S.userRole)) { showToast('Запроситись може тільки попутник', 'error'); return; }
            if (guardPassengerRequestWhileInTrip()) return false;
            const confirmed = await confirmOutgoingSwitchIfNeeded(orgId, dirId);
            if (!confirmed) return;
            if (!S.pickupCoords?.lat || !S.pickupCoords?.lng) {
                const picked = await pickPickupLocation(dirId, { kind: 'passenger_wait', persistUserLocation: true });
                if (!picked) { showToast('Вкажіть, де чекати водія', 'error'); return false; }
            } else {
                await persistPickupPointForCoordination();
            }
            const fromMap = opts?.source === 'map' || !!opts?.keepMapContext || (!!opts?.closeSheetOnSuccess && S.currentScreen === 'explore');
            if (!beginOp('request_join')) return;
            try {
                const response = await apiWithStatus('/api/v3/match/invite', {
                    method: 'POST',
                    silent: true,
                    body: JSON.stringify({ user_id: S.userId, target_id: orgId, direction_id: dirId, replace_existing: true })
                });
                const res = response.data;
                if (res?.status === 'ok') {
                    if (!fromMap) {
                        if (res.mutual) { showToast('✓ Ваш екіпаж готовий!', 'success'); }
                        else if (Array.isArray(res.switched_from) && res.switched_from.length) { showToast('↪ Запит перемкнено', 'success'); }
                        else { showToast('⏳ Запит надіслано', 'success'); }
                    }
                    persistCriticalState();
                    await hydrate();
                    if (fromMap) {
                        closeSheet();
                        if (S.map?.closePopup) S.map.closePopup();
                        switchScreen('explore');
                        renderNewsStrip();
                        await refreshMap();
                        focusActiveMapContext();
                        openMapRequestJoinResultSheet(dirId, res, orgId);
                        return true;
                    }
                    closeSheet();
                    switchScreen('trips');
                    return true;
                } else {
                    showToast(getErrorMessage(res, 'Не вдалось надіслати запит'), 'error');
                    return false;
                }
            } catch (e) {
                showToast('Немає з\'єднання — спробуйте ще раз', 'error');
                return false;
            } finally { endOp('request_join'); }
        }

        async function signalPassenger(passengerId, dirId, opts = {}) {
            if (!requireRoleForAction('запросити попутника', () => signalPassenger(passengerId, dirId, opts))) return false;
            if (!_isDriverRole(S.userRole)) { showToast('Запрошувати попутника може тільки водій', 'error'); return false; }
            const safePassengerId = parseInt(passengerId, 10) || 0;
            const safeDirId = parseInt(dirId, 10) || 0;
            if (!safePassengerId || !safeDirId) { showToast('Не вдалося визначити попутника', 'error'); return false; }
            // §0.62 / D81: прямий виклик під тим самим захистом, що й картка. Повне чи невідоме авто — лише причина,
            // без запиту й без переходу до оформлення; ще не оформлене — причина й власна поверхня оформлення.
            if (!driverHasOpenCrewForDirection(safeDirId)) {
                const recruitment = driverCrewRecruitmentState(safeDirId);
                showToast(driverRecruitmentBlockReason(recruitment) || 'Не вдалося перевірити вільні місця', 'error');
                if (recruitment === 'absent') openMapSubscribedSheet(safeDirId, { sheetMaxHeight: '65vh' });
                return false;
            }
            const fromMap = opts?.source === 'map' || !!opts?.keepMapContext;
            if (!beginOp('signal_passenger')) return false;
            try {
                const response = await apiWithStatus('/api/v3/match/invite', {
                    method: 'POST',
                    silent: true,
                    body: JSON.stringify({ user_id: S.userId, target_id: safePassengerId, direction_id: safeDirId, replace_existing: false })
                });
                const res = response.data;
                if (res?.status === 'ok') {
                    if (!fromMap) {
                        if (res.mutual) { showToast('✓ Екіпаж готовий!', 'success'); }
                        else { showToast('⏳ Запрошення надіслано', 'success'); }
                    }
                    persistCriticalState();
                    await hydrate();
                    if (fromMap) {
                        if (S.map?.closePopup) S.map.closePopup();
                        switchScreen('explore');
                        renderNewsStrip();
                        await refreshMap();
                        focusActiveMapContext();
                        openMapSignalResultSheet(safeDirId, safePassengerId, res);
                        return true;
                    }
                    closeSheet();
                    switchScreen('trips');
                    return true;
                }
                showToast(getErrorMessage(res, 'Не вдалось надіслати запрошення'), 'error');
                return false;
            } catch (e) {
                showToast('Немає з\'єднання — спробуйте ще раз', 'error');
                return false;
            } finally { endOp('signal_passenger'); }
        }

        // ─── NEWS ───
        function classifyNewsItem(n) {
            const explicit = String(n?.category || n?.root_category || n?.category_key || '').toLowerCase();
            if (['theocracy', 'leisure', 'work'].includes(explicit)) return explicit;
            const txt = `${n?.root_title || ''} ${n?.direction_title || ''} ${n?.dir_title || ''} ${n?.text || ''}`.toLowerCase();
            if (txt.includes('теократ')) return 'theocracy';
            if (txt.includes('відпоч') || txt.includes('відпуст') || txt.includes('подорож') || txt.includes('релакс') || txt.includes('тур') || txt.includes('travel') || txt.includes('vacation')) return 'leisure';
            if (txt.includes('робот') || txt.includes('навчан') || txt.includes('work') || txt.includes('study') || txt.includes('career')) return 'work';
            return 'other';
        }

        function isDiscoveryNewsItem(n) {
            if (!n || n?.is_active === false) return false;
            return String(n?.kind || '').toLowerCase() !== 'trip_done';
        }

        // News v2 keeps one live card per event.  Read state is deliberately
        // client-local in Phase 1: only the explicit expansion handler writes
        // it, while hydrate/poll remain observation-only.
        const NEWS_LAST_SEEN = 'wt_news_last_seen_v2';

        // Прочитане належить ЛЮДИНІ, не пристрою: без скоупу за user_id
        // наступний акаунт на тому ж пристрої успадковував чужі позначки і
        // бачив занижений бейдж (live-знахідка 2026-07-25: свіжий користувач
        // отримав 1 замість 3 непрочитаних).
        function newsLastSeenKey() {
            const uid = String(S.userId || 'anon');
            return `${NEWS_LAST_SEEN}:${uid}`;
        }

        function renderNewsBadgeFromEvents(events) {
            const badge = document.getElementById('nav-news-badge');
            if (!badge) return;
            let seen = {};
            try { seen = JSON.parse(localStorage.getItem(newsLastSeenKey()) || '{}') || {}; } catch (_) { seen = {}; }
            const unread = (Array.isArray(events) ? events : []).filter(card => {
                const key = String(card?.direction_id || '');
                return key && Number(card?.updated_at || 0) > Number(seen[key] || 0);
            }).length;
            if (unread > 0) { badge.style.display = 'flex'; badge.textContent = String(Math.min(99, unread)); }
            else { badge.style.display = 'none'; }
        }

        // Розгорнутий стан живе в S, а не лише в DOM: renderNewsScreen() на
        // кожному poll перебудовує innerHTML стрічки, і без цього кешу панель
        // згорталась сама через ~1с (live-знахідка 2026-07-25). Кеш — пам'ять
        // рендера, не джерело істини: свіжі дані приходять з наступним явним
        // розгортанням, poll нічого не дофетчує (§0.60).
        S._newsOpenUpdates = S._newsOpenUpdates || {};
        S._newsOpenPeople = S._newsOpenPeople || {};

        function restoreNewsExpansions() {
            for (const [id, html] of Object.entries(S._newsOpenUpdates || {})) {
                const target = document.getElementById(`news-v2-updates-${id}`);
                if (target && html) { target.innerHTML = html; target.style.display = ''; }
            }
            for (const [id, html] of Object.entries(S._newsOpenPeople || {})) {
                const target = document.getElementById(`news-v2-people-${id}`);
                if (target && html) { target.innerHTML = html; target.style.display = ''; }
            }
        }

        // Рубричні фільтри стрічки: на трьох подіях непомітно, на тридцяти —
        // єдиний спосіб не загубитись. Лічильники рахуються з тих самих
        // карток, тому окремої формули тут немає.
        function renderNewsFilterTiles(cards) {
            const host = document.getElementById('news-filter-tiles');
            if (!host) return;
            const list = Array.isArray(cards) ? cards : [];
            const counts = { theocracy: 0, leisure: 0, work: 0 };
            list.forEach(card => {
                const key = String(card?.category || '').toLowerCase();
                if (key in counts) counts[key] += 1;
            });
            const active = S.newsEventFilter || 'all';
            // Ті самі кольори категорій, що й на карті (renderNewsStrip: theocracy/
            // leisure/work), щоб фільтр виглядав однаково в обох місцях.
            const tiles = [
                ['theocracy', newsCategoryLabel('theocracy'), '#a78bfa'],
                ['leisure', newsCategoryLabel('leisure'), '#34d399'],
                ['work', newsCategoryLabel('work'), '#38bdf8']
            ];
            host.innerHTML = tiles.map(([key, label, color]) => {
                const isActive = active === key;
                return `
                <button type="button" role="button" tabindex="0"
                    aria-pressed="${isActive ? 'true' : 'false'}"
                    onclick="setNewsEventFilter('${isActive ? 'all' : key}')"
                    style="flex:1;min-width:0;padding:8px 6px;border-radius:10px;cursor:pointer;font-weight:700;font-size:12px;border:1px solid ${isActive ? color : 'var(--border)'};background:${isActive ? color : 'var(--bg-card)'};color:${isActive ? '#081018' : 'var(--text)'};">
                    ${escapeHtml(label)} · ${counts[key] || 0}
                </button>`;
            }).join('');
            host.style.display = 'flex';
        }

        // Тап по КАРТЦІ — єдиний вхід у подію: деталі + учасники (кому
        // дозволено) + дія. Дві кнопки-дублери на кожній картці створювали шум
        // рівно там, де людина просто хоче подивитись подію (UX 2026-07-25).
        async function toggleNewsEventCard(directionId) {
            const safeId = Number(directionId);
            if (!Number.isFinite(safeId) || safeId <= 0) return;
            if (S._newsOpenUpdates[String(safeId)]) { collapseNewsEventCard(safeId); return; }
            const card = (Array.isArray(S.news) ? S.news : []).find(item => Number(item?.direction_id) === safeId);
            const action = document.getElementById(`news-v2-action-${safeId}`);
            if (action) action.style.display = 'block';
            const collapseBtn = document.querySelector(`[data-news-direction="${safeId}"] .news-card-collapse`);
            if (collapseBtn) collapseBtn.style.display = 'block';
            const main = document.querySelector(`[data-news-direction="${safeId}"] .news-card-toggle`);
            if (main) main.setAttribute('aria-expanded', 'true');
            await expandNewsEventCard(safeId);
            // Внутрішній простір пропонуємо лише тому, хто його реально має:
            // сторонньому не показуємо «тапни й дізнайся, що не можна».
            const access = String(card?.viewer_access || 'public');
            if (access === 'participant' || access === 'organizer') {
                await expandNewsPersonCards(safeId);
            }
        }

        function collapseNewsEventCard(directionId) {
            const safeId = Number(directionId);
            collapseNewsPanel('updates', safeId);
            collapseNewsPanel('people', safeId);

        function eventCountFromCatalogNode(d) {
            return safeCount(
                d?.event_count ?? d?.events_count ?? d?.events ?? d?.descendant_events ?? d?.descendant_events_count

            return Array.isArray(payload) ? payload : (payload?.directions || []);

        function isRootCatalogNode(d) {
            return d?.parent_id === null || d?.parent_id === undefined || d?.parent_id === '';
        }

        function catalogRootCategory(root) {
            const k = classifyNewsItem({
                ...root,
                root_title: root?.title || root?.root_title || '',
                direction_title: root?.title || root?.direction_title || ''
            });
            return ['theocracy', 'leisure', 'work'].includes(k) ? k : 'other';
        }

        function rememberCatalogRootsForMap(dirs) {
            const roots = (dirs || []).filter(d => isRootCatalogNode(d));
            const folders = roots.filter(isFolderNode);
            const buckets = { theocracy: 0, leisure: 0, work: 0 };
            folders.forEach(root => {
                const k = catalogRootCategory(root);
                if (k in buckets) buckets[k] += eventCountFromCatalogNode(root);
            });
            S.catalogRootFolders = folders.map(root => ({
                ...root,
                root_title: root?.title || '',
                root_category: catalogRootCategory(root)
            }));
            S.catalogRootBuckets = buckets;
        }

        async function fetchCatalogChildrenForMap(parentId = null) {
            if (!S.apiBase) return [];
            const qp = new URLSearchParams({ lang: S.lang });
            if (S.userId) qp.set('user_id', String(S.userId));
            if (parentId !== null && parentId !== undefined) qp.set('parent_id', String(parentId));
            return catalogRowsFromPayload(await api(`/api/v3/board?${qp.toString()}`, { silent: true }));
        }

        function decorateCatalogEventForMap(item, root, parent = null) {
            const dirId = _directionIdFromMapItem(item);
            const rootCategory = root?.root_category || catalogRootCategory(root || item);
            return {
                ...item,
                direction_id: dirId,
                root_title: root?.root_title || root?.title || item?.root_title || '',
                root_category: rootCategory,
                category: item?.category || rootCategory,
                parent_title: parent?.title || item?.parent_title || ''
            };
        }

        async function collectCatalogEventsForMap(parentId, root, depth = 0, seen = new Set(), parentTitle = '') {
            if (!parentId || depth > 8) return [];
            const key = String(parentId);
            if (seen.has(key)) return [];
            seen.add(key);
            const children = await fetchCatalogChildrenForMap(parentId);
            const events = [];
            for (const child of children) {
                if (isFolderNode(child)) {
                    events.push(...await collectCatalogEventsForMap(child.id, root, depth + 1, seen, child?.title || parentTitle));
                } else {
                    events.push(decorateCatalogEventForMap(child, root, { id: parentId, title: parentTitle }));
                }
            }
            return events;
        }

        async function ensureMapCatalogEventsForMap(options = {}) {
            if (!S.apiBase) return [];
            if (!options.force && S.mapCatalogEventsLoaded) return S.mapCatalogEvents || [];
            if (S.mapCatalogEventsLoading) return S.mapCatalogEventsLoading;
            S.mapCatalogEventsLoading = (async () => {
                const rootRows = await fetchCatalogChildrenForMap(null);
                rememberCatalogRootsForMap(rootRows);
                const roots = S.catalogRootFolders || [];
                let events = [];
                if (roots.length) {
                    for (const root of roots) {
                        if (isFolderNode(root)) {
                            events.push(...await collectCatalogEventsForMap(root.id, root, 0, new Set()));
                        } else {
                            events.push(decorateCatalogEventForMap(root, root));
                        }
                    }
                } else {
                    events = rootRows.filter(d => !isFolderNode(d)).map(d => decorateCatalogEventForMap(d, d));
                }
                const unique = [];
                const seen = new Set();
                events.forEach(item => {
                    const point = mapEventPointFromItem(item);
                    if (!point) return;
                    const key = String(point.direction_id);
                    if (seen.has(key)) return;
                    seen.add(key);
                    unique.push(point);
                });
                S.mapCatalogEvents = unique;
                S.mapCatalogEventsLoaded = true;
                return S.mapCatalogEvents;
            })().finally(() => { S.mapCatalogEventsLoading = null; });
            return S.mapCatalogEventsLoading;
        }

        function catalogCategoryBucketsForMapStrip() {
            const empty = { theocracy: 0, leisure: 0, work: 0 };
            if (S.catalogRootBuckets) return { ...empty, ...S.catalogRootBuckets };
            const rootFolders = (allDirections || []).filter(d =>
                isFolderNode(d) && isRootCatalogNode(d)
            );
            const source = rootFolders.length ? rootFolders : [];
            source.forEach(d => {
                const k = catalogRootCategory(d);
                if (k in empty) empty[k] += eventCountFromCatalogNode(d);
            });
            if (empty.theocracy || empty.leisure || empty.work) return empty;
            // Fallback before the root catalog has loaded. Filtering/focus still uses
            // map pins; the headline counters switch to catalog totals as soon as
            // renderBoard() receives the root board payload.
            mapEventPointsForDiscovery('all').forEach(point => {
                const k = classifyNewsItem(point);
                if (k in empty) empty[k] += 1;
            });
            return empty;
        }

        function formatNewsTime(ts) {
            if (!ts) return '—';
            try { return new Date(Number(ts) * 1000).toLocaleString('uk-UA', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); }
            catch (_) { return '—'; }
        }

        function formatEventDay(value) {
            const parts = eventDateParts(value);
            if (!parts) return '';
            const months = [
                'січня', 'лютого', 'березня', 'квітня', 'травня', 'червня',
                'липня', 'серпня', 'вересня', 'жовтня', 'листопада', 'грудня'
            ];
            return `${parts.day} ${months[parts.month - 1]}`;
        }

        function formatEventDateRange(startDate, endDate) {
            const start = eventDateParts(startDate);
            const end = eventDateParts(endDate);
            if (!start && !end) return '';
            if (!start) return formatEventDay(endDate);
            if (!end) return formatEventDay(startDate);
            if (end.key < start.key) return '';
            if (start.key === end.key) return formatEventDay(startDate);
            if (start.year === end.year && start.month === end.month) {
                return `з ${start.day} по ${formatEventDay(endDate)}`;
            }
            if (start.year === end.year) {
                return `з ${formatEventDay(startDate)} по ${formatEventDay(endDate)}`;
            }
            return `з ${formatEventDay(startDate)} ${start.year} по ${formatEventDay(endDate)} ${end.year}`;
        }

        function formatEventDuration(startDate, endDate) {
            const startRaw = String(startDate || '').trim();
            const endRaw = String(endDate || '').trim();
            if (!startRaw && !endRaw) return '';
            const start = startRaw ? eventDateParts(startRaw) : eventDateParts(endRaw);
            const end = endRaw ? eventDateParts(endRaw) : eventDateParts(startRaw);
            if (!start || !end || end.key < start.key) return '';
            const startUtc = Date.UTC(start.year, start.month - 1, start.day);
            const endUtc = Date.UTC(end.year, end.month - 1, end.day);
            const spanDays = Math.floor((endUtc - startUtc) / 86400000);
            // Дати події — день виїзду на подію і день виїзду додому, тож рахуємо
            // включно: 10–12 жовтня = 3 дні; туди й назад того ж дня = 1 день.
            const days = spanDays + 1;
            return `Тривалість: ${days} ${pluralUk(days, 'день', 'дні', 'днів')}`;
        }

        function eventDateParts(value) {
            const key = String(value || '').trim().slice(0, 10);
            const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(key);
            if (!match) return null;
            const year = Number(match[1]);
            const month = Number(match[2]);
            const day = Number(match[3]);
            if (month < 1 || month > 12) return null;
            const leap = (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
            const monthDays = [31, leap ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
            if (day < 1 || day > monthDays[month - 1]) return null;
            return { key, year, month, day };
        }

        function eventPeopleTotal(drivers, passengers) {
            const driverCount = Math.max(0, Number(drivers) || 0);
            const passengerCount = Math.max(0, Number(passengers) || 0);
            return driverCount + passengerCount;
        }
