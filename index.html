        // ═══ KEYBOARD HANDLER — keeps input visible above virtual keyboard ═══
        function initKeyboardHandler() {
            if (!window.visualViewport) return;
            const vv = window.visualViewport;
            let lastHeight = vv.height;

            function adjustForKeyboard() {
                const chatBar = document.querySelector('.chat-input-bar.keyboard-shifted');
                if (!chatBar) return;

                const heightDiff = lastHeight - vv.height;
                if (heightDiff > 100) {
                    // Keyboard is visible — position input above it
                    chatBar.style.bottom = `${heightDiff}px`;
                } else {
                    // Keyboard hidden — reset
                    chatBar.style.bottom = '0px';
                }
                lastHeight = vv.height;
            }

            vv.addEventListener('resize', adjustForKeyboard);
            vv.addEventListener('scroll', adjustForKeyboard);

            // Also handle focus/blur on input fields
            document.addEventListener('focusin', (e) => {
                if (e.target.matches('.chat-input, input[type="text"], textarea')) {
                    const bar = e.target.closest('.chat-input-bar, .sheet-card');
                    if (bar && !bar.classList.contains('keyboard-shifted')) {
                        bar.classList.add('keyboard-shifted');
                        setTimeout(() => adjustForKeyboard(), 100);
                    }
                }
            });
            document.addEventListener('focusout', (e) => {
                if (e.target.matches('.chat-input, input[type="text"], textarea')) {
                    document.querySelectorAll('.keyboard-shifted').forEach(el => {

        function _pickTelegramName(tgUser, fallbackName = '') {

        function _parseInitDataUser(initDataRaw) {
            const raw = String(initDataRaw || '').trim();
            if (!raw) return null;
            try {
                const params = new URLSearchParams(raw);
                const userRaw = params.get('user');
                if (!userRaw) return null;
                return JSON.parse(decodeURIComponent(userRaw));
            } catch (_) {
                return null;
            }
        }

        function normalizeApiBase(rawApi) {
            let base = String(rawApi || '').trim();
            if (!base) return '';
            try { base = decodeURIComponent(base); } catch (_) { }
            base = base.replace(/^['"]+|['"]+$/g, '').trim();
            if (base && !/^https?:\/\//i.test(base)) base = 'https://' + base;
            base = base.split('#')[0].split('?')[0].trim();
            base = base.replace(/(https?:\/\/[^\/?#=]+)=\d+(?=\/|$)/i, '$1');
            base = base.replace(/\/+$/, '');
            try {
                const u = new URL(base);
                if (!u.hostname || u.hostname.includes('=')) return '';
                const p = (u.pathname || '').replace(/\/+$/, '');
                return `${u.protocol}//${u.host}${p === '/' ? '' : p}`;
            } catch (_) {
                return '';
            }
        }

        function sanitizeBotUsername(raw) {
            const username = String(raw || '').trim().replace(/^@+/, '');
            return /^[A-Za-z0-9_]{5,32}$/.test(username) ? username : '';
        }

        function sanitizeMiniAppShortName(raw) {
            const shortName = String(raw || '').trim().replace(/^\/+/, '');
            return /^[A-Za-z0-9_]{3,64}$/.test(shortName) ? shortName : '';
        }

        function hasFiniteNumber(value) {

        function seatCount(value, fallback = 0) {
            const n = Number(value);
            const fb = Number(fallback);
            const source = Number.isFinite(n) ? n : (Number.isFinite(fb) ? fb : 0);
            return Math.max(0, Math.floor(source));
        }

        function sanitizeAvatarUrl(raw) {
            const value = String(raw || '').trim();
            if (!value) return '';
            if (/^data:image\//i.test(value)) return value; // server-proxied own avatar (no token in URL)
            try {
                const u = new URL(value, location.origin);
                if (u.protocol !== 'https:' && u.protocol !== 'http:') return '';
                return u.toString();
            } catch (_) {
                return '';
            }
        }

        function _avatarGradient(seedRaw) {
            const seed = String(seedRaw || '?');
            const palette = [
                ['#6366f1', '#8b5cf6'],
                ['#0ea5e9', '#0284c7'],
                ['#10b981', '#059669'],
                ['#f59e0b', '#f97316'],
                ['#ec4899', '#db2777'],
                ['#22c55e', '#16a34a']
            ];
            let hash = 0;
            for (let i = 0; i < seed.length; i++) hash = ((hash << 5) - hash) + seed.charCodeAt(i);
            const idx = Math.abs(hash) % palette.length;
            const [a, b] = palette[idx];
            return `linear-gradient(135deg, ${a}, ${b})`;
        }

        function applyAvatarElement(el, name, photoUrl) {
            if (!el) return;
            const displayName = String(name || '').trim();
            const firstChar = (displayName || '?')[0].toUpperCase();

            el.innerHTML = '';
            el.style.background = _avatarGradient(displayName || firstChar);
            if (safePhoto) {
                const img = document.createElement('img');
                img.className = 'avatar-photo';
                img.src = safePhoto;
                img.alt = '';
                img.loading = 'lazy';
                img.referrerPolicy = 'no-referrer';
                el.appendChild(img);
            } else {
                el.textContent = firstChar;
            }
        }

            if (safePhoto) {
                return `<div class="${classes}" style="width:${size}px;height:${size}px;"><img class="avatar-photo" src="${escapeAttr(safePhoto)}" alt=""></div>`;

            const bg = _avatarGradient(displayName || firstChar);
            return `<div class="${classes}" style="width:${size}px;height:${size}px;background:${bg};">${escapeHtml(firstChar)}</div>`;
        }

        function resolveUser() {
            const tg = window.Telegram?.WebApp;
            const qp = new URLSearchParams(location.search);
            const storedApi = normalizeApiBase(S.apiBase);
            S.apiBase = storedApi;
            if (storedApi) localStorage.setItem('wt_api', storedApi);
            const urlApi = qp.get('api');
            if (urlApi) {
                const base = normalizeApiBase(urlApi);
                if (base) {
                    S.apiBase = base;
                    localStorage.setItem('wt_api', S.apiBase);
                } else {
                    console.warn('Invalid api base query param:', urlApi);
                }
            }
            const urlBot = sanitizeBotUsername(qp.get('bot') || qp.get('bot_username') || '');
            const globalBot = sanitizeBotUsername(window.WAYTANDEM_BOT_USERNAME || '');
            const storedBot = sanitizeBotUsername(S.botUsername || localStorage.getItem('wt_bot_username') || '');
            S.botUsername = urlBot || globalBot || storedBot;
            if (S.botUsername) localStorage.setItem('wt_bot_username', S.botUsername);
            const urlMiniApp = sanitizeMiniAppShortName(qp.get('miniapp') || qp.get('mini_app') || qp.get('mini_app_short_name') || '');
            const globalMiniApp = sanitizeMiniAppShortName(window.WAYTANDEM_MINI_APP_SHORT_NAME || '');
            const storedMiniApp = sanitizeMiniAppShortName(S.miniAppShortName || localStorage.getItem('wt_mini_app_short_name') || '');
            S.miniAppShortName = urlMiniApp || globalMiniApp || storedMiniApp;
            if (S.miniAppShortName) localStorage.setItem('wt_mini_app_short_name', S.miniAppShortName);
            let initStartParam = '';
            try { initStartParam = new URLSearchParams(tg?.initData || '').get('start_param') || ''; } catch (_) { }
            const startParam = tg?.initDataUnsafe?.start_param || initStartParam || qp.get('tgWebAppStartParam') || qp.get('startapp') || qp.get('start_param') || '';
            S.pendingStartDirectionId = parseStartDirectionId(startParam);
            const initDataUser = _parseInitDataUser(tg?.initData || '');
            const tgUser = tg?.initDataUnsafe?.user || initDataUser;
            if (tgUser?.id) {
                S.userId = tgUser.id;
                S.userName = _pickTelegramName(tgUser, qp.get('name') || '');
                S.userPhoto = sanitizeAvatarUrl(tgUser.photo_url || '');
                S.userUsername = sanitizeBotUsername(tgUser.username || '');
            } else {
                S.userId = parseInt(qp.get('user_id') || '0');
                S.userName = String(qp.get('name') || '').trim();
                S.userPhoto = sanitizeAvatarUrl(qp.get('avatar') || '');
                S.userUsername = sanitizeBotUsername(qp.get('username') || qp.get('telegram_username') || '');
            }
            if (tg) { tg.ready(); tg.expand(); }
            if (!String(S.userName || '').trim() && S.userId) {
                const cachedName = String(localStorage.getItem('wt_name_' + S.userId) || '').trim();
                if (cachedName) S.userName = cachedName;
            }
            if (!S.userPhoto && S.userId) {
                const cachedPhoto = sanitizeAvatarUrl(localStorage.getItem('wt_photo_' + S.userId) || '');
                if (cachedPhoto) S.userPhoto = cachedPhoto;
            }
            if (!S.userUsername && S.userId) {
                S.userUsername = sanitizeBotUsername(localStorage.getItem('wt_username_' + S.userId) || '');
            }
            syncIdentityUI();
            if (S.userId && String(S.userName || '').trim()) {
                localStorage.setItem('wt_name_' + S.userId, String(S.userName || '').trim());
            }
            if (S.userId && S.userPhoto) {
                localStorage.setItem('wt_photo_' + S.userId, S.userPhoto);
            }
            if (S.userId && S.userUsername) {
                localStorage.setItem('wt_username_' + S.userId, S.userUsername);
            }
            try {
                const saved = JSON.parse(localStorage.getItem('wt_profile_' + S.userId) || '{}');
                if (typeof saved.role === 'string') S.userRole = normalizeRole(saved.role);
                if (saved.car) S.car = saved.car;
                if (saved.seats) S.seats = saved.seats;
                if (saved.lang) S.lang = saved.lang;
            } catch (_) { }
            updateRolePill();
        }

        // ─── API ───
        // Stale-auth UX (2026-06-10): initData живе 24 год (server_v3.py, auth_date guard).

                </div>`);
            const btn = document.getElementById('btn-auth-reopen');
            if (btn) btn.onclick = () => {
                const t = window.Telegram?.WebApp;
                if (t && typeof t.close === 'function') t.close(); else location.reload();
            };
        }
        function _maybeHandleAuthExpired(detail) {
            const d = String(detail || '');
            const stale = d.includes('initData expired') || d.includes('Invalid initData') || d.includes('Invalid auth_date');
            if (!stale) return false;
            S.authExpired = true;
            if (!_authExpiredShown) { _authExpiredShown = true; _showAuthExpiredSheet(); }
            return true;
        }

        // Centralized API wrapper (I-FRONT-2, I-FRONT-3)
        // Codex #7 (DM-2026-07-15-002) — політика шуму: МУТАЦІЇ кричать
        // (toast, як було), read-и (GET) — тихі: один мовчазний retry,
        // далі console.warn і локальна деградація поверхні. Один впалий
        // другорядний boot-read більше не фарбує застосунок у «зламано».
        // User-initiated read може попросити гучність через opts.loud.
        async function apiWithStatus(path, opts = {}) {
            if (!S.apiBase) return { ok: false, status: 0, data: null };
            // Circuit breaker: auth протух — не б'ємо сервер (захист від 429, I-151).
            if (S.authExpired) {
                if (!opts.silent) _showAuthExpiredSheet();
                return { ok: false, status: 401, data: { detail: 'initData expired (24h)' } };
            }

            const method = String(opts.method || 'GET').toUpperCase();
            const isRead = method === 'GET' && !opts.loud;

            // Handle busy state if not silent
            const opKey = opts.opKey || path;
            if (!opts.silent) beginOp(opKey);

            const headers = { 'Content-Type': 'application/json' };
            const initData = window.Telegram?.WebApp?.initData || '';
            if (initData) headers['Authorization'] = 'tma ' + initData;

            try {
                const attempts = isRead ? 2 : 1;
                for (let attempt = 1; attempt <= attempts; attempt++) {
                    try {
                        const r = await fetch(S.apiBase + path, { ...opts, headers: { ...headers, ...opts.headers } });
                        let payload = null;
                        try {
                            payload = await r.json();
                        } catch (_) { /* payload remains null */ }

                        if (!r.ok) {
                            // 401 зі застарілим initData обробляється sheet-ом, не toast-ом.
                            const consumed = r.status === 401 && _maybeHandleAuthExpired(payload?.detail);
                            if (!opts.silent && !consumed) {
                                if (isRead) console.warn('API read failed (quiet):', path, r.status);
                                else showToast(payload?.detail || `Помилка ${r.status}`, 'error');
                            }
                            return { ok: false, status: r.status, data: payload };
                        }

                        return { ok: true, status: r.status, data: payload };
                    } catch (e) {
                        if (attempt < attempts) {
                            await new Promise(res => setTimeout(res, 700));
                            continue;
                        }
                        if (!opts.silent) {
                            if (isRead) {
                                console.warn('API read failed after retry (quiet):', path, e);
                            } else {
                                showToast('Помилка з’єднання', 'error');
                                console.error('API Error:', path, e);
                            }
                        }
                        return { ok: false, status: 0, data: null };
                    }
                }
                return { ok: false, status: 0, data: null };
            } finally {
                if (!opts.silent) endOp(opKey);
            }
        }

        async function api(path, opts = {}) {
            const resp = await apiWithStatus(path, opts);
            return resp.ok ? resp.data : null;
        }

        async function hydrateAppConfig() {
            if (!S.apiBase || (S.botUsername && S.miniAppShortName)) return;
            const cfg = await api('/api/v3/app/config', { silent: true });
            const username = sanitizeBotUsername(cfg?.bot_username || '');
            if (username) {
                S.botUsername = username;
                localStorage.setItem('wt_bot_username', username);
            }
            const miniAppShortName = sanitizeMiniAppShortName(cfg?.mini_app_short_name || '');
            if (miniAppShortName) {
                S.miniAppShortName = miniAppShortName;
                localStorage.setItem('wt_mini_app_short_name', miniAppShortName);
            }
        }

        async function syncUserIdentityToServer() {
            // ФІКС 2026-07-04 (live-прохід, тупик role-gate): раніше без імені
            // (link-режим ?user_id=... без Telegram initData) реєстрація мовчки
            // пропускалась -> юзера НЕМАЄ в БД -> /user/role та subscribe пишуть
            // у порожнечу -> hydrate повертає пусту роль -> role-gate зациклюється.
            // Тепер: ім'я = Telegram -> серверний профіль -> fallback «Гість NNNN».
            if (!S.apiBase || !S.userId) return;
            try {
                const p = await api(`/api/v3/user/profile?user_id=${S.userId}`);
                if (!S.userPhoto && p?.photo_url) { S.userPhoto = sanitizeAvatarUrl(p.photo_url); syncIdentityUI(); }
                // §0.60/I-176 (live-аудит 2026-07-12): пасивний boot НЕ вигадує роль.
                // Дефолт 'client' тут мовчки писав роль у БД самим відкриттям сторінки
                // (register → change_user_role) і назавжди ховав gate «Як ти їдеш?».
                // Порожня роль їде порожньою: юзер у БД існує (фікс дедлоку 2026-07-04
                // збережено), а роль пише лише явний setRole() → POST /user/role.
                const role = normalizeRole(p?.role || S.userRole || '');
                if (!S.userUsername && p?.telegram_username) S.userUsername = sanitizeBotUsername(p.telegram_username);
                const serverName = String(p?.name || '').trim();
                const name = String(S.userName || '').trim() || serverName || `Гість ${String(S.userId).slice(-4)}`;
                await apiWithStatus('/api/v3/user/register', {
                    method: 'POST',
                    body: JSON.stringify({ user_id: S.userId, name, role, telegram_username: S.userUsername || '' })
                });
            } catch (_) { }
        }

        function normalizeRole(role) {
            const r = String(role ?? '').trim();
            if (!r) return '';
            if (r === 'passenger') return 'client';
            return r;
        }

        function resolveActiveTripPayload(payload) {
            if (!payload || typeof payload !== 'object') return null;
            if (payload.active_trip && typeof payload.active_trip === 'object') return payload.active_trip;
            if (payload.trip && typeof payload.trip === 'object') return payload.trip;
            if (payload.found === true && (payload.crew_id || payload.id || payload.request_id)) return payload;
            if (payload.active === true && (payload.crew_id || payload.id || payload.request_id)) return payload;
            return null;
        }

        function resolvePendingMatchesPayload(payload) {
            if (Array.isArray(payload)) return payload;
            if (!payload || typeof payload !== 'object') return [];
            if (Array.isArray(payload.matches)) return payload.matches;
            const incoming = Array.isArray(payload.incoming) ? payload.incoming.map(m => ({ ...m, scope: m?.scope || 'incoming' })) : [];
            const outgoing = Array.isArray(payload.outgoing) ? payload.outgoing.map(m => ({ ...m, scope: m?.scope || 'outgoing' })) : [];
            return [...incoming, ...outgoing];
        }

        // ─── SKELETON ───
        let _skeletonShown = false;
        function showSkeleton() {
            const overlay = document.getElementById('skeleton-overlay');
            if (overlay) overlay.style.display = 'block';
            _skeletonShown = true;
        }
        function hideSkeleton() {
            const overlay = document.getElementById('skeleton-overlay');
            if (overlay) overlay.style.display = 'none';
            _skeletonShown = false;
        }

        // Failed reads do not revoke membership. Only a valid server list can.
        function applySubscriptionsPayload(payload) {
            S.subscriptionsRefreshFailed = !Array.isArray(payload?.subscriptions);
            if (S.subscriptionsRefreshFailed) return false;
            S.subscriptions = payload.subscriptions;
            S.subscriptionSearchHeld = false;
            return true;
        }

        // ─── HYDRATE ───
        async function hydrate() {
            if (!S.apiBase || !S.userId) { renderNews(); renderBoard(); renderTrips(); renderSubBar(); return; }
            showSkeleton();
            const data = await api(`/api/v3/hydrate?user_id=${S.userId}&include_outgoing=1`);
            if (!data) { hideSkeleton(); return; }
            if (data.profile) {
                if (Object.prototype.hasOwnProperty.call(data.profile, 'role')) {
                    S.userRole = normalizeRole(data.profile.role);
                }
                if (!String(S.userName || '').trim()) S.userName = data.profile.name || S.userName;
                if (!S.userPhoto) S.userPhoto = sanitizeAvatarUrl(data.profile.photo_url || '');
            }
            if (!String(S.userName || '').trim()) {
                const prof = await api(`/api/v3/user/profile?user_id=${S.userId}`);
                if (prof?.found && String(prof.name || '').trim()) {
                    S.userName = String(prof.name || '').trim();
                }
                if (!S.userPhoto && prof?.found) {
                    S.userPhoto = sanitizeAvatarUrl(prof.photo_url || '');
                }
            }
            if (_isDriverRole(S.userRole)) {
                try {
                    const driverInfo = await api(`/api/v3/driver/info?user_id=${S.userId}`, { silent: true });
                    if (driverInfo?.found) {
                        if (String(driverInfo.car || '').trim()) S.car = String(driverInfo.car || '').trim();
                        if (hasFiniteNumber(driverInfo.seats_total)) S.seats = seatCount(driverInfo.seats_total, S.seats);
                        saveProfile();
                    }
                } catch (_) { /* driver profile sync is best-effort; hydrate state remains authoritative */ }
            }
            if (S.userId && String(S.userName || '').trim()) {
                localStorage.setItem('wt_name_' + S.userId, String(S.userName || '').trim());
            }
            if (S.userId && S.userPhoto) {
                localStorage.setItem('wt_photo_' + S.userId, S.userPhoto);
            }
            const previousTrip = S.activeTrip ? { ...S.activeTrip } : null;
            S.lastHydrateAt = Date.now();
            S.activeTrip = resolveActiveTripPayload(data);
            applyPresenceClaimsPayload(data);
            renderMapNavigationButton();
            notifyLifecycleTransitions(previousTrip, S.activeTrip, { allowNewTrip: S.didInitialHydrate });
            S.didInitialHydrate = true;
            if (S.activeTrip) lastKnownTripForRating = { ...S.activeTrip };
            else maybeOpenCompletedTripRatingSheet('hydrate');
            S.pendingMatches = resolvePendingMatchesPayload(data);
            S.proposedMatch = (S.activeTrip || S.pendingMatches.length) ? null : (data.proposed_match || null);
            if (!S.proposedMatch) closeMapResultPanelIfNoProposedMatch();
            const subs = await api(`/api/v3/user/subscriptions?user_id=${S.userId}`);
            const subscriptionsUpdated = applySubscriptionsPayload(subs);
            // An ended trip cannot revive its old search while refresh is unavailable.
            if (previousTrip && !S.activeTrip && !subscriptionsUpdated) S.subscriptionSearchHeld = true;
            // Suppress a just-switched-from/unsubscribed direction while the server
            // catches up (its row can linger for a moment after a switch), so the
            // sub-bar never shows the stale + new subscription at the same time.
            if (S._recentlyUnsubbed && Date.now() < S._recentlyUnsubbed.until) {
                S.subscriptions = S.subscriptions.filter(s => String(s.direction_id) !== S._recentlyUnsubbed.id);
            } else {
                S._recentlyUnsubbed = null;
            }
            S.boardSubSet = new Set(S.subscriptions.map(s => String(s.direction_id)));
            suppressManualSearchProposedMatch();
            syncTerminalIdleState('hydrate');
            // Тримаємо "Моя подія" свіжою, щоб миттєва перевірка ліміту (одна подія
            // на користувача) спрацьовувала ще до відкриття форми створення.
            try {
                const myData = await api(`/api/v3/board/my?user_id=${S.userId}&lang=${S.lang}`);
                const myDirs = myData?.directions || myData?.my_directions || [];
                S.myDirections = Array.isArray(myDirs) ? myDirs : [];
            } catch (_) { /* не блокуємо hydrate, якщо запит не вдався */ }
            syncIdentityUI();
            updateRolePill(); updateBadges(); updateNewsBadge(); renderBoard(); renderTrips(); renderSubBar(); refreshMap();
            if (S.currentScreen === 'news' || S.currentScreen === 'explore') renderNews();
            // Check handshake panel logic after hydration
            verifyHandshakePanelState();
            verifyMapResultPanelState();
            maybeOpenMapResultPanelOnHydrate();
            verifyMapTripDockState();
            refreshOpenMapTripCrewSheet();
            maybeOpenMatchSheet();
            hideSkeleton();
            // Повернення у вкладку / дія людини: оновити знак непрочитаного, не чекаючи наступного опитування.
            refreshChatUnread().catch(() => { });
        }

        function startPolling() {
            if (!S.apiBase || !S.userId) return;
            setInterval(async () => {
                if (!S.apiBase || !S.userId || pollInFlight || S.authExpired) return;
                pollInFlight = true;
                try {
                    const data = await api(`/api/v3/hydrate?user_id=${S.userId}&include_outgoing=1`, { silent: true });
                    if (!data) return;

                    const oldPendingRaw = JSON.stringify(S.pendingMatches);
                    const previousTrip = S.activeTrip ? { ...S.activeTrip } : null;
                    const oldTripId = S.activeTrip ? S.activeTrip.id : null;
                    const oldStatus = S.activeTrip ? S.activeTrip.status : null;
                    const wasStarted = S.activeTrip ? S.activeTrip.is_started : 0;

                    S.lastHydrateAt = Date.now();
                    S.activeTrip = resolveActiveTripPayload(data);
                    applyPresenceClaimsPayload(data);
                    renderMapNavigationButton();
                    notifyLifecycleTransitions(previousTrip, S.activeTrip, { allowNewTrip: S.didInitialHydrate });
                    S.didInitialHydrate = true;
                    if (S.activeTrip) lastKnownTripForRating = { ...S.activeTrip };
                    // If waiting for partner and trip is gone — partner finished, show rating from any screen.
                    if (waitingForPartner && !S.activeTrip && lastKnownTripForRating) {
                        maybeOpenCompletedTripRatingSheet('poll');
                    }
                    S.pendingMatches = resolvePendingMatchesPayload(data);
                    S.proposedMatch = (S.activeTrip || S.pendingMatches.length) ? null : (data.proposed_match || null);
                    suppressManualSearchProposedMatch();
                    if (!S.proposedMatch) closeMapResultPanelIfNoProposedMatch();
                    // Completed trip is a terminal event for this social outing.
                    // Polling can be the first client to observe partner finish, so
                    // refresh subscriptions before any map-result banner is allowed
                    // to reopen from stale in-memory search state. While held, retry this
                    // read on the existing poll cycle; failure never fabricates an exit.
                    if ((previousTrip && !S.activeTrip) || S.subscriptionSearchHeld) {
                        const subs = await api(`/api/v3/user/subscriptions?user_id=${S.userId}`, { silent: true });
                        const subscriptionsUpdated = applySubscriptionsPayload(subs);
                        if (!subscriptionsUpdated) S.subscriptionSearchHeld = true;
                        S.boardSubSet = new Set(S.subscriptions.map(s => String(s.direction_id)));
                        suppressManualSearchProposedMatch();
                        syncTerminalIdleState('poll');
                        await renderBoard();
                    }
                    syncTerminalIdleState('poll');

                    syncIdentityUI();
                    verifyHandshakePanelState();
                    verifyMapResultPanelState();
                    maybeOpenMapResultPanelOnHydrate();
                    verifyMapTripDockState();
                    refreshOpenMapTripCrewSheet();

                    const newPendingRaw = JSON.stringify(S.pendingMatches);
                    if (oldPendingRaw !== newPendingRaw) updateBadges();
                    let _pendingRefreshMap = false;
                    if (oldTripId !== (S.activeTrip ? S.activeTrip.id : null) ||
                        oldStatus !== (S.activeTrip ? S.activeTrip.status : null) ||
                        wasStarted !== (S.activeTrip ? S.activeTrip.is_started : 0)) {
                        _pendingRefreshMap = true;
                    }

                    updateRolePill();
                    renderSubBar();
                    if (S.currentScreen === 'trips') renderTrips();
                    if (S.currentScreen === 'news') renderNewsScreen();
                    maybeOpenMatchSheet();
                    if (S.chatRequestId) loadChatMessages();
                    else await refreshChatUnread().catch(() => { });

                    if (_pendingRefreshMap) refreshMap();
                    else if (shouldRenderCrewMembersOnMap(S.activeTrip)) renderCrewMembersOnMap();
                    persistCriticalState(); // Persist after each successful poll
                } finally {
                    pollInFlight = false;
                }
            }, POLL_INTERVAL_MS);
        }

        function updateBadges() {
            const badge = document.getElementById('nav-trips-badge');
            const count = S.pendingMatches.length;
            if (count > 0) {
                const prev = parseInt(badge.textContent || '0');
                badge.style.display = 'flex';
                badge.textContent = count;
                if (count > prev) {
                    badge.classList.remove('badge-pulse');
                    void badge.offsetWidth; // reflow to restart animation
                    badge.classList.add('badge-pulse');
                }
            } else {
                badge.style.display = 'none';
                badge.classList.remove('badge-pulse');
            }
        }

        // ─── ROLE ───
        function initRolePill() { updateRolePill(); }
        function _isDriverRole(role) { return String(role || '') === 'driver'; }
        function _isPassengerRole(role) { const r = String(role || ''); return r === 'passenger' || r === 'client'; }
        function hasChosenRole() { return _isDriverRole(S.userRole) || _isPassengerRole(S.userRole); }

        function requireRoleForAction(actionLabel, retryFn) {
            if (hasChosenRole()) return true;
            S.pendingRoleAction = typeof retryFn === 'function' ? retryFn : null;
            openRoleSelector(true, actionLabel || 'продовжити');
            return false;
        }

        function syncProfileSettingsByRole() {
            const carRow = document.getElementById('settings-row-car');
            const seatsRow = document.getElementById('settings-row-seats');
            const isDriver = _isDriverRole(S.userRole);
            if (carRow) carRow.style.display = isDriver ? '' : 'none';
            if (seatsRow) seatsRow.style.display = isDriver ? '' : 'none';
        }

        function updateRolePill() {
            const pill = document.getElementById('role-pill');
            const sr = document.getElementById('settings-role');
            if (_isDriverRole(S.userRole)) { pill.className = 'role-pill driver'; pill.textContent = '🚗 Водій'; sr.textContent = 'Водій'; }
            else if (_isPassengerRole(S.userRole)) { pill.className = 'role-pill passenger'; pill.textContent = '👤 Попутник'; sr.textContent = 'Попутник'; }
            else { pill.className = 'role-pill none'; pill.textContent = 'Обрати роль'; sr.textContent = 'Не обрано'; }
            // Організатор — факт про подію, не про роль: водій чи попутник можуть
            // одночасно бути організаторами власної події, тому значок додається
            // поверх пілюлі, а не замінює її текст.
            pill.classList.toggle('is-organizer', Array.isArray(S.myDirections) && S.myDirections.length > 0);
            // Роль — рішення для конкретної події (WD-49). На стартовому екрані новачка
            // пілюля «Обрати роль» лише відволікає від «Хочу поїхати», тому показуємо її,
            // коли людина вже в події: підписка, поїздка або власна подія. Поза подією
            // роль змінюється в профілі.
            const inEvent = (S.subscriptions || []).length > 0 || !!S.activeTrip
                || (Array.isArray(S.myDirections) && S.myDirections.length > 0);
            pill.style.display = inEvent ? '' : 'none';
            document.getElementById('settings-car').textContent = S.car || '—';
            document.getElementById('settings-seats').textContent = S.seats;
            syncProfileSettingsByRole();
        }

        function openRoleSelector(required = false, actionLabel = '') {
            const isDriver = S.userRole === 'driver';
            const isClient = S.userRole === 'client';
            S.roleGateOpen = !!required;
            openSheet(`
                <div class="sheet-title">${required ? 'Як ти їдеш?' : 'Оберіть роль'}</div>
                <div class="sheet-sub">${required ? `Щоб ${escapeHtml(actionLabel || 'продовжити')}, оберіть свій варіант для цієї події. Роль можна змінити пізніше, якщо немає активних домовленостей.` : 'Створювати події можуть обидві ролі. Далі дії залежать від ролі.'}</div>
                <div class="sheet-actions">
                    <button class="btn ${isDriver ? 'btn-primary' : 'btn-secondary'}" onclick="setRole('driver')">🚗 Я повезу людей</button>
                    <button class="btn ${isClient ? 'btn-primary' : 'btn-secondary'}" onclick="setRole('client')">👤 Мені потрібно місце</button>
                    ${required ? '' : '<button class="btn btn-ghost" onclick="closeSheet()">Скасувати</button>'}
                </div>
            `);
        }

        async function setRole(role, options = {}) {
            const normalizedRole = normalizeRole(role);
            if (!normalizedRole) return false;
            if (normalizedRole === S.userRole) {
                // Ghost-guard: локальна роль може випереджати сервер (юзер ще не
                // зареєстрований у link-режимі). Повторний клік тієї ж ролі має
                // все одно гарантувати серверний запис, інакше gate зациклиться.
                if (S.apiBase) await syncUserIdentityToServer();
                if (!options?.keepSheetOpen) closeSheet();
                return true;
            }

            if (S.apiBase) {
                // Спершу гарантуємо існування юзера в БД (register ідемпотентний;
                // для існуючих оновлює лише username) — інакше role POST відповість
                // «ok», нічого не записавши (UPDATE 0 rows), і тост збреше.
                await syncUserIdentityToServer();
                const resp = await apiWithStatus('/api/v3/user/role', {
                    method: 'POST',
                    silent: true,
                    body: JSON.stringify({ user_id: S.userId, role: normalizedRole })
                });
                if (!resp.ok) {
                    const detail = resp?.data?.detail;
                    const reason = (detail && typeof detail === 'object') ? detail.reason : String(detail || '');
                    if (reason === 'role_change_blocked_by_opposite_interest') {
                        // Не глухий кут: показуємо, ДЕ саме скасувати активність.
                        openSheet(`
                            <div class="sheet-title">Зміна ролі поки заблокована</div>
                            <div class="sheet-sub">У вас є активна підписка або запити в поточній ролі. Скасуйте їх на екрані «Поїздки» («Скасувати запит» чи «Вийти з події») — і одразу зможете змінити роль.</div>
                            <div class="sheet-actions">
                                <button class="btn btn-primary" onclick="closeSheet(); switchScreen('trips')">Відкрити Поїздки</button>
                                <button class="btn btn-ghost" onclick="closeSheet()">Зрозуміло</button>
                            </div>
                        `);
                    } else if (reason === 'role_change_blocked_active_trip' || reason === 'cannot_change_role_active_trip') {
                        showToast('Неможливо змінити роль під час активної поїздки', 'error');
                    } else {
                        showToast('Не вдалося змінити роль', 'error');
                    }
                    return false;
                }
            }

            S.userRole = normalizedRole;
            saveProfile();
            updateRolePill();
            if (!options?.keepSheetOpen) closeSheet();
            if (!options?.silentToast) showToast(normalizedRole === 'driver' ? '🚗 Ви водій!' : '👤 Ви попутник!', 'success');
            if (S.currentScreen === 'explore') refreshMap();
            renderSubBar();
            if (S.apiBase) await hydrate();
            const pendingAction = S.pendingRoleAction;
            if (!options?.skipPendingAction) {
                S.pendingRoleAction = null;
                if (pendingAction) setTimeout(() => pendingAction(), 0);
            }
            return true;
        }

        function activeTripSubBarPhase(trip) {
            if (!trip) return '';
            const cancelBy = trip.cancel_requested_by;
            if (cancelBy && !trip.is_started) {
                return String(cancelBy) === String(S.userId) ? 'Скасування' : 'Запит скасування';
            }
            if (trip.is_started) return 'В дорозі до події'; // C (DM-2026-06-16-003, §8.5)
            if (trip.status === 'pickup') return 'Збір'; // 2zi: смужка вгорі = фаза банера
            return 'Резервація';
        }

        function activeTripCrewNumber(trip) {
            if (!trip) return '';
            const eventNumber = crewEventDisplayNumber(trip);
            return eventNumber || trip.crew_display_id || trip.crew_id || trip.request_id || trip.id || '—';
        }

        function crewEventDisplayNumber(item) {
            const direct = Number(item?.crew_event_number ?? item?.event_crew_number);
            if (Number.isFinite(direct) && direct > 0) return String(Math.trunc(direct));

            const dirId = String(item?.direction_id || '');
            if (!dirId) return '';
            const candidateIds = [
                item?.crew_real_id,
                item?.crew_id,
                item?.crew_display_id,
                item?.request_id,
                item?.id
            ].filter(v => v !== undefined && v !== null && String(v) !== '').map(v => String(v));
            const driverId = String(item?.driver_id || item?.organizer_id || '');

            const match = (S.mapCrews || []).find(c => {
                if (String(c?.direction_id || '') !== dirId) return false;
                const crewIds = [c?.crew_real_id, c?.crew_id, c?.crew_display_id]
                    .filter(v => v !== undefined && v !== null && String(v) !== '')
                    .map(v => String(v));
                if (candidateIds.some(id => crewIds.includes(id))) return true;
                return driverId && String(c?.organizer_id || '') === driverId;
            });
            if (!match) return '';
            const mapped = Number(match?.crew_event_number ?? match?.event_crew_number);
            if (Number.isFinite(mapped) && mapped > 0) return String(Math.trunc(mapped));

            const directionCrews = (S.mapCrews || []).filter(c => String(c?.direction_id || '') === dirId);
            const idx = directionCrews.findIndex(c => c === match);
            return idx >= 0 ? String(idx + 1) : '';
        }

        function activeTripSubBarLabel(trip) {
            if (!trip) return '';
            const icon = trip?.viewer_role === 'driver' ? '🚗' : '👤';
            return `${icon} Екіпаж #${escapeHtml(activeTripCrewNumber(trip))} · ${escapeHtml(activeTripSubBarPhase(trip))}`;
        }

        function activeTripSubBarTitle(trip) {
            if (!trip) return '';
            const title = trip?.direction_title || 'Поїздка';
            return `${title} · Екіпаж #${activeTripCrewNumber(trip)} · ${activeTripSubBarPhase(trip)}`;
        }

        function activeTripWaitingSubBarLabel(trip) {
            const icon = trip?.viewer_role === 'driver' ? '🚗' : '👤';
            return `${icon} Екіпаж #${escapeHtml(activeTripCrewNumber(trip))} · Очікування партнера`;
        }

        function activeTripWaitingSubBarTitle(trip) {
            const title = trip?.direction_title || 'Поїздка';
            return `${title} · Екіпаж #${activeTripCrewNumber(trip)} · очікуємо підтвердження партнера`;
        }

        function compactSubBarText(value, fallback = '') {
            const text = String(value || '').replace(/\s+/g, ' ').trim();
            if (!text) return fallback;
            return text.length > 22 ? `${text.slice(0, 21)}...` : text;
        }

        function pendingMatchPartnerName(match, scope) {
            const raw = scope === 'incoming'
                ? (match?.partner_name || match?.sender_name || match?.target_name)
                : (match?.target_name || match?.partner_name || match?.sender_name);
            return compactSubBarText(raw, 'партнера');
        }

        function pendingMatchSubBarLabel(matches, scope) {
            if (matches.length === 1) {
                const partner = pendingMatchPartnerName(matches[0], scope);
                return scope === 'incoming'
                    ? `📩 Новий запит: ${partner}`
                    : `⏳ Чекаємо підтвердження: ${partner}`;
            }
            return scope === 'incoming'
                ? `📩 ${matches.length} запит${matches.length > 1 ? 'ів' : ''}`
                : `⏳ ${matches.length} очікує`;
        }

        function myCrewSubBarLabel(crew) {
            const crewNo = activeTripCrewNumber(crew);
            const crewLabel = crewNo && crewNo !== '—' ? `Екіпаж #${crewNo}` : 'Екіпаж';
            return `🚗 ${crewLabel} · очікуємо попутників`;
        }

        function myCrewSubBarTitle(crew) {
            const crewNo = activeTripCrewNumber(crew);
            const crewLabel = crewNo && crewNo !== '—' ? `Екіпаж #${crewNo}` : 'Екіпаж';
            return `${crewLabel} · відкриті місця · очікуємо попутників`;
        }

        function directionTitleById(dirId, fallback = 'подія') {
            const id = String(dirId || '');
            const sub = (S.subscriptions || []).find(s => String(s?.direction_id ?? s?.id ?? '') === id);
            if (sub) return sub.direction_title || sub.title || fallback;
            const dir = (allDirections || []).find(d => String(d?.id ?? d?.direction_id ?? '') === id);
            return dir?.title || dir?.direction_title || fallback;
        }

        function driverOnboardingSubBarLabel() {
            const title = compactSubBarText(directionTitleById(S._driverOnboardingDirId), 'подія');
            if (S._driverOnboardingPhase === 'pickup') return `🚗 ${title} · вкажіть старт авто`;
            if (S._driverOnboardingPhase === 'method') return `🚗 ${title} · оберіть пошук`;
            if (S._driverOnboardingPhase === 'opening') return `🚗 ${title} · відкриваємо місця`;
            return `🚗 ${title} · відкрийте місця`;
        }

        function driverOnboardingSubBarTitle() {
            const title = directionTitleById(S._driverOnboardingDirId, 'Подія');
            if (S._driverOnboardingPhase === 'pickup') return `${title} · Водій: вкажіть, звідки стартує авто`;
            if (S._driverOnboardingPhase === 'method') return `${title} · Водій: оберіть автоматичний або ручний пошук попутників`;
            if (S._driverOnboardingPhase === 'opening') return `${title} · відкриваємо екіпаж і місця`;
            return `${title} · відкрийте місця для попутників`;
        }

        function subscriptionSubBarLabel(sub) {
            const role = normalizeRole(sub?.role || S.userRole);
            const title = compactSubBarText(sub?.direction_title || sub?.title || `#${sub?.direction_id || sub?.id || ''}`, 'подія');
            if (S.subscriptionSearchHeld) return subscriptionHeldSubBarLabel(title);
            if (S.missedPickup && String(S.missedPickup.direction_id) === String(sub?.direction_id || sub?.id || '')) {
                return `⚠️ ${title} · посадка не відбулась`;
            }
            if (_isDriverRole(role)) return `🚗 ${title} · авто на карту`;
            if (_isPassengerRole(role)) return `👤 ${title} · шукайте водія`;
            return `🧭 ${title}`;
        }

        function subscriptionSubBarTitle(sub) {
            const role = normalizeRole(sub?.role || S.userRole);
            const title = sub?.direction_title || sub?.title || `Подія #${sub?.direction_id || sub?.id || ''}`;
            if (S.subscriptionSearchHeld) return `${title} · Стан участі після поїздки ще оновлюється`;
            if (_isDriverRole(role)) return `${title} · Водій: поставте авто на карту або відкрийте місця`;
            if (_isPassengerRole(role)) return `${title} · Попутник: оберіть водія або вкажіть точку очікування`;
            return title;
        }

        function openSubBarSubscription(dirId) {
            const safeDirId = parseInt(dirId, 10) || 0;
            if (!safeDirId) return;
            if (S.currentScreen === 'explore') {
                openMapSubscribedSheet(safeDirId, { sheetMaxHeight: '65vh' });
                return;
            }
            openDirection(safeDirId);
        }

        // Presentation-only context: which event sheet is currently being
        // viewed. This never writes lifecycle state, survives no reload, and
        // is cleared together with the sheet.
        function rememberViewedDirection(dirId, title = '') {
            const safeDirId = parseInt(dirId, 10) || 0;
            if (!safeDirId) return false;
            S.viewedDirectionId = safeDirId;
            S.viewedDirectionTitle = String(title || cachedDirectionTitle(safeDirId) || `Подія #${safeDirId}`).trim();
            renderSubBar();
            return true;
        }

        function clearViewedDirection() {
            const changed = !!(S.viewedDirectionId || S.viewedDirectionTitle);
            S.viewedDirectionId = null;
            S.viewedDirectionTitle = '';
            if (changed) renderSubBar();
        }

        function subBarIdleFallback() {
            const viewedId = parseInt(S.viewedDirectionId, 10) || 0;
            if (viewedId) {
                const title = String(S.viewedDirectionTitle || cachedDirectionTitle(viewedId) || `Подія #${viewedId}`).trim();
                return { label: `🧭 ${title} · переглядаєте подію`, action: `openDirection(${viewedId})` };
            }
            // Стрічка очікування відкриває пошук там, де людина є, а не викидає з мапи в каталог (власник 2026-09-25).
            if (_isDriverRole(S.userRole)) return { label: '🚗 Водій · оберіть подію', action: 'openStripSearch()' };
            if (_isPassengerRole(S.userRole)) return { label: '👤 Попутник · оберіть подію', action: 'openStripSearch()' };
            return { label: '📌 Оберіть подію, щоб почати', action: 'openStripSearch()' };
        }

        async function openMapActiveTripFromSubBar() {
            if (S.currentScreen !== 'explore') switchScreen('explore');
            closeMapResultPanel();
            await refreshMap();
            focusActiveMapContext();
            verifyMapTripDockState();
            openMapTripCrewSheet();
        }

        async function openMapMyCrewFromSubBar() {
            if (!S.myCrew) return;
            const dirId = parseInt(S.myCrew.direction_id || S.myCrew.id || 0, 10) || 0;
            if (S.currentScreen !== 'explore') switchScreen('explore');
            await hydrate();
            await refreshMap();
            focusActiveMapContext();
            if (S.activeTrip) {
                verifyMapTripDockState();
                openMapTripCrewSheet();
                return;
            }
            if (dirId) openMapMyCrewStatusSheet(dirId);
        }

        function pendingMatchesForDirection(dirId) {
            const safeDirId = String(dirId || '');
            if (!safeDirId) return [];
            return (S.pendingMatches || []).filter(m => m && String(m.direction_id || '') === safeDirId);
        }

        function renderMapPendingMatchRow(m) {
            const isIncoming = m.scope === 'incoming';
            const partnerId = parseInt(m.partner_id || m.sender_id || m.target_id || 0, 10) || 0;
            const dirId = parseInt(m.direction_id || 0, 10) || 0;
            const partnerName = isIncoming
                ? (m.partner_name || m.sender_name || m.target_name || `#${partnerId}`)
                : (m.target_name || m.partner_name || m.sender_name || `#${partnerId}`);
            const dirTitle = m.direction || m.direction_title || 'Подія';
            const tag = isIncoming ? 'потрібна відповідь' : 'чекаємо відповідь';
            const actions = isIncoming
                ? `<button class="btn btn-primary" onclick="respondHandshakeFromMapQueue(${partnerId}, ${dirId}, true)">✅ Прийняти</button>
                   <button class="btn btn-secondary" onclick="respondHandshakeFromMapQueue(${partnerId}, ${dirId}, false)">❌ Відмовити</button>`
                : `<button class="btn btn-secondary" onclick="respondHandshakeFromMapQueue(${partnerId}, ${dirId}, false, 'cancel')">🛑 Скасувати</button>`;
            return `<div style="padding:12px 0;border-bottom:1px solid var(--border);">
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
                    ${renderAvatarInline(partnerName, m.partner_photo_url || m.sender_photo_url || m.target_photo_url || '', 34)}
                    <div style="flex:1;min-width:0;">
                        <div style="font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(partnerName)}</div>
                        <div style="font-size:11px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(dirTitle)} · ${escapeHtml(tag)}</div>
                        ${isIncoming && _isDriverRole(S.userRole) ? `<div data-incoming-pickup-line="true" style="font-size:11px;color:var(--text-secondary);margin-top:2px;">${escapeHtml(incomingPickupLine(m))}</div>` : ''}
                    </div>
                </div>
                <div style="display:flex;gap:8px;">${actions}</div>
            </div>`;
        }

        function openMapMyCrewStatusSheet(dirId) {
            const crew = S.myCrew;
            if (!crew) return false;
            const safeDirId = parseInt(dirId || crew.direction_id || 0, 10) || 0;
            if (!safeDirId) return false;
            const pending = pendingMatchesForDirection(safeDirId);
            const seatsTotal = safeCount(crew.seats_total);
            const seatsFree = safeCount(crew.seats_free);
            const seatsBusy = Math.max(0, seatsTotal - seatsFree);
            const crewNo = activeTripCrewNumber(crew);
            const crewLabel = crewNo && crewNo !== '—' ? `Екіпаж #${crewNo}` : 'Екіпаж';
            const title = directionTitleById(safeDirId, 'подія');
            const pendingRows = pending.map(renderMapPendingMatchRow).join('');
            const pendingLine = pending.length
                ? `${pending.length} ${pluralUk(pending.length, 'запит очікує', 'запити очікують', 'запитів очікують')} відповіді`
                : 'активних запитів немає';
            const seatLine = seatsTotal
                ? `${seatsBusy}/${seatsTotal} місць зайнято або зарезервовано${seatsFree > 0 ? ` · ${seatsFree} ${pluralUk(seatsFree, 'місце вільне', 'місця вільні', 'місць вільно')}` : ''}`
                : (seatsFree > 0 ? `${seatsFree} ${pluralUk(seatsFree, 'місце вільне', 'місця вільні', 'місць вільно')}` : 'місця відкриті');
            const status = pending.length
                ? (seatsFree > 0 ? 'Чекаємо відповіді й можна добирати попутників.' : 'Набір повний: чекаємо відповідей попутників.')
                : (seatsFree > 0 ? 'Авто відкрите: оберіть попутників на карті.' : 'Вільних місць зараз немає.');
            const passengersAction = seatsFree > 0
                ? `<button class="btn btn-primary" onclick="closeSheet(); S.mapEventFilter='passengers'; renderNewsStrip(); refreshMap().then(() => focusMapByFilter())">👤 Попутники</button>`
                : '';
            openSheet(`
                <div data-map-my-crew-sheet="true">
                    <div style="font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--blue);margin-bottom:6px;">Ваше авто на карті</div>
                    <div class="sheet-title">${escapeHtml(crewLabel)}</div>
                    <div class="sheet-sub">${escapeHtml(title)} · ${escapeHtml(seatLine)}</div>
                    <div style="padding:10px;border-radius:8px;background:rgba(56,189,248,0.08);border:1px solid rgba(56,189,248,0.22);font-size:12px;color:var(--text-secondary);line-height:1.45;margin:10px 0;">
                        <strong style="color:var(--text-primary);">${escapeHtml(pendingLine)}.</strong><br>${escapeHtml(status)}
                    </div>
                    ${pendingRows ? `<div style="margin:6px 0 4px;">${pendingRows}</div>` : '<div style="font-size:12px;color:var(--text-muted);padding:10px 0;">Немає запитів на взаємну згоду. Вільних попутників шукайте через фільтр «Попутники».</div>'}
                </div>
                <div class="sheet-actions" data-map-command-count="${passengersAction ? '2' : '1'}">
                    ${passengersAction}
                    <button class="btn btn-ghost" onclick="closeSheet()">Карта</button>
                </div>
            `, { maxHeight: '65vh' });
            return true;
        }

        async function respondHandshakeFromMapQueue(partnerId, dirId, accept, mode = '') {
            const ok = await respondHandshake(partnerId, dirId, accept, mode);
            if (ok) {
                closeSheet();
                verifyHandshakePanelState();
                verifyMapTripDockState();
            }
        }

        async function inviteProposedFromMapQueue(partnerId, dirId) {
            await inviteProposedMatch(partnerId, dirId);
            closeSheet();
        }

        async function declineProposedFromMapQueue(partnerId, dirId) {
            await declineProposedMatch(partnerId, dirId);
            closeSheet();
        }

        function openMapPendingMatchesSheet(scope = 'all') {
            if (S.currentScreen !== 'explore') switchScreen('explore');
            closeMapResultPanel();
            closeHandshakeActionPanel();
            const normalizedScope = String(scope || 'all');
            const matches = (S.pendingMatches || []).filter(m => {
                if (!m) return false;
                if (normalizedScope === 'incoming') return m.scope === 'incoming';
                if (normalizedScope === 'outgoing') return m.scope === 'outgoing';
                return true;
            });
            const rows = matches.map(renderMapPendingMatchRow).join('');
            const pm = (normalizedScope === 'all' || normalizedScope === 'proposed') ? S.proposedMatch : null;
            const proposedHtml = pm ? (() => {
                const partnerId = parseInt(pm.partner_id || 0, 10) || 0;
                const dirId = parseInt(pm.direction_id || 0, 10) || 0;
                const partnerName = pm.partner_name || `#${partnerId}`;
                const dirTitle = pm.direction_title || 'Подія';
                return `<div style="padding:12px 0;border-bottom:1px solid var(--border);">
                    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
                        ${renderAvatarInline(partnerName, pm.partner_photo_url || '', 34)}
                        <div style="flex:1;min-width:0;">
                            <div style="font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(partnerName)}</div>
                            <div style="font-size:11px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(dirTitle)} · пропозиція</div>
                        </div>
                    </div>
                    <div style="display:flex;gap:8px;">
                        <button class="btn btn-primary" onclick="inviteProposedFromMapQueue(${partnerId}, ${dirId})">✓ Запросити</button>
                        <button class="btn btn-secondary" onclick="declineProposedFromMapQueue(${partnerId}, ${dirId})">✕ Пропустити</button>
                    </div>
                </div>`;
            })() : '';
            if (!rows && !proposedHtml) {
                showToast('Активних запитів немає', '');
                return;
            }
            openSheet(`
                <div class="sheet-title">Запити на карті</div>
                <div class="sheet-sub">Поточні рішення можна закрити тут, не переходячи у «Поїздки».</div>
                <div style="margin:10px 0 4px;">${rows}${proposedHtml}</div>
                <div class="sheet-actions" data-map-command-count="1">
                    <button class="btn btn-ghost" onclick="closeSheet()">Карта</button>
                </div>
            `, { maxHeight: '65vh' });
        }

        // A11y (Codex #8): будь-який [role="button"] активується з клавіатури
        // як справжня кнопка — ОДНА делегація на документ, без по-елементних
        // слухачів. Enter/Space → click; Space не скролить сторінку.
        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Enter' && e.key !== ' ') return;
            const t = e.target;
            if (t instanceof Element && t.tagName !== 'BUTTON' && t.tagName !== 'A'
                && t.matches('[role="button"][tabindex]')) {
                e.preventDefault();
                t.click();
            }
        });

        // ─── SUBSCRIPTION BAR ───
        function renderSubBar() {
            const bar = document.getElementById('sub-bar');
            if (!bar) return;
            const parts = [];
            if (S.activeTrip) {
                const t = S.activeTrip;
                const partnerDone = tripPartnerFinished(t);
                const myDone = tripViewerFinished(t);
                let label = activeTripSubBarLabel(t);
                let title = activeTripSubBarTitle(t);
                let cls = 'sub-bar-crew';
                if (waitingForPartner) {
                    label = activeTripWaitingSubBarLabel(t);
                    title = activeTripWaitingSubBarTitle(t);
                    cls = 'sub-bar-pending';
                } else if (partnerDone && !myDone) {
                    label = `🏁 Екіпаж #${escapeHtml(activeTripCrewNumber(t))} · Партнер чекає фініш`;
                    title = `${t?.direction_title || 'Поїздка'} · партнер уже підтвердив фініш`;
                    cls = 'sub-bar-pending';
                }
                parts.push(`<div class="${cls}" role="button" tabindex="0" title="${escapeAttr(title)}" aria-label="${escapeAttr(title)}" onclick="openMapActiveTripFromSubBar()">${label}</div>`);
            }
            if (!S.activeTrip && waitingForPartner) {
                parts.push(`<div class="sub-bar-pending" role="button" tabindex="0" onclick="openMapActiveTripFromSubBar()">⏳ Очікуємо підтвердження партнера</div>`);
            }
            if (!S.activeTrip && !waitingForPartner && hasPendingRating()) {
                parts.push(`<div class="sub-bar-pending" role="button" tabindex="0" onclick="maybeOpenCompletedTripRatingSheet('subbar') || openMapActiveTripFromSubBar()">⭐ Оцініть поїздку</div>`);
            }
            const incoming = S.pendingMatches.filter(m => m.scope === 'incoming');
            if (incoming.length > 0) parts.push(`<div class="sub-bar-pending" role="button" tabindex="0" onclick="openMapPendingMatchesSheet('incoming')">${escapeHtml(pendingMatchSubBarLabel(incoming, 'incoming'))}</div>`);
            const outgoing = S.pendingMatches.filter(m => m.scope === 'outgoing');
            if (outgoing.length > 0) parts.push(`<div class="sub-bar-pending" role="button" tabindex="0" onclick="openMapPendingMatchesSheet('outgoing')">${escapeHtml(pendingMatchSubBarLabel(outgoing, 'outgoing'))}</div>`);
            // Active trip/reservation owns the lifecycle context. Do not show the
            // open-crew recruitment pill beside it; capacity remains visible in
            // the trip dock and map pin.
            if (S.myCrew && !S.activeTrip) {
                const label = myCrewSubBarLabel(S.myCrew);
                const title = myCrewSubBarTitle(S.myCrew);
                parts.push(`<div class="sub-bar-crew" role="button" tabindex="0" title="${escapeAttr(title)}" aria-label="${escapeAttr(title)}" onclick="openMapMyCrewFromSubBar()">${escapeHtml(label)}</div>`);
            }
            if (!S.activeTrip && !S.myCrew && S._driverOnboardingActive && _isDriverRole(S.userRole)) {
                const label = driverOnboardingSubBarLabel();
                const title = driverOnboardingSubBarTitle();
                parts.push(`<button type="button" class="sub-bar-chip" title="${escapeAttr(title)}" aria-label="Продовжити оформлення: ${escapeAttr(title)}" onclick="resumeDriverOnboarding()" ${S._driverOnboardingPhase === 'opening' ? 'disabled' : ''}>${escapeHtml(label)}${S._driverOnboardingPhase === 'opening' ? '' : ' · Продовжити оформлення'}</button>`);
            }
            const subs = S.subscriptions || [];
            if (subs.length > 0 && !S.activeTrip && incoming.length === 0 && outgoing.length === 0 && !waitingForPartner) {
                subs.slice(0, 3).forEach(s => {
                    const dirId = parseInt(s.direction_id ?? s.id, 10) || 0;
                    if (!dirId) return;
                    if (S.myCrew && String(dirId) === String(S.myCrew.direction_id || '')) return;
                    const label = subscriptionSubBarLabel(s);
                    const title = subscriptionSubBarTitle(s);
                    parts.push(`<div class="sub-bar-chip" role="button" tabindex="0" title="${escapeAttr(title)}" aria-label="${escapeAttr(title)}" onclick="openSubBarSubscription(${dirId})">${escapeHtml(label)}</div>`);
                });
                if (subs.length > 3) parts.push(`<div class="sub-bar-text">+${subs.length - 3} ще</div>`);
            }
            if (parts.length === 0) {
                const fallback = subBarIdleFallback();
                parts.push(`<div class="sub-bar-text" role="button" tabindex="0" onclick="${fallback.action}">${escapeHtml(fallback.label)}</div>`);
            }
            bar.innerHTML = parts.join('');
        }

        // ─── OPEN CREW ───
        async function openMyCrew() {
            if (!requireRoleForAction('відкрити місця', () => openMyCrew())) return;
            if (!_isDriverRole(S.userRole)) { showToast('Відкрити місця може тільки водій', 'error'); openRoleSelector(); return; }
            if (!beginOp('open_crew_sheet')) return;
            try {
                const dirs = S.subscriptions.length > 0 ? S.subscriptions : (await api(`/api/v3/board?lang=${S.lang}`))?.directions || [];
                if (!dirs.length) { endOp('open_crew_sheet'); showToast('Спочатку підпишіться на подію', 'error'); switchScreen('board'); return; }
                if (dirs.length === 1) { await doOpenCrew(dirs[0].direction_id || dirs[0].id); return; }
                openSheet(`
                <div class="sheet-title">Я водій: відкрити місця</div>
                <div class="sheet-sub">Оберіть подію, на яку готові взяти попутників.</div>
                <div class="sheet-actions">
                    ${dirs.map(d => {
                    const did = d.direction_id || d.id;
                    const title = d.direction_title || d.title || `#${did}`;
                    return `<button class="btn btn-secondary" onclick="doOpenCrew(${did});closeSheet();">${escapeHtml(title)}</button>`;
                }).join('')}
                    <button class="btn btn-ghost" onclick="closeSheet()">Скасувати</button>
                </div>
            `);
            } finally {
                endOp('open_crew_sheet');
            }
        }

        async function doOpenCrew(dirId, options = {}) {
            if (!requireRoleForAction('відкрити місця', () => doOpenCrew(dirId, options))) return;
            if (!_isDriverRole(S.userRole)) { showToast('Відкрити місця може тільки водій', 'error'); openRoleSelector(); return; }
            if (!S.pickupCoords?.lat || !S.pickupCoords?.lng) {
                const picked = await pickPickupLocation(dirId, { kind: 'driver_start' });
                if (!picked) { showToast('Поставте авто на карту', 'error'); return false; }
            }
            if (!beginOp('open_crew_submit')) return;
            let opened = false;
            try {
                const pickupText = String(S.pickupLabel || '').trim() || `${S.pickupCoords.lat.toFixed(5)}, ${S.pickupCoords.lng.toFixed(5)}`;
                // D1: явний вибір оформлення приходить в options.seats; профіль S.seats змінюємо лише після успіху.
                const requestedSeats = Number(options?.seats) > 0 ? options.seats : S.seats;
                const openSeats = Math.max(1, Math.min(4, seatCount(requestedSeats, 4) || 1));
                const payload = {
                    user_id: S.userId,
                    direction_id: dirId,
                    pickup: pickupText,
                    seats: openSeats,
                    auto_match: options?.autoMatch !== false
                };
                // Re-opening seats from an existing subscription preserves its
                // chosen mode unless this invocation explicitly changes it.
                const activeSub = (S.subscriptions || []).find(s => String(s?.direction_id ?? s?.id ?? '') === String(dirId));
                if (options?.autoMatch == null && activeSub) payload.auto_match = activeSub.auto_match !== false;
                if (S.pickupCoords?.lat && S.pickupCoords?.lng) {
                    payload.pickup_lat = S.pickupCoords.lat;
                    payload.pickup_lng = S.pickupCoords.lng;
                }
                const response = await apiWithStatus('/api/v3/crews/open', {
                    method: 'POST',
                    silent: true,
                    body: JSON.stringify(payload)
                });
                const res = response?.data;
                if (response?.ok && (res?.status === 'ok' || res?.crew_id)) {
                    opened = true;
                    S.seats = openSeats;
                    S.myCrew = {
                        crew_id: res.crew_id,
                        crew_real_id: res.crew_id,
                        crew_event_number: res.crew_event_number,
                        direction_id: dirId,
                        auto_match: res?.auto_match ?? payload.auto_match
                    };
                    showToast(payload.auto_match
                        ? '🚗 Екіпаж відкрито · автопошук активний'
                        : '🚗 Екіпаж відкрито · шукайте попутників на карті', 'success');
                    clearPickupMarkerOnly();
                    await hydrate();
                    if (options?.keepMapSheet) {
                        // DM-2026-06-15-002 (§8.1): закрити wizard-шторку «Як знайти попутників?»
                        // яка лишалась .open після keepMapSheet-шляху і блокувала maybeOpenMatchSheet().
                        closeSheet();
                        switchScreen('explore');
                        renderNewsStrip();
                        await refreshMap();
                        // Модал «Екіпаж відкрито» прибрано (DM-2026-06-14-008): карта
                        // сама показує статус — власна пінешка (map-pin-mine + пульс) +
                        // тост + СТАТУС-банер. Фокусуємось саме на своїй машині.
                        if (S.pickupCoords?.lat && S.pickupCoords?.lng && S.map) {
                            S.map.flyTo([S.pickupCoords.lat, S.pickupCoords.lng], 16, { duration: 0.8 });
                        } else {
                            focusActiveMapContext();
                        }
                        return true;
                    }
                    closeSheet();
                    switchScreen('trips');
                } else if (res?.reason === 'active_trip_other_direction') {
                    openActiveTripOtherDirectionConflict(res);
                } else {
                    showToast(getErrorMessage(res, 'Не вдалося відкрити екіпаж'), 'error');
                }
            } catch (e) { showToast('Помилка створення екіпажу', 'error'); }
            finally {
                endOp('open_crew_submit');
                if (opened) {
                    S._driverOnboardingActive = false;
                    S._driverOnboardingDirId = null;
                    S._driverOnboardingPhase = '';
                    S._driverOnboardingSeats = null;
                } else if (S._driverOnboardingActive) {
                    // D1: після відмови шторка способу лишається — повтор несе ті самі місця й точку старту.
                    S._driverOnboardingPhase = 'method';
                    renderSubBar();
                }
            }
        }

        // ─── NAVIGATION ───
        function switchScreen(name) {
            S.currentScreen = name;

            closeBlockingSheetForScreen(name);
            document.querySelectorAll('.screen').forEach(el => {
                const active = el.id === `screen-${name}`;
                el.classList.toggle('active', active);
                el.toggleAttribute('inert', !active);
                el.setAttribute('aria-hidden', active ? 'false' : 'true');
            });

                el.classList.toggle('active', el.dataset.tab === name);

            });

            if (name !== 'trips') { document.body.style.paddingBottom = ''; }
