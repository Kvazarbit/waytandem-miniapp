        function directionInviteSocialProof(dir, organizers = [], eventSummary = {}) {
            const orgs = Array.isArray(organizers) ? organizers : [];
            const driverOrgs = orgs.filter(o => normalizeRole(o?.role || 'driver') === 'driver');
            const summary = (eventSummary && typeof eventSummary === 'object') ? eventSummary : {};
            const hasEventSummary = summary.drivers_total != null;
            const dirDrivers = safeCount(dir?.drivers ?? dir?.drivers_count);
            const dirPassengers = safeCount(dir?.passengers ?? dir?.passengers_count);
            const drivers = hasEventSummary
                ? safeCount(summary.drivers_total)
                : Math.max(dirDrivers, driverOrgs.length);
            const passengers = hasEventSummary
                ? safeCount(summary.passengers_matched)
                    + safeCount(summary.passengers_without_seat ?? summary.passengers_waiting)
                    + safeCount(summary.passengers_pending)
                : dirPassengers;
            const openSeats = hasEventSummary
                ? safeCount(summary.open_seats)
                : orgs.reduce((sum, o) => sum + safeCount(o?.seats_free), 0);
            const driverCount = drivers;
            const total = eventPeopleTotal(drivers, passengers) || orgs.length;
            const participantLine = total > 0
                ? eventPeopleLabel(drivers, passengers)
                : 'Будьте серед перших учасників';
            const driverLine = driverCount > 0
                ? `${driverCount} ${pluralUk(driverCount, 'водій', 'водії', 'водіїв')}${openSeats > 0 ? ` • ${openSeats} ${pluralUk(openSeats, 'вільне місце', 'вільні місця', 'вільних місць')}` : ''}`
                : 'Водії ще збираються';
            return { participantLine, driverLine, total, driverCount, openSeats };
        }

        function mapInviteContext(dirId) {
            const safeDirId = parseInt(dirId) || 0;
            const cached = S.directionDetailsCache?.[safeDirId] || {};
            const localDir = allDirections.find(d => String(d.id) === String(safeDirId)) || {};
            // UX-fix (ChatFlowLogic беклог №1): візард не має права казати
            // «Подія #ID» і «Водії ще збираються», коли пам'ять мапи вже знає
            // правду. Дотягуємо контекст з живих джерел: фід-пін (назва/лічильники)
            // і екіпажі мапи (водії+вільні місця). Холодний кеш дозаповнюється
            // асинхронно (_hydrateInviteContextOnce) з in-place оновленням хедера.
            const feedItem = (Array.isArray(S.news) ? S.news : [])
                .find(n => String(n?.direction_id || n?.id) === String(safeDirId)) || {};
            const dirCrews = (S.mapCrews || [])
                .filter(c => String(c?.direction_id || '') === String(safeDirId));
            const dir = { ...feedItem, ...localDir, ...(cached.direction || {}), id: safeDirId };
            const liveCrewOrgs = dirCrews.map(c => ({
                    user_id: c.organizer_id,
                    name: c.driver_name || c.organizer_name || '',
                    role: 'driver',
                    seats_free: safeCount(c?.seats_free ?? c?.free_seats ?? c?.available_seats),
                }));
            const orgs = liveCrewOrgs.length
                ? liveCrewOrgs
                : (Array.isArray(cached.organizers) ? cached.organizers : []);
            _hydrateInviteContextOnce(safeDirId);
            const creatorId = dir.creator_id || dir.user_id || '';
            const isMyDir = creatorId && String(creatorId) === String(S.userId);
            const creatorName = dir.creator_name || (isMyDir ? S.userName : '') || '';
            const creatorUsername = sanitizeBotUsername(dir.creator_username || (isMyDir ? S.userUsername : '') || '');
            const creatorDisplay = creatorName || (creatorUsername ? '@' + creatorUsername : 'організатор');
            return {
                safeDirId,
                dir,
                orgs,
                title: dir.title || dir.name || dir.direction_title || `Подія #${safeDirId}`,
                creatorDisplay,
                proof: directionInviteSocialProof(dir, orgs, cached.event_summary)
            };
        }

        function renderMapInviteContextHeader(ctx) {
            return `
                <div data-map-sheet-context="event" data-map-sheet-dir-id="${parseInt(ctx.safeDirId) || 0}" style="padding:10px;border:1px solid rgba(56,189,248,0.22);border-radius:8px;background:rgba(56,189,248,0.07);margin-bottom:12px;">
                    <div style="font-size:13px;font-weight:900;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(ctx.title)}</div>
                    <div style="display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-secondary);margin-top:6px;min-width:0;">${organizerMiniHtml(ctx)}<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(ctx.creatorDisplay)} · ${escapeHtml(ctx.proof.participantLine)} · ${escapeHtml(ctx.proof.driverLine)}</span></div>
                </div>`;

        // НА МІСЦІ (без перевідкриття шторки). Якщо шторку вже закрили або
        // відкрили для іншої події — no-op.
        function _refreshMapInviteContextHeaderDom(dirId) {
            const safeDirId = parseInt(dirId) || 0;

        function _refreshMapInviteContextSurfaces(dirId) {
            const safeDirId = parseInt(dirId) || 0;
            _refreshMapInviteContextHeaderDom(safeDirId);
            const panel = document.getElementById('map-result-panel');
            const meta = panel && panel._mapResultMeta;
            if (!panel || !panel.classList.contains('open') || !meta) return;
            if (meta.kind === 'auto_search' && String(meta.dirId || '') === String(safeDirId)) {

        function _hydrateInviteContextOnce(dirId) {
            const safeDirId = parseInt(dirId) || 0;
            if (!safeDirId || !S.apiBase) return;
            S.directionDetailsCache = S.directionDetailsCache || {};
            if (S.directionDetailsCache[safeDirId]?.direction) return;
            S.directionDetailsFetching = S.directionDetailsFetching || new Set();
            if (S.directionDetailsFetching.has(safeDirId)) return;
            S.directionDetailsFetching.add(safeDirId);
            api(`/api/v3/fractal/organizers?direction_id=${safeDirId}&lang=${S.lang}&user_id=${S.userId || ''}`)
                .then(data => {
                    if (data && (data.direction || data.organizers)) {
                        S.directionDetailsCache[safeDirId] = data;
                        _refreshMapInviteContextSurfaces(safeDirId);
                    }
                })
                .catch(() => {})
                .finally(() => S.directionDetailsFetching.delete(safeDirId));
        }

                    </div>` : ''}
                    <div style="padding:10px;border:1px solid rgba(56,189,248,0.22);border-radius:8px;background:rgba(56,189,248,0.07);font-size:12px;color:var(--text-secondary);line-height:1.4;margin-bottom:12px;">

            const ctx = mapInviteContext(dirId);

            // Роль загальна (власник 2026-09-26): поточна роль уже вибрана — досить «Далі», змінити можна тут же.
            if (!S.mapInviteRoleDraft && normalizeRole(S.userRole)) {

                    ${roleOption('client', '👤 Шукаю місце', 'Хочу приєднатися до водія.')}

            const safeDirId = parseInt(dirId) || 0;

            body?.querySelectorAll('[data-map-role-option]').forEach(option => {
                const selected = option.dataset.mapRoleOption === normalizedRole;

            const nextButton = body?.querySelector('[data-map-role-continue]');
            if (nextButton) nextButton.disabled = false;
            // Смужка кроків: водій має ще крок «Місця» — видно одразу, без стрибка «2 із 3» → «3 із 4» (2026-09-26).
            const stepsBar = body?.querySelector('.join-steps');
            if (stepsBar) stepsBar.outerHTML = joinStepsHtml('Роль', _isDriverRole(normalizedRole));
            return true;

        async function confirmMapInviteRole(dirId) {
            const safeDirId = parseInt(dirId) || 0;
            const draftRole = String(S.mapInviteRoleDraft?.directionId || '') === String(safeDirId)
                ? normalizeRole(S.mapInviteRoleDraft?.role || '')
                : '';
            if (!safeDirId || !draftRole) return false;
            return chooseMapInviteRole(safeDirId, draftRole);

        async function chooseMapInviteRole(dirId, role) {
            const safeDirId = parseInt(dirId) || 0;
            const normalizedRole = normalizeRole(role);
            if (!safeDirId || !normalizedRole) return false;
            S.pendingRoleAction = null;
            const roleOk = await setRole(normalizedRole, { keepSheetOpen: true, silentToast: true, skipPendingAction: true });
            if (!roleOk) return false;
            // Водій: спершу скільки місць → звідки старт → як шукати (без порожнього
            // повторення «постав авто»). Попутник лишається на старому метод-кроці.
            if (_isDriverRole(S.userRole)) return openMapDriverSeatsSheet(safeDirId);

            if (!ctx.safeDirId) return false;
            const isDriver = _isDriverRole(S.userRole);
            const title = isDriver ? 'Поставте авто на карту' : 'Як шукати?';
            const sub = isDriver
                ? 'Спершу покажіть, звідки стартуєте. Далі попутники побачать вашу машину, а ви зможете запрошувати людей на карті.'
                : 'Оберіть спосіб. Резервація зʼявиться тільки після згоди обох сторін.';
            const manualLabel = isDriver ? '🚗 Поставити авто на карту' : '🗺 Виберу водія сам';
            const autoLabel = isDriver ? '✨ Автоматичний пошук попутників' : '✨ Знайти місце автоматично';
            wizardShow(ctx.safeDirId, `
                ${joinInlineBox(ctx.safeDirId) ? '' : renderMapInviteContextHeader(ctx)}

                <div class="sheet-title">${escapeHtml(title)}</div>
                <div class="sheet-sub">${escapeHtml(sub)}</div>
                <div class="sheet-actions" data-map-command-count="3">
                    <button class="btn btn-primary" onclick="chooseMapInviteMethod(${ctx.safeDirId}, false)">${manualLabel}</button>
                    <button class="btn btn-secondary" onclick="chooseMapInviteMethod(${ctx.safeDirId}, true)">${autoLabel}</button>
                    <button class="btn btn-ghost" onclick="openMapInviteRoleSheet(${ctx.safeDirId})">Назад</button>
                </div>
            `, { maxHeight: '65vh' });

        async function chooseMapInviteMethod(dirId, auto) {
            const safeDirId = parseInt(dirId) || 0;
            if (!safeDirId) return false;
            if (guardPassengerRequestWhileInTrip()) return false;
            const autoMatch = !!auto;
            clearPickupPoint();
            // closeSheetAfterConfirm: 06-04 UX-trap (sheet поверх карти блокував тап по
            // машині) — прямий шлях до пікера зобов'язаний закривати шторку після
            // підтвердження, людина лишається на карті зі своїм піном.
            const picked = await pickPickupLocation(safeDirId, { kind: 'passenger_wait', persistUserLocation: true, closeSheetAfterConfirm: true });
            if (!picked) {
                openMapInviteMethodSheet(safeDirId);
                return false;
            }
            // suppressSubscribedSheet: map-manual шлях лишає людину НА КАРТІ зі своїм
            // піном (канон 06-04); «підписка активна» шторка тут була б тією ж
            // пасткою, що блокує тапи по екіпажах.
            if (!autoMatch) {
                S.mapResultCollapsed = true;
                persistCriticalState();
            }
            const subOk = await subscribeDir(safeDirId, {
                afterSuccessScreen: 'explore',
                keepSheetOpen: true,
                mapInline: true,
                manualOnly: !autoMatch,
                suppressSubscribedSheet: true,
                successToast: !autoMatch ? '✓ Точку очікування вказано' : '',
            });
            // UX-fix #4: «Виберу водія сам» більше не кидає людину на порожню карту —
            // одразу показуємо ранжований список екіпажів (відстань від точки очікування),
            // з якого можна запроситись в один тап. Карта лишається доступною («Закрити»).
            if (subOk && !autoMatch && !S.activeTrip) { openMapManualSearchPanel(safeDirId); openNearbyCrewsSheet(safeDirId); }
            // UX-fix: автопошук з карти — показуємо компактний банер «Шукаємо…» внизу
            // карти. Без нього людина лишається на порожній карті без зворотного зв'язку
            // (тост зникає за 2 сек, а інформація доступна тільки у вкладці «Поїздки»).
            if (subOk && autoMatch && !S.activeTrip && !hasHandshakeActionSurface()) openMapAutoSearchPanel(safeDirId);
            return subOk;
        }

        function _geoDistKm(lat1, lng1, lat2, lng2) {
            const toRad = (v) => (Number(v) || 0) * Math.PI / 180;
            const R = 6371;
            const dLat = toRad(lat2 - lat1);
            const dLng = toRad(lng2 - lng1);
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function _fmtDistKm(km) {
            if (!Number.isFinite(km)) return '';
            if (km < 1) return `≈ ${Math.max(50, Math.round(km * 1000 / 50) * 50)} м`;
            return `≈ ${km < 10 ? km.toFixed(1) : Math.round(km)} км`;
        }

        function buildNearbyCrewsSheetBody(dirId) {
            const safeDirId = parseInt(dirId) || 0;
            if (!safeDirId) return '';
            const myLat = Number(S.pickupCoords?.lat);
            const myLng = Number(S.pickupCoords?.lng);
            const hasMyPoint = Number.isFinite(myLat) && Number.isFinite(myLng);
            const crews = (S.mapCrews || [])
                .filter(c => String(c?.direction_id || '') === String(safeDirId))
                .filter(c => String(c?.organizer_id || '') !== String(S.userId))
                .map(c => {
                    const lat = Number(c?.lat), lng = Number(c?.lng);
                    const dist = hasMyPoint && Number.isFinite(lat) && Number.isFinite(lng)
                        ? _geoDistKm(myLat, myLng, lat, lng) : NaN;
                    return { ...c, _dist: dist };
                })
                .sort((a, b) => (Number.isFinite(a._dist) ? a._dist : 1e9) - (Number.isFinite(b._dist) ? b._dist : 1e9));
            if (!crews.length) {
                return `
                    <div data-nearby-crews-sheet-dir-id="${safeDirId}">
                    <div class="sheet-title">Поки немає відкритих екіпажів</div>
                    <div class="sheet-sub">У цій події ще ніхто не відкрив місця. Ви підписані — щойно з'явиться водій, побачите його на карті та отримаєте запит тут.</div>
                    <div class="sheet-actions">
                        <button class="btn btn-primary" onclick="closeSheet()">Зрозуміло</button>
                    </div>
                    </div>`;
            }
            const rows = crews.slice(0, 12).map(c => {
                const orgId = parseInt(c.organizer_id) || 0;
                const name = c.driver_name || c.organizer_name || 'Екіпаж';
                const freeSeats = safeCount(c?.seats_free ?? c?.free_seats ?? c?.available_seats);
                const seatsHtml = freeSeats > 0
                    ? `<span style="color:#22c55e;font-weight:700;">${freeSeats} ${pluralUk(freeSeats, 'місце', 'місця', 'місць')}</span>`
                    : `<span style="color:var(--text-muted);">місць немає</span>`;
                const distHtml = Number.isFinite(c._dist) ? ` · ${_fmtDistKm(c._dist)} від вас` : '';
                const btn = freeSeats > 0
                    ? `<button class="btn btn-primary" style="padding:8px 12px;font-size:12px;min-height:36px;width:auto;" onclick="requestJoin(${orgId}, ${safeDirId}, { source: 'map', keepMapContext: true })">Запроситись</button>`
                    : '';
                return `<div style="display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;background:rgba(255,255,255,0.03);">
                    ${renderAvatarInline(name, c.driver_photo_url || c.organizer_photo_url || '', 38)}
                    <div style="flex:1;min-width:0;">
                        <div style="font-weight:800;font-size:13px;">${escapeHtml(name)}</div>
                        <div style="font-size:11px;color:var(--text-secondary);margin-top:2px;">${seatsHtml}${escapeHtml(distHtml)}</div>
                    </div>
                    ${btn}
                </div>`;
            }).join('');
            return `
                <div data-nearby-crews-sheet-dir-id="${safeDirId}">
                <div class="sheet-title">Оберіть екіпаж</div>
                <div class="sheet-sub">Водії цієї події, найближчі до вашої точки очікування — зверху.</div>
                <div style="margin:12px 0 4px;max-height:42vh;overflow-y:auto;">${rows}</div>
                <div class="sheet-actions">
                    <button class="btn btn-secondary" onclick="closeSheet()">🗺 Дивитись на карті</button>
                </div>
                </div>`;
        }

        function openNearbyCrewsSheet(dirId) {
            const safeDirId = parseInt(dirId) || 0;
            if (!safeDirId) return false;
            openSheet(buildNearbyCrewsSheetBody(safeDirId), { maxHeight: '70vh' });
            return true;
        }

        function refreshOpenNearbyCrewsSheet() {
            const sheet = document.getElementById('sheet');
            const body = document.getElementById('sheet-body');
            if (!sheet?.classList.contains('open') || !body) return false;
            const marker = body.querySelector('[data-nearby-crews-sheet-dir-id]');
            if (!marker) return false;
            const dirId = parseInt(marker.dataset.nearbyCrewsSheetDirId || 0, 10) || 0;
            if (!dirId) return false;
            const scrollTop = body.scrollTop;
            body.innerHTML = buildNearbyCrewsSheetBody(dirId);
            body.scrollTop = scrollTop;
            return true;
        }

        // ─── Водійський онбординг: місця → старт → метод (замість потрійного «постав авто») ───
        function openMapDriverSeatsSheet(dirId) {
            if (S._driverOnboardingPhase === 'opening' || S._driverPickupPending) return false;
            const ctx = mapInviteContext(dirId);
            if (!ctx.safeDirId) return false;
            const chip = (n) => `<button type="button" class="btn btn-secondary" data-seat="${n}" style="flex:1;text-align:center;" onclick="chooseDriverSeats(${ctx.safeDirId}, ${n})">${n}</button>`;
            wizardShow(ctx.safeDirId, `
                ${joinInlineBox(ctx.safeDirId) ? '' : renderMapInviteContextHeader(ctx)}
                ${joinStepsHtml('Місця', true)}
                <div class="sheet-title">Скільки місць для попутників?</div>
                <div class="sheet-sub">Стільки людей зможе сісти до вас в авто. Можна змінити пізніше.</div>
                <div style="display:flex;gap:8px;margin:12px 0 4px;">${chip(1)}${chip(2)}${chip(3)}${chip(4)}</div>
                <div class="sheet-actions" data-map-command-count="1">
                    <button class="btn btn-ghost" onclick="openMapInviteRoleSheet(${ctx.safeDirId})">Назад</button>
                    ${S._driverOnboardingActive ? '<button class="btn btn-ghost" onclick="cancelDriverOnboarding()">Скасувати оформлення</button>' : ''}
                </div>
            `, { maxHeight: '65vh' });
            return true;
        }

        async function chooseDriverSeats(dirId, seats) {
            const safeDirId = parseInt(dirId) || 0;
            if (!safeDirId || S._driverPickupPending || S._driverOnboardingPhase === 'opening') return false;
            S._driverPickupPending = true;
            // D1: вибір — чернетка цього екіпажу, не профіль (S.seats); hydrate/налаштування її не бачать.
            S._driverOnboardingSeats = Math.max(1, Math.min(4, parseInt(seats) || 1));
            // DM-2026-06-28-001 (§8.11): активний driver-онбординг — щоб фоновий poll/hydrate
            // (syncTerminalIdleState) не обнуляв щойно поставлену точку старту, поки підписки
            // ще нема. Закриття пікера залишає чернетку для явного продовження.
            S._driverOnboardingActive = true;
            S._driverOnboardingDirId = safeDirId;
            S._driverOnboardingPhase = 'pickup';
            renderSubBar();
            // Звідки стартуєш? Точку беремо ДО підписки — pickPickupLocation її не вимагає.
            let picked;
            try {
                picked = await pickPickupLocation(safeDirId, { kind: 'driver_start' });
            } finally { S._driverPickupPending = false; }
            if (!S._driverOnboardingActive || S._driverOnboardingDirId !== safeDirId || !_isDriverRole(S.userRole)) return false;
            if (!picked) { renderSubBar(); return false; }
            S._driverOnboardingPhase = 'method';
            renderSubBar();
            return openMapDriverMethodSheet(safeDirId);
        }

        function cancelDriverOnboarding() {
            if (!S._driverOnboardingActive || S.activeTrip || S.myCrew || S._driverOnboardingPhase === 'opening') return false;
            closeLocationPicker();
            S._driverOnboardingActive = false;
            S._driverOnboardingDirId = null;
            S._driverOnboardingPhase = '';
            S._driverOnboardingSeats = null;
            if (S.pickupKind === 'driver_start') clearPickupPoint();
            S.joinInlineDirId = null;
            closeSheet();
            renderSubBar();
            return true;
        }

        function resumeDriverOnboarding() {
            if (!S._driverOnboardingActive || !_isDriverRole(S.userRole) || S.activeTrip || S.myCrew || S._driverPickupPending || S._driverOnboardingPhase === 'opening') return false;
            const dirId = parseInt(S._driverOnboardingDirId, 10) || 0;
            if (!dirId) return false;
            // A closed event sheet may still own an inline box in the hidden DOM.
            S.joinInlineDirId = null;
            if (S._driverOnboardingPhase === 'method' && S.pickupKind === 'driver_start' && Number.isFinite(S.pickupCoords?.lat) && Number.isFinite(S.pickupCoords?.lng)) {
                return openMapDriverMethodSheet(dirId);
            }
            return chooseDriverSeats(dirId, driverDraftSeats(dirId));
        }

        // D1: місця, які показує і відкриває оформлення цієї події: явна чернетка, інакше профіль.
        function driverDraftSeats(dirId) {
            const draft = S._driverOnboardingSeats;
            const sameDir = String(S._driverOnboardingDirId ?? '') === String(parseInt(dirId) || '');
            const seats = Number(draft) > 0 && sameDir ? draft : S.seats;
            return Math.max(1, Math.min(4, seatCount(seats, 4) || 1));
        }

        function openMapDriverMethodSheet(dirId) {
            const ctx = mapInviteContext(dirId);
            if (!ctx.safeDirId) return false;
            wizardShow(ctx.safeDirId, `
                ${joinInlineBox(ctx.safeDirId) ? '' : renderMapInviteContextHeader(ctx)}
                ${joinStepsHtml('Спосіб', true)}
                <div class="sheet-title">Як знайти попутників?</div>
                <div class="sheet-sub">Місць: ${driverDraftSeats(ctx.safeDirId)}. Старт авто вказано на карті. Оберіть, як шукати людей.</div>
                <div class="sheet-actions" data-map-command-count="3">
                    <button class="btn btn-primary" onclick="chooseDriverMethod(${ctx.safeDirId}, true)">✨ Знайти автоматично</button>
                    <button class="btn btn-secondary" onclick="chooseDriverMethod(${ctx.safeDirId}, false)">🗺 Я знайду на карті</button>
                    <button class="btn btn-ghost" onclick="openMapDriverSeatsSheet(${ctx.safeDirId})">Назад</button>
                    <button class="btn btn-ghost" onclick="cancelDriverOnboarding()">Скасувати оформлення</button>
                </div>
            `, { maxHeight: '65vh' });
            return true;
        }

        async function chooseDriverMethod(dirId, auto) {
            const safeDirId = parseInt(dirId) || 0;
            if (!safeDirId || S._driverPickupPending || S._driverOnboardingPhase === 'opening') return false;
            const autoMatch = !!auto;
            const selectedSeats = driverDraftSeats(safeDirId);
            S._driverOnboardingDirId = safeDirId;
            S._driverOnboardingPhase = 'opening';
            renderSubBar();
            if (!autoMatch) {
                S.mapResultCollapsed = true;
                persistCriticalState();
            }
            // Crew-open is the single atomic publication boundary for a driver:
            // it persists the driver interest, open seats and selected search mode.
            // A pre-flight subscribe would expose a phantom participant if open fails.
            return doOpenCrew(safeDirId, { keepMapSheet: true, autoMatch, seats: selectedSeats });
        }

        // Мікро-смужка СТАТУС-банера (спливає над навігацією). label — короткий
        // підпис (вже екранований); права частина — «розгорнути ▴». Тап =
        // toggleMapResultCollapse. Так нижнє меню стає доступним.
        function mapResultStrip(label) {
            return `<div class="result-strip" onclick="toggleMapResultCollapse()">
                <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${label}</span>
                <span style="opacity:.55;font-size:11px;flex-shrink:0;">розгорнути ▴</span>
            </div>`;
        }

        // Лічильник зайнятих місць ВОДІЯ у фазі пошуку (до екіпажу): джерело —
        // S.myCrew (відкритий екіпаж водія, seats_total/seats_free). Порожньо для
        // попутника або коли крю не цього напрямку. Дзеркало tripSeatsLabel для
        // до-trip фази (вимога: водій бачить зайняті місця + режим пошуку).
        function driverFreeSeatsAfterAccept() {
            const mc = S.myCrew;
            const active = S.activeTrip;
            const total = seatCount(mc?.seats_total ?? active?.seats_total ?? active?.total_seats);
            if (total <= 0) return 0;
            if (active && String(active.driver_id || active.organizer_id || '') === String(S.userId || '')) {
                const members = Array.isArray(active.members) ? active.members : [];
                const passengerCount = members.filter(m => {
                    const roleText = String(m?.role || '').toLowerCase();
                    return roleText !== 'driver' && String(m?.user_id || '') !== String(S.userId || '');
                }).length;
                return Math.max(0, total - passengerCount);
            }
            if (!mc) return 0;
            if (hasFiniteNumber(mc.seats_free)) return Math.min(total, seatCount(mc.seats_free));
            return Math.max(0, total - seatCount(mc.seats_used));
        }

        function searchSeatsLabel(dirId) {
            const mc = S.myCrew;
            if (!mc || String(mc.direction_id) !== String(dirId)) return '';
            const total = seatCount(mc.seats_total);
            if (total <= 0) return '';
            const free = hasFiniteNumber(mc.seats_free)
                ? Math.min(total, seatCount(mc.seats_free))
                : Math.max(0, total - seatCount(mc.seats_used));
            const occupied = Math.min(total, Math.max(0, total - free));
            return `💺 ${occupied}/${total}`;
        }

        function passengerOpenCrewChoices(dirId, ctx = null) {
            const safeDirId = parseInt(dirId) || 0;
            if (!safeDirId || !_isPassengerRole(S.userRole)) return [];
            const byDriver = new Map();
            const addCrew = (raw) => {
                const organizerId = parseInt(raw?.organizer_id ?? raw?.user_id ?? raw?.driver_id, 10) || 0;
                if (!organizerId || String(organizerId) === String(S.userId || '')) return;
                const rowDirId = parseInt(raw?.direction_id ?? safeDirId, 10) || safeDirId;
                if (rowDirId !== safeDirId) return;
                const freeSeats = safeCount(raw?.seats_free ?? raw?.free_seats ?? raw?.available_seats);
                if (freeSeats <= 0) return;
                const existing = byDriver.get(organizerId);
                if (existing && existing.seats_free >= freeSeats) return;
                byDriver.set(organizerId, {
                    organizer_id: organizerId,
                    direction_id: safeDirId,
                    name: raw?.driver_name || raw?.organizer_name || raw?.name || 'Водій',
                    photo_url: raw?.driver_photo_url || raw?.organizer_photo_url || raw?.photo_url || '',
                    seats_free: freeSeats
                });
            };
            const liveCrews = (S.mapCrews || []).filter(raw => {
                const rowDirId = parseInt(raw?.direction_id ?? safeDirId, 10) || safeDirId;
                return rowDirId === safeDirId;
            });
            liveCrews.forEach(addCrew);
            // Live /api/v3/map/crews is the seat truth. Direction organizers are
            // only a cold-start fallback; mixing them after live crews resurrects
            // stale free-seat/name data in multi-driver events.
            if (liveCrews.length === 0 && byDriver.size === 0) {
                (Array.isArray(ctx?.orgs) ? ctx.orgs : [])
                    .filter(o => normalizeRole(o?.role || 'driver') === 'driver')
                    .forEach(addCrew);
            }
            return Array.from(byDriver.values())
                .sort((a, b) => b.seats_free - a.seats_free || String(a.name).localeCompare(String(b.name)))
                .slice(0, 3);
        }

        function renderPassengerOpenCrewChoices(dirId, crews) {
            const safeDirId = parseInt(dirId) || 0;
            if (!safeDirId || !Array.isArray(crews) || !crews.length) return '';
            const rows = crews.map(c => {
                const orgId = parseInt(c.organizer_id, 10) || 0;
                const freeSeats = safeCount(c.seats_free);
                return `<div data-auto-search-crew-id="${orgId}" style="display:flex;align-items:center;gap:8px;padding:8px;border:1px solid rgba(34,197,94,0.22);border-radius:10px;background:rgba(34,197,94,0.07);margin-bottom:6px;">
                    ${renderAvatarInline(c.name || 'Водій', c.photo_url || '', 30)}
                    <div style="flex:1;min-width:0;">
                        <div style="font-size:12px;font-weight:850;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(c.name || 'Водій')}</div>
                        <div style="font-size:11px;color:#86efac;">${freeSeats} ${pluralUk(freeSeats, 'вільне місце', 'вільні місця', 'вільних місць')}</div>
                    </div>
                    <button class="btn btn-primary" style="width:auto;min-height:32px;padding:7px 10px;font-size:12px;border-radius:9px;" onclick="requestJoin(${orgId}, ${safeDirId}, { source: 'auto_search', keepMapContext: true })">Запроситись</button>
                </div>`;
            }).join('');
            return `<div data-auto-search-open-crews="true" style="margin:8px 0 10px;">
                <div style="font-size:11px;color:var(--text-secondary);margin-bottom:6px;">Є відкриті екіпажі з місцями. Запит створиться тільки після вашого кліку.</div>
                ${rows}
            </div>`;
        }

        function openMapAutoSearchPanel(dirId) {
            const ctx = mapInviteContext(dirId);
            const safeDirId = ctx.safeDirId || (parseInt(dirId) || 0);
            if (!safeDirId) return;
            if (hasHandshakeActionSurface()) return;
            const isDriver = _isDriverRole(S.userRole);
            const title = isDriver ? '✨ Шукаємо попутників' : '✨ Шукаємо місце';
            const seats = isDriver ? searchSeatsLabel(safeDirId) : '';
            const chip = `✨ Авто${seats ? ' · ' + seats : ''}`;
            const panel = document.getElementById('map-result-panel');
            const meta = panel && panel._mapResultMeta;
            const sameAutoPanel =
                panel?.classList.contains('open') &&
                meta?.kind === 'auto_search' &&
                String(meta?.dirId || '') === String(safeDirId);
            const collapseStateMatches = !!S.mapResultCollapsed === !!panel?.classList.contains('collapsed');
            if (sameAutoPanel && collapseStateMatches && (isDriver || S.mapResultCollapsed)) {
                return;
            }
            const crewChoices = isDriver ? [] : passengerOpenCrewChoices(safeDirId, ctx);
            const renderSignature = [
                'auto_search',
                safeDirId,
                isDriver ? 'driver' : 'passenger',
                seats,
                S.mapResultCollapsed ? 'collapsed' : 'open',
                crewChoices.map(c => `${c.organizer_id}:${c.seats_free}:${c.name || ''}`).join('|')
            ].join('::');
            if (
                panel?.classList.contains('open') &&
                meta?.kind === 'auto_search' &&
                String(meta?.dirId || '') === String(safeDirId) &&
                meta?.renderSignature === renderSignature
            ) {
                return;
            }
            const crewChoicesHtml = renderPassengerOpenCrewChoices(safeDirId, crewChoices);
            const sub = isDriver
                ? 'Автоматичний пошук активний. Як тільки попутник знайдеться — ви отримаєте пропозицію.'
                : (crewChoices.length
                    ? 'Автоматичний пошук активний, і вже є відкриті місця. Можете запроситись явно або чекати пропозицію.'
                    : 'Автоматичний пошук активний. Як тільки водій знайдеться — ви отримаєте пропозицію.');
            openMapResultPanel(`
                ${ctx.safeDirId ? renderMapInviteContextHeader(ctx) : ''}
                <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
                    <div class="sheet-title" style="font-size:15px;">${escapeHtml(title)}</div>
                    <span onclick="toggleMapResultCollapse()" style="cursor:pointer;opacity:.6;font-size:18px;line-height:1;" title="Згорнути">▾</span>
                </div>
                <div class="sheet-sub" style="font-size:12px;margin:4px 0 4px;"><span style="display:inline-block;padding:2px 8px;border-radius:999px;background:rgba(56,189,248,0.12);font-weight:700;">${escapeHtml(chip)}</span></div>
                <div class="sheet-sub" style="font-size:12px;margin-bottom:10px;">${escapeHtml(sub)}</div>
                ${crewChoicesHtml}
                <div style="display:flex;gap:10px;">
                    <button class="btn ${crewChoices.length ? 'btn-primary' : 'btn-secondary'}" style="flex:1;" onclick="closeMapResultPanel(); ${crewChoices.length ? `openNearbyCrewsSheet(${safeDirId})` : `openSubscribedDirectionDetails(${safeDirId})`}">${crewChoices.length ? 'Показати місця' : 'Деталі'}</button>
                    <button class="btn btn-secondary" style="flex:1;" onclick="disableAutoSearch(${safeDirId})">⏸ Зупинити автопошук</button>
                </div>
            `, { kind: 'auto_search', dirId: safeDirId, renderSignature }, mapResultStrip(escapeHtml(`${title}${seats ? ' · ' + seats : ''}`)));
        }

        function hasHandshakeActionSurface() {
            const handshake = document.getElementById('handshake-panel');
            if (handshake && handshake.classList.contains('open')) return true;
            if (S.proposedMatch) return true;
            return (S.pendingMatches || []).some(m => m && m.scope === 'incoming');
        }

        // DM-2026-06-14-004: банер 1 — підписка активна в РУЧНОМУ режимі
        // (auto_match=false). Постійний згортаний банер унизу карти для попутника
        // (і водія), з діями «Включити автопошук» / «Вийти». Дзеркало
        // openMapAutoSearchPanel; переживає F5 через maybeOpenMapResultPanelOnHydrate
        // (бо auto_match тепер персистентний у web_subscriptions).
        function openMapManualSearchPanel(dirId) {
            const ctx = mapInviteContext(dirId);
            const safeDirId = ctx.safeDirId || (parseInt(dirId) || 0);
            if (!safeDirId) return;
            const isDriver = _isDriverRole(S.userRole);
            if (!S.mapResultCollapseTouched) {
                S.mapResultCollapsed = true;
                S.mapResultCollapseTouched = true;
                persistCriticalState();
            }
            const seats = isDriver ? searchSeatsLabel(safeDirId) : '';
            const chip = `📍 Ручний${seats ? ' · ' + seats : ''}`;
            const sub = isDriver
                ? 'Ви на карті як водій. Тапайте попутників, щоб запросити — або увімкніть автопошук, і система знайде їх сама.'
                : 'Ви на карті. Тапайте машини, щоб запроситись — або увімкніть автопошук, і система знайде водія сама.';
            openMapResultPanel(`
                ${ctx.safeDirId ? renderMapInviteContextHeader(ctx) : ''}
                <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
                    <div class="sheet-title" style="font-size:15px;">📍 Підписані · пошук вручну</div>
                    <span onclick="toggleMapResultCollapse()" style="cursor:pointer;opacity:.6;font-size:18px;line-height:1;" title="Згорнути">▾</span>
                </div>
                <div class="sheet-sub" style="font-size:12px;margin:4px 0 4px;"><span style="display:inline-block;padding:2px 8px;border-radius:999px;background:rgba(56,189,248,0.12);font-weight:700;">${escapeHtml(chip)}</span></div>
                <div class="sheet-sub" style="font-size:12px;margin:0 0 10px;">${escapeHtml(sub)}</div>
                <div style="display:flex;gap:10px;">
                    <button class="btn btn-primary" style="flex:1;" onclick="enableAutoSearch(${safeDirId})">✨ Включити автопошук</button>
                    <button class="btn btn-danger" style="flex:1;" onclick="closeMapResultPanel(); confirmLeaveDirection(${safeDirId})">🚪 Вийти з події</button>
                </div>
            `, { kind: 'manual_search', dirId: safeDirId }, mapResultStrip(escapeHtml(`📍 ${ctx.title || 'Підписка'} · ручний${seats ? ' · ' + seats : ''}`)));
        }

        // СТАТУС-банер «Очікування відповіді партнера» (outgoing). За рішенням —
        // очікування = пасивний статус, тож згортається в мікро над навігацією
        // (нижнє меню доступне), на відміну від ДІЯ-банера #handshake-panel.
        // Єдиний рендер outgoing-картки (verify/poll/hydrate кличуть саме його).
        function openMapOutgoingPanel(dirId) {
            const safeDirId = parseInt(dirId) || 0;
            if (!safeDirId) return;
            const ctx = mapInviteContext(safeDirId);
            openMapResultPanel(`
                <div style="display:flex;justify-content:flex-end;margin-bottom:2px;">
                    <span onclick="toggleMapResultCollapse()" style="cursor:pointer;opacity:.6;font-size:18px;line-height:1;" title="Згорнути">▾</span>
                </div>
                ${ctx.safeDirId ? renderMapInviteContextHeader(ctx) : ''}
                ${renderMapOutgoingProcessCard(safeDirId)}
            `, { kind: 'outgoing', dirId: safeDirId }, mapResultStrip('📤 Очікуємо відповіді партнера'));
        }

        // Згортання map-result банера (міні <-> мікро), як у #map-trip-dock.
        // Диспетчеризація по meta.kind — будь-який СТАТУС-банер згортається.
        // persistCriticalState() одразу: вибір «мікро» переживає F5.
        function inferMapResultMetaFromState() {
            const outgoing = (S.pendingMatches || []).find(m => m && m.scope === 'outgoing' && m.direction_id != null);
            if (outgoing) return { kind: 'outgoing', dirId: outgoing.direction_id };
            const sub = (S.subscriptions || [])[0];
            if (sub && sub.direction_id != null) {
                return {
                    kind: sub.auto_match === false ? 'manual_search' : 'auto_search',
                    dirId: sub.direction_id
                };
            }
            return null;
        }

        function toggleMapResultCollapse() {
            S.mapResultCollapsed = !S.mapResultCollapsed;
            S.mapResultCollapseTouched = true;
            persistCriticalState();
            const panel = document.getElementById('map-result-panel');
            const meta = (panel && panel._mapResultMeta) || inferMapResultMetaFromState();
            if (panel && !panel._mapResultMeta && meta) panel._mapResultMeta = meta;
            if (meta && meta.dirId) {
                if (meta.kind === 'manual_search') openMapManualSearchPanel(meta.dirId);
                else if (meta.kind === 'auto_search') openMapAutoSearchPanel(meta.dirId);
                else if (meta.kind === 'outgoing') openMapOutgoingPanel(meta.dirId);
            }
            syncBottomStripStacking();
        }

        // «✨ Включити автопошук»: ре-підписка з auto_match=true (без нового роуту,
        // I-LA-1), потім переключення банера на auto_search.
        async function enableAutoSearch(dirId) {
            const safeDirId = parseInt(dirId) || 0;
            if (!safeDirId) return;
            S.mapResultCollapsed = false;
            showToast('🔍 Вмикаємо автопошук…', '');
            const ok = await subscribeDir(safeDirId, { afterSuccessScreen: 'explore', keepSheetOpen: true, mapInline: true, manualOnly: false, suppressSubscribedSheet: true });
            if (ok) {
                S.subscriptions = (S.subscriptions || []).map(s => String(s.direction_id) === String(safeDirId) ? { ...s, auto_match: true } : s);
                openMapAutoSearchPanel(safeDirId);
            }
        }

        // Non-destructive counterpart to enableAutoSearch: only the matching
        // mode changes. Event participation and explicit requests remain live.
        async function disableAutoSearch(dirId) {
            const safeDirId = parseInt(dirId) || 0;
            if (!safeDirId) return false;
            S.mapResultCollapsed = false;
            const ok = await subscribeDir(safeDirId, {
                afterSuccessScreen: 'explore',
                keepSheetOpen: true,
                mapInline: true,
                manualOnly: true,
                suppressSubscribedSheet: true,
                successToast: 'Автопошук зупинено. Ви лишаєтесь у події.'
            });
            if (!ok) return false;
            S.subscriptions = (S.subscriptions || []).map(s =>
                String(s.direction_id) === String(safeDirId) ? { ...s, auto_match: false } : s
            );
            openMapManualSearchPanel(safeDirId);
            renderTrips();
            return true;
        }

        function openMapSubscribedSheet(dirId, options = {}) {
            const ctx = mapInviteContext(dirId);
            if (!ctx.safeDirId) return;
            if (S.subscriptionSearchHeld) { openSubscriptionHeldSheet(ctx, options); return; }
            if (S.missedPickup && String(S.missedPickup.direction_id) === String(ctx.safeDirId)) {
                // G5 М3: before the person's own choice the event offers no search — back to the dock with the two options
                if (S.currentScreen !== 'explore') switchScreen('explore');
                closeMapResultPanel();
                verifyMapTripDockState();
                showToast('Спершу оберіть: шукати інший екіпаж або більше не їхати', '');
                return;
            }
            const isDriver = _isDriverRole(S.userRole);
            const openCrews = openCrewCountForRadar(ctx.safeDirId);
            const auto = !!options.auto;
            const title = auto
                ? (isDriver ? 'Шукаємо попутників' : 'Шукаємо місце')
                : (isDriver ? 'Ви в події як водій' : 'Ви шукаєте місце');
            const manualStatus = isDriver
                ? (S.pickupCoords ? 'Ваше авто вже на карті. Відкрийте місця, щоб попутники побачили, звідки ви стартуєте.' : 'Поставте авто на карту: покажіть, звідки стартуєте. Потім відкрийте місця для своїх людей.')
                : (S.pickupCoords ? (openCrews > 0 ? 'Точка очікування вказана. Торкніться машини, щоб запроситись.' : 'Точка очікування вказана. Коли водії відкриють місця, вони зʼявляться на цій карті.') : 'Вкажіть, де чекати водія. Потім торкніться машини й надішліть запит.');
            const autoStatus = isDriver
                ? 'WayTandem сам підбере попутника й покаже пропозицію. Можете вказати старт авто, щоб з’явитись на карті.'
                : 'WayTandem сам знайде водія й покаже пропозицію. Можете вказати, де чекати, щоб з’явитись на карті.';
            const statusLine = auto ? autoStatus : manualStatus;
            const secondaryAction = isDriver
                ? 'closeSheet()'
                : (auto ? `closeSheet(); disableAutoSearch(${ctx.safeDirId})` : `confirmLeaveDirection(${ctx.safeDirId})`);
            const secondaryLabel = isDriver
                ? 'Закрити'
                : (auto ? '⏸ Зупинити автопошук' : '🚪 Вийти з події');
            const primary = isDriver
                ? `<button class="btn btn-primary" onclick="doOpenCrew(${ctx.safeDirId}, { keepMapSheet: true })">${S.pickupCoords ? 'Відкрити місця' : 'Поставте авто на карту'}</button>`
                : `<button class="btn btn-primary" onclick="pickPickupLocation(${ctx.safeDirId}, { kind: 'passenger_wait', persistUserLocation: true, closeSheetAfterConfirm: true })">${S.pickupCoords ? 'Точка очікування ✓' : 'Вказати де чекати'}</button>`;
            openSheet(`
                ${renderMapInviteContextHeader(ctx)}
                <div class="sheet-title">${escapeHtml(title)}</div>
                <div class="sheet-sub">${escapeHtml(statusLine)}</div>
                ${isDriver ? `<div class="sheet-context">📍 Старт авто: ${S.pickupCoords ? 'вказано на карті' : 'ще не вказано'}</div>` : ''}
                <div class="sheet-actions" data-map-command-count="3">
                    ${primary}
                    <button class="btn btn-secondary" onclick="openSubscribedDirectionDetails(${ctx.safeDirId})">Деталі події</button>
                    <button class="btn btn-ghost" onclick="${secondaryAction}">${secondaryLabel}</button>
                </div>
            `, { maxHeight: options?.sheetMaxHeight || '65vh' });
        }

        // openMapCrewOpenedSheet видалено (DM-2026-06-14-008): модал «Екіпаж відкрито»
        // дублював те, що карта вже показує — власну пінешку (map-pin-mine + сонар-пульс),
        // тост і СТАТУС-банер. Як «історичний шум» прибрано; статус живе на карті.

        function eventDriverRosterHtml(organizers, dirId, options = {}) {
            const safeDirId = parseInt(dirId, 10) || 0;
            const compact = !!options.compact;
            const allowJoin = !!options.allowJoin;
            const drivers = (Array.isArray(organizers) ? organizers : [])
                .filter(o => normalizeRole(o?.role || 'driver') === 'driver')
                .slice()
                .sort((a, b) => {
                    const aSelf = String(a?.user_id || '') === String(S.userId || '');
                    const bSelf = String(b?.user_id || '') === String(S.userId || '');
                    return Number(bSelf) - Number(aSelf);
                });

            return drivers.map(o => {
                const uid = parseInt(o?.user_id, 10) || 0;
                if (!uid) return '';
                const isSelf = String(uid) === String(S.userId || '');
                const seats = safeCount(o?.seats_free);
                const hasActiveCrew = o?.has_active_crew === true || o?.has_active_crew === 1;
                // D84/D85/D86: a driver who has not opened seats in this event is neither free nor full (payloads without
                // the field keep the previous behaviour); whatever seats_free says, no seat request is offered for such a row.
                // «не відкрито» is true both for a new driver and for one who returned without reopening.
                const capacityUnknown = o?.capacity_known === false && !hasActiveCrew;
                const availability = capacityUnknown ? 'unconfigured' : (seats > 0 ? 'open' : (hasActiveCrew ? 'formed' : 'full'));
                const statusText = capacityUnknown
                    ? 'Місця ще не відкрито'
                    : seats > 0
                    ? `${seats} ${pluralUk(seats, 'вільне місце', 'вільні місця', 'вільних місць')}`
                    : (hasActiveCrew ? 'Екіпаж сформовано' : 'Вільних місць немає');
                const opacity = isSelf ? '1' : (availability === 'open' ? '0.9' : '0.68');
                const background = isSelf ? 'rgba(34,197,94,0.12)' : 'rgba(255,255,255,0.04)';
                const border = isSelf ? 'rgba(34,197,94,0.42)' : 'rgba(255,255,255,0.08)';
                const username = escapeAttr(sanitizeBotUsername(o?.telegram_username || ''));
                const chatButton = !isSelf
                    ? `<button class="btn btn-secondary" data-driver-chat="true" data-tg-username="${username}" data-tg-user-id="${uid}" onclick="openTelegramContactFromButton(this)" style="padding:${compact ? '6px 9px' : '8px 11px'};font-size:12px;min-height:${compact ? '30px' : '36px'};border-radius:9px;white-space:nowrap;">💬 Чат</button>`
                    : '';
                const joinButton = allowJoin && !isSelf && seats > 0 && !capacityUnknown
                    ? `<button class="btn btn-primary" style="padding:8px 12px;font-size:12px;min-height:36px;border-radius:10px;white-space:nowrap;" onclick="requestJoin(${uid}, ${safeDirId}, { source: 'map', closeSheetOnSuccess: true, keepMapContext: true })">Запроситись</button>`
                    : '';
                const actions = [chatButton, joinButton].filter(Boolean).join('');

                return `
                    <div data-event-driver-row="true" data-event-driver-id="${uid}" data-current-driver="${isSelf ? 'true' : 'false'}" data-driver-availability="${availability}" style="display:flex;align-items:center;gap:${compact ? '9px' : '12px'};padding:${compact ? '8px' : '12px'};margin-bottom:${compact ? '6px' : '8px'};border-radius:${compact ? '9px' : '12px'};background:${background};border:1px solid ${border};opacity:${opacity};">
                        ${renderAvatarInline(o?.name || 'Водій', o?.photo_url || personPhoto(o?.user_id), compact ? 30 : 42)}
                        <div style="flex:1;min-width:0;">
                            <div style="display:flex;align-items:center;gap:6px;min-width:0;">
                                <div style="font-size:${compact ? '12px' : '15px'};font-weight:800;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(o?.name || 'Водій')}</div>
                                ${isSelf ? '<span class="tag tag-green" style="border-radius:6px;padding:2px 6px;font-size:10px;flex-shrink:0;">Ви</span>' : ''}
                            </div>
                            <div style="font-size:11px;color:${availability === 'open' ? '#22c55e' : 'var(--text-secondary)'};margin-top:2px;font-weight:${availability === 'open' ? '700' : '500'};">${escapeHtml(statusText)}</div>
                        </div>
                        ${actions ? `<div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">${actions}</div>` : ''}
                    </div>`;
            }).join('');
        }

        function directionInviteEmptyMessage(dir, data = {}, subscribedDetails = false, contactButton = '') {
            const summary = data?.event_summary || {};
            const counts = [summary.drivers_total, summary.passengers_matched, summary.passengers_pending, summary.passengers_without_seat ?? summary.passengers_waiting];
            if (subscribedDetails || data?.user_status?.subscribed === true || !data?.direction || !Array.isArray(data?.organizers) || data.organizers.length || !counts.every(n => Number.isInteger(n) && n === 0)) return '';
            const creatorRole = String(dir?.creator_id || '') !== String(S.userId || '') ? normalizeRole(dir?.creator_role) : '';
            const suggestion = creatorRole === 'driver' ? 'Організатор — водій. Можна обрати «Шукаю місце».'
                : creatorRole === 'client' ? 'Організатор шукає місце. Можна обрати «Можу взяти людей».' : '';
            return `<div data-invite-first-participant="true" class="sheet-sub" style="display:flex;align-items:center;gap:12px;padding:12px;margin:10px 0 12px;border-radius:12px;background:rgba(163,230,53,0.06);border:1px solid rgba(163,230,53,0.2);"><div style="flex:1;min-width:0;"><div style="font-weight:700;color:var(--text-primary);">Ви можете стати першим учасником.</div>${suggestion ? `<div style="margin-top:6px;">${escapeHtml(suggestion)} Це лише пропозиція — обидві ролі доступні.</div>` : ''}</div>${contactButton}</div>`;
        }

        function openDirectionInviteSheet(dirId, dir, data = {}, options = {}) {
            const safeDirId = parseInt(dirId) || 0;
            const orgs = Array.isArray(data?.organizers) ? data.organizers : [];
            const dirMeta = { ...(dir || {}), ...(data?.direction || {}) };
            const title = dirMeta.title || dirMeta.name || dir?.title || dir?.name || `Подія #${safeDirId}`;
            const creatorId = dirMeta.creator_id || dirMeta.user_id || '';
            const isMyDir = creatorId && String(creatorId) === String(S.userId);
            const creatorName = dirMeta.creator_name || (isMyDir ? S.userName : '') || '';
            const creatorUsername = sanitizeBotUsername(dirMeta.creator_username || (isMyDir ? S.userUsername : '') || '');
            const creatorDisplay = creatorName || (creatorUsername ? 'Організатор' : '');
            const meetingPoint = String(dirMeta.meeting_point || '').trim();
            const desc = String(dirMeta.description || '').trim();
            const startAt = String(dirMeta.start_date || '').trim();
            const endAt = String(dirMeta.end_date || '').trim();
            const whenText = formatEventDateRange(startAt, endAt);
            rememberViewedDirection(safeDirId, title);
            const proof = directionInviteSocialProof(dirMeta, orgs, data?.event_summary);
            const topDrivers = eventDriverRosterHtml(orgs, safeDirId, { compact: true });
            const contactButton = creatorId && !isMyDir
                ? `<button class="btn btn-secondary" data-invite-organizer-chat="true" aria-label="Чат з організатором" style="flex-shrink:0;width:auto;min-height:44px;padding:8px 12px;border-radius:10px;background:rgba(163,230,53,0.12);border:1px solid rgba(163,230,53,0.3);color:var(--accent);font-size:12px;box-shadow:none;white-space:nowrap;" data-tg-username="${escapeAttr(creatorUsername)}" data-tg-user-id="${parseInt(creatorId, 10) || 0}" onclick="openTelegramContactFromButton(this)">💬 Чат</button>`
                : '';
            const joinArgs = options?.source === 'map' ? `${safeDirId}, 'map'` : `${safeDirId}`;
            const activeSub = (S.subscriptions || []).find(s => String(s.direction_id || s.id || '') === String(safeDirId));
            const eventTrip = String(S.activeTrip?.direction_id || '') === String(safeDirId) ? S.activeTrip : null;
            const eventPending = (S.pendingMatches || []).find(m => String(m?.direction_id || '') === String(safeDirId));
            const subscribedDetails = !!(activeSub || eventTrip || eventPending);
            const roleLabel = _isDriverRole(activeSub?.role || S.userRole) ? 'водій' : 'попутник';
            const searchMode = activeSub?.auto_match === false ? 'ручний пошук' : 'автопошук';
            // Підписаний учасник бачить «Деталі події», а не нове приєднання; номер кроку
            // показуємо окремо, щоб не змішувати його з цим вибором заголовка.
            const heading = subscribedDetails ? 'Деталі події' : 'Запрошення до події';
            // Порядок запрошення: опис → учасники → пояснення → кроки → дії (власник 2026-10-01).
            const introLine = eventTrip ? 'Ви в екіпажі цієї події. Вашу домовленість показано на мапі.'
                : eventPending ? 'У цій події є запит на спільну поїздку. Його стан показано на мапі.'
                : S.subscriptionSearchHeld ? 'Стан участі після поїздки ще уточнюється. Поверніться на мапу, щоб перевірити його.'
                : subscribedDetails
                ? `${S.subscriptionsRefreshFailed ? 'Останній підтверджений стан: ви в цій події' : 'Ви вже в цій події'} як ${roleLabel}. ${searchMode === 'автопошук' ? 'Автоматичний пошук триває.' : 'Ручний пошук активний.'}`
                : (creatorDisplay ? `${escapeHtml(creatorDisplay)}${creatorUsername ? ` (@${escapeHtml(creatorUsername)})` : ''} збирає людей їхати разом.` : 'Вас запросили до спільної поїздки.');
            const availabilityKnown = data?.event_summary?.drivers_total != null
                ? Number.isFinite(data.event_summary.open_seats)
                : Array.isArray(data?.organizers) && data.organizers.every(o => Number.isFinite(o?.seats_free));
            const passengerNextStep = !availabilityKnown
                ? 'перевірте на мапі, чи є водії з вільними місцями.'
                : proof.openSeats > 0
                    ? 'оберіть на мапі водія з вільним місцем, щоб попросити місце.'
                    : 'поки немає водіїв із вільними місцями; коли вони з’являться, ви побачите їх на мапі.';
            // D86: a driver with no car set up in this event cannot invite yet (D83 card blocks it) - the next step is the car.
            const searchNextStep = _isDriverRole(activeSub?.role || S.userRole)
                ? (driverCrewRecruitmentState(safeDirId) === 'absent'
                    ? 'поставте авто на карту й відкрийте місця — тоді зможете запрошувати попутників.'
                    : 'коли на мапі побачите вільного попутника, запросіть його в екіпаж.')
                : passengerNextStep;
            const nextStepHtml = subscribedDetails
                ? `<strong style="color:var(--text-primary);">Наступний крок:</strong> ${S.subscriptionSearchHeld ? 'перевірте свій стан на мапі після оновлення даних.' : eventTrip ? 'поверніться до свого екіпажу на мапі.' : eventPending ? 'перегляньте запит на мапі.' : searchMode === 'автопошук' ? `чекайте на пропозицію; ${searchNextStep}` : searchNextStep}`
                : `<strong style="color:var(--text-primary);">Що буде далі:</strong> ви оберете, чи можете взяти людей, чи шукаєте місце. Потім WayTandem покаже відповідний екіпаж або повідомить, щойно знайдеться водій.`;
            const actionHtml = subscribedDetails
                ? `<div style="display:flex;gap:8px;">
                    <button class="btn btn-secondary" style="flex:1;font-size:12px;" onclick="openDirection(${safeDirId})">Деталі події</button>
                    <button class="btn btn-ghost" style="flex:1;font-size:12px;" onclick="closeSheet(); switchScreen('explore'); maybeOpenMapResultPanelOnHydrate();">${eventTrip ? 'Назад до екіпажу' : eventPending ? 'Назад до запиту' : S.subscriptionSearchHeld ? 'Назад до мапи' : 'Назад до пошуку'}</button>
                </div>`
                : `<button class="btn btn-primary" style="width:100%;margin-bottom:8px;" onclick="joinInvitedDirection(${joinArgs})">Хочу поїхати</button>
                <div style="display:flex;gap:8px;">
                    <button class="btn btn-secondary" style="flex:1;font-size:12px;" onclick="openDirection(${safeDirId})">Деталі події</button>
                    <button class="btn btn-ghost" style="flex:1;font-size:12px;" onclick="closeSheet()">Пізніше</button>
                </div>`;
            const emptyParticipantsHtml = directionInviteEmptyMessage(dirMeta, data, subscribedDetails, contactButton);
            const participantsHtml = emptyParticipantsHtml || `
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 12px;">
                    <div style="padding:10px;border-radius:8px;background:rgba(56,189,248,0.08);border:1px solid rgba(56,189,248,0.22);">
                        <div style="font-size:11px;color:var(--text-muted);font-weight:800;text-transform:uppercase;">Люди</div>
                        <div style="font-size:13px;font-weight:800;color:var(--text-primary);margin-top:3px;">${escapeHtml(proof.participantLine)}</div>
                    </div>
                    <div style="padding:10px;border-radius:8px;background:rgba(163,230,53,0.08);border:1px solid rgba(163,230,53,0.22);">
                        <div style="font-size:11px;color:var(--text-muted);font-weight:800;text-transform:uppercase;">Машини</div>
                        <div style="font-size:13px;font-weight:800;color:var(--text-primary);margin-top:3px;">${escapeHtml(proof.driverLine)}</div>
                    </div>
                </div>
            `;
            S.directionInviteSheetOpen = true;
            openSheet(`
                <div class="sheet-steps">${heading}</div>
                <div class="sheet-title" style="font-size:22px;line-height:1.15;margin-bottom:8px;">${escapeHtml(title)}</div>
                <div class="sheet-sub" style="margin-bottom:12px;">${introLine}</div>
                ${!data?.direction || S.subscriptionsRefreshFailed ? '<div role="status" style="font-size:12px;color:var(--text-secondary);margin-bottom:12px;">Не вдалося оновити всі дані. Показуємо останній відомий стан; поверніться на мапу, щоб перевірити його.</div>' : ''}
                <div style="padding:10px;border-radius:8px;background:rgba(255,255,255,0.04);border:1px solid var(--border);display:flex;flex-direction:column;gap:6px;margin-bottom:12px;">
                    ${whenText ? `<div style="font-size:12px;color:var(--text-secondary);">📅 ${escapeHtml(whenText)}</div>` : ''}
                    ${meetingPoint ? `<div style="font-size:12px;color:var(--text-secondary);">📍 ${escapeHtml(meetingPoint)}</div>` : ''}
                    ${desc ? `<div style="font-size:12px;color:var(--text-secondary);line-height:1.45;white-space:pre-wrap;">${escapeHtml(desc.slice(0, 360))}</div>` : ''}
                    ${!whenText && !meetingPoint && !desc ? '<div style="font-size:12px;color:var(--text-secondary);">Деталі події можна уточнити в організатора.</div>' : ''}
                </div>
                ${participantsHtml}
                ${!emptyParticipantsHtml && contactButton ? `<div style="display:flex;justify-content:flex-end;margin:-4px 0 12px;">${contactButton}</div>` : ''}
                ${topDrivers ? `<div style="font-size:11px;font-weight:900;text-transform:uppercase;color:var(--text-muted);letter-spacing:1px;margin-bottom:2px;">Водії в події</div><div style="margin-bottom:12px;">${topDrivers}</div>` : ''}
                <div style="padding:10px;border-radius:8px;background:rgba(255,193,7,0.08);border:1px solid rgba(255,193,7,0.2);font-size:12px;color:var(--text-secondary);line-height:1.45;margin-bottom:12px;">
                    ${nextStepHtml}
                </div>
                ${subscribedDetails ? '' : joinStepsHtml('Подія', false)}
                ${actionHtml}
            `, { maxHeight: options?.sheetMaxHeight || '' });
        }

        async function openSubscribedDirectionDetails(dirId, options = {}) {
            const safeDirId = parseInt(dirId) || 0;
            if (!safeDirId) return;
            S._openDirectionSeq = (S._openDirectionSeq || 0) + 1;
            const seq = S._openDirectionSeq;
            openStartDirectionLoadingSheet(safeDirId);
            const data = await api(`/api/v3/fractal/organizers?direction_id=${safeDirId}&lang=${S.lang}&user_id=${S.userId || ''}`);
            if (seq !== S._openDirectionSeq) return;
            const localDir = cachedDirectionDetails(safeDirId);
            const remoteDir = data?.direction && typeof data.direction === 'object' ? data.direction : {};
            const dir = { ...localDir, ...remoteDir, id: safeDirId,
                title: remoteDir.title || remoteDir.name || localDir.title || localDir.direction_title || localDir.dir_title || localDir.name };
            if (!dir || !dir.id) { closeSheet(); showToast('Подія недоступна', 'error'); return; }
            if (isFolderNode(dir)) { closeSheet(); await boardOpenFolder(safeDirId); return; }
            S.directionDetailsCache = S.directionDetailsCache || {};
            S.directionDetailsCache[safeDirId] = { ...(data || {}), direction: dir };
            openDirectionInviteSheet(safeDirId, dir, data || {}, {
                ...(options || {}),
                source: 'map',
                sheetMaxHeight: options?.sheetMaxHeight || '65vh',
                fullInvite: true,
                subscribedDetails: true
            });
        }

        async function openStartDirectionInvite(dirId, options = {}) {
            const safeDirId = parseInt(dirId) || 0;
            if (!safeDirId) return;
            S._openDirectionSeq = (S._openDirectionSeq || 0) + 1;
            const seq = S._openDirectionSeq;
            openStartDirectionLoadingSheet(safeDirId);
            const data = await api(`/api/v3/fractal/organizers?direction_id=${safeDirId}&lang=${S.lang}&user_id=${S.userId || ''}`);
            if (seq !== S._openDirectionSeq) return;
            const localDir = cachedDirectionDetails(safeDirId);
            const remoteDir = data?.direction && typeof data.direction === 'object' ? data.direction : {};
            const dir = { ...localDir, ...remoteDir, id: safeDirId,
                title: remoteDir.title || remoteDir.name || localDir.title || localDir.direction_title || localDir.dir_title || localDir.name };
            if (!dir || !dir.id) { closeSheet(); showToast('Подія недоступна', 'error'); return; }
            if (isFolderNode(dir)) { closeSheet(); await boardOpenFolder(safeDirId); return; }
            S.directionDetailsCache = S.directionDetailsCache || {};
            S.directionDetailsCache[safeDirId] = { ...(data || {}), direction: dir };
            const inviteOptions = options || {};
            if (inviteOptions?.source === 'map' && !inviteOptions?.fullInvite) {
                openMapCompactDirectionInviteSheet(safeDirId, dir, data || {}, inviteOptions);
                return;
            }
            openDirectionInviteSheet(safeDirId, dir, data || {}, inviteOptions);
        }

        async function joinInvitedDirection(dirId, source = '') {
            const safeDirId = parseInt(dirId) || 0;
            if (!safeDirId) { showToast('Подію не знайдено', 'error'); return false; }
            // Домовленість в іншій події — попередження одразу, не наприкінці майстра (власник 2026-09-26).
            if (warnActiveDealElsewhere(safeDirId)) return false;
            // One flow for both entry points (map pin / list): role -> search method -> subscribe.
            // auto_match is decided by the method choice, never implied by where the user tapped.
            return openMapInviteRoleSheet(safeDirId);
        }

        async function openStartDirectionIfNeeded() {
            const dirId = parseInt(S.pendingStartDirectionId) || 0;
            if (!dirId || S.startDirectionHandled) return;
            S.startDirectionHandled = true;
            S.pendingStartDirectionId = null;
            switchScreen('explore');
            const activeSub = (S.subscriptions || []).find(s => String(s.direction_id || s.id || '') === String(dirId));
            if (activeSub) {
                S.mapScope = 'sub';
                S._mapScopeDirId = null; // force renderMapModeStrip() to re-apply the role lens for this subscription.
                S.mapEventFilter = _isDriverRole(activeSub.role || S.userRole)
                    ? 'passengers'
                    : (_isPassengerRole(activeSub.role || S.userRole) ? 'drivers' : 'all');
                renderSubBar();
                renderNews();
                await refreshMap();
                renderNewsStrip();
                focusMapByFilter();
                maybeOpenMapResultPanelOnHydrate();
                return;
            }
            await openStartDirectionInvite(dirId, { source: 'map', fullInvite: true, sheetMaxHeight: '65vh' });
        }

        function defaultNewsEventFilterForRole() {
            return _isDriverRole(S.userRole) ? 'passengers'
                : (_isPassengerRole(S.userRole) ? 'drivers' : 'all');
        }

        function newsEventLensKey(n) {
            const explicit = String(n?.item_type || n?.type || '').toLowerCase();
            if (['event', 'driver', 'passenger', 'passengers', 'client'].includes(explicit)) {
                if (explicit === 'passengers' || explicit === 'client') return 'passenger';
                return explicit;
            }
            const kind = String(n?.kind || '').toLowerCase();
            if (['direction_new', 'direction_event', 'event'].includes(kind)) return 'event';
            if (kind === 'crew_open') return 'driver';
            if (kind === 'subscription') {
                const role = String(n?.role || n?.viewer_role || '').toLowerCase();
                if (role === 'driver') return 'driver';
                if (role === 'client' || role === 'passenger') return 'passenger';
                const text = String(n?.text || '').toLowerCase();
                if (text.includes('🚗') || text.includes('водій')) return 'driver';
                if (text.includes('👤') || text.includes('попутник')) return 'passenger';
            }
            const viewerRole = String(n?.viewer_role || '').toLowerCase();
            if (viewerRole === 'driver') return 'driver';
            if (viewerRole === 'client' || viewerRole === 'passenger') return 'passenger';
            return 'event';
        }

        function filterNewsItemsByEventLens(items, filter) {
            const ef = filter || 'all';
            if (ef === 'event') return items.filter(n => newsEventLensKey(n) === 'event');
            if (ef === 'drivers') return items.filter(n => newsEventLensKey(n) === 'driver');
            if (ef === 'passengers') return items.filter(n => newsEventLensKey(n) === 'passenger');
            return items;
        }

        function newsBadgeItemsForActiveContext() {
            const context = activeMapContextForMap();
            if (!context?.dirId) return [];
            const dirId = String(context.dirId);
            const allItems = Array.isArray(S.news) ? S.news.filter(isDiscoveryNewsItem) : [];
            const dirItems = allItems.filter(n => String(n?.direction_id || '') === dirId);
            const ef = S.newsEventFilter || defaultNewsEventFilterForRole();
            return filterNewsItemsByEventLens(dirItems, ef);
        }

        function updateNewsBadge() {
            if (Array.isArray(S.news) && S.news.some(item => item && item.aggregates && item.direction_id != null)) {
                renderNewsBadgeFromEvents(S.news);
                return;
            }
            const badge = document.getElementById('nav-news-badge');
            if (!badge) return;
            const count = Math.min(99, newsBadgeItemsForActiveContext().length);
            if (count > 0) { badge.style.display = 'flex'; badge.textContent = count; }
            else { badge.style.display = 'none'; }
        }

        function livePassengerCountForMapContext(context = activeMapContextForMap()) {
            if (!context) return 0;
            const dirId = String(context.dirId || '');
            const seen = new Set();
            let count = 0;
            const addPassenger = (id, lat, lng) => {
                if (lat == null || lng == null || !Number.isFinite(Number(lat)) || !Number.isFinite(Number(lng))) return;
                const key = String(id || `${Number(lat).toFixed(5)},${Number(lng).toFixed(5)}`);
                if (seen.has(key)) return;
                seen.add(key);
                count += 1;
            };
            (S.mapPassengers || []).forEach(p => {
                if (String(p?.direction_id || '') !== dirId) return;
                if (S.userId && String(p?.user_id || '') === String(S.userId)) return;
                addPassenger(p?.user_id, p?.lat, p?.lng);
            });
            const members = (S.activeTrip && String(S.activeTrip.direction_id || '') === dirId && Array.isArray(S.activeTrip.members)) ? S.activeTrip.members : [];
            members.forEach(m => {
                if (String(m?.role || '').toLowerCase() === 'driver') return;
                addPassenger(m?.user_id || m?.id || m?.client_id, m?.lat, m?.lng);
            });
            return count;
        }

        // Г (запис 57): пін події — також із підтверджених даних поїздки й деталей саме цієї події, навіть якщо
        // news / allDirections / subscriptions її ще не завантажили. Нуль — валідна координата.
        function eventPointSourcesForDir(dirId) {
            const trip = S.activeTrip && String(S.activeTrip.direction_id || '') === dirId ? S.activeTrip : null;
            const details = S.directionDetailsCache?.[dirId]?.direction || null;
            return [
                ...(S.news || []),
                ...(allDirections || []),
                ...(S.subscriptions || []),
                ...(trip ? [{ direction_id: dirId, lat: trip.direction_lat, lng: trip.direction_lng,
                    title: trip.direction_title, kind: 'direction_event' }] : []),
                ...(details ? [{ ...details, direction_id: dirId }] : []),
            ];
        }

        function eventPointForMapContext(context = activeMapContextForMap()) {
            if (!context) return null;
            const dirId = String(context.dirId || '');
            let coord = null;
            const hit = eventPointSourcesForDir(dirId).find(n => {
                if (String(n?.direction_id || n?.id || '') !== dirId) return false;
                coord = firstFiniteLatLng([n?.lat, n?.lng]);
                return !!coord;
            });
            if (!hit) return null;
            return {
                ...hit,
                lat: coord.lat,
                lng: coord.lng,
                direction_id: Number(dirId),
                dir_title: hit.dir_title || hit.direction_title || hit.title || context.title,
                text: hit.text || 'Подія на карті',
                kind: hit.kind || 'direction_event',
                is_active: hit.is_active !== false,
            };
        }

        function eventPinCountForMapContext(context = activeMapContextForMap()) {
            return eventPointForMapContext(context) ? 1 : 0;
        }

        // Три різні стани точки події (Г): «завантажуємо», «не вдалося завантажити», «точку не задано».
        // «Без координат» — лише коли дані, що несуть поля точки (поїздка чи деталі події), завантажено і точки в
        // них немає; відсутність у news/каталозі ще нічого не означає.
        function eventPointStateForMapContext(context) {
            if (!context) return { state: 'none', point: null };
            const point = eventPointForMapContext(context);
            if (point) return { state: 'ready', point };
            const dirId = String(context.dirId || '');
            const trip = S.activeTrip && String(S.activeTrip.direction_id || '') === dirId ? S.activeTrip : null;
            const details = S.directionDetailsCache?.[dirId]?.direction || null;
            if ((trip && ('direction_lat' in trip || 'direction_lng' in trip)) || (details && ('lat' in details || 'lng' in details))) {
                return { state: 'missing', point: null };
            }
            if (S.eventPointLoad?.[dirId] === 'error') return { state: 'error', point: null };
            return { state: 'loading', point: null };
        }

        // Пасивне читання деталей події (GET, без запису; §0.60). Один запит на подію; після помилки — лише за
        // явною дією людини (retry).
        function ensureEventPointForMap(dirId, { retry = false } = {}) {
            const safeDirId = parseInt(dirId) || 0;
            if (!safeDirId || !S.apiBase) return;
            S.eventPointLoad = S.eventPointLoad || {};
            const key = String(safeDirId);
            const status = S.eventPointLoad[key];
            if (status === 'loading' || status === 'done' || (status === 'error' && !retry)) return;
            S.eventPointLoad[key] = 'loading';
            api(`/api/v3/fractal/organizers?direction_id=${safeDirId}&lang=${encodeURIComponent(S.lang || 'uk')}&user_id=${encodeURIComponent(S.userId || '')}`)
                .then(data => {
                    if (data && data.direction) {
                        S.directionDetailsCache = S.directionDetailsCache || {};
                        S.directionDetailsCache[safeDirId] = { ...(S.directionDetailsCache[safeDirId] || {}), ...data };
                        S.eventPointLoad[key] = 'done';
                    } else {
                        S.eventPointLoad[key] = 'error';
                    }
                })
                .catch(() => { S.eventPointLoad[key] = 'error'; })
                .finally(() => {
                    renderNewsStrip();
                    if (S.currentScreen === 'explore') refreshMap();
                });
        }

        function onMapEventChip() {
            const context = mapContextScoped();
            if (!context) return;
            const st = eventPointStateForMapContext(context);
            if (st.state === 'ready') { setMapEventFilter(S.mapEventFilter === 'event' ? 'all' : 'event'); return; }
            if (st.state === 'error') {
                ensureEventPointForMap(context.dirId, { retry: true });
                renderNewsStrip();
                showToast('Пробуємо ще раз завантажити точку події', '');
                return;
            }
            showToast(st.state === 'missing' ? 'У події немає точки на карті' : 'Завантажуємо точку події…', '');
        }

        function renderMapModeStrip() {
            const strip = document.getElementById('map-mode-strip');
            if (!strip) return;
            const raw = activeMapContextForMap();
            // Перемикач Підписка/Загальна доступний лише для активної ПІДПИСКИ (не під час поїздки)
            const canToggle = !!(raw && raw.kind === 'subscription');
            // Авто-скидання на «Підписка» при зміні активної підписки
            const rawDirId = canToggle ? String(raw.dirId) : '';
            if (S._mapScopeDirId !== rawDirId) {
                S.mapScope = 'sub';
