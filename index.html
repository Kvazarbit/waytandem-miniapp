                       <button class="btn btn-secondary" onclick="closeSheet();openMapTripCrewSheet()">👥 Екіпаж</button>
                       <button class="btn btn-ghost" onclick="closeSheet()">Карта</button>`
                    : `<button class="btn btn-secondary" onclick="closeSheet();openChat(${safeReqId}, ${safePartnerId})">💬 Чат</button>
                       <button class="btn btn-success" onclick="closeSheet();confirmOwnFinish('trip')">🏁 Я доїхав до події</button>
                       <button class="btn btn-ghost" onclick="closeSheet()">Карта</button>`)
                : (isDriver
                    ? `${!isPickup ? `<button class="btn btn-secondary" onclick="arriveAtPickup().then(ok => { if (ok) openTripMap(); })">🚗 Я біля точки збору</button>` : ''}
                       ${isPickup && nextPassenger ? `<button class="btn btn-primary" onclick="markPassengerPickedUp(${nextReqId}, ${nextPassengerId}).then(ok => { if (ok) openTripMap(); })">✅ ${escapeHtml(nextName)} в авто</button>` : ''}
                       ${isPickup && allPickedUp ? `<button class="btn btn-primary" onclick="startTrip().then(ok => { if (ok) openTripMap(); })">🚀 Усі в авто — поїхали</button>` : ''}
                       <button class="btn btn-ghost" onclick="closeSheet();openMapTripCrewSheet()">👥 Екіпаж</button>`
                    : `<button class="btn btn-primary" onclick="closeSheet()">Дивитись карту</button>
                       <button class="btn btn-secondary" onclick="closeSheet();openMapTripCrewSheet()">👥 Екіпаж</button>
                       <button class="btn btn-ghost" onclick="closeSheet()">Пізніше</button>`);
            openSheet(`
                <div data-map-trip-coordination="true">
                    <div style="font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--blue);margin-bottom:6px;">Карта екіпажу</div>
                    <div class="sheet-title">${escapeHtml(title)}</div>
                    <div class="sheet-sub">${escapeHtml(status)}</div>
                    ${buildCrewPresenceSummary(t)}
                    ${buildPickupSequence(t)}
                    ${buildPickupActionPanel(t, { includeAction: false })}
                </div>
                <div class="sheet-actions" data-map-command-count="3">
                    ${actions}
                </div>
            `, { maxHeight: '58vh' });
            return true;
        }

        // ─── TRIPS ───
        function tripContactCard(c, history = false) {
            const reqId = Number(c.request_id) || 0, partnerId = Number(c.partner_id) || 0;
            const name = String(c.partner_name || 'Учасник');
            const chat = `openContactChat(${reqId},${partnerId},${escapeAttr(JSON.stringify(name))})`;
            const visibility = history
                ? (c.hidden && c.event_active ? `<button class="btn btn-ghost" onclick="setTripContactHidden(${reqId},false)">Повернути у Поїздки</button>` : '')
                : `<button class="btn btn-ghost" onclick="setTripContactHidden(${reqId},true)">Прибрати зі списку</button>`;
            const when = history ? `<div class="sheet-sub" style="font-size:12px;margin-top:5px;">${c.missed_at ? 'Посадка не відбулась: ' + escapeHtml(formatNewsTime(c.missed_at)) : 'Час невдалої посадки не зафіксовано'}</div>` : '';
            return `<div class="card" data-trip-contact="${reqId}" style="margin-top:12px;">
                <div style="font-weight:700;">Посадка не відбулась · ${escapeHtml(name)}</div>
                <div style="color:var(--text-muted);font-size:12px;margin-top:5px;">${escapeHtml(c.direction_title || 'Подія')}</div>${when}
                <div style="color:var(--text-secondary);font-size:13px;margin:8px 0;">Можна уточнити ситуацію в чаті. Це не активна поїздка.</div>
                <div class="sheet-actions"><button class="btn btn-secondary" onclick="${chat}">💬 Чат</button>${visibility}</div>
            </div>`;
        }

        async function setTripContactHidden(requestId, hidden) {
            const key = `contact_visibility_${requestId}`;
            if (!beginOp(key)) return;
            try {
                const res = await api('/api/v3/trip/contact/visibility', { method: 'POST', body: JSON.stringify({ request_id: requestId, user_id: S.userId, hidden }) });
                if (res?.status !== 'ok') { showToast('Не вдалося змінити список', 'error'); return; }
                showToast(hidden ? 'Картку прибрано тільки у вас. Чат лишився в історії.' : 'Картку повернуто у Поїздки', '');
                await hydrate();
                if (document.getElementById('sheet')?.classList.contains('open')) await openTripHistory();
            } finally { endOp(key); }
        }

        function openContactChat(requestId, partnerId, partnerName) {
            return openChat(requestId, partnerId, { partner_name: partnerName });
        }

        async function renderTrips() {
            await renderTripsCurrent();
            const container = document.getElementById('trips-content');
            if (!container) return;
            container.querySelector('[data-trip-contacts]')?.remove();
            const cards = (S.tripContacts || []).map(c => tripContactCard(c)).join('');
            container.insertAdjacentHTML('beforeend', `<section data-trip-contacts="true">${cards}<button class="btn btn-ghost" style="width:100%;margin-top:12px;" onclick="openTripHistory()">Історія поїздок і контактів</button></section>`);
        }

        async function renderTripsCurrent() {
            const container = document.getElementById('trips-content');
            if (!S.activeTrip) stopLocationTracking(true);
            if (hasTerminalIdleTruth()) syncTerminalIdleState('renderTrips');

            // Rating gate: if partner already finished and we have a cached trip
            if (!S.activeTrip && !S.pendingMatches.length && hasPendingRating() && !waitingForPartner) {
                if (maybeOpenCompletedTripRatingSheet('trips') || !hasPendingRating()) {
                    container.innerHTML = '<div class="empty" style="padding-top:80px;"><div class="empty-icon">🏁</div><div class="empty-title">Подорож завершена</div><div class="empty-sub">Оцініть вашого партнера у вікні зверху</div></div>';
                    return;
                }
            }

            // Waiting for partner confirmation
            if (waitingForPartner) { renderTripsWaiting(); return; }

            if (S.activeTrip) {
                const t = S.activeTrip;
                const isDriver = t.viewer_role === 'driver';
                const isStarted = !!t.is_started;
                const isPickup = t.status === 'pickup';
                const allPickedUp = allPickupPassengersPickedUp(t);
                const nextPassenger = nextPickupPassenger(t);
                const nextReqId = passengerRequestId(nextPassenger);
                const nextPassengerId = parseInt(nextPassenger?.user_id || 0, 10) || 0;
                const nextName = nextPassenger ? passengerDisplayName(nextPassenger) : '';
                const partnerFinished = tripPartnerFinished(t);
                const viewerFinished = tripViewerFinished(t);
                const cancelBy = t.cancel_requested_by;
                const cancelPending = cancelBy && !isStarted && String(cancelBy) !== String(S.userId);
                const cancelRequested = cancelBy && !isStarted && String(cancelBy) === String(S.userId);
                const showTripLevelCancelActions = cancelPending && !isDriver;
                const formationLabel = tripFormationLabel(t, isStarted, isPickup);
                const liveLocationActive = shouldShareLiveLocation(t);
                // Live location is telemetry for the active crew, not a lifecycle transition.
                // Use clearConsent=false here: this runs on every poll cycle, so clearing
                // would wipe the user's saved choice and re-trigger the prompt endlessly.
                if (liveLocationActive) startLocationTracking(); else stopLocationTracking(false);
                container.innerHTML = `
                    <div class="hero ${isStarted ? 'driving' : 'reservation'} animate-in">
                        <div class="hero-label" style="color:${isStarted ? 'var(--accent)' : (isPickup ? 'var(--blue)' : 'var(--amber)')};">
                            ${formationLabel}
                        </div>
                        <div class="hero-title">${escapeHtml(t.direction_title || 'Поїздка')}</div>
                        <div class="hero-sub">Екіпаж #${activeTripCrewNumber(t)} • ${isDriver ? '🚗 Ви водій' : '👤 Ви попутник'}</div>
                        ${buildCrewTree(t)}
                        ${buildCrewPresenceSummary(t)}
                        ${buildPickupSequence(t)}
                        ${buildPickupActionPanel(t, { includeAction: false })}
                        ${buildLiveLocationConsentPanel(t)}
                        ${isDriver ? buildDriverCrewCommsPanel(t) : ''}
                        ${isDriver ? buildCrewCancelAttentionPanel(t) : ''}

        function renderTripsWaiting() {

                    <div style="margin-top:20px;display:flex;align-items:center;justify-content:center;gap:8px;">

                        <span style="font-size:13px;color:var(--text-secondary);">Очікування...</span>

        async function respondHandshake(partnerId, dirId, accept, mode = '') {
            // mode='cancel' — користувач скасовує ВЛАСНИЙ вихідний запит (не відмова партнера).
            if (!beginOp('respond_handshake')) return;
            try {
                const res = await api('/api/v3/match/respond', { method: 'POST', body: JSON.stringify({ user_id: S.userId, target_id: partnerId, direction_id: dirId, accept }) });
                if (res?.status === 'ok') {
                    // §2.1 Atomic Conveyor + §0.13 Stadium Law:
                    // accept одного пасажира ≠ екіпаж готовий. Місце зайняте, але
                    // водій продовжує набирати до N=seats_total. Тост і crew_formed
                    // відкладаємо до реального стану після hydrate().
                    // НЕ викликаємо clearCriticalState() — lifecycle не закінчено.
                    if (!accept) {
                        showToast(mode === 'cancel' ? '🛑 Запит скасовано. Ви далі підписані на подію' : 'Ви відхилили запит', '');
                    }
                    S.proposedMatch = null;
                    closeMapResultPanel();
                    // Для accept — спочатку hydrate, тоді реальний тост зі стану
                    await hydrate();
                    if (accept) {
                        // Після hydrate: якщо activeTrip з'явився — handshake завершено
                        // (перший accept створює поїздку). Якщо ще є вільні місця —
                        // водій продовжує набір. crew_formed_manual тільки при першому.
                        const isDriver = _isDriverRole(S.userRole);
                        const freeSeats = driverFreeSeatsAfterAccept();
                        if (isDriver && freeSeats > 0) {
                            showToast(`✓ Прийнято! Ще ${freeSeats} ${pluralUk(freeSeats, 'місце вільне', 'місця вільних', 'місць вільних')} — шукаємо далі`, 'success');
                        } else if (isDriver && freeSeats === 0) {
                            notifyCriticalEvent('crew_formed_manual', `${partnerId}:${dirId}`);
                            showToast('✅ Всі місця зайняті! Екіпаж сформовано', 'success');
                        } else {
                            // Пасажир прийняв запрошення від водія
                            notifyCriticalEvent('crew_formed_manual', `${partnerId}:${dirId}`);
                            showToast('✅ Ви прийняті до екіпажу!', 'success');
                        }
                    }
                    return true;
                } else if (res?.reason === 'action_forbidden') {
                    showToast('Після старту — тільки фініш', 'error');
                } else {
                    showToast(getErrorMessage(res, 'Не вдалось обробити запит'), 'error');
                }
            } catch (e) {
                showToast('Немає з\'єднання — спробуйте ще раз', 'error');
            } finally { endOp('respond_handshake'); }
            return false;
        }

        async function stopSearchFromHandshake(partnerId, dirId) {
            const safePartnerId = parseInt(partnerId, 10) || 0;
            const safeDirId = parseInt(dirId, 10) || 0;
            if (!safePartnerId || !safeDirId) {
                showToast('Запит не знайдено', 'error');
                return false;
            }
            if (!beginOp('stop_search')) return false;
            try {
                const stopResp = await apiWithStatus('/api/v3/match/stop-search', {
                    method: 'POST',
                    body: JSON.stringify({ user_id: S.userId, target_id: safePartnerId, direction_id: safeDirId })
                });
                if (stopResp?.data?.reason === 'active_trip_in_direction') {
                    showActiveDealWarning(safeDirId, 'leave');  // з домовленості — лише через партнера (2026-09-26)
                    return false;
                }
                const res = stopResp?.ok ? stopResp.data : null;
                if (res?.status === 'ok') {
                    showToast('🚪 Ви вийшли з події: запити та підписку скасовано', 'success');
                    clearCriticalState();
                    clearPickupPoint();
                    removePendingMatchByPair(safePartnerId, safeDirId);
                    renderSubBar();
                    renderTrips();
                    verifyHandshakePanelState();
                    await hydrate();
                    return true;
                }
                showToast(getErrorMessage(res, 'Не вдалось зупинити пошук'), 'error');
            } catch (e) {
                showToast('Немає з\'єднання — спробуйте ще раз', 'error');
            } finally { endOp('stop_search'); }
            return false;
        }

        async function inviteProposedMatch(partnerId, dirId) {
            const safePartnerId = parseInt(partnerId, 10) || 0;
            const safeDirId = parseInt(dirId, 10) || 0;
            if (!safePartnerId || !safeDirId) return;

            if (!beginOp('invite_proposed')) return;
            try {
                const response = await apiWithStatus('/api/v3/match/invite', {
                    method: 'POST',
                    silent: true,
                    body: JSON.stringify({ user_id: S.userId, target_id: safePartnerId, direction_id: safeDirId })
                });
                const res = response.data;
                if (res?.status === 'ok') {
                    showToast('📤 Запит надіслано! Очікуємо підтвердження.', 'success');
                    S.proposedMatch = null;
                    closeMapResultPanel();
                    await hydrate();
                } else {
                    showToast(getErrorMessage(res, 'Не вдалось надіслати запит'), 'error');
                }
            } catch (e) {
                showToast('Немає з\'єднання — спробуйте ще раз', 'error');
            } finally {
                endOp('invite_proposed');
            }
        }

        async function declineProposedMatch(partnerId, dirId) {
            const safePartnerId = parseInt(partnerId, 10) || 0;
            const safeDirId = parseInt(dirId, 10) || 0;
            if (!safePartnerId || !safeDirId) return;

            if (!beginOp('decline_proposed')) return;
            try {
                const res = await api('/api/v3/match/respond', {
                    method: 'POST',
                    body: JSON.stringify({ user_id: S.userId, target_id: safePartnerId, direction_id: safeDirId, accept: false })
                });
                if (res?.status === 'declined' || (res?.status === 'ok' && res?.action === 'declined')) {
                    showToast('✕ Пропущено', 'success');
                    S.proposedMatch = null;
                    closeMapResultPanel();
                    await hydrate();
                } else {
                    showToast(getErrorMessage(res, 'Не вдалось пропустити'), 'error');
                }
            } catch (e) {
                showToast('Немає з\'єднання — спробуйте ще раз', 'error');
            } finally {
                endOp('decline_proposed');
            }
        }

        function closeHandshakeActionPanel() {
            clearIncomingPickupMarker();
            const panel = document.getElementById('handshake-panel');
            if (!panel) return;
            panel.classList.remove('open');
            panel.innerHTML = '';
            document.body.style.paddingBottom = '';
            const nav = document.querySelector('.nav');
            if (nav) nav.style.display = 'flex';
        }

        function openMapRequestsFromHandshakePanel() {
            closeHandshakeActionPanel();
            openMapPendingMatchesSheet('all');
        }

        function verifyHandshakePanelState() {
            const panel = document.getElementById('handshake-panel');
            if (!panel) return;

            const incoming = S.pendingMatches.filter(m => m.scope === 'incoming');
            closePassiveDirectionInviteSheetForActionSurface('handshake-panel');
            suppressManualSearchProposedMatch();

            // If there's an active trip, or we are waiting for partner, hide the panel
            if (!incoming.length || !_isDriverRole(S.userRole)) clearIncomingPickupMarker();
            if ((S.activeTrip && S.activeTrip.is_started) || waitingForPartner) {
                clearIncomingPickupMarker();
                panel.classList.remove('open');
                panel.innerHTML = '';
                document.body.style.paddingBottom = '';
                const nav = document.querySelector('.nav');
                if (nav) nav.style.display = 'flex';
                return;
            }

            // Case A: Incoming handshake
            if (incoming.length > 0) {
                // DM-2026-06-14-003 (addendum): handshake-панель — рішення, що
                // вимагає дії — має пріоритет над пасивними result-банерами
                // (auto_search/manual_search/outgoing/rating_due), які мають
                // той самий z-index і інакше перекривали б цей запит.
                closeMapResultPanel();
                const m = incoming[0];
                const partnerName = m.partner_name || m.sender_name || `#${m.partner_id}`;
                const partnerId = m.partner_id || m.sender_id;
                const dirTitle = m.direction || m.direction_title || 'Подія';
                const isDriver = _isDriverRole(S.userRole);
                const title = isDriver ? '📩 Запит в екіпаж' : '📩 Знайдено водія';
                const acceptText = isDriver ? '✓ Взяти в екіпаж' : '✓ Прийняти';
                const declineText = isDriver ? '✕ Пропустити' : '✕ Відхилити';
                // 2zi (Ф1): водій вирішує, знаючи, де чекає попутник і як далеко від старту авто.
                const pickupInfo = isDriver ? incomingPickupInfo(m) : null;
                const pickupLine = isDriver
                    ? `<div data-incoming-pickup-line="true" ${pickupInfo.hasPickup ? 'role="button" tabindex="0" onclick="focusIncomingPickupOnMap()" style="cursor:pointer;' : 'style="'}font-size:12px;color:var(--text);white-space:normal;margin-top:4px;">${escapeHtml(incomingPickupLine(m))}${pickupInfo.hasPickup ? ' <span style="color:var(--accent);font-weight:700;">· показати</span>' : ''}</div>`
                    : '';
                const pickupFocusKey = `${partnerId}:${m.direction_id}`;

                document.body.style.paddingBottom = '175px';

                panel.innerHTML = `
                    <div style="font-weight:800;font-size:14px;margin-bottom:10px;color:var(--accent);display:flex;align-items:center;gap:6px;">
                        🟢 ${escapeHtml(title)}
                    </div>
                    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;padding:10px;border-radius:10px;background:rgba(255,255,255,0.03);border:1px solid var(--border);">
                        ${renderAvatarInline(partnerName, m.partner_photo_url || m.sender_photo_url || m.target_photo_url || '', 40)}
                        <div style="flex:1;min-width:0;">
                            <div style="font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(partnerName)}</div>
                            <div style="font-size:11px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;">🎯 ${escapeHtml(dirTitle)}</div>
                            ${pickupLine}
                        </div>
                    </div>
                    <div style="display:flex;gap:10px;margin-bottom:8px;">
                        <button class="btn btn-primary" style="flex:1;height:40px;font-size:13px;" onclick="respondHandshake(${partnerId}, ${m.direction_id}, true)">${escapeHtml(acceptText)}</button>
                        <button class="btn btn-danger" style="flex:1;height:40px;font-size:13px;" onclick="respondHandshake(${partnerId}, ${m.direction_id}, false)">${escapeHtml(declineText)}</button>
                    </div>
                    <button class="btn btn-secondary" style="width:100%;height:36px;font-size:12px;background:transparent;border:1px solid rgba(255,255,255,0.15);" onclick="openMapRequestsFromHandshakePanel()">Інші запити</button>
                `;
                panel.classList.add('open');
                const nav = document.querySelector('.nav');
                if (nav) nav.style.display = 'none';
                if (isDriver) {
                    // Пін точки очікування — одразу; карту підганяємо один раз на запит, не на кожен poll.
                    const firstShow = S._incomingPickupFocusedKey !== pickupFocusKey;
                    showIncomingPickupOnMap(m, { focus: firstShow });
                    S._incomingPickupFocusedKey = pickupFocusKey;
                } else {
                    clearIncomingPickupMarker();
                }
                return;
            }

            // Case B: Proposed match (automatic search candidate)
            if (S.proposedMatch) {
                // DM-2026-06-14-003 (addendum): see Case A — same priority rule.
                closeMapResultPanel();
                const pm = S.proposedMatch;
                const partnerName = pm.partner_name || `#${pm.partner_id}`;
                const partnerId = pm.partner_id;
                const dirTitle = pm.direction_title || 'Подія';
                const isDriver = _isDriverRole(S.userRole);
                const title = isDriver ? '✨ Знайдено попутника' : '✨ Знайдено водія';

                document.body.style.paddingBottom = '175px';

                panel.innerHTML = `
                    <div style="font-weight:800;font-size:14px;margin-bottom:10px;color:var(--accent);display:flex;align-items:center;gap:6px;">
                        ${escapeHtml(title)}
                    </div>
                    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;padding:10px;border-radius:10px;background:rgba(255,255,255,0.03);border:1px solid var(--border);">
                        ${renderAvatarInline(partnerName, pm.partner_photo_url || '', 40)}
                        <div style="flex:1;min-width:0;">
                            <div style="font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(partnerName)}</div>
                            <div style="font-size:11px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;">🎯 ${escapeHtml(dirTitle)}</div>
                        </div>
                    </div>
                    <div style="display:flex;gap:10px;margin-bottom:8px;">
                        <button class="btn btn-primary" style="flex:1;height:40px;font-size:13px;" onclick="inviteProposedMatch(${partnerId}, ${pm.direction_id})">✓ Запросити</button>
                        <button class="btn btn-danger" style="flex:1;height:40px;font-size:13px;" onclick="declineProposedMatch(${partnerId}, ${pm.direction_id})">✕ Пропустити</button>
                    </div>
                    <button class="btn btn-secondary" style="width:100%;height:36px;font-size:12px;background:transparent;border:1px solid rgba(255,255,255,0.15);" onclick="openMapRequestsFromHandshakePanel()">Інші запити</button>
                `;
                panel.classList.add('open');
                const nav = document.querySelector('.nav');
                if (nav) nav.style.display = 'none';
                return;
            }

            // Case C: No matches/proposals
            panel.classList.remove('open');
            panel.innerHTML = '';
            document.body.style.paddingBottom = '';
            const nav = document.querySelector('.nav');
            if (nav) nav.style.display = 'flex';
        }

        // ═══════ MAP RESULT PANEL (non-modal, map stays visible/interactive) ═══════
        // Used for short-lived results of map actions (join request sent, signal sent)
        // — unlike .sheet/#sheet-backdrop, this does NOT dim or block the map.
        // `meta` (DM-2026-06-13-005) lets verifyMapResultPanelState() keep a
        // long-lived "outgoing process" card in sync with hydrate/poll — e.g.
        // close it once the handshake resolves, so action buttons never point
        // at an already-settled request.
        function syncMapSearchPanelVisibility() {
            const panel = document.getElementById('map-result-panel');
            if (!panel) return;
            const manual = panel._mapResultMeta?.kind === 'manual_search';
            panel.classList.toggle('manual-search-panel', manual);
            panel.classList.toggle('screen-hidden', manual && S.currentScreen !== 'explore');
        }

        function openMapResultPanel(html, meta = null, stripHtml = null) {
            const panel = document.getElementById('map-result-panel');
            if (!panel) return;
            // СТАТУС-банер може жити у мікро-смужці над навігацією (stripHtml +
            // S.mapResultCollapsed) — тоді нижнє меню доступне. Без stripHtml
            // банер завжди повний (перекриває нав).
            const micro = !!(stripHtml && S.mapResultCollapsed);
            panel.innerHTML = micro ? stripHtml : html;
            panel.classList.add('open');
            panel.classList.toggle('collapsed', micro);
            panel._mapResultMeta = meta;
            syncMapSearchPanelVisibility();
            document.body.style.paddingBottom = micro ? '' : '170px';
            syncBottomStripStacking();
        }

        function closeMapResultPanel() {
            const panel = document.getElementById('map-result-panel');
            if (!panel) return;
            panel.classList.remove('open');
            panel.classList.remove('collapsed');
            panel.innerHTML = '';
            panel._mapResultMeta = null;
            const handshake = document.getElementById('handshake-panel');
            if (!handshake || !handshake.classList.contains('open')) {
                document.body.style.paddingBottom = '';
            }
            syncBottomStripStacking();
        }

        function closeMapResultPanelIfNoProposedMatch() {
            const panel = document.getElementById('map-result-panel');
            if (!panel || !panel.classList.contains('open')) return;
            const meta = panel._mapResultMeta;
            if (meta && ['auto_search', 'manual_search', 'outgoing'].includes(meta.kind)) return;
            closeMapResultPanel();
        }

        // DM-2026-06-13-005: тримає компактну "процес"-картку (renderMapOutgoingProcessCard)
        // синхронною з реальним станом хендшейку на кожному hydrate/poll —
        // інакше "🛑 Скасувати запит"/"🚪 Вийти з події" можуть лишитись над
        // уже вирішеним запитом (партнер прийняв/відхилив, або запит
        // скасовано з "Поїздки" в іншій вкладці).
        function verifyMapResultPanelState() {
            const panel = document.getElementById('map-result-panel');
            if (!panel || !panel.classList.contains('open')) return;

            // DM-2026-06-14-003 (addendum): handshake-панель (рішення, що
            // вимагає дії — incoming request / proposed match) має пріоритет
            // над цією result-панеллю (пасивний статус). Обидві мають
            // z-index:10000 і однакову позицію — без цього map-result-panel
            // (пізніше в DOM) перекриває handshake-panel і користувач не
            // бачить новий запит/матч.
            const handshake = document.getElementById('handshake-panel');
            if (handshake && handshake.classList.contains('open')) {
                closeMapResultPanel();
                return;
            }

            const meta = panel._mapResultMeta;
            if (!meta) return;
            const { dirId, kind } = meta;

            // Обидва типи панелей: якщо вже є активна поїздка — банер більше не потрібен.
            const tripMatched = !!(S.activeTrip && String(S.activeTrip.direction_id || '') === String(dirId));
            if (tripMatched) {
                closeMapResultPanel();
                showToast('🎉 Екіпаж готовий! Відкрийте екіпаж на карті', 'success');
                return;
            }

            if (S.subscriptionSearchHeld && (kind === 'auto_search' || kind === 'manual_search')) {
                closeMapResultPanel();
                return;
            }
            if (S.missedPickup && (kind === 'auto_search' || kind === 'manual_search')) {
                closeMapResultPanel();   // G5 М3: no search before «Шукати інший екіпаж» / «Більше не їду»
                return;
            }
            if (kind === 'auto_search') {
                // Автопошук: якщо з'явився outgoing хендшейк — переключити на процес-картку.
                if (getOutgoingForDirection(dirId)) { openMapOutgoingPanel(dirId); return; }
                // Якщо підписку скасовано (немає в subscriptions) — закрити панель.
                const stillSubscribed = (S.subscriptions || []).some(s => String(s.direction_id) === String(dirId));
                if (!stillSubscribed) { closeMapResultPanel(); return; }
                // Підписка ще жива, пошук іде — оновлюємо банер (контекст/місця/режим, мікро-стан).
                openMapAutoSearchPanel(dirId);
                return;
            }

            if (kind === 'manual_search') {
                // Виник outgoing хендшейк (запросився) — перемкнути на процес-картку.
                if (getOutgoingForDirection(dirId)) { openMapOutgoingPanel(dirId); return; }
                const sub = (S.subscriptions || []).find(s => String(s.direction_id) === String(dirId));
                if (!sub) { closeMapResultPanel(); return; }      // підписку скасовано деінде
                if (sub.auto_match) { openMapAutoSearchPanel(dirId); return; }  // перемкнули на авто
                openMapManualSearchPanel(dirId);                  // оновити (контекст/місця/режим, мікро-стан)
                return;
            }

            if (kind !== 'outgoing') return;

            if (!getOutgoingForDirection(dirId)) {
                // Хендшейк уже вирішено (прийнято/відхилено/скасовано) деінде —
                // картка з "Скасувати запит"/"Вийти з події" більше не актуальна.
                closeMapResultPanel();
                return;
            }
            // Запит ще в процесі — оновлюємо картку (ім'я/фото партнера могли довантажитись).
            openMapOutgoingPanel(dirId);
        }

        // DM-2026-06-14-005: проактивне відкриття map-result "процес"-банера на
        // cold-start. Після F5 DOM #map-result-panel створюється закритим, а
        // panel._mapResultMeta втрачено, тож verifyMapResultPanelState() (refresh-
        // only: бейлиться, поки панель закрита) НЕ відновлює активний outgoing-
        // запит — користувач бачить порожню карту, хоча запрошення ще живе в
        // "Поїздки". Будуємо банер заново зі стану S на hydrate, як це робить
        // verifyHandshakePanelState() (завжди ребілдить Case A/B).
        // Гейти (DM-2026-06-14-003 + сервер/клієнт-аналіз банерів):
        //   • активна поїздка -> картою володіє trip-dock, і сервер може віддати
        //     застарілий outgoing під час 'driving' (фантом) -> НЕ відкривати;
        //   • відкритий handshake -> рішення важливіше за пасивний статус -> НЕ відкривати;
        //   • панель уже .open -> verifyMapResultPanelState() тримає її синхронною.
        function maybeOpenMapResultPanelOnHydrate() {
            const panel = document.getElementById('map-result-panel');
            if (!panel || panel.classList.contains('open')) return;
            // DM-2026-06-15: якщо саме зараз відкрита шторка (напр. rating-sheet
            // після завершення поїздки), не відкривати банер ІНШОЇ підписки —
            // він стане .open БЕЗ .hidden-by-sheet (бо на момент openSheet() ще
            // не існував) і перекриє шторку (z-index 10000 > 9001). Дзеркалить
            // guard з maybeOpenCompletedTripRatingSheet(). Банер коректно
            // з'явиться після closeSheet() (там цей самий виклик додано нижче).
            if (isAppInBackground || S.roleGateOpen || S.matchSheetOpen || isSheetOpen()) return;
            if (S.activeTrip) return;
            const handshake = document.getElementById('handshake-panel');
            if (handshake && handshake.classList.contains('open')) return;
            // Банер 5 (outgoing): активний запит/запрошення, що чекає на партнера.
            const outgoing = (S.pendingMatches || []).find(m => m && m.scope === 'outgoing' && m.direction_id != null);
            if (outgoing) {
                openMapOutgoingPanel(outgoing.direction_id);
                return;
            }
            // Банери 1/2 (DM-2026-06-14-004): активна підписка без поїздки/
            // handshake/outgoing. Single Subscription Law -> максимум одна активна;
            // режим вирішує auto_match (персистентний у web_subscriptions).
            if (S.subscriptionSearchHeld || S.missedPickup) return;   // G5 М3: the dock's two options first
            const sub = (S.subscriptions || [])[0];
            if (sub && sub.direction_id != null) {
                if (sub.auto_match === false) openMapManualSearchPanel(sub.direction_id);
                else openMapAutoSearchPanel(sub.direction_id);
            }
        }

        // ═══════ MAP TRIP DOCK ═══════
        // DM-2026-06-13-006: персистентний нижній док активного екіпажу на карті.
        // Закриває діру "після рукостискання карта порожня, статус і дії — лише у
        // вкладці Поїздки". Тримає поточну фазу циклу (домовились → збір → у дорозі)
        // + до двох дій біля великого пальця, авто-синхронний з hydrate/poll.
        // Працює лише на екрані карти (explore); у Поїздках своя hero-картка.
        function mapTripDockPhase(t) {
            if (!t) return null;
            if (t.is_started) return 'driving';
            if (t.status === 'pickup') return 'pickup';
            return 'reservation';
        }

        function mapTripDockTitle(phase) {
            if (phase === 'driving') return { icon: '🛣', title: 'У дорозі до події' };
            if (phase === 'pickup') return { icon: '🚗', title: 'Збір екіпажу' };
            return { icon: '🤝', title: 'Екіпаж домовився' };
        }

        function closeMapTripDock() {
            const panel = document.getElementById('map-trip-dock');
            if (!panel) return;
            panel.classList.remove('open');
            panel.classList.remove('collapsed');
            panel.classList.remove('stacked-above-result');
            panel.innerHTML = '';
        }

        function toggleMapTripDock() {
            S.mapTripDockCollapsed = !S.mapTripDockCollapsed;
            S.mapTripDockCollapseMemo = S.mapTripDockPhaseSeen ? { key: S.mapTripDockPhaseSeen, collapsed: S.mapTripDockCollapsed } : null;
            persistCriticalState();
            verifyMapTripDockState();
            // Розгорнутий банер вищий за смужку — точки екіпажу не мають опинитись під ним.
            if (shouldRenderCrewMembersOnMap(S.activeTrip)) renderCrewMembersOnMap();
        }

        // DM-2026-06-14-011: #map-result-panel.collapsed і #map-trip-dock.collapsed —
        // обидві мікро-смужки внизу карти з однаковим bottom-офсетом. Якщо ОБИДВІ
        // .open.collapsed одночасно (напр. активна поїздка по напрямку A + нова
        // підписка-пошук по напрямку B), result-панель (z-index 10000) перекриє
        // смужку дока (z-index 9000). Зсуваємо смужку дока вище — обидві видимі.
        // Викликати після будь-якої зміни .open/.collapsed на цих двох контейнерах.
        function syncBottomStripStacking() {
            const dock = document.getElementById('map-trip-dock');
            if (!dock) return;
            const result = document.getElementById('map-result-panel');
            const resultMicro = !!(result && result.classList.contains('open') && result.classList.contains('collapsed'));
            const dockMicro = dock.classList.contains('open') && dock.classList.contains('collapsed');
            dock.classList.toggle('stacked-above-result', dockMicro && resultMicro);
        }

        function mapTripDockViewKey(t, phase) {
            // r2 (рев'ю 02.10): сповіщення водія — конкретні пари, що чекають саме його відповіді.
            // Новий фініш ще одного попутника змінює набір і розгортає док один раз; той самий набір — ні.
            const waiting = t?.viewer_role === 'driver'
                ? unconfirmedCrewFinishers(t).map(m => Number(m.request_id)).sort((a, b) => a - b)
                : [];
            const claimKey = t?.viewer_role === 'driver'
                ? claimedPickupPassengers(t).map(p => `${passengerRequestId(p)}${p.presence_contested ? 'c' : 'd'}`).join('_')
                : (ownPresenceClaim(t)?.state || '');
            const notice = t?.cancel_requested_by ? `cancel_${t.cancel_requested_by}`
                : (waiting.length ? `finished_${waiting.join('_')}` : (tripPartnerFinished(t) ? 'partner_finished'
                    : (claimKey ? `claims_${claimKey}` : '')));
            return `${currentRequestIdFromTrip(t) || 0}:${phase}:${notice}`;
        }

        // Новий вигляд дока (фаза/сповіщення) — розгорнутий, окрім випадку, коли людина вже
        // згорнула саме цей вигляд (пам'ять переживає повернення з інших вкладок і F5).
        function syncMapTripDockView(viewKey) {
            if (viewKey === S.mapTripDockPhaseSeen) return;
            const memo = S.mapTripDockCollapseMemo;
            S.mapTripDockCollapsed = !!(memo && memo.key === viewKey && memo.collapsed);
            S.mapTripDockPhaseSeen = viewKey;
        }

        function verifyMapTripDockState() {
            const panel = document.getElementById('map-trip-dock');
            if (!panel) return;
            const t = S.activeTrip;
            const handshake = document.getElementById('handshake-panel');
            const handshakeOpen = handshake && handshake.classList.contains('open');
            // Док лише на карті, лише за наявності активного екіпажу. Поступається
            // панелі вхідного запиту (прийняти нового попутника терміновіше) і не
            // конкурує з очікуванням підтвердження партнера.
            // Finding A (DM-2026-06-16-001): finish-wait — раніше `waitingForPartner`
            // повністю ховав док, і водій лишався без банера й без «Чат».
            // Тепер у стані «ви відмітили фініш, чекаємо партнера» показуємо
            // компактний банер (статус + «💬 Чат» + «Екіпаж»). `waitingForPartner`
            // істинний лише коли ВИ відмітили фініш; трип беремо з S.activeTrip
            // або зі знімка lastKnownTripForRating (сервер міг вже віддати трип).
            const fwTrip = (waitingForPartner && t && tripViewerFinished(t) && !tripPartnerFinished(t))
                ? t
                : (waitingForPartner && lastKnownTripForRating) ? lastKnownTripForRating : null;
            if (fwTrip && S.currentScreen === 'explore' && !handshakeOpen) {
                syncMapTripDockView(`${currentRequestIdFromTrip(fwTrip) || 0}:finish_wait:`);
                if (S.mapTripDockCollapsed) {
                    panel.innerHTML = buildMapFinishWaitStrip(fwTrip);
                    panel.classList.add('open', 'collapsed');
                    syncBottomStripStacking();
                    return;
                }
                panel.classList.remove('collapsed', 'stacked-above-result');
                panel.innerHTML = buildMapFinishWaitBody(fwTrip);
                panel.classList.add('open');
                syncBottomStripStacking();
                return;
            }
            if (!t && S.missedPickup && S.currentScreen === 'explore' && !handshakeOpen && !waitingForPartner) {
                syncMapTripDockView(`${Number(S.missedPickup.request_id) || 0}:missed:${S.missedPickup.state || ''}`);
                panel.classList.remove('collapsed', 'stacked-above-result');
                panel.innerHTML = buildMissedPickupDockBody(S.missedPickup);
                panel.classList.add('open');
                syncBottomStripStacking();
                return;
            }
            if (!t || S.currentScreen !== 'explore' || handshakeOpen || waitingForPartner) {
                closeMapTripDock();
                S.mapTripDockPhaseSeen = null;
                // Поїздки вже немає за підтвердженим hydrate — пам'ять згортання більше не потрібна.
                if (!t && !waitingForPartner && S.lastHydrateAt && S.mapTripDockCollapseMemo) {
                    S.mapTripDockCollapseMemo = null;
                    persistCriticalState();
                }
                syncBottomStripStacking();
                return;
            }
            const phase = mapTripDockPhase(t);
            // Нова фаза циклу або НОВЕ сповіщення (скасування/фініш партнера) розгортає док один раз;
            // повторний poll того самого стану не перемагає явне згортання людини (кандидат 2026-10-01).
            syncMapTripDockView(mapTripDockViewKey(t, phase));
            if (S.mapTripDockCollapsed) {
                panel.innerHTML = buildMapTripDockStrip(t, phase);
                panel.classList.add('open', 'collapsed');
                syncBottomStripStacking();
                return;
            }
            panel.classList.remove('collapsed');
            panel.classList.remove('stacked-above-result');
            panel.innerHTML = buildMapTripDockBody(t, phase);
            panel.classList.add('open');
        }

        // DM-2026-06-14-003 (addendum, gap #2 partial): компактний лічильник
        // зайнятих місць для ВОДІЯ — зайнято = пасажири в екіпажі
        // (crewPassengerMembers), total = seats_total, якщо payload його віддає.
        // Дзеркалить crew-presence з вкладки "Поїздки" одним числом, видимий
        // навіть у згорнутому (мікро) стані дока.
        function tripSeatsLabel(t) {
            const occupied = crewPassengerMembers(t).length;
            const total = seatCount(t?.seats_total ?? t?.total_seats);
            return total > 0 ? `💺 ${occupied}/${total}` : `💺 ${occupied}`;
        }

        function buildMapTripDockStrip(t, phase) {
            const head = tripPartnerFinished(t) && !tripViewerFinished(t)
                ? { icon: '🏁', title: 'Фініш · чекає вашого підтвердження' }
                : (tripViewerFinished(t) && !tripPartnerFinished(t) ? { icon: '⏳', title: 'Очікуємо підтвердження' } : mapTripDockTitle(phase));
            const seats = (t && t.viewer_role === 'driver') ? ` · ${tripSeatsLabel(t)}` : '';
            return `<div class="dock-strip" onclick="toggleMapTripDock()">
                <span>${head.icon} ${escapeHtml(head.title)}${seats}</span>
                <span style="opacity:.55;font-size:11px;">розгорнути ▴</span>
            </div>`;
        }

        // Finding A (DM-2026-06-16-001): компактний банер фази finish-wait
        // (водій/попутник відмітив фініш, чекає підтвердження партнера).
        // Не конкурує з rating-sheet: як тільки партнер підтвердив —
        // res.completed → waitingForPartner=false → ця гілка більше не рендериться.
        function buildMapFinishWaitBody(t) {
            const isDriver = t.viewer_role === 'driver';
            const crewNo = activeTripCrewNumber(t);
            const dir = t.direction_title || 'Поїздка';
            const seatsChip = isDriver ? ` · ${tripSeatsLabel(t)}` : '';
            const metaLine = `Екіпаж #${escapeHtml(String(crewNo))} · ${escapeHtml(dir)} · ${isDriver ? '🚗 Ви водій' : '👤 Ви попутник'}${seatsChip}`;
            const safeReqId = parseInt(t.request_id || t.id || 0, 10) || 0;
            const safePartnerId = parseInt(isDriver ? (t.client_id || 0) : (t.driver_id || 0), 10) || 0;
            return `<div class="dock-head">
                    <div style="min-width:0;">
                        <div class="dock-title">⏳ Очікуємо підтвердження</div>
                        <div class="dock-sub">${metaLine}</div>
                        <div class="dock-sub" style="color:var(--amber);font-weight:bold;margin-top:5px;white-space:normal;">✓ Ви відмітили фініш. ${finishAwaitingLine(t)}</div>
                    </div>
                    <button class="dock-collapse" onclick="toggleMapTripDock()" title="Згорнути" aria-label="Згорнути">▾</button>
                </div>
                ${mapTripPhaseStepper('driving', true)}
                <div class="dock-actions">
                    <button class="btn btn-secondary" onclick="openChat(${safeReqId}, ${safePartnerId})">💬 Чат</button>
                    <button class="btn btn-secondary" onclick="openMapTripCrewSheet()">👥 Екіпаж</button>
                </div>`;
        }

        function buildMapFinishWaitStrip(t) {
            return `<div class="dock-strip" onclick="toggleMapTripDock()">
                <span>⏳ Очікуємо підтвердження</span>
                <span style="opacity:.55;font-size:11px;">розгорнути ▴</span>
            </div>`;
        }

        function buildMapTripCrewSheetBody(t) {
            if (!t) return '';
            const isDriver = t.viewer_role === 'driver';
            const isStarted = !!t.is_started;
            const safeReqId = parseInt(t.request_id || t.id || 0, 10) || 0;
            const safePartnerId = parseInt(isDriver ? (t.client_id || 0) : (t.driver_id || 0), 10) || 0;
            const title = `Екіпаж #${escapeHtml(activeTripCrewNumber(t))}`;
            const status = tripHumanStatusLabel(t);
            const actions = isDriver
                ? `<button class="btn btn-secondary" onclick="closeSheet();openChat(${safeReqId}, ${safePartnerId})">💬 Чат</button>
                   <button class="btn btn-ghost" onclick="closeSheet()">Карта</button>`
                : `<button class="btn btn-secondary" onclick="closeSheet();openChat(${safeReqId}, ${safePartnerId})">💬 Чат</button>
                   ${!isStarted ? `<button class="btn btn-ghost" onclick="closeSheet();cancelTrip()">🚪 Попросити вихід</button>` : ''}
                   <button class="btn btn-ghost" onclick="closeSheet()">Карта</button>`;
            return `
                <div data-map-trip-crew-sheet="true">
                    <div style="font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--blue);margin-bottom:6px;">Екіпаж на карті</div>
                    <div class="sheet-title">${title}</div>
                    <div class="sheet-sub">${escapeHtml(status)}</div>
                    ${buildCrewPresenceSummary(t)}
                    ${buildCrewTree(t)}
                    ${buildPickupSequence(t)}
                    ${isDriver ? buildDriverPresenceClaimsPanel(t) : ''}
                    ${isDriver ? buildDriverCrewCommsPanel(t) : ''}
                    ${isDriver ? buildDriverFinishPanel(t) : ''}
                </div>
                <div class="sheet-actions" data-map-command-count="3">
                    ${actions}
                </div>
            `;
        }

        function openMapTripCrewSheet() {
            const t = S.activeTrip;
            if (!t) return false;
            openSheet(buildMapTripCrewSheetBody(t), { maxHeight: '62vh' });
            return true;
        }

        function refreshOpenMapTripCrewSheet() {
            const sheet = document.getElementById('sheet');
            const body = document.getElementById('sheet-body');
            if (!sheet?.classList.contains('open') || !body?.querySelector('[data-map-trip-crew-sheet="true"]')) return false;
            if (!S.activeTrip) {
                closeSheet();
                return true;
            }
            const scrollTop = body.scrollTop;
            body.innerHTML = buildMapTripCrewSheetBody(S.activeTrip);
            body.scrollTop = scrollTop;
            return true;
        }

        function mapTripPhaseStepper(phase, finishDone) {
            const steps = [
                { key: 'reservation', label: 'Домовились' },
                { key: 'pickup', label: 'Збір' },
                { key: 'driving', label: 'В дорозі' },
                { key: 'finish', label: 'Фініш' },
            ];
            const order = ['reservation', 'pickup', 'driving', 'finish'];
            const activeIdx = finishDone ? 3 : Math.max(0, order.indexOf(phase));
            return `<div class="dock-steps" aria-hidden="true">${steps.map((s, i) => `<span class="dock-step${i < activeIdx ? ' done' : ''}${i === activeIdx ? ' active' : ''}">${i < activeIdx ? '●' : (i === activeIdx ? '◉' : '○')} ${s.label}</span>`).join('')}</div>`;
        }

        function buildMapTripDockBody(t, phase) {
            let head = mapTripDockTitle(phase);
            const isDriver = t.viewer_role === 'driver';
            const crewNo = activeTripCrewNumber(t);
            const dir = t.direction_title || 'Поїздка';
            const seatsChip = isDriver ? ` · ${tripSeatsLabel(t)}` : '';
            const metaLine = `Екіпаж #${escapeHtml(String(crewNo))} · ${escapeHtml(dir)} · ${isDriver ? '🚗 Ви водій' : '👤 Ви попутник'}${seatsChip}`;
            const safeReqId = parseInt(t.request_id || t.id || 0, 10) || 0;
            const safePartnerId = parseInt(isDriver ? (t.client_id || 0) : (t.driver_id || 0), 10) || 0;
            const nextPassenger = nextPickupPassenger(t);
            const nextReqId = passengerRequestId(nextPassenger);
            const nextPassengerId = parseInt(nextPassenger?.user_id || 0, 10) || 0;
            const nextName = nextPassenger ? passengerDisplayName(nextPassenger) : '';
            const allPicked = allPickupPassengersPickedUp(t);
            // P-5 (live-прохід 2026-07-05): канон §9 хоче ІМ'Я, не роль-генерик.
            // У водія ціль уже персоналізована (nextName). Дзеркалимо для попутника —
            // щоб той, хто забув, з банера памʼятав, ХТО саме по нього їде.
            const driverName = t.driver_name || t.organizer_name || 'Водій';

            const partnerFinished = tripPartnerFinished(t);
            const viewerFinished = tripViewerFinished(t);
            const crewAwaiting = crewPassengersAwaitingFinish(t);
            const cancelBy = t.cancel_requested_by;
            const cancelPending = cancelBy && !t.is_started && String(cancelBy) !== String(S.userId);
            const cancelRequested = cancelBy && !t.is_started && String(cancelBy) === String(S.userId);

            let hint = '';
            let actions = '';
            let alertStyle = '';

            if (cancelPending) {
                alertStyle = 'color: var(--red); font-weight: bold;';
                if (isDriver) {
                    const pendingCancels = pendingCrewCancelRequests(t);
                    const names = escapeHtml(pendingCrewCancelNames(t));
                    if (pendingCancels.length === 1) {
                        const p = pendingCancels[0];
                        const reqId = passengerRequestId(p);
                        const passengerId = parseInt(p?.user_id || 0, 10) || safePartnerId;
                        hint = `⚠️ ${escapeHtml(passengerDisplayName(p))} хоче вийти з екіпажу.`;
                        actions = `<button class="btn btn-primary" ${!reqId ? 'disabled' : ''} onclick="confirmCancelTrip(${reqId})">✅ Прийняти</button>
                                   <button class="btn btn-secondary" ${!reqId ? 'disabled' : ''} onclick="rejectCancelTrip(${reqId})">❌ Відмовити</button>
                                   <button class="btn btn-secondary" onclick="openChat(${reqId || safeReqId}, ${passengerId})">💬 Чат</button>`;
                    } else {
                        hint = `⚠️ Попутники хочуть вийти: ${names}. Відповідь у списку екіпажу.`;
                        actions = `<button class="btn btn-primary" onclick="openMapTripCrewSheet()">👥 Екіпаж</button>
                                   <button class="btn btn-secondary" onclick="openChat(${safeReqId}, ${safePartnerId})">💬 Чат</button>`;
                    }
                } else {
                    hint = '⚠️ Водій хоче скасувати домовленість';
                    actions = `<button class="btn btn-primary" onclick="confirmCancelTrip()">✅ Скасувати</button>
                               <button class="btn btn-secondary" onclick="rejectCancelTrip()">❌ Відмовити</button>`;
                }
            } else if (cancelRequested) {
                hint = '⏳ Очікуємо підтвердження скасування від партнера';
                alertStyle = 'color: var(--amber); font-weight: bold;';
                actions = `<button class="btn btn-secondary" onclick="openChat(${safeReqId}, ${safePartnerId})">💬 Чат</button>`;
            } else if (partnerFinished && !viewerFinished) {
                // 2zi (Ф5): заголовок, крокомір і дія — про фініш; ім'я через двокрапку,
                // без відмінювання й вгадування роду.
                head = { icon: '🏁', title: 'Фініш' };
                alertStyle = 'color: var(--green); font-weight: bold;';
                if (!isDriver) {
                    hint = `🏁 Фініш відмічено: ${driverRef(driverName)}. Чекаємо лише вашого підтвердження.`;
                    actions = `<button class="btn btn-secondary" onclick="openChat(${safeReqId}, ${safePartnerId})">💬 Чат</button>
                               <button class="btn btn-success" onclick="confirmOwnFinish('trip')">✅ Я теж доїхав до події</button>`;
                } else {
                    // Фікс L-5 (live-прохід 2026-07-04): ДІЯ-банер мусить нести ДІЮ.
                    // Раніше водію давали лише «Екіпаж» → Поїздки → скрол → Підтвердити
                    // (3 кроки). Один фінішер → пряме підтвердження по request_id +
                    // ім'я (канон №11 + доктрина «map inline confirmation» у FRACTAL_MAP);
                    // кілька — список імен і перехід у ростер.
                    const finishers = unconfirmedCrewFinishers(t);
                    if (finishers.length === 1) {
                        const f = finishers[0];
                        const fReqId = Number(f.request_id);
                        const fPartnerId = Number(f.user_id) || safePartnerId;
                        hint = `🏁 Фініш відмічено: ${escapeHtml(passengerDisplayName(f))}. Чекаємо лише вашого підтвердження.`;
                        actions = `<button class="btn btn-secondary" onclick="openChat(${fReqId}, ${fPartnerId})">💬 Чат</button>
                                   <button class="btn btn-success" onclick="confirmOwnFinish('request', ${fReqId})">✅ Я теж доїхав до події</button>`;
                    } else if (finishers.length > 1) {
                        const names = finishers.map(p => passengerDisplayName(p)).filter(Boolean).slice(0, 3).join(', ');
                        hint = `🏁 Відмітили фініш: ${escapeHtml(names)}. Чекаємо вашого підтвердження.`;
                        actions = `<button class="btn btn-secondary" onclick="openChat(${safeReqId}, ${safePartnerId})">💬 Чат</button>
                                   <button class="btn btn-secondary" onclick="openMapTripCrewSheet()">👥 Екіпаж</button>
                                   <button class="btn btn-success" onclick="confirmOwnFinish('all_finishers')">✅ Я теж доїхав до події</button>`;
                    } else {
                        // Pair-режим без members-знімка — пряме підтвердження якірної пари.
                        hint = '🏁 Партнер відмітив фініш. Чекаємо лише вашого підтвердження.';
                        actions = `<button class="btn btn-secondary" onclick="openChat(${safeReqId}, ${safePartnerId})">💬 Чат</button>
                                   <button class="btn btn-success" onclick="confirmOwnFinish('request', ${safeReqId})">✅ Я теж доїхав до події</button>`;
                    }
                }
            } else if (crewAwaiting.length) {
                head = { icon: '🏁', title: 'Фініш екіпажу' };
                const names = crewAwaiting.map(p => passengerDisplayName(p)).filter(Boolean);
                const shown = names.slice(0, 3).join(', ') + (names.length > 3 ? ` та ще ${names.length - 3}` : '');
                hint = `⏳ Чекаємо підтвердження: ${escapeHtml(shown)}`;
                alertStyle = 'color: var(--amber); font-weight: bold;';
                actions = `<button class="btn btn-secondary" onclick="openChat(${safeReqId}, ${safePartnerId})">💬 Чат</button>
                           <button class="btn btn-secondary" onclick="openMapTripCrewSheet()">👥 Екіпаж</button>`;
            } else if (viewerFinished && !partnerFinished) {
                head = { icon: '🏁', title: 'Фініш' };
                hint = `⏳ Ви відмітили фініш. ${finishAwaitingLine(t)}`;
                alertStyle = 'color: var(--amber); font-weight: bold;';
                actions = `<button class="btn btn-secondary" onclick="openChat(${safeReqId}, ${safePartnerId})">💬 Чат</button>`;
            } else {
                if (phase === 'driving') {
                    hint = isDriver ? 'Усі в авто. Коли доїдете до події, позначте прибуття.' : `Ви в дорозі (${driverRef(driverName)}). Коли доїдете до події, позначте прибуття.`;
                    // Codex аудит #3 (2026-07-14): хінт кликав завершувати, але дія
                    // була захована в шторці екіпажу — L-5 «ДІЯ-банер мусить нести
                    // ДІЮ» + spine driving.allowed_actions дає фініш ОБОМ ролям
                    // (max 3 команди). «Екіпаж» лишається — ростер потрібен для
                    // pending-виходів і огляду під час руху.
                    actions = isDriver
                        ? `<button class="btn btn-secondary" onclick="openChat(${safeReqId}, ${safePartnerId})">💬 Чат</button>
                           <button class="btn btn-secondary" onclick="openMapTripCrewSheet()">👥 Екіпаж</button>
                           <button class="btn btn-success" onclick="confirmOwnFinish('driver_dock')">🏁 Я доїхав до події</button>`
                        : `<button class="btn btn-secondary" onclick="openChat(${safeReqId}, ${safePartnerId})">💬 Чат</button>
                           <button class="btn btn-success" onclick="confirmOwnFinish('trip')">🏁 Я доїхав до події</button>`;
                } else {
                    // DM-2026-06-15: gap #6 — до старту поїздки ("Поїхали") вихід з
                    // домовленості можливий лише через взаємну згоду (cancelTrip() ->
                    // doCancelTrip() -> confirmCancelTrip()/rejectCancelTrip(), як у
                    // вкладці "Поїздки", isStarted=false). Раніше ця кнопка була
                    // доступна тільки в "Поїздки" — у нижньому банері карти "вихід"
                    // був не видний (обрив контексту). Це НЕ новий одноосібний вихід,
                    // а той самий "рукостискання"-шлях, винесений і в банер.
                    // DM-2026-07-05: напис «🚪 Покинути» був двозначним — голий, читався
                    // як «покинути подію» (event-scope). Дія ж завжди crew-scoped
                    // (cancelTrip() → «Ви вийдете з екіпажу. Водій та інші лишаться»).
                    // Вихід з ПОДІЇ — окремий шлях (unsubscribeDir/stopSearch), живе в
                    // «Поїздки»/map-filter. Уточнюємо напис, wiring не чіпаємо (gap#6).
                    const leaveBtn = `<button class="btn btn-ghost" onclick="cancelTrip()">${isDriver ? '🚪 Попросити скасування' : '🚪 Попросити вихід'}</button>`;
                    const claimedNow = isDriver ? claimedPickupPassengers(t) : [];
                    const ownClaim = !isDriver ? ownPresenceClaim(t) : null;
                    if (phase === 'pickup') {
                        if (isDriver && nextPassenger && !isPassengerClaimed(nextPassenger)) {
                            hint = `Заберіть: ${escapeHtml(nextName)}. Позначайте по одному.`
                                + (claimedNow.length ? ` Не знайшли: ${claimedNamesLine(claimedNow)}.` : '');
                            actions = `<button class="btn btn-secondary" onclick="openChat(${nextReqId || safeReqId}, ${nextPassengerId || safePartnerId})">💬 Чат</button>
                                <button class="btn btn-secondary" data-g5-claim-action="true" ${(!nextReqId || !nextPassengerId) ? 'disabled' : ''} onclick="declarePassengerMissing(${nextReqId}, ${nextPassengerId}, ${JSON.stringify(nextName).replace(/"/g, '&quot;')})">❓ Не знайшов</button>
                                <button class="btn btn-primary" ${(!nextReqId || !nextPassengerId) ? 'disabled' : ''} onclick="markPassengerPickedUp(${nextReqId}, ${nextPassengerId})">✅ ${escapeHtml(nextName)} в авто</button>`;
                        } else if (isDriver && pickupReadyForStart(t) && claimedNow.length) {
                            const one = claimedNow.length === 1 ? claimedNow[0] : null;
                            hint = `Не знайшли: ${claimedNamesLine(claimedNow)}. Якщо людина підійде — позначте «в авто». Інакше можна вирушати без неї.`;
                            alertStyle = 'color: var(--amber); font-weight: bold;';
                            actions = `<button class="btn btn-secondary" onclick="openMapTripCrewSheet()">👥 Екіпаж</button>
                                ${one ? `<button class="btn btn-secondary" onclick="markPassengerPickedUp(${passengerRequestId(one)}, ${parseInt(one.user_id || 0, 10) || 0})">✅ ${escapeHtml(passengerDisplayName(one))} в авто</button>` : ''}
                                <button class="btn btn-primary" onclick="startTrip()">🚀 Поїхали</button>`;
                        } else if (isDriver && allPicked) {
                            hint = 'Усі попутники в авто. Можна стартувати до події.';
                            actions = `<button class="btn btn-secondary" onclick="openChat(${safeReqId}, ${safePartnerId})">💬 Чат</button>
                                <button class="btn btn-secondary" onclick="openMapTripCrewSheet()">👥 Екіпаж</button>
                                <button class="btn btn-primary" onclick="startTrip()">🚀 Поїхали</button>`;
                        } else if (ownClaim) {
                            alertStyle = 'color: var(--amber); font-weight: bold;';
                            hint = ownClaim.contested
                                ? 'Водій повідомив, що не знайшов вас на погодженій точці. Ви відповіли «Я на місці» — водій це бачить.'
                                : 'Водій повідомив, що не знайшов вас на погодженій точці. Якщо ви там — натисніть «Я на місці».';
                            actions = `<button class="btn btn-secondary" onclick="openChat(${safeReqId}, ${safePartnerId})">💬 Чат</button>
                                ${ownClaim.can_contest ? `<button class="btn btn-primary" data-g5-contest="true" onclick="contestPresenceClaim(${Number(ownClaim.request_id) || 0}, ${Number(ownClaim.claim_seq) || 0})">📍 Я на місці</button>` : ''}
                                <button class="btn btn-secondary" onclick="openMapTripCrewSheet()">👥 Екіпаж</button>`;
                        } else {
                            // 2zi (Ф3): текст — за власним статусом посадки попутника. Вихід
                            // до «Поїхали» лишається (взаємна згода; сервер блокує лише після старту).
                            hint = passengerPickupHint(t, driverName, nextPassenger);
                            actions = `<button class="btn btn-secondary" onclick="openChat(${safeReqId}, ${safePartnerId})">💬 Чат</button>
                                <button class="btn btn-secondary" onclick="openMapTripCrewSheet()">👥 Екіпаж</button>
                                ${leaveBtn}`;
                        }
                    } else {
                        // Live-аудит 2026-07-12 (блокер #3): між взаємною згодою і явним
                        // стартом водія (arriveAtPickup → POST /trip/start) руху НЕМАЄ —
                        // це фаза резервації й очікування дня виїзду. Старий копірайт
                        // («Вирушив за…» / «вирушає по вас») стверджував рух одразу після
                        // згоди, навіть коли подія за кілька днів. Перехід у збір — явна
                        // ДІЯ водія, не таймер; ім'я поточної цілі лишається
                        // (DM-2026-06-16-002 §8.2, ротація через nextPickupPassenger).
                        if (isDriver) {
                            hint = nextName
                                ? `✅ Резервацію підтверджено. Перша точка збору: ${escapeHtml(nextName)}. У день виїзду рушайте й позначте, коли будете на місці.`
                                : '✅ Резервацію підтверджено. У день виїзду рушайте до точки збору й позначте, коли будете на місці.';
                            actions = `<button class="btn btn-secondary" onclick="openChat(${safeReqId}, ${safePartnerId})">💬 Чат</button>
                                <button class="btn btn-primary" onclick="arriveAtPickup()">🚗 Я біля точки збору</button>
                                ${leaveBtn}`;
                        } else {
                            hint = `✅ Місце зарезервовано (${driverRef(driverName)}). Початок збору, вашу чергу й посадку видно у картці. Деталі зустрічі уточнюйте в чаті.`;
                            actions = `<button class="btn btn-secondary" onclick="openChat(${safeReqId}, ${safePartnerId})">💬 Чат</button>
                                <button class="btn btn-secondary" onclick="openMapTripCrewSheet()">👥 Екіпаж</button>
                                ${leaveBtn}`;
                        }
                    }
                }
            }

            // А5/А7 (запис 57): один рядок про «Схему збору» — чесна назва лінії або що саме неповне й що робити.
            const schemeNotice = pickupSchemeNotice(buildPickupScheme(t));
            const schemeLine = schemeNotice
                ? `<div class="dock-sub" data-pickup-scheme="${schemeNotice.tone}" style="margin-top:4px;white-space:normal;${schemeNotice.tone === 'warn' ? 'color:var(--amber);font-weight:bold;' : 'opacity:.75;'}">${schemeNotice.tone === 'warn' ? '⚠️ ' : '┄ '}${escapeHtml(schemeNotice.text)}</div>`
                : '';
            // А4: попутник постійно бачить свою позицію в черзі збору (поки чекає; не в станах виходу чи фінішу).
            const queueText = !isDriver && !t.is_started && !cancelPending && !cancelRequested && !partnerFinished && !viewerFinished
                ? passengerQueuePositionText(t) : '';
            const queueLine = queueText
                ? `<div class="dock-sub" data-pickup-queue-position="true" style="margin-top:4px;white-space:normal;color:var(--text);">🔢 ${escapeHtml(queueText)}</div>`
                : '';
            return `<div class="dock-head">
                    <div style="min-width:0;">
                        <div class="dock-title">${head.icon} ${escapeHtml(head.title)}</div>
                        <div class="dock-sub">${metaLine}</div>
                        <div class="dock-sub" style="${alertStyle || 'color:var(--text);'}margin-top:5px;white-space:normal;">${hint}</div>
                        ${queueLine}
                        ${schemeLine}
                    </div>
                    <button class="dock-collapse" onclick="toggleMapTripDock()" title="Згорнути" aria-label="Згорнути">▾</button>
                </div>
                ${mapTripPhaseStepper(phase, partnerFinished || viewerFinished)}
                <div class="dock-actions">${actions}</div>`;
        }

        function tripDriverName(trip) {
            // Ім'я водія для попутникових банерів (P-5, live-прохід 2026-07-04):
            // попутник має пам'ятати, З КИМ їде — «водій» без імені не допомагає.
            const fromMembers = (Array.isArray(trip?.members) ? trip.members : [])
                .find(m => String(m?.role || '').toLowerCase() === 'driver');
            const raw = fromMembers?.name || trip?.driver_name || trip?.organizer_name || trip?.partner_name || '';
            return String(raw || '').trim();
        }

        function currentRequestIdFromTrip(trip) {
            const raw = trip?.id ?? trip?.request_id ?? null;
            const reqId = Number(raw);
            return Number.isFinite(reqId) && reqId > 0 ? reqId : null;
        }

        function tripViewerFinished(trip) {
            if (!trip) return false;
            return trip.viewer_role === 'driver' ? !!trip.driver_finished : !!trip.client_finished;
        }

        function tripPartnerFinished(trip) {
            if (!trip) return false;
            return trip.viewer_role === 'driver' ? !!trip.client_finished : !!trip.driver_finished;
        }

        function shouldPromptPartnerFinish(trip) {
            return !!trip && !!currentRequestIdFromTrip(trip) && tripPartnerFinished(trip) && !tripViewerFinished(trip);
        }

        function maybeOpenPartnerFinishSheet(trip = S.activeTrip) {
            const reqId = currentRequestIdFromTrip(trip);
            if (!reqId || !shouldPromptPartnerFinish(trip)) return false;
            if (S.partnerFinishSheetShownIds.has(reqId)) return false;
            if (isAppInBackground || S.roleGateOpen || S.matchSheetOpen || isSheetOpen()) return false;
            // На мапі ('explore') нижній док уже показує інлайн-банер
            // "🏁 Партнер відмітив фініш. Підтвердіть завершення." + кнопку
            // (buildMapTripDockBody, гілка partnerFinished && !viewerFinished),
            // тож модал тут дублює док. Лишаємо його лише як off-map страхувальник
            // (поза мапою банера не видно; там працюють тост + critical-notify).
            if (S.currentScreen === 'explore') return false;

            S.partnerFinishSheetShownIds.add(reqId);
            const title = escapeHtml(trip.direction_title || 'поїздка');
            const isDriver = trip.viewer_role === 'driver';
            const partner = isDriver ? 'Попутник' : 'Водій';
            const primaryAction = isDriver
                ? `<button class="btn btn-secondary" id="partner-finish-open">Відкрити Поїздки</button>`
                : `<button class="btn btn-success" id="partner-finish-confirm">✅ Я теж доїхав до події</button>
                   <button class="btn btn-secondary" id="partner-finish-open">Відкрити Поїздки</button>`;
            openSheet(`
                <div class="sheet-title">🏁 ${partner} відмітив фініш</div>
                <div class="sheet-sub">Поїздка «${title}» чекає вашого підтвердження. ${isDriver ? 'Підтвердіть потрібного попутника у списку екіпажу.' : 'Натисніть завершення тільки якщо ви справді доїхали.'}</div>
                <div class="sheet-actions">
                    ${primaryAction}
                    <button class="btn btn-ghost" id="partner-finish-later">Ще в дорозі</button>
                </div>
            `);
            const confirmBtn = document.getElementById('partner-finish-confirm');
            if (confirmBtn) confirmBtn.onclick = () => { closeSheet(); confirmOwnFinish('trip'); };
            document.getElementById('partner-finish-open').onclick = () => { closeSheet(); switchScreen('trips'); };
            document.getElementById('partner-finish-later').onclick = () => { closeSheet(); showToast('Підтвердіть у нижній панелі карти, коли доїдете', ''); };
            return true;
        }

        function notifyLifecycleTransitions(prevTrip, nextTrip, options = {}) {
            if (!nextTrip) return;
            const reqId = currentRequestIdFromTrip(nextTrip);
            if (!reqId) return;
            const sameTrip = prevTrip && currentRequestIdFromTrip(prevTrip) === reqId;
            if (!sameTrip && options.allowNewTrip) {
                notifyCriticalEvent('crew_formed', reqId);
            }
            if (sameTrip && prevTrip.status !== 'pickup' && nextTrip.status === 'pickup' && nextTrip.viewer_role !== 'driver' && !S.pickupNotifiedIds.has(reqId)) {
                S.pickupNotifiedIds.add(reqId);
                notifyCriticalEvent('pickup_arrived', reqId);
                showToast('🚗 Водій почав збір екіпажу', 'success');
            }
            if (sameTrip && !prevTrip.is_started && nextTrip.is_started && nextTrip.viewer_role !== 'driver' && !S.tripStartNotifiedIds.has(reqId)) {
                S.tripStartNotifiedIds.add(reqId);
                notifyCriticalEvent('trip_started', reqId);
                showToast('🚀 Водій почав поїздку. Скасування закрито', 'success');
            }
            if (sameTrip && !tripPartnerFinished(prevTrip) && tripPartnerFinished(nextTrip) && !tripViewerFinished(nextTrip) && !S.partnerFinishNotifiedIds.has(reqId)) {
                S.partnerFinishNotifiedIds.add(reqId);
                notifyCriticalEvent('finish_confirmation_needed', reqId);
                showToast('🏁 Партнер відмітив фініш. Підтвердіть у нижній панелі карти', '');
            }
            // А4: після перестановки черги тост отримує лише попутник, чия позиція змінилась. Порівнюємо відносний
            // порядок спільних непосаджених (запис 62, P3): прийняття, вихід чи посадка між опитуваннями його не
            // змінюють і тосту не дають, а перестановка разом із ними — дає. Постійний текст у картці вже новий.
            if (sameTrip && nextTrip.viewer_role !== 'driver' && !nextTrip.is_started
                && Number(prevTrip.pickup_queue_version || 0) !== Number(nextTrip.pickup_queue_version || 0)) {
                const prevIds = waitingPickupPassengers(prevTrip).map(p => passengerRequestId(p));
                const nextIds = waitingPickupPassengers(nextTrip).map(p => passengerRequestId(p));
                const common = prevIds.filter(id => nextIds.includes(id));
                const relative = ids => ids.filter(id => common.includes(id));
                const mine = passengerRequestId(waitingPickupPassengers(nextTrip).find(p => String(p?.user_id) === String(S.userId)));
                const before = relative(prevIds).indexOf(mine);
                const after = relative(nextIds).indexOf(mine);
                if (mine && before >= 0 && after >= 0 && before !== after) {
                    showToast(`Водій змінив чергу збору: ${passengerQueuePositionText(nextTrip)}`, '');
                }
            }
            maybeOpenPartnerFinishSheet(nextTrip);
        }

        function buildCrewTree(trip) {
            if (!trip || !trip.members) return '';
            const isDriver = trip.viewer_role === 'driver';
            // Sort: driver first, then passengers, then empty seats
            const sorted = [...trip.members].sort((a, b) => {
                if (a.role === 'driver') return -1;
                if (b.role === 'driver') return 1;
                return 0;
            });
            const totalSeats = Math.max(sorted.length, seatCount(trip.total_seats ?? trip.seats_total, sorted.length));
            const emptySeats = Math.max(0, totalSeats - sorted.length);
            let html = '<div class="crew-tree">';
            sorted.forEach((m, i) => {
                const isLast = i === sorted.length - 1 && emptySeats === 0;
                const connector = i === 0 ? '' : (isLast ? '└' : '├');
                const isMe = String(m.user_id) === String(S.userId);
                const icon = m.role === 'driver' ? '🚗' : '👤';
                const name = escapeHtml(m.name || `#${m.user_id || '?'}`);
                const roleLabel = m.role === 'driver' ? 'водій' : (isMe ? 'Ви' : '');
                html += `<div class="crew-member${isMe ? ' is-self' : ''}">
                    ${connector ? `<span class="crew-connector">${connector} </span>` : ''}
                    <span class="crew-icon">${icon}</span>
                    <span>${name}</span>
                    ${roleLabel ? `<span class="crew-role">${roleLabel}</span>` : ''}
                </div>`;
            });
            for (let e = 0; e < emptySeats; e++) {
                const isLastE = e === emptySeats - 1;
                const connector = sorted.length === 0 && e === 0 ? '' : (isLastE ? '└' : '├');
                html += `<div class="crew-empty">
                    ${connector ? `<span class="crew-connector">${connector} </span>` : ''}
                    <span class="crew-icon">⬜</span>
                    <span>Вільне місце</span>
                </div>`;
            }
            html += '</div>';
            return html;
        }

        function ratingPartnerName(trip, partnerId = null, requestId = null) {
            if (!trip) return '';
            const viewerRole = String(trip.viewer_role || S.userRole || '').toLowerCase();
            if (viewerRole !== 'driver') return tripDriverName(trip);
            const passenger = orderedPickupPassengers(trip).find(p => {
                const samePartner = partnerId && String(p?.user_id || '') === String(partnerId);
                const sameRequest = requestId && passengerRequestId(p) === Number(requestId);
                return samePartner || sameRequest;
            });
            const raw = (passenger ? passengerDisplayName(passenger) : '') || trip.client_name || trip.partner_name || '';
            return String(raw || '').trim();
        }

        function buildRatingContext(trip) {
            if (!trip) return null;
            const requestId = currentRequestIdFromTrip(trip);
            if (!requestId) return null;
            const viewerRole = String(trip.viewer_role || S.userRole || '').toLowerCase();
            const partnerRaw = viewerRole === 'driver'
